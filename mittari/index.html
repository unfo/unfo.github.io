<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time to Target</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="time-selection">
      <div class="hour-selection">
        <p class="section-title" data-text-key="hour"></p>
        <div id="hour-options" class="options"></div>
      </div>

      <div class="minute-selection">
        <p class="section-title" data-text-key="minute"></p>
        <div id="minute-options" class="options"></div>
      </div>
    </div>
    <div class="time-output" id="time-output">
      ⏰: --:--
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
