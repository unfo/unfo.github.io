<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>R&amp;A 2026 — aikatauluttaja</title>
<style>/* R&A 2026 aikatauluttaja — no frameworks, no webfonts. */

:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #eeece7;
  --line: #d8d5cd;
  --line-strong: #b9b5aa;
  --ink: #1c1a17;
  --ink-2: #5a564e;
  --ink-3: #8b867a;
  --accent: #9c1f2e;
  --accent-ink: #ffffff;
  --pick: #1c6b45;
  --pick-bg: #dff0e5;
  --pick-line: #4f9b74;
  --suggest: #2c4c9c;
  --suggest-bg: #e2e8f8;
  --reject: #9a2c2c;
  --reject-bg: #f1e2e2;
  --warn: #8a5a00;
  --warn-bg: #fbeecd;
  --radius: 7px;
  --gutter: 54px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --surface: #1e2024;
    --surface-2: #262931;
    --line: #343841;
    --line-strong: #4b5160;
    --ink: #eceef2;
    --ink-2: #b0b5bf;
    --ink-3: #7e8492;
    --accent: #e05a6b;
    --accent-ink: #1a0d10;
    --pick: #6fd39f;
    --pick-bg: #16352a;
    --pick-line: #2f7f57;
    --suggest: #9ab4f5;
    --suggest-bg: #1e2740;
    --reject: #f0918f;
    --reject-bg: #35211f;
    --warn: #f0c86a;
    --warn-bg: #362c14;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

/* Author styles beat the UA stylesheet, so any rule setting `display` on an
 * element we toggle with the hidden attribute (.modal, .settings) would keep
 * it rendered. Make hidden authoritative. */
[hidden] { display: none !important; }

body {
  margin: 0;
  font: 14px/1.45 var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  /* App shell: full viewport, nothing scrolls but the panes themselves. */
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.25; }
p { margin: 0 0 .6em; }
a { color: var(--accent); }

/* ---------------------------------------------------------------- buttons */

button {
  font: inherit;
  font-size: 13px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius);
  padding: .34em .7em;
  cursor: pointer;
}
button:hover { border-color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
button.ghost { background: transparent; }
button.ghost:hover { background: var(--surface-2); }
button.danger { color: var(--reject); }
button.tiny { font-size: 11px; padding: .15em .45em; font-weight: 400; }
button[disabled] { opacity: .45; cursor: default; }

input, select {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: .34em .5em;
}
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------------------------------------------------------------- topbar */

.topbar {
  display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
  padding: .55rem .85rem;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}
.brand { display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap; }
.brand strong { font-size: 15px; letter-spacing: .01em; }
.brand-sub { color: var(--ink-3); font-size: 12px; }
.topbar-actions { margin-left: auto; display: flex; gap: .35rem; flex-wrap: wrap; }

.settings {
  flex: 0 0 auto;
  display: grid; gap: .9rem 1.6rem;
  grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  padding: .85rem;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.settings label { display: block; color: var(--ink-2); }
.settings .row { display: flex; align-items: center; gap: .4rem; margin-top: .25rem; color: var(--ink); }
.settings input[type=number] { width: 5.2em; }
.settings small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: .15rem; }

label.check { display: grid; grid-template-columns: auto 1fr; gap: .1rem .45rem; align-items: start; }
label.check input { margin-top: .18em; }
label.check small { grid-column: 2; }
label.check.tight { font-size: 12.5px; color: var(--ink-2); align-items: center; }

/* ---------------------------------------------------------------- layout */

.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(290px, 340px) minmax(0, 1fr);
}
/* Narrow screens stack the panes and let the document scroll instead. */
@media (max-width: 880px) {
  body { height: auto; overflow: visible; }
  .layout { grid-template-columns: 1fr; }
  .picker { max-height: 60vh; }
  .workspace { height: 82vh; }
}

/* ---------------------------------------------------------------- picker */

.picker {
  border-right: 1px solid var(--line);
  background: var(--surface);
  min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.picker-head {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: .6rem .7rem .55rem;
  display: grid; gap: .4rem;
}
.picker-head #search { width: 100%; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
/* Selects have a content-based minimum width; without this the long theme
   names push the second column past the edge of a narrow screen. */
.filter-row select { min-width: 0; }

.picker h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3); font-weight: 650;
  padding: .8rem .7rem .3rem;
  display: flex; align-items: center; gap: .4rem;
}
.picker h2 .count { color: var(--ink-3); font-weight: 400; letter-spacing: 0; text-transform: none; }
.picker h2 button { margin-left: auto; }
.picker .hint { padding: 0 .7rem .35rem; font-size: 11.5px; color: var(--ink-3); margin: 0; }
.picker .empty { padding: .5rem .7rem; color: var(--ink-3); }

.chosen { border-bottom: 1px solid var(--line); padding-bottom: .4rem; }
.chosen-list, .film-list { list-style: none; margin: 0; padding: 0; }

.chosen-list li {
  display: grid;
  grid-template-columns: 2.1rem 1fr auto;
  gap: .1rem .5rem;
  padding: .4rem .7rem;
  border-top: 1px solid var(--line);
  align-items: center;
}
.chosen-list li:first-child { border-top: 0; }
.opts {
  grid-row: span 2;
  align-self: start;
  display: grid; place-items: center;
  width: 2.1rem; height: 2.1rem;
  border-radius: 50%;
  font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
}
.opts.scarce { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.opts.none { background: var(--reject-bg); color: var(--reject); border-color: var(--reject); }
.opts.done { background: var(--pick-bg); color: var(--pick); border-color: var(--pick-line); }
.chosen-name {
  font-weight: 600; text-align: left; background: none; border: 0; padding: 0;
  color: var(--ink); cursor: pointer; font-size: 13.5px; line-height: 1.3;
}
.chosen-name:hover { color: var(--accent); text-decoration: underline; }
.chosen-list .tier { grid-row: span 2; align-self: start; }
.chosen-list .tier select { padding: .15em .3em; font-size: 11.5px; }
.chosen-slot { grid-column: 2 / -1; font-size: 11.5px; color: var(--ink-3); }
.chosen-slot.picked { color: var(--pick); font-weight: 600; }
.chosen-slot.suggested { color: var(--suggest); font-weight: 600; }

.film-list li { border-top: 1px solid var(--line); }
.film-list label {
  display: grid;
  grid-template-columns: auto 34px 1fr;
  gap: .1rem .5rem;
  align-items: center;
  padding: .35rem .7rem;
  cursor: pointer;
}
.film-list label:hover { background: var(--surface-2); }
.film-list input { grid-row: span 2; }
.film-list img {
  grid-row: span 2; width: 34px; height: 48px; object-fit: cover;
  border-radius: 3px; background: var(--surface-2); display: block;
}
.film-title { font-size: 13px; font-weight: 550; }
.film-meta { font-size: 11px; color: var(--ink-3); }
.film-list li.on label { background: var(--pick-bg); }
.film-list li.on .film-title { color: var(--pick); }

/* ------------------------------------------------------------- workspace */

.workspace {
  min-height: 0; min-width: 0;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.toolbar {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .5rem .8rem;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tabs { display: flex; gap: .2rem; }
.tab { border-color: transparent; background: transparent; color: var(--ink-2); }
.tab.active {
  background: var(--surface-2); border-color: var(--line-strong);
  color: var(--ink); font-weight: 650;
}
.toolbar-actions { margin-left: auto; display: flex; gap: .35rem; }

.statusbar {
  display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
  padding: .4rem .8rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  font-size: 12px;
  min-height: 30px;
}
.pill {
  padding: .1rem .5rem; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
}
.pill.good { background: var(--pick-bg); color: var(--pick); border-color: var(--pick-line); }
.pill.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.pill.bad { background: var(--reject-bg); color: var(--reject); border-color: var(--reject); }
.pill.info { background: var(--suggest-bg); color: var(--suggest); border-color: var(--suggest); }

.view { flex: 1; min-height: 0; overflow: auto; padding: 0; }
.view .placeholder { padding: 2.5rem 1rem; text-align: center; color: var(--ink-3); }

/* ------------------------------------------------------------- grid view */

.grid-scroll {
  display: grid;
  /* max-content lets a crowded day widen the strip and scroll horizontally,
     while 1fr still fills the pane when there is room to spare. */
  grid-template-columns: var(--gutter) minmax(max-content, 1fr);
  min-height: 100%;
}
/* Flex, not grid: a flex item honours its own min-width by growing the strip,
   whereas a grid item wider than its track spills over the next column and
   swallows its clicks. */
.grid-days { display: flex; align-items: stretch; }

.time-gutter {
  position: sticky; left: 0; z-index: 8;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.gutter-body { position: relative; }
.time-gutter .hour {
  position: absolute; right: .35rem;
  font-size: 10.5px; color: var(--ink-3);
  transform: translateY(-.55em);
  font-variant-numeric: tabular-nums;
}
.day-head.gutter-head { justify-content: flex-end; color: var(--ink-3); font-size: 10.5px; }
.day-col { position: relative; flex: 1 1 168px; min-width: 168px; border-right: 1px solid var(--line); }
.day-head {
  position: sticky; top: 0; z-index: 6;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: .3rem .4rem;
  display: flex; align-items: center; gap: .3rem;
  font-size: 12px;
}
.day-head .lbl { font-weight: 650; }
.day-head .n { color: var(--ink-3); font-size: 11px; }
.day-head button { margin-left: auto; }
.day-head.blocked { background: var(--reject-bg); }
.day-head.blocked .lbl { color: var(--reject); text-decoration: line-through; }
.day-body { position: relative; }
.day-body .hline {
  position: absolute; left: 0; right: 0;
  border-top: 1px solid var(--line);
  pointer-events: none;
}
.day-body .hline.half { border-top-style: dotted; opacity: .55; }

.blk {
  position: absolute;
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--ink-3);
  border-radius: 5px;
  background: var(--surface);
  padding: 2px 4px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  font: inherit;
  font-size: 11.5px;
  line-height: 1.25;
  display: block;
}
.blk:hover { border-color: var(--ink); z-index: 3; }
.blk .t { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 10.5px; }
.blk .ttl { font-weight: 600; display: block; }
.blk .v { color: var(--ink-3); font-size: 10.5px; display: block; }
.blk .x {
  position: absolute; top: 1px; right: 1px;
  width: 17px; height: 17px; line-height: 1;
  padding: 0; border-radius: 4px;
  border-color: transparent; background: transparent;
  color: var(--ink-3); font-size: 13px;
}
.blk .x:hover { background: var(--reject-bg); color: var(--reject); border-color: var(--reject); }
.blk.picked { background: var(--pick-bg); border-color: var(--pick-line); border-left-color: var(--pick); }
.blk.picked .ttl { color: var(--pick); }
.blk.suggested { background: var(--suggest-bg); border-color: var(--suggest); border-left-style: dashed; }
.blk.suggested .ttl { color: var(--suggest); }
.blk.rejected {
  background: var(--reject-bg); border-color: var(--reject); border-left-color: var(--reject);
  opacity: .62;
}
.blk.rejected .ttl { text-decoration: line-through; }
.blk.dayblocked {
  opacity: .5;
  background:
    repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px),
    var(--surface-2);
}
.blk.clash { box-shadow: inset 0 0 0 2px var(--warn); }
.blk.scarce1 { border-left-color: var(--warn); border-left-width: 5px; }
.blk .badge { font-size: 9.5px; color: var(--warn); font-weight: 700; }
.blk .sold { color: var(--reject); font-weight: 700; font-size: 9.5px; }

/* ----------------------------------------------------------- agenda view */

.agenda { padding: .3rem .8rem 2rem; }
.agenda details { border-bottom: 1px solid var(--line); }
.agenda summary {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .1rem; cursor: pointer;
  font-weight: 650;
  position: sticky; top: 0; background: var(--bg); z-index: 2;
}
.agenda summary .n { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.agenda summary button { margin-left: auto; }
.agenda details.blocked summary .lbl { color: var(--reject); text-decoration: line-through; }

.row {
  display: grid;
  grid-template-columns: 5.6rem 2rem 1fr auto;
  gap: .15rem .55rem;
  align-items: center;
  padding: .3rem .1rem;
  border-top: 1px solid var(--line);
}
.row .when { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-2); }
.row .name { font-weight: 600; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; }
.row .name:hover { color: var(--accent); text-decoration: underline; }
.row .sub { grid-column: 3; font-size: 11.5px; color: var(--ink-3); }
.row .acts { display: flex; gap: .25rem; }
.row .acts button { width: 26px; padding: .15em 0; text-align: center; }
.row.picked { background: var(--pick-bg); }
.row.picked .name { color: var(--pick); }
.row.suggested { background: var(--suggest-bg); }
.row.rejected { opacity: .6; }
.row.rejected .name { text-decoration: line-through; color: var(--reject); }
.row.dayblocked {
  opacity: .5;
  background:
    repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px),
    var(--surface-2);
}
.row.dayblocked .when, .row.dayblocked .name { text-decoration: line-through; }
.row .clash { color: var(--warn); font-weight: 600; }
.row .opts { width: 2rem; height: 2rem; font-size: 12px; grid-row: span 2; }
.acts button.on { background: var(--pick); border-color: var(--pick); color: #fff; }
.acts button.off { background: var(--reject); border-color: var(--reject); color: #fff; }

/* ------------------------------------------------------------- plan view */

.plan { padding: .9rem 1rem 2.5rem; max-width: 60rem; }
.plan h3 { margin: 1.2rem 0 .35rem; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.plan h3:first-child { margin-top: 0; }
.plan-day { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: .55rem; overflow: hidden; }
.plan-day > header { padding: .35rem .6rem; background: var(--surface-2); font-weight: 650; font-size: 12.5px; display: flex; gap: .5rem; }
.plan-day > header .tot { margin-left: auto; color: var(--ink-3); font-weight: 400; }
.plan-line { display: grid; grid-template-columns: 6.4rem 1fr auto; gap: .5rem; padding: .3rem .6rem; border-top: 1px solid var(--line); align-items: baseline; }
.plan-line .when { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; }
.plan-line .where { color: var(--ink-3); font-size: 12px; }
.plan-gap { padding: .15rem .6rem .15rem 7rem; font-size: 11.5px; color: var(--ink-3); border-top: 1px dotted var(--line); }
.plan-gap.tight { color: var(--warn); font-weight: 600; }
.plan-gap.impossible { color: var(--reject); font-weight: 700; }
.unfit { list-style: none; padding: 0; margin: 0; }
.unfit li { border-top: 1px solid var(--line); padding: .35rem .1rem; }
.unfit .why { font-size: 12px; color: var(--ink-3); }
.unfit strong { color: var(--reject); }

/* ----------------------------------------------------------- browse view */

/* Cards wrap into as many columns as fit. The 40rem track cap keeps the
 * measure at roughly 78 characters per line whatever the window width — a
 * single full-width column ran to 119, well past comfortable reading. Card
 * heights here are tightly clustered (median 820px, p25-p75 within 62px), so
 * plain grid rows pack with little waste and masonry is not needed. */
.browse {
  padding: .9rem 1rem 3rem;
  display: grid;
  /* auto-fill counts tracks by the track's MAX size, so capping the track at
     40rem would demand ~1670px before a second column appeared. Fit by the
     minimum and let 1fr tracks stretch, then cap the card itself to hold the
     measure. */
  grid-template-columns: repeat(auto-fill, minmax(min(34rem, 100%), 1fr));
  justify-items: center;
  align-items: start;
  gap: 1rem;
}
.browse.single { grid-template-columns: minmax(0, 1fr); }
.browse-head {
  grid-column: 1 / -1;
  justify-self: stretch;
  font-size: 12px; color: var(--ink-3);
  margin: 0 0 -.2rem;
}
.film-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 1rem 1.15rem 1.15rem;
  scroll-margin-top: 1rem;
  min-width: 0;
  width: 100%;
  max-width: 40rem;   /* ~78 characters per line at 13.5px */
}
.film-card.on {
  border-color: var(--pick-line);
  box-shadow: inset 3px 0 0 var(--pick);
}
.film-card.flash { animation: cardflash 1.1s ease-out; }
@keyframes cardflash {
  from { border-color: var(--accent); background: var(--surface-2); }
  to   { border-color: var(--line); background: var(--surface); }
}
@media (prefers-reduced-motion: reduce) {
  .film-card.flash { animation-duration: 1ms; }
}
.film-card h2 { font-size: 18px; }
.film-card h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-3); margin: .9rem 0 .1rem;
}

/* The one strip that is rewritten on every state change. */
.card-controls {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  margin: .55rem 0 .8rem;
  padding: .4rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.card-controls .opts { width: 1.9rem; height: 1.9rem; font-size: 12px; grid-row: auto; }
.card-controls .pickbox {
  display: flex; align-items: center; gap: .3rem;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.card-controls select { padding: .2em .35em; font-size: 12px; }
.card-controls .slot { font-size: 11.5px; color: var(--ink-3); margin-left: auto; }
.card-controls .slot.picked { color: var(--pick); font-weight: 600; }
.card-controls .slot.suggested { color: var(--suggest); font-weight: 600; }

/* The modal reuses the card markup, so these rules must cover both hosts. */
.film-card .modal-grid,
.modal-card .modal-grid { margin-bottom: .2rem; }
.film-card .body p { font-size: 13.5px; }

/* ----------------------------------------------------------------- modal */

.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1rem; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.modal-card {
  position: relative; z-index: 1;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 1.1rem 1.2rem;
  max-width: 40rem; width: 100%; max-height: 88vh; overflow: auto;
}
.modal-close { position: absolute; top: .5rem; right: .5rem; border-color: transparent; background: transparent; font-size: 20px; line-height: 1; padding: 0 .3rem; }
.modal-card h2 { font-size: 19px; padding-right: 2rem; }
.modal-card .orig { color: var(--ink-3); font-size: 13px; margin-bottom: .5rem; }
.modal-card .lead { font-weight: 600; margin: .5rem 0 .7rem; }
.modal-grid { display: grid; grid-template-columns: 128px 1fr; gap: 1rem; align-items: start; }
.modal-grid img { width: 100%; border-radius: 5px; background: var(--surface-2); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; font-size: 12.5px; margin: 0 0 .7rem; }

erico García Lorcan teokset sekä Espanjan sisällissodan myllerryksen vastustamattomaksi queer-eepokseksi.","description_text":"Espanjan sisällissodan kaaoksessa Sebastián ajautuu liittymään fasistiarmeijaan ja pestataan huolehtimaan salaperäisestä sotavangista. Vuosia aiemmin nuori Carlos hakee jäsenyyttä eksklusiiviselle klubille, mutta hänen seksuaalisuuteensa kohdistuvat epäilykset tuovat mutkia matkaan. 2000-luvulla nuori historioitsija Alberto ajautuu setvimään sukunsa salatun historian verkkoa.\n\nR&A:n avajaiselokuva La bola negra on pakahduttavan romanttinen queer-triptyykki. Kunnianhimoinen eepos on saanut inspiraationsa ja nimensä legendaarisen espanjalaisrunoilijan Federico García Lorcan kesken jääneestä näytelmästä.\n\nAikaa halkova tarina nivoo kolmella aikatasolla yhteen queer-rakkautta, historiallista mysteeriä ja Espanjan sisällissodan myllerrystä vastustamattomaksi kokonaisuudeksi. Se nousi yhdeksi Cannesin elokuvajuhlien suurista tapauksista, ja nimellä Los Javis tunnettu ohjaajaduo jakoi festivaalin parhaan ohjauksen palkinnon yhdessä Paweł Pawlikowskin kanssa. La bola negran sivurooleissa vilahtaa tuttuja kasvoja Penelope Cruzista Julio Torresiin ja Glenn Closeen.\n\nInari Ylinen\n\nAvajaisgaalan klo 16.45 näytöksessä ennen elokuvaa säveltäjä Ilari Heinilä esittää alitajunnasta kumpuavia tummasävyisiä sävelmiä yhdessä kauniin aavemaisen The Black Lodge -yhtyeensä kanssa. Yhdessä Jasmine Lefrancoisin, Helmi Tikkasen ja Jussi Koski-Laulajan kanssa he johdattavat yleisön esitykseen, joka on samanaikaisesti meditatiivinen ja kaunis, mutta myös levottomuutta herättävä. Tunnelma syntyy syntetisaattoreiden, samplereiden, kitaroiden ja unenomaisen laulun välityksellä.","poster":"https://hiff.fi/wp-content/uploads/airtable/d820b299aa8860c7287ecb690441ac44-large.jpg","trailer_url":"https://www.youtube.com/embed/FaZqDtYUMds?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/la-bola-negra/","imdb":"https://www.imdb.com/title/tt35511966/?ref_= nsuojelujärjestelmän hampaissa.","description_text":"R&A:n vieraaksi saapuvalle romanialaiselle Cristian Mungiulle uran toisen Kultaisen palmun Cannesin elokuvajuhlilla ansainnut Vuono on tiivistunnelmainen ja terävä luotaus pohjoismaisen hyvinvointiyhteiskunnan kipukohtiin ja polarisaatioon.\n\nYhdeksi tämän hetken kiinnostavimmista näyttelijöistä pikavauhtia noussut Renate Reinsve (mm. Sentimental Value , R&A 2025 & 2026) sekä Marvel-pestistään uusille urille karannut Sebastian Stan (mm. A Different Man , R&A 2024) tähdittävät elokuvaa syvästi uskovaisena avioparina, joka muuttaa lapsineen norjalaiseen pikkukylään. Perheen uskonnolliset elämäntavat ajautuvat nopeasti törmäyskurssille maallisen pohjoismaisen kulttuurin kanssa. Naapuriperheestä löytyy kuitenkin seuraa ja ymmärrystä sekä perheen lapsille että aikuisille.\n\nKun opettaja huomaa perheen tyttären mustelmat, alkaa lumivyöryn tavoin eskaloituva tapahtumaketju, jossa perhe joutuu norjalaisen lastensuojelujärjestelmän hampaisiin. Yksityisen ja julkisen rajat hämärtyvät oikeussalidraaman kiertyessä tiukemmalle ja tiukemmalle vanhempien ympärillä. Mutta mitä kotona on todella tapahtunut – ja mikä olisi oikea toimintatapa lasten kannalta?\n\nVuonon taustalla on suomalaista elokuvaosaamista: sen osatuottaja on Aamu Film Companyn Jussi Rantamäki, pukusuunnittelija Kirsi Gum ja äänisuunnittelija Pietu Korhonen.\n\nInari Ylinen","poster":"https://hiff.fi/wp-content/uploads/airtable/77a605e39ad825aabfe67646f93cbe34-large.jpg","trailer_url":"https://www.youtube.com/embed/TBVU3A_SEzU?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/fjord-2026/","imdb":"https://www.imdb.com/title/tt35410859/?ref_=nv_sr_srsg_1_tt_5_nm_2_in_0_q_fjord"},"content_warnings":["Lapsen kaltoinkohtelu"],"showing_ids":["recFygbyRJLoO6U5v"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 21.1.2027","status":"dated","date":"2027-01-21"},"on_yle_areena":true},{"slug":"paatosgaala-minotaur","title":"Päätösgaala: Minotaur","original_title":"Minotaure","url":"https://hiff.fi/ohjelma/paatosgaala-minotaur/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Gaalaelokuvat"],"keywords":["Rikos","Yhteiskunta","Rakkaus"],"countries":["Iso-Britannia","Latvia","Ranska"],"directors":["Andrey Zvyagintsev"],"cast":["Dmitriy Mazurov","Iris Lebedeva","Varvara Shmykova","Juris Žagars"],"languages":["venäjä"],"subtitles":["englanti"],"age_rating":"K16","duration_min":135,"year":2026,"logline":"Andrey Zvyagintsevin paluuteos on synkän hauska ja poliittisuudessaan viiltävä trilleri nyky-Venäjän korruptiosta kerrottuna yhden myrkyllisen avioliiton kautta.","description_text":"Eläköön elokuva: Andrey Zvyagintsev on tullut takaisin.\n\nViimeisimmän elokuvansa Rakkautta vailla (R&A 2017) jälkeen terävästä yhteiskuntakritiikistään ja brutaalin tarkkanäköisistä teoksistaan tunnettu ohjaaja taisteli hengestään sairastuttuaan koronapandemian aikana ja joutui lähtemään maanpakoon kotimaastaan Venäjältä hyökkäyssodan sytyttyä.\n\nVaikka uusin elokuva Minotaur on tuotettu kokonaan Venäjän ulkopuolella, sensuurin ulottumattomissa, sen aihe on eittämättä Putinin johtaman maan nykytila – ja Zvyagintsevin ote kritiikissään on entistäkin viiltävämpi. Venäläistä yhteiskuntaa, hyökkäyssotaa ja korruptiota tarkastellaan ohjaajalle tuttuun tapaan yhden myrkyllisen avioliiton linssin läpi.\n\nMinotaurissa Zvyagintsev sovittaa löyhästi nyky-Venäjälle Claude Chabrolin eroottisen trillerin Mies, nainen, rakastaja (1969) kieron kolmiodraaman. Venäläisen yhteiskunnan konteksti tuo tarinaan kylmääviä ulottuvuuksia, mutta myös synkän koomisia sävyjä.\n\nMinotaur nousi Cannesin elokuvajuhlilla kriitikoiden suosikiksi ja nappasi tuomaristolta festivaalin kakkospalkinnon Grand Prix’n. R&A:ssa se nähdään festivaalin päätöspaikalla. Tämä on se elokuva, jota jäät miettimään pitkäksi aikaa esiripun sulkeuduttua – ehkä seuraavaan festivaaliin asti.\n\nInari Ylinen","poster":"https://hiff.fi/wp-content/uploads/airtable/45a0 in ja vogue-tanssin synnyinpaikassa. Ballroom-kulttuuri yhdistää yli rajojen ja sukupolvien ja sen parista on moni löytänyt henkisen kotinsa.\n\nChan Sze-wein seurantadokumentin kamera vaeltaa päähenkilöidensä Sunin, Teddyn ja Xyzan kanssa sulavasti läpi tanssilattioiden sekä alakulttuurin, josta moni on löytänyt uuden perheen, sijaisisän ja -äidin oman perheen hylättyä. Toisilla taas on hyväksyvä äiti, joka kokkaa einestä tanssienergiaksi. Dokumentin myötä selviää, miten pandemia vaikutti tanssikulttuuriin, mutta toisaalta toi verkkotapahtumien myötä lisää yksinäisiä mukaan skeneen. Katsoja pääsee mukaan tanssiareenoille ihailemaan värikkäitä bling-bling-asuja ja taidokkaan tanssin notkeita kuvioita.\n\nUpeiden tanssinumeroiden täyttämän elokuvan ohjaaja Chan Sze-wei on erikoistunut tanssielokuvaan, alakulttuureihin ja LGBTQIA+-skenen kuvaamiseen.\n\nEija Niskanen","poster":"https://hiff.fi/wp-content/uploads/airtable/a8c7fadb45224e99c3a635dea0acaa86-large.jpg","trailer_url":"https://www.youtube.com/embed/_e3bv7TDwd8?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/10s-across-the-borders/","imdb":"https://www.imdb.com/title/tt27827068/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_10s%20across"},"content_warnings":["Transfobia"],"showing_ids":["recxtNumnwlWQzp7X","recfaAl2taJbBEUBm","recFKt1H9yR092upX"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"a-girl-unknown","title":"A Girl Unknown","original_title":"无名女孩","url":"https://hiff.fi/ohjelma/a-girl-unknown/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Kasvutarina","Nuoruus","Identiteetti","Angsti","Suru","Naiskuvia"],"countries":["Kiina","Ranska"],"directors":["Zou Jing"],"cast":["Li Gengxi","Shen Jiani","Zu Feng","Cao Ruofan"],"languages":["kiina","mandariinikiina"],"subtitles":["englanti"],"age_rating":"K16","duration_min":128,"year":2026,"logline":"Herkässä, visuaalisesti upeassa kasvutarinassa vauvana hylätty tyttö varttuu kolmen perheen välillä ja etsii identiteettiään 80–90-lukujen Kiinassa.","description_text":"Zou Jingin riipaisevan kaunis esikoispitkä seuraa vauvana hylättyä tyttöä kuusivuotiaasta aikuisuuden kynnykselle hänen siirtyessään kolmen eri perheen välillä ja joutuessaan omaksumaan jokaisessa niistä uuden nimen ja identiteetin.\n\n1980- ja 1990-lukujen Kiinaan sijoittuva A Girl Unknown kuljettaa katsojan maaseudulta kaupunkiin, läpi yhteiskuntaluokkien. Yhden kiinalaistytön kasvutarina kertoo herkästi kokonaisesta sukupolvesta tyttöjä, joiden varttumista varjostivat yhteiskunnan misogynistiset rakenteet ja hylkäämiskokemus. Yhden lapsen politiikan aikana vanhemmat hylkäsivät tyttölapsia suhteettomasti, sillä patriarkaalinen kulttuuri suosi poikia.\n\nJuurettomuuden ja kuulumattomuuden kokemukset värittävät päähenkilön elämää lapsuudesta aikuisuuteen, kun hän etsii haparoiden itseään. Elokuvan pääroolissa loistaa Li Gengxi, joka nähtiin myös Bi Ganin henkeäsalpaavassa Resurrectionissa (R&A 2025).\n\nKuvakerronta vangitsee syvät värit ja yhdistelee tiukkoja rajauksia avariin maisemiin. Vaikka elokuva kuvaa tarkkanäköisesti synkeää todellisuutta, katse pysyy hellän varmasti selviytymisessä ja myötätunnossa, jota voi yhä löytää myös valtavan eksistentiaalisen surun keskellä.\n\nAnni Rossi","poster":"https://hiff.fi/wp-content/uploads/airtable/4cfb730eed81fab798165cd197a561c4-large.jpg","trailer_url":"https://www.youtube.com/embed/N9hG41IAREA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/a-girl-unknown/","imdb":"https://www.imdb.com/title/tt32459280/"},"content_warnings":["Itsetuhoisuus","Itsemurha","Seksuaalinen hyväksikäyttö"],"showing_ids":["recCKW2Xqh5IsjGRf","rec8C5xzPhmJWa4ci","recc7nhibzIjuNhmm"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"a-girls-story","title":"A Girl's Story","original_title":"Mémoire de fille","url":"https://hiff.fi/ohjelma/a-girls-story/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Kids These Days"],"keywords":["Muisti","Nuoruus","Naiskuvia","Kirjallisuus","Identiteetti"],"countries":["Ranska"],"directors":["Judith Godrèche"],"cast":["Esther Archambault","Maïwene Barthelemy","Tess Barthélémy","Sephora Pondi","Valérie Dréville"],"languages":["ranska"],"subtitles":["englanti"],"age_rating":"K16","duration_min":117,"year":2026,"logline":"Annie Ernaux’n muistelmaan pohjaavassa draamassa kirjailija palaa kotiseudulleen ja kipeät muistot nuoruuden kesästä leiriohjaajana nousevat pintaan.","description_text":"Ranskalaisen Judith Godrèchen elokuva A Girl’s Story perustuu Annie Ernauxin romaaniin Tytön tarina ( Mémoire de fille ). ”Mémoire” ei oikeastaan tarkoita tarinaa vaan pikemminkin tutkielmaa tai muistelmaa. Tarinan tyttö on Ernaux itse ja teos kirjailijalle tyypillisesti oman menneen tarkkailua, jo kaukaisen nuoren Annien tuntojen muistelua.\n\nKierroksia elokuvan kerrontaan kasvattaa se, että ohjaajan oma tytär Tess Barthelémy esittää Annieta. Ohjaaja itse on hyvin nuorena näyttelijänä joutunut hyväksikäytetyksi vähän samaan tapaan kuin 17-vuotias Annie tässä ihon alle käyvän sensitiivisessä tarinassa. Godrèche asettaa siis tyttärensä läpikäymään fiktiossa jotain sellaista, josta hänellä on omaa, tuskallista kokemusta.\n\nElokuva kertoo hienostuneen julmasti ja tarkasti nuoren päähenkilönsä kesästä lasten leirikeskuksen ohjaajana vuonna 1958. Annie on sosiaalisesti kokematon lähtiessään leirille, ja leirin muut ohjaajat koettelevat häntä monin tavoin. Lisäksi hän alkaa kylmäkiskoisen viettelyn jäljiltä kuvitella olevansa suhteessa yhteen ohjaajista. Elokuva tavoittaa järisyttävällä tavalla kaiken tämän Annien hämmennyksen elämän edessä.\n\nJaana Semeri","poster":"https://hiff.fi/wp-content/uploads/airtable/40f90232870250ac1c199258bd3fcb2a-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/a-girls-story/","imdb":"https://www.imdb.com/title/tt39088978/?ref_=nv_sr_srsg_0_tt_7_nm_0_in_0_q_M%C3%A9moire%20de%20fille"},"content_warnings":["Seksuaalinen väkivalta"],"showing_ids":["recRcwLBXcIDDfDKV","recYOrOdRWE0MgEgl","recgYc97YZd4w7ZVk","reclgAOFUW0AkAO8T"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"a-poet","title":"A Poet","original_title":"Un poeta","url":"https://hiff.fi/ohjelma/a-poet/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Huumori","Taide","Kirjallisuus","Outoa"],"countries":["Kolumbia","Ruotsi","Saksa"],"directors":["Simón Mesa Soto"],"cast":["Ubeimar Rios","Rebeca Andrade","Guillermo Cardona"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K12","duration_min":123,"year":2025,"logline":"Mustassa komediassa unholaan jäänyt kiusallinen runoilija löytää elämälleen uuden suunnan ryhtyessään opettajaksi.","description_text":"Oscar Restrepon (Ubeimar Rios) elämä ei ota sujuakseen. Avioliitto on jo etäinen muisto, eikä edes oma tytär halua viettää Oscarin kanssa aikaa. Oscar oli joskus mahdollisesti lahjakas runoilija, mutta edellisestä julkaistusta teoksesta on vierähtänyt jo vuosikymmeniä, eivätkä kirjat varsinaisia myyntimenestyksiä koskaan olleet. Työnteko ei ainakaan tälle runoilijalle sovi, mutta lopulta Oscar on pakotettu ryhtymään opettajaksi, jotta voisi maksaa tyttärensä opinnoista edes osan – ja välttää häädön.\n\nYllättäen opettaminen antaakin Oscarille edes vähän merkitystä elämään, ja hän pääsee jopa eroon eräästä elämäänsä varjostaneesta paheesta. Kun vaatimattomista oloista kotoisin oleva oppilas Yurlady (Rebeca Andrade) osoittautuu oivaksi runoilijaksi, Oscar aistii, että nuoren runoilijan mentorina hän voisi saada kenties edes pienen palan siitä kunniasta, joka hänelle kuuluu. Oscarin lisäksi Yurladysta haluaa hyötyä moni muukin, mutta kukaan ei halua miettiä sitä, mitä Yurlady itse elämältään haluaa.\n\nPositiiviset käänteet tuovat ensin elämään hiukan valoa, mutta toivon hauras valo hautautuu pian huonojen päätösten varjoon Simón Mesa Soton tragikoomisessa tarinassa. Onko Oscarista kasvamaan?\n\nHerman Tikkanen","poster":"https://hiff.fi/wp-content/uploads/airtable/067a09b0c75b8a117159c58255f68bfc-large.png","trailer_url":"https://www.youtube.com/embed/xRyVkKYG3BA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/a-poet/","imdb":"https://www.imdb.com/title/tt36544524/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_a%20poet"},"content_warnings":["Lapsen kaltoinkohtelu"],"showing_ids":["recj3eX6jm72ZCOU8","recKk5rzgOaG6Yiaz","recI2fovEElqp5Dm2"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"a-prayer-for-the-dying","title":"A Prayer for the Dying","original_title":null,"url":"https://hiff.fi/ohjelma/a-prayer-for-the-dying/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Historia uusiksi"],"keywords":["Angsti","Historia","Kaupunkitila","Mielenterveys","Outoa","Perhesuhteet"],"countries":["Norja","Puola","Ruotsi"],"directors":["Dara Van Dusen"],"cast":["Johnny Flynn","John C. Reilly","Kristine Kujath Thorp","Gustav Lindh"],"languages":["englanti","norja"],"subtitles":["osittain englanti"],"age_rating":"K16","duration_min":95,"year":2026,"logline":"Sisällissodan traumatisoima sheriffi joutuu painajaismaisten valintojen eteen, kun hänen kaupunkiinsa leviää sekä kulkutauti että metsäpalo. Mukana menossa myös John C. Reilly!","description_text":"Vuosikymmen on 1870, kaupunki nimeltä Friendship Wisconsinissa. Pientilallisen pusikosta löytyy kuollut mies, jonka taskut on käännetty. Paikalle pyöräilee paikkakunnan virkaa tekevä sheriffi Jacob Hansen (Johnny Flynn). Vesikaivon vierestä löytyy myös kuollut koira, jota kukaan ei tunnu kaipaavan.\n\nPolttava helle ja riuduttava kuivuus piinaavat skandimaahanmuuttajien asuttamaa pikkukaupunkia, jota lähestyy valtava metsäpalo. Ennen kuin taivaalta alkaa sataa tuhkaa, friendshipiläisten keskuudessa leviää tappava kulkutauti, jota kaupungin lääkäri (John C. Reilly) pystyy korkeintaan hidastamaan.\n\nSheriffi Hansen on paitsi pastori ja hautausurakoitsija myös sisällissodan traumatisoima veteraani, joka on saanut uuden mahdollisuuden. Nyt hänen olisi pystyttävä tekemään oikeita ratkaisuja mahdottoman tilanteen edessä. Karanteeni, metsäpalo ja posttraumaattinen oireyhtymä kun ovat hulluuteen ajava yhdistelmä. Hereillä olosta tuleekin pian yhtä painajaista.\n\nYhdysvaltalais-norjalaisen Dara Van Dusenin väkevä esikoisohjaus A Prayer for the Dying perustuu Stewart O’Nanin samannimiseen romaaniin, ja kirjailija on käsikirjoittanut elokuvan yhdessä ohjaajan kanssa.\n\nMarko Ylitalo","poster":"https://hiff.fi/wp-content/uploads/airtable/537558107a6690bd3324e3af31bf2c60-large.jpg","trailer_url":"https://www.youtube.com/embed/mj_kkJFm4AQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/a-prayer-for-the-dying-2026/","imdb":"https://www.imdb.com/title/tt31183803/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_a%20prayer%20for%20the%20"},"content_warnings":["Ahdistus","Kuolema","Mielenterveysongelmat","Sairaus","Väkivalta"],"showing_ids":["rec4i84tg7g7TAvQC","reczB7xkfhVqMzmbz","recotItVNPJVHJuw8"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"a-womans-life","title":"A Woman’s Life","original_title":"La vie d'une femme","url":"https://hiff.fi/ohjelma/a-womans-life/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Rakkaus","Perhesuhteet","Naiskuvia","Badass","Feelgood","LGBTQIA+"],"countries":["Ranska"],"directors":["Charline Bourgeois-Tacquet"],"cast":["Léa Drucker","Mélanie Thierry","Charles Berling"],"languages":["ranska"],"subtitles":["englanti"],"age_rating":"K12","duration_min":99,"year":2026,"logline":"Ranskalaiselokuvassa viisikymppinen kirurgi (Léa Drucker) kyllästyy vastuiden painamaan elämäänsä ja leikkelee sen uuteen uskoon.","description_text":"Kirurgi, puoliso, rakastaja. Tytär, sisko, huoltaja, esihenkilö. Ystävä, idoli. Naisella on monta roolia ja monta vastuuta, ainakin jos hän on Gabrielle (Léa Drucker), päähenkilö Charline Bourgeois-Tacquetin hengästyttävässä uutukaisessa A Woman’s Life . Nimensä mukaisesti elokuva avaa yhden naisen elämää yhdessä ajassa.\n\nBourgeois-Tacquetin tuore filmi on ranskalainen draama, jossa puhutaan, tavataan ja kosketaan. Hahmot piirtyvät esiin vuorovaikutuksen kautta ja se, kuka on kuka, kuuluu sanotussa. Välillä on alastomuutta, usein paljon monimutkaisia tunteita. Yhdessä kohtauksessa voi vilistä sävyjä kiintymyksestä kismitykseen ja himosta häiritsevään käytökseen. Elämän ja reaktioiden kirjo on alati läsnä.\n\nNimenomaan ihmissuhteet koostavat tämän elokuvan ja Gabriellen vikoineen ja vahvuuksineen. Kohtaaminen kohtaamiselta esiin viiltyy tinkimätön nainen, joka vaatii paljon sekä itseltään että toisilta. Vastuut kertyvät hänen harteilleen, mutta ottaako hän ne itse vai kasaavatko niitä toiset? Voiko hänen tapaansa elää vai tulisiko tehdä toisin? Jokainen sivuhahmo näyttää oman otoksensa Gabriellesta. Kuten elämässä, tässä elokuvassakin se, miten kohtaa muut, antaa ihmisestä tarkimman kuvan.\n\nSusanna Puomio","poster":"https://hiff.fi/wp-content/uploads/airtable/611f2129de14691a2aa90e2873ce0a7f-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/a-womans-life-2026/","imdb":"https://www.imdb.com/title/tt39299437/"},"content_warnings":["Sairaalakuvasto"],"showing_ids":["recaejvaEJRACv9aw","recwhJsZjTPtsZLLk"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"arrested-memory","title":"Arrested Memory","original_title":"狂忘警探","url":"https://hiff.fi/ohjelma/arrested-memory/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Action","Huumori","Angsti","Jännitys","Muisti","Matka","Suru","Rikos"],"countries":["Japani","Taiwan"],"directors":["Sabu"],"cast":["Ethan Juan","Moon Lee","Reika Kirishima","Shinichi Tsutsumi"],"languages":["kiina"],"subtitles":["englanti"],"age_rating":"K16","duration_min":87,"year":null,"logline":"R&A-suosikki Sabun rikoselokuvassa etsivä ryhtyy selvittämään sieppausoperaatiota, mutta paheneva muistisairaus sotkee suunnitelmia.","description_text":"Huonosti nukutun yön jälkeinen päivä on usein tahmea. Olo on väsynyt ja keskittymiskyky koetuksella. Arrested Memoryn rikosetsivänä työskentelevä päähenkilö kantaa tavallista raskaampaa taakkaa: hän kärsii muistisairaudesta.\n\nKun paikallisen liikemiehen lapsi kidnapataan, etsivä Lee (Ethan Juan) lähtee syyllisen perään lunnasrahat kourassaan. Yltyvä dementia heittää kuitenkin jos monenlaista kapulaa konnajahdin rattaisiin. Operaatio suistuu raiteiltaan lähes välittömästi, ja pian etsivä huomaa pakenevansa paitsi roistoja myös kollegojaan. Vähä vähältä Leen kova ulkokuori antaa myöten. Sairausdiagnoosin taustalta alkaa paljastua menneen haamuja.\n\nKulttimainetta nauttiva Sabu on ohjannut elokuvia kolmekymmentä vuotta, ja sen huomaa. Arrested Memory on tyylikäs ja itsevarma lisä etsiväelokuvan kirjavaan perinteeseen. Kuvaus suosii lämpimiä värejä, tyyneyttä ja hiljaisuutta. Sabu löytää seesteistä kauneutta hengästyttävien käsirysyjenkin keskeltä. Vaikka Leen verkkaisestikin etenevälle matkalle annetaan tilaa hengittää, elokuva ei unohda lajityyppinsä suolaa: komiikkaa ja meheviä toimintakohtauksia.\n\nIikka Arve","poster":"https://hiff.fi/wp-content/uploads/airtable/ba163731a56ea2b3fd020c5244bea7ba-large.webp","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/arrested-memory/","imdb":"https://www.imdb.com/title/tt38893248/?ref_=nm_flmg_job_1_accord_1_unrel_cdt_c_1"},"content_warnings":["Väkivalta","Päihteiden ongelmakäyttö","Mielenterveysongelmat"],"showing_ids":["recYNfb1L2sD4yOkX","rec4u30AD09TddMVF","recBW6Rf4fCBC310r"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"arru","title":"Árru","original_title":null,"url":"https://hiff.fi/ohjelma/arru/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjolan huiput"],"keywords":["Alkuperäiskansat","Musiikki","Perhesuhteet","Muisti","Ihmisoikeudet"],"countries":["Norja","Ruotsi","Saamenmaa","Suomi"],"directors":["Elle Sofe Sara"],"cast":["Sara Marielle Gaup Beaska","Simon Issát Marainen","Ayla Gáren Audhild P. Nutti","Mikkel Gaup"],"languages":["Saami","norja","ruotsi","suomi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":98,"year":2026,"logline":"Maailman ensimmäisessä joikumusikaalissa saamelaisperheen taistelu esi-isien maiden puolesta nostaa esiin vaiettuja salaisuuksia.","description_text":"Tunturiluonto voi näyttää karulta ja autiolta, mutta se on täynnä elämää – ja kuolemaa. Jälkimmäinen uhkaa saamelaisen poronhoitajaperheen elämäntapaa, kun kaivosta louhitaan keskelle laidunalueita.\n\nTupakkaa kuluu, kun yksinhuoltaja Maia (Sara Marielle Gaup), tämän tytär Áilin (Ayla Gáren Nutti) ja veli Dánel (Simon Issát Marainen) hoitavat tokkaa esi-isiensä mailla. Vääjäämättömältä näyttävän tuhon edessä Maia pyytää avuksi vastaavissa taisteluissa kunnostautuneen setänsä. Toivon lisäksi sedän läsnäolo herättää pitkään haudotut traumat ja asettaa Maian valinnan eteen: toimiako omantunnon mukaan vai jatkaako pysymistä vaiti sekä maan että yhteisön edun niin vaatiessa?\n\nKoutokeinolainen Elle Sofe Sara tarttuu esikoisohjauksessaan ajankohtaiseen aiheeseen. Lupalaput heltiävät ja risut ja männynkävyt saavat väistyä, kunhan muistaa taikasanat: vihreä siirtymä, kriittiset mineraalit tai puolustusteollisuus. Vaikka nyt pitäydytään Norjan rajojen sisäpuolella, kaivosteollisuus ja hakkuut uhkaavat saamelaiskulttuuria ja luontoa läpi koko Saamenmaan.\n\nElle Sofe Sara hyödyntää poikkeuksellisella tavalla saamelaisten perinteistä kulttuuri-ilmaisua niin protestoinnin, maayhteyden kuin vaietun trauman käsittelyssä. Joiku voi kertoa myös vastauksen, kun on asetuttava omaa yhteisöään vastaan.\n\nMinna Saarinen","poster":"https://hiff.fi/wp-content/uploads/airtable/b3e694dae59a6e7f8c1c2a9c2c377cb8-large.jpg","trailer_url":"https://player.vimeo.com/video/1165986810?dnt=1&app_id=122963","links":{"letterboxd":"https://letterboxd.com/film/arru/","imdb":"https://www.imdb.com/title/tt13975248/?ref_=nv_sr_srsg_0_tt_3_nm_5_in_0_q_arru"},"content_warnings":["Seksuaalinen hyväksikäyttö","Lapsen kaltoinkohtelu"],"showing_ids":["reckjMRixKaMRdqrd","recFgCF7MU0xI2b70","recRhiiQecdvVod2B"],"shorts":[],"cinema_release":null,"on_yle_areena":true},{"slug":"attenberg","title":"Attenberg","original_title":null,"url":"https://hiff.fi/ohjelma/attenberg/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["R&A x LUX-yleisöpalkinto"],"keywords":["Identiteetti","Kasvutarina","Perhesuhteet","Outoa","Seksi","Tekstitetty/puhuttu suomeksi","Maksuton"],"countries":["Kreikka"],"directors":["Athina Rachel Tsangari"],"cast":["Ariane Labed","Evangelia Randou","Vangelis Mourikis","Yorgos Lanthimos"],"languages":["kreikka","englanti","ranska"],"subtitles":["suomi","ruotsi"],"age_rating":"K16","duration_min":95,"year":2011,"logline":"Kreikan oudon aallon pioneeritöihin lukeutuva helmi yhdistelee seksiä ja surua ihmeellisen vangitsevasti. Se esitetään maksuttomassa näytöksessä osana R&A:n LUX-yleisöpalkintoehdokkaiden sarjaa.","description_text":"Suosittelen, että lakkaat lukemasta nyt. Attenberg on parhaimmillaan, kun et tiedä siitä etukäteen liikaa. Todennäköisesti kuitenkin jatkat lukemista, joten kerron sinulle jotain.\n\nKreikan outo aalto on tullut tutuksi erityisesti Yorgos Lanthimoksen ansiosta, mutta yksi aallon merkkitekijöistä on myös Athina Rachel Tsangari. Attenberg on ihastuttavan kummallinen ja herkkä kasvutarina 23-vuotiaasta Marinasta, joka huolehtii kuolemansairaasta isästään vaatimattomassa pikkukaupungissa. Seksuaalisesti kokematon Marina saa seksineuvoja ystävältään Bellalta. Kun Bella opettaa ystävälleen kielaria, muistuttaa tämän kieli Marinan mielestä lähinnä etanaa. Teknisen koulutuksen lisäksi Bella kuvailee peniksiä kryptisesti ja kertoo, että sukuelinten näkeminen unessa on huono enne. Marinan kiinnostus seksiä kohtaan herää, kun pikkukaupunkiin saapuu nimettömäksi jäävä insinööri. (Täytynee mainita, että insinööriä näyttelee muuan Yorgos.)\n\nMarinan ensiaskeleet seksiä kohtaan ja isän lähestyvä kuolema kietoutuvat elokuvassa liikuttavaksi, eriskummalliseksi ja haikeaksi yhdistelmäksi. Marinan uskaltautuessa tutkimaan identiteettiään luisuu hänen isänsä minuus ajasta ikuisuuteen.\n\nSamaan aikaan ilmeetön ja silti ruumiillista ilmaisua juhliva Attenberg on epätavallinen kuvaus seksuaalisuudesta ja surusta, ja sen hiljainen tunnelma jää kehoon pyörimään – vaikka tietäisit etukäteen jotain.\n\nEelia Leikas\n\nAttenberg oli LUX-yleisöpalkintoehdokkaana vuonna 2011. Ilmaisnäytökset järjestetään yhdessä Euroopan parlamentin kanssa. Elokuvat on tekstitetty suomeksi ja ruotsiksi.","poster":"https://hiff.fi/wp-content/uploads/airtable/e14a4da73c0ef15dcfd799a346501929-large.jpg","trailer_url":"https://www.youtube.com/embed/ZyfGZpzoDDc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/attenberg/","imdb":"https://www.imdb.com/title/tt1691323/?ref_=nv_sr_srsg_0_tt_2_nm_6_in_0_q_attenber"},"content_warnings":["Seksuaalinen kuvasto","Sairaus","Kuolema"],"showing_ids":["recxdyDQr6ZpnFzuQ"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"barbara-forever","title":"Barbara Forever","original_title":null,"url":"https://hiff.fi/ohjelma/barbara-forever/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["R&A Trailblazers"],"keywords":["LGBTQIA+","Arkistot","Elämäkerta","Taide","Elokuvanteko","Ikääntyminen"],"countries":["Yhdysvallat"],"directors":["Brydie O’Connor"],"cast":[],"languages":["englanti"],"subtitles":["kuvaileva tekstitys englanniksi"],"age_rating":"K16","duration_min":102,"year":2026,"logline":"Sundancessa ja Berliinissä palkittu dokumentti avantgarde-uranuurtaja Barbara Hammerista, jonka työ teki näkyväksi lesboa elämää, iloa ja vastarintaa.","description_text":"Kuka saa tulla nähdyksi, kuvatuksi ja lopulta osaksi historiaa? Brydie O’Connorin dokkari Barbara Forever sukeltaa kokeellisen elokuvan uranuurtajan Barbara Hammerin maailmaan tavalla, joka tuntuu yhtä omintakeiselta kuin sen kohde itse. Hammer (1939–2019) oli lesboelokuvan visionääri, visuaalinen runoilija, joka kuvasi itseään, rakastettujaan ja yhteisöään kautta vuosikymmenien.\n\n”I am creating lesbian history in a world where we are invisible”, Hammer totesi. Häntä ajoi polttava tarve tehdä näkyväksi elämä ja historia, jotka olivat liian usein jääneet marginaaliin. Arkistomateriaaleista, päiväkirjoista, valokuvista ja Hammerin omasta äänestä rakentuva dokumentti ei tyydy kertomaan elämäntarinaa perinteiseen tapaan. O’Connorin ohjaus hengittää samaa kokeilevaa henkeä kuin Hammerin elokuvat. Elokuva kutsuu katsojan keskelle taiteellista prosessia, jossa taiteen tekeminen on vastarinnan muoto, henkilökohtainen erottamattomasti poliittista ja ilo queeriä.\n\nBarbara Forever muistuttaa elokuvan ja arkistojen voimasta tallentaa elämää ja tehdä näkyväksi sen, mikä on liian usein unohdettu kulttuurisesta muistista. Maailmanensi-iltansa Sundancen elokuvajuhlilla saanut ja editoinnistaan palkittu dokumentti on sykähdyttävä kunnianosoitus poikkeukselliselle elokuvantekijälle ja elämälle.\n\nRiikka Pennanen","poster":"https://hiff.fi/wp-content/uploads/airtable/7e3c8081273d7d4ba1c9a7b602ade6e9-large.jpg","trailer_url":"https://www.youtube.com/embed/8WW89Vm5O6A?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/barbara-forever/","imdb":"https://www.imdb.com/title/tt39150008/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_barbara%20for"},"content_warnings":["Seksuaalinen kuvasto"],"showing_ids":["recx8qrIrZHNRXbHY","recu7itRXYvq7pt6b","rec9yavpiWvS7JBUw"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"bayside-shakedown-n-e-w","title":"Bayside Shakedown N.E.W.","original_title":"踊る大捜査線 N.E.W. メトロポリスを駆け抜けろ！","url":"https://hiff.fi/ohjelma/bayside-shakedown-n-e-w/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"], https://hiff.fi/wp-content/uploads/airtable/8ac9395b723af5487c0f652b5c18d546-large.jpg","trailer_url":"https://www.youtube.com/embed/wrVkzVwE6JE?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/beginnings-2025/","imdb":"https://www.imdb.com/title/tt32144178/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_Begyndelser"},"content_warnings":["Sairaus"],"showing_ids":["rec4eGQgFkzxlH9eM","recv5MsT4gS0nAJfD","recRN9MFhxZJ0PR0u"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"belzebubs","title":"Belzebubs","original_title":null,"url":"https://hiff.fi/ohjelma/belzebubs/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio"],"themes":["Animoituja unia"],"keywords":["Perhesuhteet","Huumori","Taide","Tekstitetty/puhuttu suomeksi","Musiikki"],"countries":["Suomi"],"directors":["Samppa Kukkonen"],"cast":["Martti Manninen","Krista Kosonen","Viivi Tamminen","Elias Salonen"],"languages":["suomi"],"subtitles":["englanti"],"age_rating":"K16","duration_min":67,"year":null,"logline":"JP Ahosen sarjakuvista tuttu black metal -perhe seikkailee animaatiosarjassa, josta nähdään R&A:ssa kolme taiteilijan valitsemaa jaksoa.","description_text":"Belzebubs on 13-osainen nuorille aikuisille suunnattu animaatio-sitcom tuiki tavallisen black metal -kultistiperheen unelmista ja ihmissuhteista. Perheen isä Sløth (Martti Manninen) yrittää luotsata bändiään kohti mainetta ja menestystä aina kun koti-isän velvollisuuksiltaan ehtii. Tulisieluinen äiti Lucy (Krista Kosonen) kipuilee uravalintojensa kanssa ja teini-iän hormonimyrskyn kourissa riutuva tytär Lilith (Viivi Tamminen) ihastuu pakkomielteisesti luokkatoveriinsa Samiin (Elias Salonen). Leviathan (Kosmo Salminen) on perheen herttainen ja hyväntahtoinen kuopus.\n\nSatanistiperheen arkea värittävät rahahuolet, lapsenkasvatukselliset haasteet, satunnaiset kulttimenot, räväkkä mummi (Carla Rindell), epäkuollut vaari (Vesa Vierikko) ja muut tyypilliset ruuhkavuosien tilanteet.\n\nTamperelaisen JP Ahosen samannimiseen nettisarjakuvaan perustuva Belzebubs yhdistää arkipäiväistä huumoria ja ihmissuhdedraamaa yliluonnollisiin ja okkultistisiin elementteihin ja viljelee viittauksia pop-kulttuuriin, metallimusiikkiin ja lovecraftilaiseen kauhuun. Belzebubs on kehittynyt pienimuotoisesta nettisarjakuvasta globaaliksi, monta eri mediaa kattavaksi ilmiöksi, jolla on somessa satoja tuhansia faneja ympäri maailman. Animaatiosarjan lisäksi konsepti kattaa yli 15 kielelle käännettyjä sarjakuva-albumeja sekä tosielämän incognito-bändin, jolla on usean albumin levytyssopimus maailman suurimman metallimusiikki -levy-yhtiön Century Median kanssa, sekä YouTubessa miljoonia katselukertoja saaneita musiikkivideota.\n\nNäytöksessä esitetään sarjan jaksot ”Limbo”, ”Vika hitti” ja ”Pohjanmaan kautta”.","poster":"https://hiff.fi/wp-content/uploads/airtable/04ad3c0829400c235eb519abe72df92e-large.jpg","trailer_url":null,"links":{"imdb":"https://www.imdb.com/title/tt11717526/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_belzebubs"},"content_warnings":[],"showing_ids":["rec842QbFdFdp9rCM","recGcxvFTXa3YUSjV"],"shorts":[],"cinema_release":null,"on_yle_areena":true},{"slug":"belzebubs-nayttely","title":"Belzebubs-näyttely","original_title":null,"url":"https://hiff.fi/ohjelma/belzebubs-nayttely/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Events"],"keywords":["Taide"],"countries":[],"directors":[],"cast":[],"languages":[],"subtitles":[],"age_rating":null,"duration_min":null,"year":null,"logline":"Bio Rex Lasipalatsissa on läpi festivaalipäivien esillä näyttely JP Ahosen R&A:ssa esitettävän Belzebubs-sarjan ja -sarjakuvan konseptitaidetta.","description_text":"","poster":"https://hiff.fi/wp-content/uploads/airtable/04ad3c0829400c235eb519abe72df92e-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":[],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"benimana","title":"Ben'Imana","original_title":null,"url":"https://hiff.fi/ohjelma/benimana/","is_f
