<script>/* R&A 2026 aikatauluttaja — vanilla ES2020, no dependencies.
 *
 * Data is embedded at build time as #app-data (see build.py). All planning
 * state lives in localStorage and is portable via Vie/Tuo JSON.
 */
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("app-data").textContent);
  var STORE_KEY = "ra2026.plan.v1";
  var TIERS = [["must", "Pakko"], ["want", "Haluan"], ["maybe", "Ehkä"]];
  var TIER_INDEX = { must: 0, want: 1, maybe: 2 };
  var PPM = 0.85;          // pixels per minute in the calendar grid
  var MIN_BLOCK = 30;      // px, shortest rendered block
  var MIN_LANE_PX = 62;    // px, narrowest readable lane in a crowded cluster
  var SOLVE_NODE_CAP = 400000;
  var SOLVE_MS = 2500;

  // ------------------------------------------------------------- indexes

  var films = DATA.films;
  var showings = DATA.showings;
  var filmBySlug = new Map();
  var showById = new Map();
  var showsByFilm = new Map();
  var dayByDate = new Map();

  films.forEach(function (f) {
    filmBySlug.set(f.slug, f);
    showsByFilm.set(f.slug, []);
  });
  /* The ISO strings carry the festival's own +03:00 offset. Reading the clock
   * time out of the string keeps every rendered time identical to hiff.fi no
   * matter what timezone the browser is in; epoch milliseconds are used only
   * for arithmetic, where the offset is already accounted for. */
  function isoClock(iso) { return iso.slice(11, 16).replace(":", "."); }
  function isoMinuteOfDay(iso) {
    return Number(iso.slice(11, 13)) * 60 + Number(iso.slice(14, 16));
  }

  showings.forEach(function (s) {
    s._start = Date.parse(s.start);
    s._end = Date.parse(s.end);
    if (!(s._end > s._start)) s._end = s._start + (s.runtime_min || 100) * 60000;
    s._durMin = (s._end - s._start) / 60000;
    s._clock = isoClock(s.start);
    s._clockEnd = isoClock(s.end);
    s._min = isoMinuteOfDay(s.start);          // minutes past midnight, local
    s._minEnd = s._min + s._durMin;            // may exceed 1440 past midnight
    showById.set(s.id, s);
    var list = showsByFilm.get(s.film_slug);
    if (list) list.push(s);
  });
  showsByFilm.forEach(function (list) {
    list.sort(function (a, b) { return a._start - b._start; });
  });
  DATA.days.forEach(function (d) { dayByDate.set(d.date, d); });

  // --------------------------------------------------------------- state

  function defaults() {
    return {
      version: 1,
      selected: [],
      priority: {},
      showings: {},
      rejectedDays: [],
      suggestion: {},
      settings: {
        bufferMin: 30,
        sameVenueGapMin: 10,
        soldOutBlocks: false,
        showEvents: false,
        allDays: false,
        browseSingle: false,
        view: "browse"
      }
    };
  }

  var state = load();

  function load() {
    var base = defaults();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return base;
      return merge(base, JSON.parse(raw));
    } catch (error) {
      console.warn("could not read saved plan", error);
      return base;
    }
  }

  function merge(base, saved) {
    if (!saved || typeof saved !== "object") return base;
    var out = defaults();
    if (Array.isArray(saved.selected)) {
      out.selected = saved.selected.filter(function (slug) { return filmBySlug.has(slug); });
    }
    if (saved.priority) {
      Object.keys(saved.priority).forEach(function (slug) {
        if (filmBySlug.has(slug) && TIER_INDEX[saved.priority[slug]] !== undefined) {
          out.priority[slug] = saved.priority[slug];
        }
      });
    }
    if (saved.showings) {
      Object.keys(saved.showings).forEach(function (id) {
        var value = saved.showings[id];
        if (showById.has(id) && (value === "picked" || value === "rejected")) {
          out.showings[id] = value;
        }
      });
    }
    if (Array.isArray(saved.rejectedDays)) {
      out.rejectedDays = saved.rejectedDays.filter(function (date) { return dayByDate.has(date); });
    }
    if (saved.suggestion) {
      Object.keys(saved.suggestion).forEach(function (slug) {
        if (filmBySlug.has(slug) && showById.has(saved.suggestion[slug])) {
          out.suggestion[slug] = saved.suggestion[slug];
        }
      });
    }
    if (saved.settings) {
      Object.keys(out.settings).forEach(function (key) {
        var value = saved.settings[key];
        if (typeof value === typeof out.settings[key]) out.settings[key] = value;
      });
    }
    return out;
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (error) {
      console.warn("could not save plan", error);
    }
  }

  // ---------------------------------------------------------- derivations

  function tierOf(slug) { return state.priority[slug] || "want"; }
  function markOf(id) { return state.showings[id] || null; }
  function dayBlocked(date) { return state.rejectedDays.indexOf(date) !== -1; }
  function soldOut(s) { return !!(s.sales && s.sales.available === 0); }

  /** Why a showing cannot be used, or null when it is available. */
  function blockedBy(s) {
    if (markOf(s.id) === "rejected") return "rejected";
    if (dayBlocked(s.date)) return "day";
    if (state.settings.soldOutBlocks && soldOut(s)) return "soldout";
    return null;
  }

  function optionsOf(slug) {
    return (showsByFilm.get(slug) || []).filter(function (s) { return !blockedBy(s); });
  }

  function pickOf(slug) {
    var list = showsByFilm.get(slug) || [];
    for (var i = 0; i < list.length; i++) {
      if (markOf(list[i].id) === "picked" && !blockedBy(list[i])) return list[i];
    }
    return null;
  }

  function suggestionOf(slug) {
    var id = state.suggestion[slug];
    if (!id) return null;
    var s = showById.get(id);
    return s && !blockedBy(s) ? s : null;
  }

  /** The plan as it currently stands: pins first, suggestions filling gaps. */
  function planMap() {
    var map = new Map();
    state.selected.forEach(function (slug) {
      var chosen = pickOf(slug) || suggestionOf(slug);
      if (chosen) map.set(slug, chosen);
    });
    return map;
  }

  function requiredGapMin(a, b) {
    return a.venue && a.venue === b.venue
      ? state.settings.sameVenueGapMin
      : state.settings.bufferMin;
  }

  function conflicts(a, b) {
    if (a.id === b.id) return false;
    var first = a._start <= b._start ? a : b;
    var second = first === a ? b : a;
    return second._start < first._end + requiredGapMin(a, b) * 60000;
  }

  /** Plan entries (other films) that the given showing would clash with. */
  function clashesWith(s, plan) {
    var out = [];
    plan.forEach(function (chosen, slug) {
      if (slug !== s.film_slug && conflicts(chosen, s)) out.push({ slug: slug, showing: chosen });
    });
    return out;
  }

  // ------------------------------------------------------------- mutation

  function toggleFilm(slug) {
    var at = state.selected.indexOf(slug);
    if (at === -1) state.selected.push(slug);
    else {
      state.selected.splice(at, 1);
      delete state.suggestion[slug];
      (showsByFilm.get(slug) || []).forEach(function (s) {
        if (markOf(s.id) === "picked") delete state.showings[s.id];
      });
    }
    commit();
  }

  function togglePick(id) {
    var s = showById.get(id);
    if (!s) return;
    if (markOf(id) === "picked") {
      delete state.showings[id];
    } else {
      (showsByFilm.get(s.film_slug) || []).forEach(function (other) {
        if (markOf(other.id) === "picked") delete state.showings[other.id];
      });
      state.showings[id] = "picked";
      delete state.suggestion[s.film_slug];
      if (state.selected.indexOf(s.film_slug) === -1) state.selected.push(s.film_slug);
    }
    commit();
  }

  function toggleReject(id) {
    if (markOf(id) === "rejected") delete state.showings[id];
    else state.showings[id] = "rejected";
    commit();
  }

  /** Day toggle is a select-all: it clears the day's individual marks either way. */
  function toggleDay(date) {
    var at = state.rejectedDays.indexOf(date);
    if (at === -1) state.rejectedDays.push(date);
    else state.rejectedDays.splice(at, 1);
    showings.forEach(function (s) {
      if (s.date === date && state.showings[s.id]) delete state.showings[s.id];
    });
    commit();
  }

  function commit() {
    dropStaleSuggestions();
    save();
    render();
  }

  function dropStaleSuggestions() {
    Object.keys(state.suggestion).forEach(function (slug) {
      var s = showById.get(state.suggestion[slug]);
      if (!s || blockedBy(s) || state.selected.indexOf(slug) === -1 || pickOf(slug)) {
        delete state.suggestion[slug];
      }
    });
  }

  // --------------------------------------------------------------- solver

  function cmpScore(a, b) {
    for (var i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
    return 0;
  }

  /** Lower is better: dead time between consecutive showings plus venue hops. */
  function looseness(list) {
    var byDay = new Map();
    list.forEach(function (s) {
      if (!byDay.has(s.date)) byDay.set(s.date, []);
      byDay.get(s.date).push(s);
    });
    var total = 0;
    byDay.forEach(function (day) {
      day.sort(function (a, b) { return a._start - b._start; });
      for (var i = 1; i < day.length; i++) {
        total += Math.max(0, (day[i]._start - day[i - 1]._end) / 60000);
        if (day[i].venue !== day[i - 1].venue) total += 15;
      }
    });
    return total;
  }

  function solve() {
    var pinned = [];
    var pinnedSlugs = new Set();
    state.selected.forEach(function (slug) {
      var pick = pickOf(slug);
      if (pick) { pinned.push(pick); pinnedSlugs.add(slug); }
    });

    var pinClashes = [];
    for (var i = 0; i < pinned.length; i++) {
      for (var j = i + 1; j < pinned.length; j++) {
        if (conflicts(pinned[i], pinned[j])) pinClashes.push([pinned[i], pinned[j]]);
      }
    }
    if (pinClashes.length) return { error: "pins", pinClashes: pinClashes };

    var open = [];
    state.selected.forEach(function (slug) {
      if (pinnedSlugs.has(slug)) return;
      open.push({ slug: slug, tier: tierOf(slug), options: optionsOf(slug) });
    });
    open.sort(function (a, b) {
      return (a.options.length || 99) - (b.options.length || 99) ||
             TIER_INDEX[a.tier] - TIER_INDEX[b.tier];
    });

    var n = open.length;
    var suffix = new Array(n + 1);
    suffix[n] = [0, 0, 0];
    for (var k = n - 1; k >= 0; k--) {
      suffix[k] = suffix[k + 1].slice();
      if (open[k].options.length) suffix[k][TIER_INDEX[open[k].tier]]++;
    }

    var base = [0, 0, 0];
    pinnedSlugs.forEach(function (slug) { base[TIER_INDEX[tierOf(slug)]]++; });

    var chosen = pinned.slice();
    var assign = new Map();
    var best = null;
    var nodes = 0;
    var stopped = false;
    var deadline = Date.now() + SOLVE_MS;

    function record(score) {
      var loose = looseness(chosen);
      if (!best || cmpScore(score, best.score) > 0 ||
          (cmpScore(score, best.score) === 0 && loose < best.loose)) {
        best = { score: score.slice(), loose: loose, assign: new Map(assign) };
      }
    }

    function recurse(index, score) {
      if (stopped) return;
      if (++nodes > SOLVE_NODE_CAP || (nodes % 4096 === 0 && Date.now() > deadline)) {
        stopped = true;
        return;
      }
      if (index === n) { record(score); return; }
      if (best) {
        var ceiling = score.slice();
        for (var t = 0; t < 3; t++) ceiling[t] += suffix[index][t];
        if (cmpScore(ceiling, best.score) < 0) return;
      }
      var film = open[index];
      for (var o = 0; o < film.options.length; o++) {
        var option = film.options[o];
        var ok = true;
        for (var c = 0; c < chosen.length; c++) {
          if (conflicts(chosen[c], option)) { ok = false; break; }
        }
        if (!ok) continue;
        chosen.push(option);
        assign.set(film.slug, option);
        var next = score.slice();
        next[TIER_INDEX[film.tier]]++;
        recurse(index + 1, next);
        chosen.pop();
        assign.delete(film.slug);
        if (stopped) return;
      }
      recurse(index + 1, score);
    }

    recurse(0, base);
    if (!best) record(base);

    return {
      assign: best.assign,
      pinnedSlugs: pinnedSlugs,
      score: best.score,
      nodes: nodes,
      truncated: stopped
    };
  }

  /** Why a selected film ended up with no slot. */
  function unfitReason(slug, plan) {
    var all = showsByFilm.get(slug) || [];
    if (!all.length) return "ohjelmistossa ei ole näytöksiä";
    var options = optionsOf(slug);
    if (!options.length) {
      var counts = { rejected: 0, day: 0, soldout: 0 };
      all.forEach(function (s) { counts[blockedBy(s)]++; });
      var parts = [];
      if (counts.rejected) parts.push(counts.rejected + " hylätty");
      if (counts.day) parts.push(counts.day + " hylätyllä päivällä");
      if (counts.soldout) parts.push(counts.soldout + " loppuunmyyty");
      return (all.length === 1
        ? "ainoa näytös pois käytöstä ("
        : "kaikki " + all.length + " näytöstä pois käytöstä (") + parts.join(", ") + ")";
    }
    var blockers = new Set();
    options.forEach(function (option) {
      clashesWith(option, plan).forEach(function (clash) {
        var film = filmBySlug.get(clash.slug);
        blockers.add(film ? film.title : clash.slug);
      });
    });
    if (blockers.size) {
      return (options.length === 1
        ? "ainoa vapaa näytös menee päällekkäin: "
        : "kaikki " + options.length + " vapaata näytöstä menevät päällekkäin: ") +
        Array.from(blockers).join(", ");
    }
    return fi(options.length, "vapaa näytös", "vapaata näytöstä") + " — ei vielä valittu";
  }

  // ------------------------------------------------------------ rendering

  var el = {};
  ["brand-sub", "settings", "btn-settings", "btn-export", "btn-import", "btn-reset",
   "import-file", "set-buffer", "set-same", "set-soldout", "set-events", "set-alldays",
   "set-single", "search", "filter-theme", "filter-genre", "filter-day",
   "filter-later", "filter-scarce",
   "chosen-section", "chosen-count", "chosen-list", "btn-clear-selection",
   "catalogue-count", "film-list", "film-empty", "statusbar", "btn-solve", "btn-accept",
   "btn-clear-suggestion", "view-browse", "view-grid", "view-agenda", "view-plan",
   "modal", "modal-body"
  ].forEach(function (id) { el[id] = document.getElementById(id); });

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function span(s) { return s._clock + "–" + s._clockEnd; }

  /* Finnish takes the nominative after 1 and the partitive after anything
   * else, so every counted noun needs both forms. */
  function fi(count, one, many) {
    return count + " " + (count === 1 ? one : many);
  }

  /* Post-festival availability. A film you can catch in a cinema or on Areena
   * later does not need to win a scarce festival slot, which is exactly the
   * judgement the scarcity badge alone cannot express. */

  function cinemaLabel(film, compact) {
    var release = film.cinema_release;
    if (!release) return null;
    if (release.status === "in_cinemas") {
      return compact ? "teattereissa" : "Teattereissa nyt";
    }
    if (release.date) {
      var parts = release.date.split("-");
      var when = Number(parts[2]) + "." + Number(parts[1]) + ".";
      if (parts[0] !== String(DATA.meta.year)) when += parts[0];
      return (compact ? "teatteri " : "Teattereissa ") + when;
    }
    return compact ? "teatteri tulossa" : "Teatterilevitys tulossa";
  }

  function laterLabels(film, compact) {
    var out = [];
    var cinema = cinemaLabel(film, compact);
    if (cinema) out.push(cinema);
    if (film.on_yle_areena) out.push(compact ? "Areena" : "Yle Areena");
    return out;
  }

  function laterTags(film) {
    return laterLabels(film, false).map(function (label) {
      return '<span class="tag later">' + esc(label) + "</span>";
    }).join(" ");
  }

  function optionBadge(slug) {
    var pick = pickOf(slug);
    var count = optionsOf(slug).length;
    if (pick) return { text: "✓", cls: "done", title: "Valittu: " + span(pick) + " " + pick.venue };
    if (count === 0) return { text: "0", cls: "none", title: "Ei vapaita näytöksiä" };
    if (count === 1) return { text: "1", cls: "scarce", title: "Vain yksi vapaa näytös — priorisoi tämä" };
    return { text: String(count), cls: "", title: count + " vapaata näytöstä" };
  }

  /** Selected films, scarcest unresolved first; resolved films sink to the bottom. */
  function chosenOrder() {
    return state.selected.slice().sort(function (a, b) {
      var pa = pickOf(a) ? 1 : 0;
      var pb = pickOf(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
      var oa = optionsOf(a).length;
      var ob = optionsOf(b).length;
      if (oa !== ob) return oa - ob;
      var ta = TIER_INDEX[tierOf(a)];
      var tb = TIER_INDEX[tierOf(b)];
      if (ta !== tb) return ta - tb;
      return (filmBySlug.get(a).title || "").localeCompare(filmBySlug.get(b).title || "", "fi");
    });
  }

  function visibleFilms() {
    var query = el.search.value.trim().toLowerCase();
    var theme = el["filter-theme"].value;
    var genre = el["filter-genre"].value;
    var day = el["filter-day"].value;
    var later = el["filter-later"].value;
    var scarceOnly = el["filter-scarce"].checked;
    return films.filter(function (f) {
      if (!f.is_film && !state.settings.showEvents) return false;
      if (theme && f.themes.indexOf(theme) === -1) return false;
      if (genre && f.genres.indexOf(genre) === -1) return false;
      var list = showsByFilm.get(f.slug) || [];
      if (day && !list.some(function (s) { return s.date === day; })) return false;
      if (scarceOnly && list.length !== 1) return false;
      var seeLater = !!(f.cinema_release || f.on_yle_areena);
      if (later === "exclusive" && seeLater) return false;
      if (later === "later" && !seeLater) return false;
      if (later === "cinema" && !f.cinema_release) return false;
      if (later === "yle" && !f.on_yle_areena) return false;
      if (query) {
        var haystack = [f.title, f.original_title, f.logline, f.directors.join(" "),
                        f.keywords.join(" "), f.themes.join(" "), f.countries.join(" "),
                        f.cast.join(" ")].join(" ").toLowerCase();
        if (haystack.indexOf(query) === -1) return false;
      }
      return true;
    });
  }

  function renderPicker() {
    var chosen = chosenOrder();
    el["chosen-section"].hidden = chosen.length === 0;
    el["chosen-count"].textContent = chosen.length ? "(" + chosen.length + ")" : "";
    el["chosen-list"].innerHTML = chosen.map(function (slug) {
      var film = filmBySlug.get(slug);
      var badge = optionBadge(slug);
      var pick = pickOf(slug);
      var suggested = pick ? null : suggestionOf(slug);
      var slot = pick || suggested;
      var slotClass = pick ? "picked" : suggested ? "suggested" : "";
      var slotText = slot
        ? (dayByDate.get(slot.date) || {}).label + " " + span(slot) + " · " + slot.venue +
          (suggested ? " (ehdotus)" : "")
        : fi(optionsOf(slug).length, "vapaa näytös", "vapaata näytöstä");
      var later = laterLabels(film, true);
      return '<li>' +
        '<span class="opts ' + badge.cls + '" title="' + esc(badge.title) + '">' + badge.text + '</span>' +
        '<button type="button" class="chosen-name" data-film="' + esc(slug) + '">' + esc(film.title) + '</button>' +
        '<span class="tier"><select data-tier="' + esc(slug) + '" aria-label="Prioriteetti">' +
        TIERS.map(function (t) {
          return '<option value="' + t[0] + '"' + (tierOf(slug) === t[0] ? " selected" : "") + '>' + t[1] + '</option>';
        }).join("") +
        '</select></span>' +
        '<span class="chosen-slot ' + slotClass + '">' + esc(slotText) +
        (later.length ? ' <span class="later-note">· ' + esc(later.join(" · ")) + '</span>' : "") +
        '</span>' +
        '</li>';
    }).join("");

    var list = visibleFilms();
    el["catalogue-count"].textContent = "(" + list.length + ")";
    el["film-empty"].hidden = list.length > 0;
    var selected = new Set(state.selected);
    el["film-list"].innerHTML = list.map(function (f) {
      var shows = showsByFilm.get(f.slug) || [];
      var later = laterLabels(f, true);
      var meta = [
        f.duration_min ? f.duration_min + " min" : null,
        shows.length ? shows.length + (shows.length === 1 ? " näytös" : " näytöstä") : "ei näytöksiä",
        f.year || null
      ].filter(Boolean).join(" · ");
      return '<li class="' + (selected.has(f.slug) ? "on" : "") + '">' +
        '<label><input type="checkbox" data-select="' + esc(f.slug) + '"' +
        (selected.has(f.slug) ? " checked" : "") + '>' +
        (f.poster ? '<img src="' + esc(f.poster) + '" alt="" loading="lazy">' : '<img alt="">') +
        '<span class="film-title">' + esc(f.title) + '</span>' +
        '<span class="film-meta">' + esc(meta) +
        (later.length ? ' <span class="later-note">· ' + esc(later.join(" · ")) + '</span>' : "") +
        '</span>' +
        '</label></li>';
    }).join("");
  }

  function daysToShow(plan) {
    var used = new Set();
    state.selected.forEach(function (slug) {
      (showsByFilm.get(slug) || []).forEach(function (s) { used.add(s.date); });
    });
    return DATA.days.filter(function (d) {
      return state.settings.allDays || used.has(d.date);
    });
  }

  function showingsFor(date) {
    var out = [];
    state.selected.forEach(function (slug) {
      (showsByFilm.get(slug) || []).forEach(function (s) {
        if (s.date === date) out.push(s);
      });
    });
    out.sort(function (a, b) { return a._start - b._start || (a.venue || "").localeCompare(b.venue || ""); });
    return out;
  }

  function stateClasses(s, plan) {
    var classes = [];
    var mark = markOf(s.id);
    var block = blockedBy(s);
    if (mark === "picked") classes.push("picked");
    else if (plan.get(s.film_slug) === s) classes.push("suggested");
    if (block === "rejected" || block === "soldout") classes.push("rejected");
    if (block === "day") classes.push("dayblocked");
    if (!block && mark !== "picked" && clashesWith(s, plan).length) classes.push("clash");
    if (!block && optionsOf(s.film_slug).length === 1) classes.push("scarce1");
    return classes;
  }

  function renderGrid(plan) {
    var days = daysToShow(plan);
    if (!state.selected.length) {
      el["view-grid"].innerHTML =
        '<p class="placeholder">Valitse elokuvia vasemmalta — niiden näytökset ilmestyvät tähän kalenteriin.</p>';
      return;
    }
    var all = [];
    days.forEach(function (d) { all = all.concat(showingsFor(d.date)); });
    if (!all.length) {
      el["view-grid"].innerHTML = '<p class="placeholder">Valituilla elokuvilla ei ole näytöksiä.</p>';
      return;
    }

    // Time axis in minutes-of-day; a showing running past midnight extends it.
    var lo = Infinity;
    var hi = -Infinity;
    all.forEach(function (s) {
      lo = Math.min(lo, s._min);
      hi = Math.max(hi, s._minEnd);
    });
    lo = Math.floor(lo / 60) * 60 - 30;
    hi = Math.ceil(hi / 60) * 60 + 30;
    var height = (hi - lo) * PPM;

    /* The gutter carries a header of its own so that its body starts at the
     * same y as every day column's body; without it the hour labels sit one
     * header-height above the times they mark. */
    var gutter = ['<div class="time-gutter">',
      '<div class="day-head gutter-head">klo</div>',
      '<div class="gutter-body" style="height:' + height + 'px">'];
    for (var minute = Math.ceil(lo / 60) * 60; minute <= hi; minute += 60) {
      var hour = ((minute / 60) % 24 + 24) % 24;
      gutter.push('<span class="hour" style="top:' + ((minute - lo) * PPM) + 'px">' +
        String(hour).padStart(2, "0") + '</span>');
    }
    gutter.push("</div></div>");

    var columns = days.map(function (d) {
      var list = showingsFor(d.date);
      /* Lanes are assigned per overlap cluster, not per day: one crowded noon
       * must not squeeze the evening's blocks into slivers. A cluster is a run
       * of showings connected by actual time overlap; each block is sized by
       * its own cluster's lane count. */
      var placed = [];
      var maxLanes = 1;
      var cluster = [];
      var clusterEnd = -Infinity;

      function flushCluster() {
        if (!cluster.length) return;
        var lanes = [];
        cluster.forEach(function (s) {
          var lane = 0;
          while (lane < lanes.length && lanes[lane] > s._min) lane++;
          lanes[lane] = s._minEnd;
          placed.push({ s: s, lane: lane, of: 0 });
        });
        var count = Math.max(1, lanes.length);
        maxLanes = Math.max(maxLanes, count);
        // Backfill the lane count now that the cluster is complete.
        placed.slice(placed.length - cluster.length).forEach(function (item) {
          item.of = count;
        });
        cluster = [];
        clusterEnd = -Infinity;
      }

      list.forEach(function (s) {
        if (cluster.length && s._min >= clusterEnd) flushCluster();
        cluster.push(s);
        clusterEnd = Math.max(clusterEnd, s._minEnd);
      });
      flushCluster();

      var lines = [];
      for (var minute = Math.ceil(lo / 60) * 60; minute <= hi; minute += 30) {
        lines.push('<div class="hline' + (minute % 60 ? " half" : "") +
          '" style="top:' + ((minute - lo) * PPM) + 'px"></div>');
      }

      var blocks = placed.map(function (item) {
        var s = item.s;
        var film = filmBySlug.get(s.film_slug) || {};
        var top = (s._min - lo) * PPM;
        var boxHeight = Math.max(MIN_BLOCK, s._durMin * PPM);
        var width = 100 / item.of;
        var classes = stateClasses(s, plan);
        var clashList = clashesWith(s, plan);
        var titleAttr = film.title + " · " + span(s) + " · " + s.venue +
          (clashList.length ? "\nPäällekkäin: " + clashList.map(function (c) {
            return (filmBySlug.get(c.slug) || {}).title;
          }).join(", ") : "") +
          (s.sales ? "\nMyynnissä: " + s.sales.available + "/" + s.sales.total : "");
        return '<button type="button" class="blk ' + classes.join(" ") + '"' +
          ' data-show="' + esc(s.id) + '"' +
          ' style="top:' + top + 'px;height:' + boxHeight + 'px;left:calc(' +
          (item.lane * width) + '% + 1.5px);width:calc(' + width + '% - 3px)"' +
          ' title="' + esc(titleAttr) + '">' +
          '<span class="t">' + s._clock + '</span> ' +
          (optionsOf(s.film_slug).length === 1 && !pickOf(s.film_slug)
            ? '<span class="badge">AINOA</span> ' : "") +
          (soldOut(s) ? '<span class="sold">LOPPU</span> ' : "") +
          '<span class="ttl">' + esc(film.title) + '</span>' +
          '<span class="v">' + esc(s.venue) + '</span>' +
          '<span class="x" data-reject="' + esc(s.id) + '" title="Hylkää / palauta tämä näytös">✕</span>' +
          '</button>';
      }).join("");

      var blocked = dayBlocked(d.date);
      var columnStyle = maxLanes > 3
        ? ' style="min-width:' + (maxLanes * MIN_LANE_PX) + 'px"'
        : "";
      return '<div class="day-col"' + columnStyle + '>' +
        '<div class="day-head' + (blocked ? " blocked" : "") + '">' +
        '<span class="lbl">' + esc(d.label) + '</span>' +
        '<span class="n">' + list.length + '</span>' +
        '<button type="button" class="tiny" data-day="' + d.date + '" title="' +
        (blocked ? "Palauta koko päivä käyttöön" : "Hylkää koko päivä") + '">' +
        (blocked ? "↺" : "✕") + '</button>' +
        '</div>' +
        '<div class="day-body" style="height:' + height + 'px">' + lines.join("") + blocks + '</div>' +
        '</div>';
    }).join("");

    el["view-grid"].innerHTML = '<div class="grid-scroll">' + gutter.join("") +
      '<div class="grid-days">' + columns + '</div></div>';
  }

  function renderAgenda(plan) {
    if (!state.selected.length) {
      el["view-agenda"].innerHTML =
        '<p class="placeholder">Valitse elokuvia vasemmalta — niiden näytökset listautuvat tähän päivittäin.</p>';
      return;
    }
    var days = daysToShow(plan);
    var html = days.map(function (d) {
      var list = showingsFor(d.date);
      if (!list.length && !state.settings.allDays) return "";
      var blocked = dayBlocked(d.date);
      var clashCount = list.filter(function (s) {
        return !blockedBy(s) && markOf(s.id) !== "picked" && clashesWith(s, plan).length;
      }).length;
      var rows = list.map(function (s) {
        var film = filmBySlug.get(s.film_slug) || {};
        var classes = stateClasses(s, plan);
        var badge = optionBadge(s.film_slug);
        var mark = markOf(s.id);
        var clashList = clashesWith(s, plan);
        var sub = [
          s.venue,
          s.runtime_min ? s.runtime_min + " min" : null,
          s.of ? s.index + "/" + s.of + " näytös" : null,
          s.sales ? "myynnissä " + s.sales.available + "/" + s.sales.total : null,
          s.guests && s.guests.length ? "vieraat: " + s.guests.join(", ") : null
        ].filter(Boolean).join(" · ");
        return '<div class="row ' + classes.join(" ") + '">' +
          '<span class="when">' + span(s) + '</span>' +
          '<span class="opts ' + badge.cls + '" title="' + esc(badge.title) + '">' + badge.text + '</span>' +
          '<button type="button" class="name" data-film="' + esc(s.film_slug) + '">' + esc(film.title) + '</button>' +
          '<span class="acts">' +
          '<button type="button" data-pick="' + esc(s.id) + '" class="' + (mark === "picked" ? "on" : "") +
          '" title="Valitse tämä näytös">✓</button>' +
          '<button type="button" data-reject="' + esc(s.id) + '" class="' + (mark === "rejected" ? "off" : "") +
          '" title="Hylkää / palauta tämä näytös">✕</button>' +
          '</span>' +
          '<span class="sub">' + esc(sub) +
          (clashList.length ? ' <span class="clash">⚠ päällekkäin: ' + esc(clashList.map(function (c) {
            return (filmBySlug.get(c.slug) || {}).title + " " + c.showing._clock;
          }).join(", ")) + '</span>' : "") +
          '</span>' +
          '</div>';
      }).join("");
      return '<details' + (list.length ? " open" : "") + (blocked ? ' class="blocked"' : "") + '>' +
        '<summary><span class="lbl">' + esc(d.label) + '</span>' +
        '<span class="n">' + fi(list.length, "näytös", "näytöstä") +
        (clashCount ? ", " + fi(clashCount, "päällekkäisyys", "päällekkäisyyttä") : "") + '</span>' +
        '<button type="button" class="tiny" data-day="' + d.date + '">' +
        (blocked ? "↺ palauta päivä" : "✕ hylkää koko päivä") + '</button>' +
        '</summary>' + rows + '</details>';
    }).join("");
    el["view-agenda"].innerHTML = '<div class="agenda">' + (html ||
      '<p class="placeholder">Valituilla elokuvilla ei ole näytöksiä.</p>') + '</div>';
  }

  function renderPlan(plan) {
    if (!state.selected.length) {
      el["view-plan"].innerHTML =
        '<p class="placeholder">Suunnitelma kertyy tähän, kun valitset elokuvia ja näytöksiä.</p>';
      return;
    }
    var entries = [];
    plan.forEach(function (s, slug) { entries.push({ slug: slug, s: s }); });
    entries.sort(function (a, b) { return a.s._start - b.s._start; });

    var byDay = new Map();
    entries.forEach(function (entry) {
      if (!byDay.has(entry.s.date)) byDay.set(entry.s.date, []);
      byDay.get(entry.s.date).push(entry);
    });

    var dayHtml = Array.from(byDay.keys()).sort().map(function (date) {
      var list = byDay.get(date);
      var lines = [];
      list.forEach(function (entry, index) {
        var s = entry.s;
        var film = filmBySlug.get(entry.slug) || {};
        var pinned = markOf(s.id) === "picked";
        lines.push('<div class="plan-line">' +
          '<span class="when">' + span(s) + '</span>' +
          '<span><strong>' + esc(film.title) + '</strong>' +
          (pinned ? "" : ' <span class="pill info">ehdotus</span>') + '</span>' +
          '<span class="where">' + esc(s.venue) + '</span>' +
          '</div>');
        var next = list[index + 1];
        if (next) {
          var gapMin = Math.round((next.s._start - s._end) / 60000);
          var need = requiredGapMin(s, next.s);
          var cls = gapMin < 0 ? "impossible" : gapMin < need ? "tight" : "";
          var moved = next.s.venue !== s.venue;
          lines.push('<div class="plan-gap ' + cls + '">' +
            (gapMin < 0
              ? "päällekkäin " + Math.abs(gapMin) + " min"
              : gapMin + " min väliä" + (moved ? ", siirtymä " + esc(s.venue) + " → " + esc(next.s.venue) : " samassa salissa") +
                (gapMin < need ? " — tarvitaan " + need + " min" : "")) +
            '</div>');
        }
      });
      var day = dayByDate.get(date) || { label: date };
      var minutes = list.reduce(function (sum, entry) { return sum + (entry.s.runtime_min || 0); }, 0);
      return '<div class="plan-day"><header><span>' + esc(day.label) + '</span>' +
        '<span class="tot">' + fi(list.length, "elokuva", "elokuvaa") +
        " · " + minutes + " min katsottavaa</span>" +
        '</header>' + lines.join("") + '</div>';
    }).join("");

    var unfit = state.selected.filter(function (slug) { return !plan.has(slug); });
    var unfitHtml = unfit.length
      ? '<h3>Ei mahdu (' + unfit.length + ')</h3><ul class="unfit">' + unfit.map(function (slug) {
          var film = filmBySlug.get(slug);
          var later = laterLabels(film, false);
          return '<li><button type="button" class="name" data-film="' + esc(slug) + '">' +
            esc(film.title) + '</button> <span class="why">— ' + esc(unfitReason(slug, plan)) +
            '</span>' +
            (later.length
              ? ' <span class="later-ok">' + esc("näet sen silti: " + later.join(", ")) + '</span>'
              : "") + '</li>';
        }).join("") + '</ul>'
      : "";

    var tiers = { must: 0, want: 0, maybe: 0 };
    plan.forEach(function (_s, slug) { tiers[tierOf(slug)]++; });
    var totals = TIERS.map(function (t) {
      var of = state.selected.filter(function (slug) { return tierOf(slug) === t[0]; }).length;
      return of ? t[1] + ": " + tiers[t[0]] + "/" + of : null;
    }).filter(Boolean).join(" · ");

    el["view-plan"].innerHTML = '<div class="plan">' +
      '<h3>Aikataulussa (' + plan.size + "/" + state.selected.length + ')</h3>' +
      '<p class="hint">' + esc(totals) + '</p>' +
      (dayHtml || '<p class="hint">Ei vielä yhtään valittua näytöstä.</p>') +
      unfitHtml + '</div>';
  }

  function renderStatus(plan) {
    var pills = [];
    var picked = state.selected.filter(function (slug) { return pickOf(slug); }).length;
    var suggested = plan.size - picked;
    var scarce = state.selected.filter(function (slug) {
      return !pickOf(slug) && optionsOf(slug).length === 1;
    }).length;
    var dead = state.selected.filter(function (slug) {
      return !pickOf(slug) && optionsOf(slug).length === 0;
    }).length;

    pills.push('<span class="pill">' +
      fi(state.selected.length, "valittu elokuva", "valittua elokuvaa") + "</span>");
    pills.push('<span class="pill' + (picked ? " good" : "") + '">' +
      fi(picked, "lukittu näytös", "lukittua näytöstä") + "</span>");
    if (suggested > 0) {
      pills.push('<span class="pill info">' +
        fi(suggested, "ehdotettu näytös", "ehdotettua näytöstä") + "</span>");
    }
    if (scarce) {
      pills.push('<span class="pill warn">' +
        fi(scarce, "elokuva vain yhdellä vaihtoehdolla",
                   "elokuvaa vain yhdellä vaihtoehdolla") + "</span>");
    }
    if (dead) {
      pills.push('<span class="pill bad">' +
        fi(dead, "elokuva ilman vapaata näytöstä",
                 "elokuvaa ilman vapaata näytöstä") + "</span>");
    }
    if (state.rejectedDays.length) {
      pills.push('<span class="pill bad">' +
        fi(state.rejectedDays.length, "hylätty päivä", "hylättyä päivää") + "</span>");
    }
    var clashing = 0;
    plan.forEach(function (s) {
      if (clashesWith(s, plan).length) clashing++;
    });
    if (clashing) {
      pills.push('<span class="pill warn">⚠ ' +
        fi(clashing, "päällekkäinen valinta", "päällekkäistä valintaa") + "</span>");
    }
    el.statusbar.innerHTML = pills.join("");

    var hasSuggestion = Object.keys(state.suggestion).length > 0;
    el["btn-accept"].hidden = !hasSuggestion;
    el["btn-clear-suggestion"].hidden = !hasSuggestion;
    el["btn-solve"].disabled = state.selected.length === 0;
  }

  function render() {
    var scroll = {
      picker: el.picker ? el.picker.scrollTop : 0,
      browse: el["view-browse"].scrollTop,
      grid: el["view-grid"].scrollTop,
      gridLeft: el["view-grid"].scrollLeft,
      agenda: el["view-agenda"].scrollTop,
      plan: el["view-plan"].scrollTop
    };
    var plan = planMap();

    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.classList.toggle("active", tab.dataset.view === state.settings.view);
    });
    el["view-browse"].hidden = state.settings.view !== "browse";
    el["view-grid"].hidden = state.settings.view !== "grid";
    el["view-agenda"].hidden = state.settings.view !== "agenda";
    el["view-plan"].hidden = state.settings.view !== "plan";

    renderPicker();
    if (state.settings.view === "browse") renderBrowse();
    else if (state.settings.view === "grid") renderGrid(plan);
    else if (state.settings.view === "agenda") renderAgenda(plan);
    else renderPlan(plan);
    renderStatus(plan);

    if (el.picker) el.picker.scrollTop = scroll.picker;
    el["view-browse"].scrollTop = scroll.browse;
    el["view-grid"].scrollTop = scroll.grid;
    el["view-grid"].scrollLeft = scroll.gridLeft;
    el["view-agenda"].scrollTop = scroll.agenda;
    el["view-plan"].scrollTop = scroll.plan;
  }

  // ---------------------------------------------------------------- modal

  /* One card renderer feeds both the modal and the Esittelyt list. The static
   * half (poster, credits, description) is built once per film and cached as a
   * DOM node; only the two stateful strips are rewritten on each render, so a
   * 157-card list neither flickers nor loses the focus of a control you just
   * used. */

  function filmFacts(film) {
    return [
      ["Ohjaus", film.directors.join(", ")],
      ["Näyttelijät", film.cast.join(", ")],
      ["Maa", film.countries.join(", ")],
      ["Vuosi", film.year],
      ["Kesto", film.duration_min ? film.duration_min + " min" : ""],
      ["Kieli", film.languages.join(", ")],
      ["Tekstitys", film.subtitles.join(", ")],
      ["Ikäraja", film.age_rating],
      ["Teema", film.themes.join(", ")],
      ["Sisältövaroitukset", film.content_warnings.join(", ")],
      ["Teatterilevitys", film.cinema_release
        ? film.cinema_release.label + (film.cinema_release.date
            ? " (" + film.cinema_release.date + ")" : "")
        : ""],
      ["Yle Areena", film.on_yle_areena ? "festivaalin jälkeen" : ""]
    ].filter(function (row) { return row[1]; });
  }

  /** Selection checkbox, priority tier and the film's current slot. */
  function cardControls(slug) {
    var selected = state.selected.indexOf(slug) !== -1;
    var badge = optionBadge(slug);
    var pick = pickOf(slug);
    var suggested = pick ? null : suggestionOf(slug);
    var slot = pick || suggested;
    var slotText = slot
      ? (dayByDate.get(slot.date) || {}).label + " " + span(slot) + " · " + slot.venue +
        (suggested ? " (ehdotus)" : "")
      : fi(optionsOf(slug).length, "vapaa näytös", "vapaata näytöstä");
    return '<span class="opts ' + badge.cls + '" title="' + esc(badge.title) + '">' +
      badge.text + '</span>' +
      '<label class="pickbox"><input type="checkbox" data-select="' + esc(slug) + '"' +
      (selected ? " checked" : "") + '> ' + (selected ? "suunnitelmassa" : "lisää suunnitelmaan") +
      '</label>' +
      '<select data-tier="' + esc(slug) + '" aria-label="Prioriteetti">' +
      TIERS.map(function (t) {
        return '<option value="' + t[0] + '"' + (tierOf(slug) === t[0] ? " selected" : "") +
          '>' + t[1] + '</option>';
      }).join("") + '</select>' +
      laterTags(filmBySlug.get(slug)) +
      '<span class="slot ' + (pick ? "picked" : suggested ? "suggested" : "") + '">' +
      esc(slotText) + '</span>';
  }

  /** The film's showings with their per-showing pick/reject buttons. */
  function cardShows(slug) {
    var rows = (showsByFilm.get(slug) || []).map(function (s) {
      var mark = markOf(s.id);
      var block = blockedBy(s);
      var label = mark === "picked" ? "valittu"
        : block === "rejected" ? "hylätty"
        : block === "day" ? "päivä hylätty"
        : block === "soldout" ? "loppuunmyyty"
        : "vapaa";
      return '<li><span>' + esc((dayByDate.get(s.date) || {}).label) + " " + span(s) + '</span>' +
        '<span class="venue">' + esc(s.venue) +
        (s.sales ? " · myynnissä " + s.sales.available + "/" + s.sales.total : "") + '</span>' +
        '<span class="st"><button type="button" class="tiny" data-pick="' + esc(s.id) + '">' +
        (mark === "picked" ? "poista valinta" : "valitse") + '</button> ' +
        '<button type="button" class="tiny" data-reject="' + esc(s.id) + '">' +
        (mark === "rejected" ? "palauta" : "hylkää") + '</button> ' +
        '<span class="tag">' + label + '</span>' +
        (s.buy_url ? ' <a class="tag" href="' + esc(s.buy_url) +
          '" target="_blank" rel="noopener">liput</a>' : "") +
        '</span></li>';
    }).join("");
    return rows
      ? '<h3>Näytökset</h3><ul class="modal-shows">' + rows + "</ul>"
      : '<p class="hint">Ei näytöksiä ohjelmistossa.</p>';
  }

  /** Everything about a film that never changes with planning state. */
  function cardStatic(slug, headingId) {
    var film = filmBySlug.get(slug);
    var links = Object.keys(film.links || {}).map(function (name) {
      return '<a class="tag" href="' + esc(film.links[name]) +
        '" target="_blank" rel="noopener">' + esc(name) + "</a>";
    });
    if (film.url) {
      links.unshift('<a class="tag" href="' + esc(film.url) +
        '" target="_blank" rel="noopener">hiff.fi</a>');
    }
    if (film.trailer_url) {
      links.push('<a class="tag" href="' + esc(film.trailer_url) +
        '" target="_blank" rel="noopener">traileri</a>');
    }
    return '<h2' + (headingId ? ' id="' + headingId + '"' : "") + ">" + esc(film.title) + "</h2>" +
      (film.original_title ? '<p class="orig">' + esc(film.original_title) + "</p>" : "") +
      '<div class="card-controls"></div>' +
      '<div class="modal-grid">' +
      (film.poster
        ? '<img src="' + esc(film.poster) + '" alt="" loading="lazy">'
        : "<div></div>") +
      "<div>" +
      (film.logline ? '<p class="lead">' + esc(film.logline) + "</p>" : "") +
      '<dl class="facts">' + filmFacts(film).map(function (row) {
        return "<dt>" + esc(row[0]) + "</dt><dd>" + esc(row[1]) + "</dd>";
      }).join("") + "</dl>" +
      '<div class="tags">' + links.join(" ") + "</div>" +
      "</div></div>" +
      '<div class="body">' + (film.description_text || "").split("\n\n").map(function (para) {
        return "<p>" + esc(para) + "</p>";
      }).join("") + "</div>" +
      (film.shorts && film.shorts.length
        ? '<h3>Kokonaisuuden lyhytelokuvat</h3><ul class="modal-shows">' +
          film.shorts.map(function (short) {
            return "<li><span>" + esc(short.title) + '</span><span class="venue">' +
              esc([short.directors.join(", "), short.countries.join(", "), short.year,
                   short.duration_min ? short.duration_min + " min" : ""]
                .filter(Boolean).join(" · ")) + "</span></li>";
          }).join("") + "</ul>"
        : "") +
      (film.keywords.length
        ? '<div class="tags">' + film.keywords.map(function (k) {
            return '<span class="tag">' + esc(k) + "</span>";
          }).join("") + "</div>"
        : "") +
      '<div class="card-shows"></div>';
  }

  function refreshCard(node, slug) {
    node.classList.toggle("on", state.selected.indexOf(slug) !== -1);
    /* Building the markup is cheap; parsing it is not. With the whole
     * catalogue open a single click would otherwise reparse 314 strips, so
     * only write the ones that actually changed. */
    var controls = cardControls(slug);
    if (node._ctrlHtml !== controls) {
      node.querySelector(".card-controls").innerHTML = controls;
      node._ctrlHtml = controls;
    }
    var shows = cardShows(slug);
    if (node._showsHtml !== shows) {
      node.querySelector(".card-shows").innerHTML = shows;
      node._showsHtml = shows;
    }
  }

  // ------------------------------------------------------- Esittelyt (browse)

  var browseCards = new Map();
  var browseOrder = null;

  function renderBrowse() {
    var list = visibleFilms();
    var signature = list.map(function (f) { return f.slug; }).join(",");
    var host = el["view-browse"];

    if (signature !== browseOrder) {
      browseOrder = signature;
      host.textContent = "";
      var wrap = document.createElement("div");
      wrap.className = "browse";
      var head = document.createElement("p");
      head.className = "browse-head";
      head.textContent = list.length
        ? fi(list.length, "elokuva", "elokuvaa") +
          " · kuvaukset kokonaisuudessaan · haku ja rajaukset käytössä"
        : "Ei osumia näillä rajauksilla.";
      wrap.appendChild(head);
      list.forEach(function (film) {
        var card = browseCards.get(film.slug);
        if (!card) {
          card = document.createElement("article");
          card.className = "film-card";
          card.innerHTML = cardStatic(film.slug, "");
          browseCards.set(film.slug, card);
        }
        wrap.appendChild(card);
      });
      host.appendChild(wrap);
    }

    // Applied every render: the column setting can change without the film
    // list changing, which would skip the rebuild above.
    var wrapper = host.querySelector(".browse");
    if (wrapper) wrapper.classList.toggle("single", state.settings.browseSingle);

    list.forEach(function (film) {
      refreshCard(browseCards.get(film.slug), film.slug);
    });
  }

  // ----------------------------------------------------------------- modal

  function openFilm(slug) {
    if (!filmBySlug.has(slug)) return;
    el["modal-body"].innerHTML = cardStatic(slug, "modal-title");
    refreshCard(el["modal-body"], slug);
    el.modal.hidden = false;
  }

  function closeModal() { el.modal.hidden = true; }

  // --------------------------------------------------------- import/export

  function exportPlan() {
    var payload = Object.assign({}, state, {
      meta: {
        app: "ra2026-aikatauluttaja",
        exported_at: new Date().toISOString(),
        festival: DATA.meta.festival,
        data_scraped_at: DATA.meta.scraped_at,
        films: state.selected.map(function (slug) {
          var film = filmBySlug.get(slug);
          var pick = pickOf(slug);
          return {
            slug: slug,
            title: film.title,
            tier: tierOf(slug),
            picked: pick ? { id: pick.id, when: pick.time_text, venue: pick.venue } : null
          };
        })
      }
    });
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "ra2026-suunnitelma-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 5000);
  }

  function importPlan(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        var before = { films: (parsed.selected || []).length };
        state = merge(defaults(), parsed);
        var dropped = before.films - state.selected.length;
        commit();
        alert("Tuotu: " + state.selected.length + " elokuvaa" +
          (dropped > 0 ? " (" + dropped + " tuntematonta ohitettiin)" : "") + ".");
      } catch (error) {
        alert("Tiedostoa ei voitu lukea: " + error.message);
      }
    };
    reader.readAsText(file);
  }

  // -------------------------------------------------------------- wiring

  function syncSettingsInputs() {
    el["set-buffer"].value = state.settings.bufferMin;
    el["set-same"].value = state.settings.sameVenueGapMin;
    el["set-soldout"].checked = state.settings.soldOutBlocks;
    el["set-events"].checked = state.settings.showEvents;
    el["set-alldays"].checked = state.settings.allDays;
    el["set-single"].checked = state.settings.browseSingle;
  }

  function fillSelect(select, values) {
    values.forEach(function (entry) {
      var option = document.createElement("option");
      option.value = entry.value;
      option.textContent = entry.label;
      select.appendChild(option);
    });
  }

  function init() {
    el["brand-sub"].textContent = DATA.meta.festival.replace("Rakkautta & Anarkiaa ", "") +
      " · " + DATA.days[0].label + "–" + DATA.days[DATA.days.length - 1].label +
      " · " + DATA.meta.counts.showings + " näytöstä · data " +
      DATA.meta.scraped_at.slice(0, 10);

    fillSelect(el["filter-theme"], DATA.facets.themes.map(function (t) {
      return { value: t.name, label: t.name + " (" + t.count + ")" };
    }));
    fillSelect(el["filter-genre"], DATA.facets.genres.map(function (g) {
      return { value: g.name, label: g.name + " (" + g.count + ")" };
    }));
    fillSelect(el["filter-day"], DATA.days.map(function (d) {
      return { value: d.date, label: d.label + " (" + d.showing_count + ")" };
    }));

    syncSettingsInputs();
    el.picker = document.getElementById("picker");

    // load() sanitises the saved plan (unknown films, stale showing ids, wrong
    // types); write the cleaned version back so storage never keeps the junk.
    save();

    // -- topbar
    el["btn-settings"].addEventListener("click", function () {
      var open = el.settings.hidden;
      el.settings.hidden = !open;
      el["btn-settings"].setAttribute("aria-expanded", String(open));
    });
    el["btn-export"].addEventListener("click", exportPlan);
    el["btn-import"].addEventListener("click", function () { el["import-file"].click(); });
    el["import-file"].addEventListener("change", function (event) {
      if (event.target.files && event.target.files[0]) importPlan(event.target.files[0]);
      event.target.value = "";
    });
    el["btn-reset"].addEventListener("click", function () {
      if (!confirm("Tyhjennetäänkö kaikki valinnat, hylkäykset ja asetukset?")) return;
      state = defaults();
      syncSettingsInputs();
      commit();
    });

    // -- settings
    el["set-buffer"].addEventListener("change", function () {
      state.settings.bufferMin = Math.max(0, Number(this.value) || 0);
      commit();
    });
    el["set-same"].addEventListener("change", function () {
      state.settings.sameVenueGapMin = Math.max(0, Number(this.value) || 0);
      commit();
    });
    [["set-soldout", "soldOutBlocks"], ["set-events", "showEvents"],
     ["set-alldays", "allDays"], ["set-single", "browseSingle"]].forEach(function (pair) {
      el[pair[0]].addEventListener("change", function () {
        state.settings[pair[1]] = this.checked;
        commit();
      });
    });

    // -- filters
    var debounce = null;
    el.search.addEventListener("input", function () {
      clearTimeout(debounce);
      debounce = setTimeout(render, 130);
    });
    ["filter-theme", "filter-genre", "filter-day", "filter-later",
     "filter-scarce"].forEach(function (id) {
      el[id].addEventListener("change", render);
    });

    // -- tabs
    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        state.settings.view = tab.dataset.view;
        commit();
      });
    });

    // -- solver
    el["btn-solve"].addEventListener("click", function () {
      var result = solve();
      if (result.error === "pins") {
        alert("Lukitut näytökset menevät keskenään päällekkäin — pura jokin niistä ensin:\n\n" +
          result.pinClashes.map(function (pair) {
            return pair.map(function (s) {
              return (filmBySlug.get(s.film_slug) || {}).title + " " +
                (dayByDate.get(s.date) || {}).label + " " + span(s) + " " + s.venue;
            }).join("  ✕  ");
          }).join("\n"));
        return;
      }
      state.suggestion = {};
      result.assign.forEach(function (showing, slug) { state.suggestion[slug] = showing.id; });
      state.settings.view = "plan";
      commit();
      if (result.truncated) {
        console.warn("solver hit the node/time cap; showing the best plan found so far");
      }
    });
    el["btn-accept"].addEventListener("click", function () {
      Object.keys(state.suggestion).forEach(function (slug) {
        var id = state.suggestion[slug];
        (showsByFilm.get(slug) || []).forEach(function (s) {
          if (markOf(s.id) === "picked") delete state.showings[s.id];
        });
        state.showings[id] = "picked";
      });
      state.suggestion = {};
      commit();
    });
    el["btn-clear-suggestion"].addEventListener("click", function () {
      state.suggestion = {};
      commit();
    });
    el["btn-clear-selection"].addEventListener("click", function () {
      if (!confirm("Poistetaanko kaikki " + state.selected.length + " valittu elokuva?")) return;
      state.selected.forEach(function (slug) {
        (showsByFilm.get(slug) || []).forEach(function (s) {
          if (markOf(s.id) === "picked") delete state.showings[s.id];
        });
      });
      state.selected = [];
      state.suggestion = {};
      commit();
    });

    // -- delegated interaction across picker, views and modal
    document.addEventListener("click", function (event) {
      var target = event.target.closest(
        "[data-reject],[data-pick],[data-day],[data-film],[data-show],[data-close]"
      );
      if (!target) return;

      if (target.dataset.close !== undefined) { closeModal(); return; }
      if (target.dataset.reject !== undefined) {
        event.preventDefault();
        event.stopPropagation();
        toggleReject(target.dataset.reject);
        if (!el.modal.hidden) openFilm(showById.get(target.dataset.reject).film_slug);
        return;
      }
      if (target.dataset.pick !== undefined) {
        event.preventDefault();
        event.stopPropagation();
        togglePick(target.dataset.pick);
        if (!el.modal.hidden) openFilm(showById.get(target.dataset.pick).film_slug);
        return;
      }
      if (target.dataset.day !== undefined) {
        event.preventDefault();
        toggleDay(target.dataset.day);
        return;
      }
      if (target.dataset.film !== undefined) {
        event.preventDefault();
        var wanted = target.dataset.film;
        /* While reading the catalogue, the picker acts as an index: jump to the
         * card in place rather than covering it with a modal. */
        var card = browseCards.get(wanted);
        if (state.settings.view === "browse" && card && card.isConnected) {
          // Highlight first: the marker is what tells you where you landed,
          // and it must not depend on the scroll API being available.
          card.classList.remove("flash");
          void card.offsetWidth;               // restart the animation
          card.classList.add("flash");
          if (typeof card.scrollIntoView === "function") {
            card.scrollIntoView({ block: "start", behavior: "smooth" });
          }
        } else {
          openFilm(wanted);
        }
        return;
      }
      if (target.dataset.show !== undefined) {
        var showing = showById.get(target.dataset.show);
        if (showing && blockedBy(showing) === "day") return;   // day rejection wins
        togglePick(target.dataset.show);
      }
    });

    document.addEventListener("change", function (event) {
      if (event.target.dataset.select !== undefined) {
        toggleFilm(event.target.dataset.select);
      } else if (event.target.dataset.tier !== undefined) {
        var slug = event.target.dataset.tier;
        state.priority[slug] = event.target.value;
        // Setting a priority on a film you have not picked yet means you want it.
        if (state.selected.indexOf(slug) === -1) state.selected.push(slug);
        commit();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !el.modal.hidden) closeModal();
    });

    render();
  }

  init();
})();
</script>
</body>
</html>
