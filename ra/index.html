vanhaa telakkaa vertauskuvallisesti. Se on henkilöhahmojen tavoin unohdettu ja jumissa kahden ajan välissä. Isä ja tytär ovat kykenemättömiä pakenemaan menneisyyttä, mutta samanaikaisesti vailla tietoa siitä, kuinka jatketaan matkaa kohti tulevaisuutta. Aika kuitenkin kulkee eteenpäin tuoden jotain uutta: kuvauspaikallakin on nykyään telakan tilalla arvokiinteistö.\n\nOmar Fasolah","poster":"https://hiff.fi/wp-content/uploads/airtable/b39a9d7e4de8618383f8bbb3edaebf52-large.png","trailer_url":"https://www.youtube.com/embed/Vv6m68N2C78?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/hold-onto-me/","imdb":"http://imdb.com/title/tt35521189/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_glorious%20summ"},"content_warnings":[],"showing_ids":["recPweoLQyRHQva48","rec4S8MfAxyUndy3c","rechJ4GdmmorelilD"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"homebound","title":"Homebound","original_title":"होमबाउंड","url":"https://hiff.fi/ohjelma/homebound/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Ystävyys","Matka","Yhteiskunta"],"countries":["Intia","Ranska"],"directors":["Neeraj Ghaywan"],"cast":["Ishaan Khatter","Vishal Jethwa","Janhvi Kapoor"],"languages":["hindi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":122,"year":2025,"logline":"Martin Scorsesen tuottama Intian Oscar-ehdokas kahden ystävyksen matkasta pienestä kotikylästään on tiivis yhdistelmä tie-elokuvaa ja selviytymistarinaa.","description_text":"Homebound on koskettava draama ystävyydestä ja epätasa-arvosta 2020-luvun Intiassa. Martin Scorsesen tuottama elokuva on tarina Ishaan Khatterin ja Vishal Jethwan näyttelemien ystävysten yhteisestä pyrkimyksestä parempaan. Neeraj Ghaywanin toinen kokopitkä ohjaus oli Intian Oscar-ehdokas, vaikka valtio alun perin pyrki sensuroimaan teosta vahvasti. Elokuva kritisoi kastijärjestelmää ja islamofobiaa, mutta erityisesti se tekee näkyväksi siirtotyöläisten kokemat vaikeudet koronarajoitusten aikaan.\n\nShoaib ja Chandan ovat parhaat ystävät pienestä pohjoisintialaisesta kylästä. Pojat päättävät yhdessä havitella parempaa elämää hakemalla töitä muualta. Koronarajoitusten iskiessä kaksikko on jo kaukana kotoa, mutta heidän on käännyttävä takaisin. Satojen kilometrien matka takaisin kotiin on pakko kävellä, muita vaihtoehtoja ei ole. Miljoonat siirtotyöläiset kokivat saman Intiassa lockdownin aikaan. Monet heistä eivät selvinneet perille. Homebound on tiivis yhdistelmä tie-elokuvaa ja selviytymistarinaa, eikä kyyneleiltä vältytä.\n\nSiiri Siltala","poster":"https://hiff.fi/wp-content/uploads/airtable/cb8d0dc3e089e276e4a8c4ce5d45bb69-large.jpg","trailer_url":"https://www.youtube.com/embed/WojNkusud84?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/homebound-2025/","imdb":"https://www.imdb.com/title/tt26733325/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_homebound"},"content_warnings":[],"showing_ids":["recntDIXMUJYKpUsE","rec0coRz6auiMkAQN"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 2.10.","status":"dated","date":"2026-10-02"},"on_yle_areena":false},{"slug":"i-see-buildings-fall-like-lightning","title":"I See Buildings Fall Like Lightning","original_title":null,"url":"https://hiff.fi/ohjelma/i-see-buildings-fall-like-lightning/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Ystävyys","Rakkaus","Mielenterveys","Kasvutarina","Yhteiskunta","Kaupunkitila"],"countries":["Iso-Britannia","Ranska","Yhdysvallat"],"directors":["Clio Barnard"],"cast":["Anthony Boyle","Lola Petticrew","Joe Cole","Daryl McCormack"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":109,"year":2026,"logline":"Kaveriporukan lapsuudesta alkanut ystävyys alkaa säröillä kolmekymppisyyden kynnyksellä nykypäivän brittiläisen luokkayhteiskunnan puristuksissa.","description_text":"Kolmikymppiset lapsuudenystävät betonilähiöstä viettävät iltaa kuin ennen vanhaan. Tanssiaskeleet menneiden vuosien bängeriin luonnistuvat edelleen, wc-kopista saa rahalla kokkelia ja diskovalojen välkkeessä voi valua euforiseen transsiin. Krapula ei ole kuitenkaan ainoa asia, joka pahenee vanhetessa.\n\nKaveruksista Rian on päässyt pisimmälle rikastumalla osakkeilla. Hintana on ulkopuolisuus. Pitääkseen kiinni juuristaan hän rahoittaa Conorin rakennushanketta, jossa heidän lapsuutensa lanatun betonikolossin tilalle rakennetaan uusia, hienoja asuntoja, joihin kellään paikallisista ei ole varaa. Yliopistotutkinnosta huolimatta Patrick joutuu elättämään perhettään pyörälähettinä vaimo Shivin hoitaessa lapsia ja sairasta äitiään. Oli heittää keikkaa diilerinä ja ottaa vähän kuormasta, kunnes saa työtä Conorin rakennustyömaalta. Mitä korkeammaksi rakennus nousee, sitä selkeämmäksi säröt perustassa käyvät.\n\nOhjaajalegenda Ken Loachiin verrattu Clio Barnard jatkaa raikkaasti I See Buildings Fall Like Lightning -elokuvallaan brittiläisen luokkayhteiskuntaa kriittisesti tarkastelevan elokuvan perinnettä. Elokuva on oodi ystävyydelle elämän nivelvaiheessa, jossa useampi ovi on sulkeutumassa kuin avautumassa. Bilekohtauksissa maistuu aikuistumisen samanaikainen riemu ja kitkeryys.\n\nSanni Myllyaho","poster":"https://hiff.fi/wp-content/uploads/airtable/aa80134cafc9179565110eabc7a692c9-large.jpg","trailer_url":"https://www.youtube.com/embed/U46yuOQzvxw?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/i-see-buildings-fall-like-lightning/","imdb":"https://www.imdb.com/title/tt38991615/?ref_=nv_sr_srsg_0_tt_6_nm_2_in_0_q_i%20see%20buil"},"content_warnings":["Itsemurha"],"showing_ids":["recFbJBrlHxkDnAQQ","recK2D7GjMTO5f7XC","recnBC9FbSZEr5LP7"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"if-i-go-will-they-miss-me","title":"If I Go Will They Miss Me","original_title":null,"url":"https://hiff.fi/ohjelma/if-i-go-will-they-miss-me/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["United States of Indie"],"keywords":["Kaupunkitila","Perhesuhteet","Kasvutarina","Lapsuus"],"countries":["Yhdysvallat"],"directors":["Walter Thompson-Hernández"],"cast":["Bodhi Dell","J. Alphonse Nicholson","Danielle Brooks","Kelvin Adekunle","Bre-Z"],"languages":["englanti"],"subtitles":["kuvaileva tekstitys englanniksi"],"age_rating":"K12","duration_min":92,"year":2026,"logline":"Los Angelesiin sijoittuvassa lyyrisessä jenkki-indiessä pojan mielikuvitusta ruokkivat lentämisen myytit ja alueen yli lentävät lentokoneet mutta myös vankilasta vapautunut isä.","description_text":"Hiljattain vankilasta vapautunut Big Ant (J. Alphonse Nicholson) palaa vaimonsa Lozitan (Danielle Brooks) ja kolmen lapsensa luokse. Hänen ainoasta pojastaan, Lil Antista (Bodhi Dell), on hänen poissaolonsa aikana ehtinyt kasvaa luova ja herkkä poika, joka lumoutuu kreikkalaisesta mytologiasta ja naapurustonsa yli lentävistä lentokoneista. Kipeästi roolimallia kaipaava Lil Ant rinnastaa sankarina pitämänsä isän Poseidoniin ja kuvittelee itsensä siivekkääksi Pegasos-hevoseksi, joka lentää kohti taivasta. Omien haavojensa kanssa kipuileva Big Ant ei kuitenkaan osaa vastata poikansa haparoiviin yrityksiin lähentyä, vaan käskee tätä miehistymään. Piilevä side isän ja pojan välillä alkaa kuitenkin hahmottua, kun he molemmat alkavat nähdä samaa aavemaista näkyä naapurustossa vaeltavista pojista.\n\nSundancen elokuvajuhlilla vuonna 2022 palkittuun lyhytelokuvaan perustuva If I Go Will They Miss Me tarkastelee lempeästi sukupolvien välisen trauman haavoittamia perhesiteitä, vanhemmuutta ja oman identiteetin etsimistä. Lyyrinen kerrontaa liikkuu sujuvasti arkisen draaman ja maagisen realismin välimaastossa, kun Lil Ant yrittää selittää monimutkaista todellisuuttaan mielikuvituksen voimin.\n\nIda Kumpulainen","poster":"https://hiff.fi/wp-content/uploads/airtable/7265ac3afb0c053b0b11e6dd6dfe8e8a-large.jpg","trailer_url":"https://www.youtube.com/embed/Te8CWh_tUBw?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/if-i-go- yttöjen leikkejä läheltä. Orastava ystävyys ja tyttöjen arkinen mutta taianomainen maailma kuvataan kauniisti ja herkästi. Mutta alati pauhaavissa tuulettimissa on jotain painostavaa. Tytöt joutuvat oppimaan navigoimaan maailmassa, joka ei aina ole heille turvallinen.\n\nLeppoisten uintiretkien lomassa tytöt kertovat Lauralle legendasta, jonka mukaan joessa asuu violettihiuksinen, naisia tappava hirviö.\n\nVaikka useimmat tyttöjä ympäröivät aikuiset vaikuttavat turvallisilta, tuntuu siltä, että tytöt ovat vaarassa. Miehet ovat sivuhenkilöitä, läsnä vain muistoina, tai kuvien ulkolaidoilla, tummina varjoina. Patriarkaalisen yhteiskunnan nurjat puolet tulevat esiin sivulauseissa; legendan mukaan “hirviö tappaa vain huoria” ja väkivallan uhka on läsnä, vaikka sitä ei kuvata tarkasti.\n\nCostaricalaisen ohjaajan Kim Torresin ensimmäinen pitkä elokuva kuvaa vangitsevasti tyttöyttä ja pelkoa, jonka kanssa liian monet naiset joutuvat elämään. Lyyrinen elokuva ei anna valmiiksi pureskeltuja vastauksia.\n\nKira Schroeder","poster":"https://hiff.fi/wp-content/uploads/airtable/a8f2a218fc8a1a8244b58d3e117d5617-large.png","trailer_url":"https://www.youtube.com/embed/ljeQP37i_I0?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/if-we-dont-burn-how-do-we-light-up-the-night/","imdb":"https://www.imdb.com/title/tt12222490/?ref_=nv_sr_srsg_0_tt_2_nm_0_in_0_q_if%20we%20dont%20burn"},"content_warnings":["Ahdistus"],"showing_ids":["recoedCVhnTqzAEGK","recsbm6Wzu3ITyWQU","recVCZJo8SmtVd0mh","reckAuamjvZajwysw"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"iron-boy","title":"Iron Boy","original_title":"Le Corset","url":"https://hiff.fi/ohjelma/iron-boy/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio"],"themes":["Animoituja unia"],"keywords":["Lapsuus","Kasvutarina","Perhesuhteet"],"countries":["Ranska"],"directors":["Louis Clichy"],"cast":["Gary Clichy","Rod Paradot","Dimitri Colas"],"languages":["ranska"],"subtitles":["englanti"],"ag ":null,"logline":"Henkilökohtaisista muistoista ajan limittymiin ja historian marginaaliin. Kilpailunäytöksessä nähdään kotimaiset lyhytelokuvauutuudet Näkillä on limaiset hiukset, Kai, En kai huonoon aikaan soittele, Valokuvat, joita ei otettu, Elämä ja yö, ROSA ja Major Bag Alert.","description_text":"Elokuvassa Näkillä on limaiset hiukset ulkomaille opiskelemaan muuttanut Saija kokee yllätyksen, kun kohtaa suvun kesämökillä odottamatta lapsuutensa parhaan ystävän: serkkunsa Kikun, jonka kanssa ei ole ollut tekemisissä enää vuosiin. Löytöretki limaisten kasvien keskelle auttaa serkuksia saavuttamaan palan lapsuuden mutkattomuutta.\n\nAnimaatio Kai on kasvukertomus 90-luvun suomalaisessa pikkukaupungissa asuvasta Paavosta, jolla on vaikeuksia sopeutua heteronormatiivisen ympäristön kommunikoimattomaan mieskulttuuriin. Uusi maailma avautuu, kun kuultavana satuolentona kimalteleva Kai astuu kuvioihin. Jaettu erilaisuuden kokemus ei kuitenkaan ole aina riittävä yhdistävä tekijä.\n\nX kasvaa 90-luvulla, soittelee pilapuheluita lapsena ja saa ensimmäisen työpaikkansa puhelinmyynnistä teini-ikäisenä. Toimiston hajut, huohottajat ja merkityksettömät tervehdykset seuraavat häntä työpaikasta toiseen. Arkisto- ja amatöörivideomateriaalista rakennettu teos En kai huonoon aikaan soittele seuraa X:n toimintaa kasvottomana subjektina, joka käyttää ääntään kaupallisena hyödykkeenä.\n\nValokuvat, joita ei otettu hahmottaa esiin sukupolvien ketjua naisten näkökulmasta. Animaatio pohtii samalla näkymätöntä historiassa: häpeää, valtasuhteita ja turvattomuutta 1800-luvun Suomessa.\n\nNaton ydinsotaharjoitus, 12 minuuttia kestävä katkeamaton kamera-ajo ja suomalaiset Euroviisuehdokkaat törmäävät Helsingin yössä marraskuussa vuonna 1983. Elämä ja yö esittelee erilaisia maailmanlopun skenaarioita ja esittää niiden pohjalta tarinalinjan skenaarion kohteiden näkökulmasta, oikeassa mittakaavassa Helsingin kaduilla. Kuvitteellisen ja oikean ydinsodan ero paljastuu pelottavan hauraaksi.\n\nRosa Emilia Clay oli opettaja, laulaja ja kuoronjohtaja. Vuonna 1899 Rosasta tuli ensimmäinen Afrikassa syntynyt henkilö, jolle myönnettiin Suomen kansalaisuus. Kohdattuaan rasismia, eriarvoista kohtelua ja henkilökohtaisia menetyksiä hän lähti Suomesta Yhdysvaltoihin vuonna 1904. Elokuvassa ROSA hänen tulevaisuudesta tulevat sisarensa kokoontuvat kunnioittamaan ja juhlistamaan hänen elämäänsä Rosan 150-vuotissyntymäpäivänä.\n\nElokuvassa Major Bag Alert vuosi on 2005. Koulussa leviää juoru, että 16-vuotiaan Janinan perhe kokee taloudellisia haasteita. Janina ystävineen päättää todistaa huhut vääriksi varastamalla kalliin käsilaukun lähiostarilta.","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":["Seksuaalinen kuvasto"],"showing_ids":["reckjmFFXE5VpA4bY","recM5TnGUIn31wqkf"],"shorts":[{"title":"Näkillä on limaiset hiukset","directors":["Ksenia Onoprienko"],"countries":["Suomi"],"duration_min":16,"year":2026},{"title":"Kai","directors":["Erika Weiste","Aki Viikilä"],"countries":["Suomi"],"duration_min":5,"year":2026},{"title":"En kai huonoon aikaan soittele","directors":["Martta Tuomaala"],"countries":["Suomi"],"duration_min":15,"year":2025},{"title":"Valokuvat, joita ei otettu","directors":["Hanneriina Moisseinen"],"countries":["Suomi"],"duration_min":12,"year":2025},{"title":"Elämä ja yö","directors":["Jani Peltonen"],"countries":["Suomi"],"duration_min":14,"year":2025},{"title":"ROSA","directors":["Sasha Huber"],"countries":["Suomi"],"duration_min":6,"year":2025},{"title":"Major Bag Alert","directors":["Viljami Penttilä"],"countries":["Suomi"],"duration_min":15,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"kotimainen-kilpailu-hamaran-rajamailla","title":"Kotimainen kilpailu: Hämärän rajamailla","original_title":null,"url":"https://hiff.fi/ohjelma/kotimainen-kilpailu-hamaran-rajamailla/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio", ntalous kuin kansanterveyskin ovat huippukunnossa. Hyvinvoinnilla on kuitenkin hintansa: Suomen kansalaisuus on rajattu alle 70-vuotiaille.\n\nNuori nainen on loukussa syrjäisen perunakuopan pohjalla. Paikalliset jyväjemmarit haluavat uhrata hänet hyvän pottusadon toivossa. Jollekin käy vielä köpelösti elokuvassa Timo – The Lord of Potato .","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":["Ahdistus","Väkivalta","Onnettomuus","Stroboefekti"],"showing_ids":["rec7pHDbExWbZkGfc","rec77ZvjY8ihLRZ8w"],"shorts":[{"title":"Superstar","directors":["Jan Forsström"],"countries":["Suomi"],"duration_min":15,"year":2026},{"title":"Kissanristiäiset","directors":["Nooa Ruuth"],"countries":["Suomi"],"duration_min":13,"year":2026},{"title":"Yaris, Varis","directors":["Matti Harju"],"countries":["Suomi"],"duration_min":13,"year":2026},{"title":"Strive","directors":["Jussi Rautaniemi"],"countries":["Suomi"],"duration_min":14,"year":2026},{"title":"Eye Swap","directors":["Jenni Koljonen"],"countries":["Suomi"],"duration_min":5,"year":2026},{"title":"Yliaika","directors":["Siiri Halko"],"countries":["Suomi"],"duration_min":11,"year":2026},{"title":"Timo – The Lord of Potato","directors":["Antti Tuominen"],"countries":["Suomi"],"duration_min":15,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"kotimainen-kilpailu-inhimillinen-tekija","title":"Kotimainen kilpailu: Inhimillinen tekijä","original_title":null,"url":"https://hiff.fi/ohjelma/kotimainen-kilpailu-inhimillinen-tekija/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti","Fiktio"],"themes":["Kotimainen kilpailu"],"keywords":["Tekstitetty/puhuttu suomeksi","Identiteetti","Nuoruus","Yhteiskunta","Luontosuhde","R&A Shorts"],"countries":["Suomi"],"directors":[],"cast":[],"languages":["suomi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":75,"year":null,"logline":"Kuka täällä saa äänensä kuuluv otka poliisi pidätti – kirjoja, pehmoleluja, ruokaa. Kerran, kahdesti. Nyt lista ei tunnu loppuvan koskaan, ja kerään myös omia tavaroitani.”\n\nDokumentissa Aeternus Florere kadunkulmassa Helsingin Mellunmäessä seisoo pieni punainen puinen mökki, jonka sisältä paistaa valo ja ikkunaluukkujen takaa näkyy erilaisia värikkäitä kukkia. Kukkien seasta erottuu Maija, joka on pitänyt Salla Kukka -nimistä kukkakioskia 50 vuotta ja yrittää nyt päästää irti elämäntyöstään apunaan aviomies Jorma, jonka Maija tapasi jo ennen kuin avasi kioskin.\n\nElokuvassa After Ego iäkkäiden veljesten maiden välinen rajapyykki on kadonnut. Asianajajat ja maanmittausinsinööri seuranaan, miehet kohtaavat toisensa rajankäynnissä lapsuutensa purolla.\n\nNuoret romanisisarukset myyvät leluja turistirannalla ja tapaavat värikkään kavalkadin auringonottajia tietämättöminä läsnäolevasta vaarasta elokuvassa Ruumiini rakkaus .","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":["Kuolema","Onnettomuus","Kuvia ruumiista"],"showing_ids":["rec1mLa2NHZordVba","recedV4OfbqX9oeUw"],"shorts":[{"title":"Metsä jossa elät","directors":["Topi Raulo"],"countries":["Suomi"],"duration_min":12,"year":2025},{"title":"things that i was gathering","directors":["Ekaterina Zhuzhleva"],"countries":["Suomi","Belgia","Portugali"],"duration_min":7,"year":2025},{"title":"Aeternus Florere","directors":["Milja Härkönen"],"countries":["Suomi"],"duration_min":25,"year":2025},{"title":"After Ego","directors":["Mari Mantela"],"countries":["Suomi"],"duration_min":17,"year":2026},{"title":"Ruumiini rakkaus","directors":["Carmen Baltzar"],"countries":["Suomi","Kreikka"],"duration_min":14,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"kotimainen-kilpailu-nain-meidan-kesken","title":"Kotimainen kilpailu: Näin meidän kesken","original_title":null,"url":"https://hiff.fi/ohjelma/kotimainen-kilpailu-nain-meidan-kesken/","is_ rjaantunein ottein ja omaan särmikkääseen tyyliinsä. Munkki -dokumentti seuraa vapaaehtoista maanpuolustustyötä tekeviä sotilaskotisisaria ja nuoria varusmiehiä sotilaskodin asiakkaina.\n\nAhmed on on ottanut kaikki oikeat askeleet päästäkseen arvostetun yliopiston professoriksi. Työpaikalle saapuu kuitenkin uusi tyyppi, joka on aikeissa pilata kaiken. Kohtaaminen on lyhytelokuva Suomen rasistisesta todellisuudesta, jonka moni sivuuttaa, mutta jonka keskellä toiset elävät päivittäin.\n\nSekasaunassa introvertti Mikko viettää viikonloppua uuden puolisonsa mökillä jännittäen, pääseekö hän ulos kuorestaan uusien ihmisten kanssa. Puoliso Hanna on varma, että Mikko tekee hyvän ensivaikutelman Hannan lähimpiin ystäviin, joita he mökillä isännöivät.","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recxzWiiqf0qdQrXm","reccTsKPKVkt1hGks"],"shorts":[{"title":"Etäisyyksiä","directors":["Jesse Lähilehto"],"countries":["Suomi"],"duration_min":15,"year":2026},{"title":"Puolanka Pussy Rally","directors":["Inka Achté","Einari Paakkanen"],"countries":["Suomi"],"duration_min":6,"year":2025},{"title":"Vain yksi voi kellua","directors":["Jasmin Gummerus"],"countries":["Suomi"],"duration_min":16,"year":2025},{"title":"Munkki","directors":["Viena Kytöjoki"],"countries":["Suomi"],"duration_min":22,"year":2026},{"title":"Kohtaaminen","directors":["Farhia Omer","Nadiifo Omer"],"countries":["Suomi"],"duration_min":5,"year":2026},{"title":"Sekasauna","directors":["Juuso Timonen"],"countries":["Suomi"],"duration_min":16,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"kotimainen-kilpailu-palkitut","title":"Kotimainen kilpailu: Palkitut","original_title":null,"url":"https://hiff.fi/ohjelma/kotimainen-kilpailu-palkitut/","is_film":true,"event_types":["elokuvat"],"genres":[],"themes":["Kotimainen kilpailu"],"keywords":["Festarihitti","R&A Shorts"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":["englanti"],"age_rating":"K16","duration_min":null,"year":null,"logline":"R&A:n Kotimainen kilpailu huipentuu palkintonäytökseen, jossa esitetään kaikki vuoden 2026 voittajaelokuvat.","description_text":"Näytöksessä esitetään vuoden 2026 Kotimaisen kilpailun voittajaelokuvat. Näytöksen elokuvatiedot päivittyvät palkintojenjaon 24.9. jälkeen.","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recrWhbpywm2iJzr2"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"kotimainen-kilpailu-sukupolvien-valilla","title":"Kotimainen kilpailu: Sukupolvien välillä","original_title":null,"url":"https://hiff.fi/ohjelma/kotimainen-kilpailu-sukupolvien-valilla/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti","Fiktio"],"themes":["Kotimainen kilpailu"],"keywords":["Perhesuhteet","Muisti","Yhteiskunta","Kasvutarina","R&A Shorts"],"countries":["Suomi"],"directors":[],"cast":[],"languages":["suomi","arabia"],"subtitles":["englanti"],"age_rating":"K12","duration_min":88,"year":null,"logline":"Perhesuhteet ovat alituisen neuvottelun alla ja aina vaarassa kadota.  Kilpailunäytöksessä nähdään kotimaiset lyhytelokuvauutuudet Muistokirjoitus/Saarelaiset, Sukuloinen, Kanssani aina, Puskee veemäiseen paikkaan ja TJ28.","description_text":"Muistokirjoitus/Saarelaiset kertoo äidin kuolemaan liittyvästä surusta, sukupolvelta toiselle siirtyvistä muistoista ja kesämökkeilyn riemuista suomalaisessa järvimaisemassa. Se on intiimi ja suora kuvaus läheisen ihmisen kuoleman kohtaamisesta. Elokuva rakentuu kolmen sukupolven kuvaamista kaitafilmeistä, jotka hehkuvat värien iloa ja eri aikakausia ylittävää nostalgiaa.\n\nIsälle ilmoitetaan, että hän saa jäädä sukuun, muttei enää isäksi. Yllättävän tyynesti hän alkaa harjoitella alennettua rooliaan sukujuhlissa. Kun järjestely osoittautuu toimivaksi, se alkaa levitä. Kiintymykset vaihtavat kohteita. Pian isä on yhtä aikaa tarpeeton ja uudelleen omittu. Sukuloinen on musta komedia perheestä roolijärjestelmänä – siirrettävänä, neuvoteltavana ja harvoin vapaaehtoisena.\n\nDokumentaarinen lyhytelokuva Kanssani aina kertoo yhdestä viikonlopusta mummolassa Suonenjoella. Menneisyyden ja tulevaisuuden, muistamisen ja säilyttämisen, elämän ja kuoleman äärellä käydyt keskustelut rytmittyvät arkisten askareiden ympärille. Nurmikko leikataan, letut paistetaan, hautakukat kastellaan – niin kuin aina ennenkin.\n\nPuskee Veemäiseen Paikkaan on kuvaus intiimistä hetkestä isän ja pojan välillä – yksi ilta, yksi automatka, yksi ongelma.\n\nElokuvassa TJ28 palestiinansuomalainen Amani Lillak suorittaa vapaaehtoista asepalvelustaan Suomen armeijan lääkintäjoukoissa. Kesken loppusotaharjoituksen Lillak saa kuulla isänsä kotimaassa entisestään eskaloituneesta kriisistä. Samaan aikaan intensiivinen sotaharjoitus ajaa lääkintäjoukon sisäiset ristiriidat äärimmilleen. Lillak yrittää kääntää selkänsä molemmille konflikteille ja olla vain hetken vapaa.","poster":"https://hiff.fi/wp-content/uploads/airtable/100d0d03fdfacc1e50f6c87e1a3ea11c-large.jpg","trailer_url":null,"links":{},"content_warnings":["Sota","Kansanmurha"],"showing_ids":["recEChTfozXVBfLX8","recwMtWYcVoZ3OA8K"],"shorts":[{"title":"Muistokirjoitus/Saarelaiset","directors":["Matleena Jänis"],"countries":["Suomi"],"duration_min":25,"year":2025},{"title":"Sukuloinen","directors":["Vilja Autiokyrö"],"countries":["Suomi"],"duration_min":15,"year":2026},{"title":"Kanssani aina","directors":["Noa Korhonen","Myrsky Virmavirta"],"countries":["Suomi"],"duration_min":18,"year":2026},{"title":"Puskee veemäiseen paikkaan","directors":["Jukka Kärkkäinen"],"countries":["Suomi"],"duration_min":6,"year":2026},{"title":"TJ28","directors":["Yasmin Najjar"],"countries":["Suomi"],"duration_min":24,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"la-gradiva","title":"La Gradiva","original_title":null,"url":"https://hiff.fi/ohjelma/la-gradiva/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Nuoruus","Matka","Historia","Kasvutarina"],"countries":["Ranska"],"directors":["Marine Atlan"],"cast":["Antonia Buresi","Colas Quignard","Suzanne Gerin","Mitia Capellier-Audat","Hadya Fofana"],"languages":["ranska","italia"],"subtitles":["englanti"],"age_rating":"K12","duration_min":145,"year":2026,"logline":"Ryhmä ranskalaisia teinejä lähtee latinanopettajansa kanssa Pompejiin vangitsevassa elokuvassa, joka kulkee tulevaisuuden lupausten ja menneisyyden aaveiden välillä.","description_text":"Vangitseva elokuva luokkaretkestä, joka kulkee tulevaisuuden lupausten ja menneisyyden aaveiden välillä. Uuden vaiheen kynnyksellä seisovat nuoret odottavat purkautumista, monessakin mielessä. Viipyilevä kerronta virittää intensiivistä kaipausta tilanteisiin, joissa ei tapahdu mitään ja tapahtuu silti kaikki. Katseet hakevat katsetta tai jäävät vain seuraamaan vierestä, kun Won Kar-wain elokuvien tapaan kehot liikkuvat toistensa lähellä, toistensa ohi, toivoen ja pettyen.\n\nRyhmä ranskalaisia teinejä lähtee latinanopettajansa kanssa Pompejiin tutkimaan tulivuorenpurkauksen alle jähmettynyttä menneisyyttä. Tuskastunut opettaja yrittää pitää ryhmän keskittyneenä antiikin taiteen kuvauksiin hetkestä ennen katastrofia, mutta nuorten nykyhetken draamat keskeyttävät kaiken.\n\nNuoret näyttelijät ovat aivan mielettömän hyviä, kuten myös opettajaa näyttelevä Antonia Buresi. Ohjaaja-käsikirjoittaja Marine Atlasin debyyttielokuvassa todella näkyy hänen taustansa kuvaajana. Arvoituksellinen ja tarkkaileva kuvaus yhdistää luokkaretken arkisuuden omituiseen magiaan. Asiat tuntuvat tuntemattomilta ja oudoilta, koska ne koetaan ensimmäistä kertaa. Fantasian ja karun todellisuuden kohtaaminen liittyy nuorten elämänvaiheeseen, mutta sävyllisesti elokuva tuo mieleen myös Roberto Rossellinin Matkan Italiassa ja Alice Rohrwacherin La Chimeran .\n\nHelmi Kajaste","poster":"https://hiff.fi/wp-content/uploads/airtable/c808968a2449c231c2a9eb6c6e77de37-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/la-gradiva/","imdb":"https://www.imdb.com/title/tt36107185/?ref_=nv_sr_srsg_1_tt_7_nm_1_in_0_q_la%20gravida"},"content_warnings":["Itsemurha"],"showing_ids":["rec85u5s7UNa7lYnB","recLy6kjI8ZjkUhYb"],"shorts":[],"cinema_release":{"label":"Ensi-ilta vuoden 2027 alussa","status":"undated","date":null},"on_yle_areena":false},{"slug":"la-grazia","title":"La Grazia","original_title":null,"url":"https://hiff.fi/ohjelma/la-grazia/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Tekstitetty/puhuttu suomeksi","Suru","Kaupunkitila","Ikääntyminen","Festarihitti"],"countries":["Italia"],"directors":["Paolo Sorrentino"],"cast":["Toni Servillo","Anna Ferzetti","Massimo Venturiello"],"languages":["italia"],"subtitles":["suomi","ruotsi"],"age_rating":"K12","duration_min":133,"year":2025,"logline":"Paolo Sorrentino kuvaa uusimmassaan Rooman suuruutta ja suuruudenhulluutta säkenöivän surrealistisissa ja sensaatiomaisissa hetkissä. Pääosassa juhlii ikinuori Toni Servillo Italian leskeksi jääneenä presidenttinä.","description_text":"Venetsian elokuvajuhlien avajaiselokuva La Grazia on Paolo ” Grande Bellezza ” Sorrentinon paluu huipulle. Pääosassa juhliva ikinuori Toni Servillo (67-v) on leskeksi jäänyt Italian presidentti Mariano De Santis, joka kamppailee moraalisten päätösten kanssa ja murehtii vaimonsa muiston kainalossa. Rikoslakiin erikoistunut tuomari ei haluaisi tuomita ketään, vaikka kollegat ja poliittiset pelurit vallan huipulla pyrkivät painostamaan presidenttiä mielensä mukaan.\n\nSorrentino kuvaa Rooman suuruutta ja suuruudenhulluutta säkenöivän surrealistisissa ja sensaatiomaisissa hetkissä. Servillon kasvoilla häilyy haikea suru aikakauden päättymisestä. Särmikäs dialogi kutittaa huumorihammasta.\n\nHenkilögalleria on uskomatonta vyörytystä. Alati paikalla oleva turvamies sujauttaa salaa sovitun savukkeen. Suoraan Fellinin pelikirjasta kaapattu sydänystävä Coco Valori (Milvia Marigliano) on ikiaikainen seurapiirikuningatar, joka edelleen jaksaa arvostella kaikkia ja kaikkea. Sorrentino lataa isoja kysymyksiä. Mitä merkitystä on eletyllä elämällä?\n\nMika Siltala","poster":"https://hiff.fi/wp-content/uploads/airtable/e9f01b7bc13053e41c5db47544169998-large.jpg","trailer_url":"https://www.youtube.com/embed/zvQn44a_IHo?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/la-grazia/","imdb":"https://www.imdb.com/title/tt34886821/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_la%20grazia"},"content_warnings":[],"showing_ids":["recqalDE6IbGUKkAF","recvDmYP88OTFoRB6"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 2.10.","status":"dated","date":"2026-10-02"},"on_yle_areena":false},{"slug":"landmarks","title":"Landmarks","original_title":"Nuestra Tierra","url":"https://hiff.fi/ohjelma/landmarks/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Fight the Power"],"keywords":["Rikos","Alkuperäiskansat","Ihmisoikeudet","Yhteiskunta"],"countries":["Alankomaat","Argentiina","Meksiko","Ranska","Tanska","Yhdysvallat"],"directors":["Lucrecia Martel"],"cast":[],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K12","duration_min":124,"year":2025,"logline":"Argentiinalaismestari Lucrecia Martel on tehnyt aktivistin murhasta voimakkaan oikeussalidokumentin, joka purkaa maan koloniaalisen historian yhä eläviä rakenteita alkuperäiskansan näkökulmasta.","description_text":"Vuonna 2009 kolme aseistettua miestä saapui häätämään Chuschagasta-yhteisöä pois sen mailta Pohjois-Argentiinan laaksoisilta seuduilta. Yhteenotto päättyi siihen, että paikallinen aktivisti Javier Chocobar ammuttiin kuoliaaksi. Koko tilanne kuvattiin videolle. Vuosien mielenosoittamisen jälkeen, vasta lähes vuosikymmen myöhemmin, tapaus eteni oikeuteen. Tästä asetelmasta alkaa Lucrecia Martelin ensimmäinen pitkä dokumentti.\n\nLandmarks purkaa Argentiinan koloniaalisen historian yhä eläviä rakenteita alkuperäiskansayhteisön näkökulmasta. Maanomistusoikeuksia puolustava dokumentti näyttää, kuinka instituutiot, kuten oikeusjärjestelmä, historiankirjoitus ja tiede, pettävät alkuperäiskansan jatkuvasti. Käy ilmi, millä eri tavoilla Chuschagasta-yhteisöä on vuosien saatossa koitettu poistaa maisemasta ja kansallisesta muistista kokonaan. Elokuva dokumentoi yhteisön sitkeää kamppailua omasta maastaan ja oikeudestaan tulla kuulluksi omalla äänellään.\n\nLucrecia Martel ( Zama , R&A 2018) on argentiinalaisen nykyelokuvan suuri ohjaajanimi. Hänen ensimmäisessä dokumentissaan käsitellään ohjaajalle tuttuja teemoja, eli koloniaalisen historian kritiikkiä ja yhteiskunnallisia rakenteita.\n\nOliver Tomar","poster":"https://hiff.fi/wp-content/uploads/airtable/904acc7ab3ea4e94330a5c0eacbce2c5-large.jpg","trailer_url":"https://www.youtube.com/embed/k1ATK63fhIw?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/our-land-2025-1/","imdb":"https://www.imdb.com/title/tt9859510/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_landmarks"},"content_warnings":["Rasismi","Väkivalta"],"showing_ids":["rec5T4Ea67TKttofr","recz6Nr95nHwfwMBP","recBlYbPCYLI7iDFm"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"light-pillar","title":"Light Pillar","original_title":"寒夜灯柱","url":"https://hiff.fi/ohjelma/light-pillar/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio"],"themes":["Animoituja unia"],"keywords":["Huumori","Kaupunkitila","Rakkaus","Tech"],"countries":["Kiina"],"directors":["Xu Zao"],"cast":["Dong Chengpeng","Qing Yi"],"languages":["kiina"],"subtitles":["englanti"],"age_rating":"K12","duration_min":90,"year":2026,"logline":"Lakonisen hauskassa, lähitulevaisuuteen sijoittuvassa kiinalaisanimaatiossa rapistuvan elokuvastudion huoltomies etsii onnea kissa kumppaninaan.","description_text":"Rapistuvan elokuvastudioalueen huoltomies Zha sitkuttelee keskellä kulahtaneita kulisseja ja loputonta talvea. Palkkaa ei heltiä edes kerran kuussa, ja harvat työkaverit kiusaavat, minkä ehtivät. Silti horisontissa kimmeltää joka yö avaruusmatkailuohjelma Light Pillar Space Travel Program kuin unikuva tai kangastus. Kun pomo sitten tyrkkää alaiselleen virtuaalitodellisuuslasit, unelmat ovat äkkiä lähempänä toteutumista. Löytyykö onni tästä vai toisesta todellisuudesta?\n\nVuoteen 2033 sijoittuva kiinalainen animaatio Light Pillar kertoo kituuttavasta arjesta, unelmista ja onnellisuuden tavoittelusta. Ote tarinaan on samaan aikaan lakoninen ja hauska, kyyninen ja lämmin. Samalla, kun merkit ropisevat ovenpielestä ja sisällä on miltei pakkasta, pienet asiat saavat nauramaan. Kämppäkaveriksi muuttava katukissa, johtajan kultainen mikrofoni ja oikeilla ihmisillä kuvatut kömpelöt karnevaalikohtaukset pitävät harmainakin hetkinä värit kuvissa.\n\nXu Zaon esikoisohjauksessa avautuu tarina sinnikkäistä valonpilkahduksista keskellä aneemisena laahustavaa, pitkää hyhmäistä kautta. Katsomosta lähtee väkisinkin hymy huulilla. Aina jostain löytyy toivoa, vaikka sitten leluhyllyn alelaarista tai syvältä matkalaukun pohjalta.\n\nSusanna Puomio","poster":"https://hiff.fi/wp-content/uploads/airtable/83d40f63690e16efe8a5061bd378ec3b-large.jpg","trailer_url":"https://www.youtube.com/embed/EYJ4NYYy5c8?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/light-pillar/","imdb":"https://www.imdb.com/title/tt32409947/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_light%20pillar"},"content_warnings":[],"showing_ids":["recruKH7dRTTyWnvY","reclED2zQbH3uOykS","recyV1o3fK44CTcOg"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"los-tigres","title":"Los Tigres","original_title":null,"url":"https://hiff.fi/ohjelma/los-tigres/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Action","Perhesuhteet","Jännitys"],"countries":["Espanja"],"directors":["Alberto Rodríguez"],"cast":["Antonio de la Torre","Bárbara Lennie","Joaquín Núñez"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":109,"year":2025,"logline":"Espanjalaistrillerissä sukeltajasisarukset räpiköivät kultasuoneen, kun kotisatamaan saapuu laiva lastattuna kokaiinilla.","description_text":"Sukeltajasisarukset räpiköivät kultasuoneen, kun kerran kolmessa viikossa kotisatamaan saapuu laiva lastattuna kokaiinilla.\n\nEspanjalaisen Alberto Rodríguezin (muun muassa Suosurmat , R&A 2015) ohjaama trilleri pysyttelee paljolti veden alla, mikä luo elokuvalle hukuttavan piinaavan jännitteen. Ruotsalaisen elokuvaajan Eric Börjesonin tiimin vedenalainen kameratyöskentely on syystäkin palkittu festivaaleilla.\n\nMaan päällä Tiikeriksi kutsuttu Antonio (Antonio de la Torre) ja hänen siskonsa Estrella (Bárbara Lennie) joutuvat setvimään ihmissuhdesotkujaan ja rahapulmiaan, joista molempiin löytyy ratkaisu vedenpinnan alta.\n\nSuunnitelma vaikuttaa vedenpitävältä, kunnes siihen ammutaan reikiä. Salakuljetettua kokaiinia vaarallisempaa kauppatavaraa kun on varastettu kokaiini. Salaisuus ei kauaa pysy pinnan alla, ja sukelluskohtausten klaustrofobia leviää pikkuhiljaa myös päivänvaloon.\n\nEspanjan Andalusiassa, Huelvan satamateollisuusalueella kuvattu genre-elokuva ei mässäile antimillaan vaan pysyy arkisen realistisena, ja tyylilajistaan huolimatta Los Tigresiä onkin verrattu brittiläisen Ken Loachin tuotantoon.\n\nMarko Ylitalo","poster":"https://hiff.fi/wp-content/uploads/airtable/733251e1aa5780e8790cc4e61d5027fc-large.jpg","trailer_url":"https://www.youtube.com/embed/Pczmpo6WZhg?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-tigers-2025/","imdb":"https://www.imdb.com/title/tt31450976/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_the%20tigers"},"content_warnings":["Väkivalta"],"showing_ids":["recfq3j5CD8wZljHX","rec55f28gGqqViFfA","rec0HMLfmiD6ZDsTS"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"maan-laulu","title":"Maan laulu","original_title":null,"url":"https://hiff.fi/ohjelma/maan-laulu/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Perhesuhteet","Muisti","Luontosuhde"],"countries":["Suomi"],"directors":["Erol Mintaş"],"cast":[],"languages":["suomi","kurdi","turkki","ruotsi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":118,"year":null,"logline":"Helsingissä asuva suomalais-kurdilainen lääkäri on vieraantunut perheestään, mutta isän yllätysvierailu tuo pintaan perhesalaisuuksia.","description_text":"Rojîn (Dilan Gwyn) on työlleen omistautunut lääkäri, jonka jatkuvat ja intensiiviset vierailut konfliktialueille ovat vääristäneet hänen suhteitaan läheisiinsä. Kommunikaatio-ongelmat ovat kroonistuneet, ja hänen 12-vuotias adoptiotyttärensä Azad pohtii, tunteeko äiti edes omaa lastaan. Lisäksi avioliitto on alkanut muistuttaa yhä enemmän kulissia.\n\nEräänä päivänä Rojînin Ruotsissa asuva isä saapuu yllättäen Helsinkiin. Käänteentekevän vierailun myötä hän kohtaa menneisyytensä ja salatun perhehistoriansa vuoden 1980 sotilasvallankaappauksen ja Diyarbakırin sotilasvankilan trauman ympärillä. Suru ja totuuden etsintä ajavat Rojînin ja Azadin pitkälle matkalle, joka johtaa aina Itä-Anatoliaan asti.\n\nOhjaaja Erol Mintaş kuvaa keskiluokan vieraantumista, luontosuhdetta ja maanpakolaisuutta Michelangelo Antonionin ja Andrei Tarkovskin kaltaisten mestarien hengessä, mutta omaperäisesti tyylinsä ja henkilökohtaisen lähestymistapansa säilyttäen. Maan laulu (kurdiksi Strana axê ) onnistuu piirtämään koskettavan kuvauksen siitä, kuinka monet yleismaailmalliset ja ylisukupolviset teemat ulkopuolisuudesta, minuudesta ja kuulumisesta voivat ulottua myös tämän päivän Helsinkiin.\n\nOmar Fasolah\n\nTämä elokuva pitchattiin R&A:n ammattilaistapahtuma Finnish Film Affairissa ennen sen valmistumista.","poster":"https://hiff.fi/wp-content/uploads/airtable/5097b88683366173e196e1140fab1e65-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/earth-song-2026/","imdb":"https://www.imdb.com/title/tt29003193/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_maan%20laulu"},"content_warnings":[],"showing_ids":["recd92HLXC08gkHlX"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 11.12.","status":"dated","date":"2026-12-11"},"on_yle_areena":true},{"slug":"marie-madeleine","title":"Marie Madeleine","original_title":null,"url":"https://hiff.fi/ohjelma/marie-madeleine/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Ystävyys","LGBTQIA+","Identiteetti"],"countries":["Belgia","Haiti","Kanada","Luxemburg","Ranska"],"directors":["Gessica Généus"],"cast":["Gessica Généus","Beonard Monteau","Edouard Baptiste"],"languages":["ranska","haitinkreoli"],"subtitles":["englanti"],"age_rating":"K12","duration_min":104,"year":2026,"logline":"R&A-historian ensimmäisessä haitilaiselokuvassa yllättävä ystävyys seksityöntekijän kanssa avaa pastorin pojalle ovet värikkääseen maailmaan kauas Jumalan tuomitsevan katseen alta.","description_text":"Jacmelin kaupungissa Haitilla kaksi maailmaa joutuu törmäyskurssille, kun seksityöntekijä Marie tutustuu alueelle muuttaneen pastorin poikaan Josephiin. Josephin isä ei hyväksy kaksikon välille kehittyvää ystävyyttä, saati sitten poikansa orastavaa queer-identiteettiä tai kiinnostusta maailmaan, jossa Jumala tai kirkko ei välittömästi rankaise syntisten kanssa veljeilystä.\n\nElokuva jättää katsojalle tilaa ja aikaa uppoutua värikkään Jacmelin samaan aikaan raukeaan ja rytmikkääseen tunnelmaan, johon kolonialismin mukanaan tuoman kristinuskon ja haitilaisen kansanuskon yhteentörmäykset lyövät säröjä. Lopulta ohjaaja Géssica Généus lainaa Nina Simonea, jonka sanoin vapaus on ilman pelkoa elämistä: juuri tätä Marie Madeleine käsittelee. Marie ja Joseph pyrkivät kohti vapautumista painostavassa ympäristössä, jossa väkivallan uhka on alati läsnä, joko konkreettisesti tai lupauksena tuonpuoleisesta rangaistukses oni muukin. Uusi ohjelma on arvatenkin hitti.\n \nMaan kireässä ilmapiirissä, jossa naapurit vahtivat toisiaan, Chuck Berryn ja Buddy Hollyn tahtiin nuorta liveyleisöä villitsevästä Narcisosta tulee hetkellinen vapauden symboli. Hänen huomiota sekä miehissä että naisissa herättävällä karismallaan on kuitenkin kohtalokkaat seuraukset – Narciso löytyy pian kuolleena asunnostaan.\n \nPalkitun The Heiressesin (R&A 2018) ohjanneen Marcelo Martinessin uusi tunnelmallinen periodielokuva ei ole niinkään murhamysteeri, vaan kuvaus siitä, miten vapaa taiteellinen ilmaisu voi haastaa autoritaarisen järjestelmän ja puhkoa salakavalasti reikiä sen perustuksiin.\n\nIda Kumpulainen","poster":"https://hiff.fi/wp-content/uploads/airtable/4d1425e99c9a30bd5fc6cb290b4cfb09-large.jpg","trailer_url":"https://www.youtube.com/embed/m2KcpHD-UnU?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/narciso-2026/","imdb":"https://www.imdb.com/title/tt13129406/?ref_=nv_sr_srsg_0_tt_3_nm_5_in_0_q_narciso"},"content_warnings":["Väkivalta","Kuolema","Homofobia"],"showing_ids":["rec7u3t6uuIsURhep","rechddfv6QyP7aSGK","recKjFxtou8rO0NVP"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"new-group","title":"New Group","original_title":null,"url":"https://hiff.fi/ohjelma/new-group/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Kauhu","Yhteiskunta","Perhesuhteet","Outoa"],"countries":["Japani"],"directors":["Yûta Shimotsu"],"cast":["Anna Yamada","Yuzu Aoki","Pierre Taki"],"languages":["japani"],"subtitles":["englanti"],"age_rating":"K16","duration_min":82,"year":null,"logline":"Vaikuttavasti koreografioitu japanilainen kauhusatiiri voimistelumuodostelmista ja joukkosieluisuudesta vyöryy eteenpäin kuin absurdi painajainen.","description_text":"Arka Ai yrittää selviytyä arjestaan konservatiivisessa lukiossa, jossa sosiaalinen paine on musertavaa ja oman äänen löytäminen vaikeaa. Kotonakaan kaikki ei ole kohdallaan.\n\nKoulun ilmapiiri kiristyy entisestään, kun oppilaat alkavat selittämättömässä transsissa muodostaa ihmispyramidia, joka kohoaa päivä päivältä korkeammaksi. Opettajat yllyttävät oppilaita liittymään pyramidiin, ja pian muodostelmat leviävät koulun ulkopuolelle. Ai löytää rohkeutta vastarintaan luokalle siirtyneen, ulkomailla asuneen ja tinkimättömän itsenäisen Yun avulla.\n\nVaikuttavasti koreografioitu New Group unohtaa kainostelun ja vyöryy eteenpäin kuin absurdi painajainen. Sen makaaberi kuvasto tuo mieleen Junji Iton maailmat, ja älyttömyyksiin venyvä totalitarismin kritiikki muistuttaa Battle Roya­lesta . Elokuva piirtää synkän kuvan japanilaisesta yhteiskunnasta, jonka selkärankana ovat tiukka konformismi ja pyrkimys välttää sosiaalisia konflikteja kaikin keinoin.\n\nLopputulos on vangitseva yhdistelmä psykologista kauhua ja kehollisuutta, mustaa huumoria ja groteskia yhteiskunnallista satiiria. New Group tempaisee mukaansa heti kuumottavilta alkuminuuteiltaan ja asettuu osaksi ajan hermolla liikkuvien mindfuck-elokuvien ilahduttavaa kirjoa.\n\nAnni Rossi","poster":"https://hiff.fi/wp-content/uploads/airtable/0b071db0c9af6b05500d3d0ce0c54491-large.jpg","trailer_url":"https://www.youtube.com/embed/66uHwlIMFhI?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/new-group/","imdb":"https://www.imdb.com/title/tt37694048/?ref_=nv_sr_srsg_0_tt_3_nm_5_in_0_q_new%20group"},"content_warnings":["Perheväkivalta","Väkivalta","Itsemurhayritys","Koulukiusaaminen","Kuolema"],"showing_ids":["recXS33KHLEPfAXJT","recyOz689bbrFzVqI","rec26tbwlcezRg46y"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"nitrate-kisses","title":"Nitrate Kisses","original_title":null,"url":"https://hiff.fi/ohjelma/nitrate-kisses/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["R&A Trailblazers"],"keywords":["Arkistot","LGBTQIA+","Historia","Kokeellinen"],"countries":["Yhdysvallat"],"directors":["Barbara Hammer"],"cast":[],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":67,"year":1992,"logline":"Kokeellisen lesboelokuvan pioneeri Barbara Hammerin ensimmäinen pitkä elokuva kuvaa kollaasimaisesti queer-kokemusten puutetta ja peittelyä historiankirjoituksessa.","description_text":"Mitä kaikkea historiankirjoituksen ulkopuolelle jää? Barbara Hammerin Nitrate Kisses kaivaa esiin queer-historian unohdettuja tarinoita kokeellisen dokumenttielokuvan keinoin. Kollaasimainen essee-elokuva yhdistelee arkistomateriaalia, elokuvahistoriaa, haastatteluita ja homoseksiä omaehtoisen vasta-arkiston rakentamiseksi.\n\nElokuvan nimi viittaa selluloosanitraattifilmiin, joka oli elokuvien materiaalinen muoto vielä 1950-luvulle asti. Nitraattifilmi oli huonosti säilyvää ja hyvin paloherkkää, vanhetessaan se saattoi syttyä tuleen itsestään. Hammer käyttää nitraattia metaforana kadonneelle ja tuhoutuneelle 1900-luvun homohistorialle.\n\nProvosoiva ja leikkimielinen elokuva on aikansa tuote parhaalla mahdollisella tavalla. New Queer Cineman hengessä elokuva ei jää vellomaan AIDS-kriisin surussa, vaan juhlistaa homoseksin eroottisia iloja poliittisen vastarinnan keinona. Elokuva ei tyydy olemassa oleviin kuviin, vaan luo uusia representaatioita kuvaamalla neljän marginalisoidun parin seksiä.\n\nBarbara Hammer on lesboelokuvan pioneeri, jonka vaikutuksen queer-elokuvassa voi nähdä etenkin Cheryl Dunyen indie-klassikossa The Watermelon Woman . Nitrate Kisses on palkittu kokeellisen dokumenttielokuvan merkkiteos, joka on edelleen ainutlaatuinen ja ajankohtainen.\n\nOliver Tomar","poster":"https://hiff.fi/wp-content/uploads/airtable/de600d79987974f4bf833041085519f3-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/nitrate-kisses/","imdb":"https://www.imdb.com/title/tt0107693/?ref_=nv_sr_srsg_0_tt_1_nm_0_in_0_q_nitrate%20kisses"},"content_warnings":["Seksuaalinen kuvasto","Homofobia"],"showing_ids":["rechgIG6J4t2zi3Zh","rec96lsxWDy1uRj9H"],"shorts":[],"cinema_release":nul steja, toiseen metsästysvimman.","description_text":"Jääkarhut vähenevät maailmassa, mutta Kanadassa Manitoban Churchillissa sitä ei huomaa. Siellä petojen liikkeet saavat aikaan levottomuutta. Niistä aiheutuu sekä ennätyksellisen suuria turistilaumoja että kilvoittelua kaatoluvista.\n\nNuisance Bear on tuore dokumentti jääkarhuista ihmisasutuksen liepeillä. Se on kuvaus kahden pitkään toisiaan vältelleen lajin riipivästä kohtaamisesta ja hiertävästä yhteiselosta kahdessa kylässä, joista kummankin asukkaat yrittävät pärjätä yleistyvien suurpetojen kanssa. Toisessa paikassa karhut ovat matkailuvaltti ja toisessa vaarallinen, tenholla hävitettävä uhka. Molemmissa asukkaat sekä kunnioittavat että kammoavat suurpetoja. Vaikka toisin voisi kuvitella, kummassakin suhtautumistavassa on ongelmansa.\n\nNuisance Bear inuiittikertojineen käy läpi kysymystä, kenelle pohjoinen pallonpuolisko lopulta kuuluu. Elokuva taltioi sen, miten jäätiköiden sulaessa karhut vaeltavat kyliin, hajottavat paikkoja ja etsivät ruokaa jätekasoista. Mukana kuvissa on eläinten karhujuttuja, mutta yhtä lailla ihmisten aitoa ja perusteltua pelkoa. Vaaratilanteiden uhkahan – kummallekin osapuolelle – häilyy lopulta aina kohtaamisten taustalla. Se ei katoa uhanalaisuusjulistuksiin eikä palauta kadonneita elinympäristöjä.\n\nSusanna Puomio","poster":"https://hiff.fi/wp-content/uploads/airtable/cdeeb68b81e6130c37e7f80fc9f8d2c8-large.jpeg","trailer_url":"https://www.youtube.com/embed/n5yaFeMDKpc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/nuisance-bear-2026/","imdb":"https://www.imdb.com/title/tt39150922/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_nuisance%20"},"content_warnings":["Eläimiin kohdistuva väkivalta"],"showing_ids":["recMwDLvSmyHXEFcf","recKA81inwX4l7lLj","recrGxjqAJHED8f71"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"olmo","title":"Olmo","original_title":null,"url":"https://hiff.fi/ohjelma/olmo/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["United States of Indie"],"keywords":["Kasvutarina","Perhesuhteet","Nuoruus"],"countries":["Meksiko","Yhdysvallat"],"directors":["Fernando Eimbcke"],"cast":["Aivan Uttapa","Gustavo Sánchez Parra","Diego Olmedo"],"languages":["englanti","espanja"],"subtitles":["englanti"],"age_rating":"K12","duration_min":84,"year":2026,"logline":"Sympaattisessa kasvutarinassa velvollisuuksiaan pakenevan teinipojan varastetut vapauden hetket maistuvat tomulta, tupakalta ja hormonimyräkältä.","description_text":"Olmo on 14-vuotias ja täysin hullaantunut kauniiseen naapuriinsa Ninaan. Kun Nina kutsuu Olmon – ja tämän vanhempien stereot – mukaansa bileisiin kaupungin toiselle laidalle, mikään ei estä Olmoa lähtemästä. Ei edes teinipojalle turhankin painava vastuu MS-tautia sairastavasta isästä.\n\nOlmon perheessä rahasta on tiukkaa, mikä näkyy äidin uurastuksena ja korjaamatta jääneinä stereoina. Äiti on aina töissä ja isosisko keskittyy olemaan teini, joten Olmon on huolehdittava isästä, vaikka Nina ja parhaan kaverin seura kiinnostaisivat huomattavasti enemmän.\n\nMeksikolaisen ohjaajan Fernando Eimbcken ( Lake Tahoe , R&A 2008; Club Sandwich , R&A 2014) lapsuuden ja nuoruuden murroskohtaan kipeästi sohaiseva draamakomedia sijoittuu vuoden 1979 New Mexicoon. Hikisen utuista valoa hehkuvassa kasvutarinassa varjot ovat pitkiä ja kohtaukset lyhyitä.\n\nAivan Uttapa on luonteva hormonimyrskyissä luovivan Olmon roolissa. Velvollisuuksiaan pakeneva teinipoika on hurmaava yhdistelmä hömelöä kaaosta ja liian suuria saappaita. Varastetut vapauden hetket maistuvat tomulta, tupakalta ja auringossa haalenneelta oluelta.\n\nSaija Holm","poster":"https://hiff.fi/wp-content/uploads/airtable/f11f454a04f3fadd288165074ae1b2f2-large.jpg","trailer_url":"https://www.youtube.com/embed/Gw9OKjNP1Jw?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/olmo/","imdb":"https://www.imdb.com/title/tt30441926/?ref_=nv_sr_srsg_0_tt_2_nm_6_in_0_q_olmo"},"content_warnings":[],"showing_ids":["recQQI1JlD2hCUMlO","recrpDbw7Dag834p8","rec92jL5P0kYuiKj4"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"palestine-36","title":"Palestine 36","original_title":null,"url":"https://hiff.fi/ohjelma/palestine-36/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Fight the Power"],"keywords":["Historia","Yhteiskunta"],"countries":["Australia","Iso-Britannia","Jordania","Norja","Palestiina","Qatar","Ranska","Ruotsi","Saudi-Arabia","Tanska","Turkki","Yhdistyneet arabiemiirikunnat","Yhdysvallat"],"directors":["Annemarie Jacir"],"cast":["Karim Daoud Anaya","Hiam Abbass","Robert Aramayo","Dhafer L’Abidine","Jeremy Irons"],"languages":["arabia","englanti"],"subtitles":["kuvaileva tekstitys englanniksi"],"age_rating":"K12","duration_min":119,"year":null,"logline":"Epookkielokuva kertoo Palestiinan kansannoususta brittivallan alla – vapaustaistelusta, joka jatkuu yhä tänä päivänä.","description_text":"Palestiinalaisessa kylässä eletään tavallista arkea. Maa elää jalkojen alla ja nousee elokuvassa omaksi hahmokseen. Elokuva lipuu auringonlaskujen ja puuvillapeltojen halki, vuoret kätkevät vastarintataistelijoita ja salaisuuksia, ja hedelmätarhat kehystävät äidin ja tyttären keskusteluja. Historiallista otetta syventää väritetty arkistokuvamateriaali pelloista, merestä, kaupankäynnistä ja kaupungin sykkeestä.\n\nPalestine 36 on Annemarie Jacirin ohjaama ja käsikirjoittama historiallinen draamaelokuva, joka sijoittuu vuoden 1936 kansannousuun brittiläisen siirtomaavallan alla. Elokuvan yksi päähenkilö on nuori Yusuf (Karim Daoud Anaya), joka liikkuu Jerusalemin levottoman kaupunkielämän ja maaseutukylänsä välillä samalla kun brittihallinto kiristää otettaan kapinan edetessä. Yusufin rinnalla liikkuu historiallisia hahmoja niin palestiinalaisen vastarinnan kuin brittihallinnon riveistä.\n\nPalestine 36 rakentaa sillan menneisyydestä nykyhetkeen, 2020-luvun tapahtumiin ja Israelin Palestiinassa suorittamaa kansanmurhaan. Vuosien 1936–1939 kapina ei koskaan varsinaisesti päättynyt, ja pitkä vapaustaistelu jatkuu yhä.\n\nHeta Heikkala","poster":"https://hiff.fi/wp-content/uploads/airtable/6546c43ff29425f9941171887ee8c1dd-large.png","trailer_url":"https://www.youtube.com/embed/wWtwnae_5UI?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/palestine-36/","imdb":"https://www.imdb.com/title/tt29271622/?ref_=nv_sr_srsg_0_tt_6_nm_2_in_0_q_palestine%20"},"content_warnings":["Kansanmurha","Kolonialismi"],"showing_ids":["recbBVYD3ZNDeplK1","rect7TbyKXQrAeExb","rec95qSkre7fAOHto","recu4owqakfymRrpH"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"paper-tiger","title":"Paper Tiger","original_title":null,"url":"https://hiff.fi/ohjelma/paper-tiger/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Rikos","Perhesuhteet","Jännitys","Kaupunkitila"],"countries":["Yhdysvallat"],"directors":["James Gray"],"cast":["Adam Driver","Miles Teller","Scarlett Johansson"],"languages":["englanti"],"subtitles":["N/A"],"age_rating":"K16","duration_min":115,"year":2026,"logline":"Kunnollinen insinööri (Miles Teller) sekaantuu veljensä (Adam Driver) hämäräbisneksiin ja laittaa perheensä (vaimona Scarlett Johansson) elämän sekaisin 80-luvun New Yorkiin sijoittuvassa klassisessa rikoselokuvassa.","description_text":"Insinööri-isä Irwinillä (Miles Teller) on näennäisesti kaikki hyvin: kaksi rakastavaa poikaa, vaimo Linda (Scarlett Johansson) ja omakotitalo 80-luvun New Yorkissa. Veljellä Garylla (Adam Driver) asiat ovat kuitenkin Irwinin mielestä vielä vähän paremmin – ex-poliisi tahkoaa isoa tiliä lain harmaalla alueella liikkuvalla liiketoiminnallaan. Kun poikien yliopistomaksut alkavat siintää horisontissa, Garyn tarjous Irwinille lähteä mukaan New Yorkin kanaalialueen kehittämisbisnekseen vaikuttaa otolliselta. Vaikka veli maalailee kuvia teollisuusalueen herättämisestä uuteen loistoon, potentiaalisilla asiakkailla ei vaikuta olevan puhtaat jauhot pussissaan. Pian Irwin tajuaa sotkeutuneensa korviaan myöten venäläismafian rikolliseen toimintaan ja vetäneensä perheensä mukanaan vaaralliseen peliin.\n\nJames Gray on tullut tunnetuksi klassista Hollywoodia henkivistä elokuvistaan (mm. Ad Astra ; Pikku Odessa , R&A 1995). Paper Tigerissa hän tarttuu amerikkalaiseen unelmaan ja 80-luvun New Yorkin alamaailmaan tuoden yleisön nautittavaksi tiivistunnelmaisen jännitystarinan, joka kasvaa koskettavaksi kuvaukseksi perheestä, joka yrittää pitää yhtä vaikeuksien edessä. Elokuvaa kannattelevat tähtinäyttelijöiden vahvat roolisuoritukset.\n\nRanskalaisen elokuvamaailman lemmikiksi nousseen Grayn elokuva sai ensi-iltansa Cannesin elokuvajuhlien pääsarjassa tänä keväänä.\n\nInari Ylinen","poster":"https://hiff.fi/wp-content/uploads/airtable/f438c70d912a41a39c29b9b3aa8e9d83-large.jpg","trailer_url":"https://www.youtube.com/embed/vVm2jrFnlZQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/paper-tiger-2026/","imdb":"https://www.imdb.com/title/tt34385689/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_paper%20tig"},"content_warnings":["Väkivalta","Ahdistus","Alaikäisen ahdistelu"],"showing_ids":["rech2BCCx4aRW4gnS"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 20.11.","status":"dated","date":"2026-11-20"},"on_yle_areena":false},{"slug":"pillion","title":"Pillion","original_title":null,"url":"https://hiff.fi/ohjelma/pillion/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Let's Talk about Sex"],"keywords":["Tekstitetty/puhuttu suomeksi","Rakkaus","Seksi","Huumori","Feelgood","LGBTQIA+"],"countries":["Iso-Britannia"],"directors":["Harry Lighton"],"cast":["Harry Melling","Alexander Skarsgård","Lesley Sharp"],"languages":["englanti"],"subtitles":["suomi"],"age_rating":"K16","duration_min":107,"year":2025,"logline":"Alexander Skarsgårdin tähdittämässä kainostelemattomassa domcomissa arka pysäköinninvalvoja ja moottoripyöräkerhon yksinäinen susi aloittavat BDSM-suhteen.","description_text":"Harry Lightonin esikoiselokuva on tutkielma rakkaudesta koettuna sellaisen kehon kautta, joka ei rakkautta ennen ole kokenut. Fetissiseksuaalisuus ja kinkykulttuuri taas ovat todennäköisesti monelle perusleffakävijälle tuntematonta aluetta. Pillion yhdistää nämä kaksi asiaa ymmärrettävästi, liikuttavasti, hauskasti ja välillä melko rajustikin. Sillä sellaistahan ensirakkaus yleensä on.\n\nToisenlaisista elokuvista aiemmin tuttu Harry Melling muodostaa ”mahdottoman komean” Alexander Skarsgårdin kanssa täydellisen duon nahkahomokulttuurin tutkailuun. Ujon peräkammarin pojan Colinin oivallus omasta subin roolistaan puhkeaa kukkaan, kun liki suomalaisen sulkeutunut murahtelija Ray käskee tämän ensitreffeillä nuolemaan saappaitaan.\n\nPoikaystävä keretään vielä käydä esittelemässä oven suussa uteliaille vanhemmille – loistavat Douglas Hodge ja Leslie Sharp – ja sitten lähdetään yökylään, ensimmäiselle monista. Sivuosassa Colinin tavoin suhteensa subina olevaa Keviniä näyttelee Scissor Sisters -kulttidiskoyhtyeen Jake Shears.\n\nLighton käsittelee aihettaan vaivattomasti aina harmoniakvartetin joulukonsertista orgioiksi yltävään kesäpiknikiin. Mahdollisuuksia yltiögraafiseen seksin kuvaukseen olisi vaikka kuinka, mutta Pillionissa ei olekaan lopulta kyse seksistä.\n\nCannesin festivaaleilla vuonna 2025 elokuva palkittiin seitsemän minuuttia kestäneillä aplodeilla. Mukanaan Lighton vei Un Certain Regard -sarjan parhaan käsikirjoituksen palkinnon.\n\nJohanna Siik","poster":"https://hiff.fi/wp-content/uploads/airtable/8d9301136615c8ad474a2e9db5f4e725-large.jpg","trailer_url":"https://www.youtube.com/embed/Gl8n5I-IIHU?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/pillion-2025/","imdb":"https://www.imdb.com/title/tt32321317/?ref_=nv_sr_srsg_0_tt_4_nm_4_in_0_q_pillion"},"content_warnings":["Sadomasokismi"],"showing_ids":["recoSNjCOIuPkAJEt","recDvAadjtOHdfZDB"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"prosecution","title":"Prosecution","original_title":null,"url":"https://hiff.fi/ohjelma/prosecution/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Rikos & rangaistus"],"keywords":["Rikos","Badass","Naiskuvia","Yhteiskunta","Jännitys"],"countries":["Saksa"],"directors":["Faraz Shariat"],"cast":["Chen Emilie Yan","Julia Jentsch","Alev Irmak"],"languages":["saksa","korea"],"subtitles":["englanti"],"age_rating":"K12","duration_min":114,"year":2026,"logline":"Trillerin muottiin valettu kostotarina rasistisen hyökkäyksen kohteeksi joutuneesta syyttäjästä, joka vie oman tapauksensa oikeuteen.","description_text":"Uransa alkuvaiheessa oleva saksalainen valtionsyyttäjä Seyo Kim (Chen Emilie Yan) viettää kesäistä vapaapäivää, kun hänen päälleen heitetään polttopullo. Rasistisesti motivoidusta hyökkäyksestä täpärästi selvinnyt Kim pettyy pahemman kerran saksalaiseen oikeusjärjestelmään, jota on työkseen vannonut puolustavansa. On aika ottaa oikeus omiin käsiin ja viedä syylliset henkilökohtaisesti oikeuden eteen. Kostonhimo on kuitenkin kuin tuli: hyvä kisälli, huono mestari.\n\nTrillerin muottiin valettu kostotarina antaa äänen rasististen hyökkäysten kohteeksi joutuneille, joiden ääni on hautautunut syyttäjänviraston pölyisiin kansioihin. Pala palalta Kim kokoaa kartan kokonaisesta hyvävelikerhosta, joka peittelee omia jälkiään.\n\nTehokas henkilökuvaus, henkilökohtaiset tragediat ja itsevarma ohjaus rakentavat kokonaisuuden, joka vavahduttaa ja herättää ajatuksia kuin laatukirjallisuus. Oma lukunsa on Chen Emilie Yanin tulikivenkatkuinen roolisuoritus, joka uhkuu pakkomielteistä vimmaa ja vuosikymmenten syrjinnän painoa.\n\nMaahanmuuttajuutta ja queer-teemoja elokuvissaan käsittelevä Faraz Shariat on tehnyt tällä kertaa itsevarmasti poliittisen elokuvan, joka kertoo sekä yksilöllisen että kollektiivisen tarinan. Syrjinnän ja avoimen rasismin sivuuttaminen oikeuden silmissä on yksi tärkeimpiä ja ajankohtaisimpia teemoja länsimaissa, myös Suomessa.\n\nJoonas Kallonen","poster":"https://hiff.fi/wp-content/uploads/airtable/028d970e24a78e9489571c52193199ff-large.jpg","trailer_url":"https://www.youtube.com/embed/kmheMGc73eE?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/prosecution/","imdb":"https://www.imdb.com/title/tt39213126/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_prosecu"},"content_warnings":["Rasismi"],"showing_ids":["recJioByebffrzaQs","rec6je7PPwgNsARg5","recspfsNy7LeK9js6"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"queen-at-sea","title":"Queen at Sea","original_title":null,"url":"https://hiff.fi/ohjelma/queen-at-sea/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Ikääntyminen","Rakkaus","Perhesuhteet"],"countries":["Iso-Britannia","Yhdysvallat"],"directors":["Lance Hammer"],"cast":["Juliette Binoche","Tom Courtenay","Steven Cree"],"languages":["englanti","ranska"],"subtitles":["englanti"],"age_rating":"K12","duration_min":121,"year":2026,"logline":"Tytär (Juliette Binoche) saapuu muistisairaan äitinsä ja tämän aviomiehen kotiin, löytää nämä sängystä ja järkyttyy. Onko muistisairaalla lupa harrastaa seksiä?","description_text":"Elämän liekki ei sammu silloinkaan, kun dementian hämärä laskeutuu ihmismielen ylle. Rakkaus korkeassa iässä on Lance Hammerin teema, näyttelijöinä huiput Juliette Binoche, Tom Courtenay ja Anna Calder-Marshall.\n\nAmanda (Juliette Binoche) järkyttyy nähdessään äitinsä Leslien (Anna Calder-Marshall) ja isäpuolensa Martinin (Tom Courtenay) petipuuhissa. Lesliellä on dementia eikä virallisen diagnoosin mukaan kykyä suostumukseen. Amanda hälyttää poliisin, ja yhteiskunnan koneisto käynnistyy, mitä hän kohta katuu.\n\nEsiin kohoavat suuret kysymykset. Halu vai hyväksikäyttö? Koti vai hoitokoti? Itsemääräämisoikeus vai pakkoauttaminen? Draaman, satiirin ja huumorin huippukohta on sosiaaliviranomaisten haastattelu, joka menee mynkään, koska se todistaa rakkaudesta. Martin kysyy Amandalta, tajuaako tämä, millaista on, kun päämää a/ra-jazz-juho-valjakka-trio-x-everybody-digs-bill-evans/","is_film":false,"event_types":["tapahtumat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Angsti","Festarihitti","Mielenterveys","Musiikki","Perhesuhteet","Suru","Perustuu tositapahtumiin"],"countries":["Irlanti","Iso-Britannia"],"directors":["Grant Gee"],"cast":["Anders Danielsen Lie","Bill Pullman","Laurie Metcalf","Isabelle Harriet"],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":177,"year":2026,"logline":"Everybody Digs Bill Evans -elokuvaa seuraa erikoisnäytöksessä upea jazz-keikka! Juho Valjakka Trio heittäytyy vaivattomasti soljuvan yhteissoittonsa kautta Valjakan harmonisesti rikkaiden sävellysten ja Bill Evansin musiikin maailmaan.","description_text":"Ennen keikkaa esitetään Everybody Digs Bill Evans -elokuva. Tällä sivulla voit ostaa yhteislipun elokuvaan ja keikalle (25 e) tai lipun ainoastaan keikalle (12 e). Lippuja ei voi ostaa pelkästään elokuvanäytökseen, mutta voit ostaa yksittäislippuja elokuvan muihin näytöksiin elokuvan omalta sivulta. Keikka järjestetään elokuvan päätyttyä Korjaamon aulassa klo 19.30 alkaen.\n\nLuovasta ja näkemyksellisestä soitostaan tunnettu Juho Valjakka on yksi kysytyimmistä nuorista suomalaisista jazzpianisteista. Uransa varrella Valjakka on esiintynyt monien huippuyhtyeiden riveissä (mm. Lassy–Eskola Nordic Stew, UMO Helsinki Jazz Orchestra, Riikka Keränen sekä Tuomas Paukku Scription) sekä konsertoinut merkittävien kotimaisten festivaalien ohella myös arvostetuilla jazzklubeilla Euroopassa. Vuonna 2018 yhdessä kontrabasisti Oskari Siirtolan ja rumpali Anssi Tirkkosen kanssa perustettu Juho Valjakka Trio keskittyy pääasiassa pianistin omien sävellysten esittämiseen ja on kerännyt kiitosta tyylikkään viimeistellystä ilmaisusta sekä rikkaasta sävyjen kirjosta. Yhtyeen ensimmäinen albumi, Valjakan kokemuksia nuorena taiteilijana heijasteleva ”Liminal Spaces” (2022) huomioitiin Jazz Emma -ehdokkuudella.\n\nUudella ”Lines in Patterns” -albumillaan trio heittäytyy vaivattomasti soljuvan yhteissoittonsa kautta Valjakan harmonisesti rikkaiden sävellysten maailmaan sekä tulkitsee kahden kappaleen verran Valjakalle tärkeän esikuvan pianisti Bill Evansin musiikkia. Kokonaisuus heijastelee elämän lineaarisuuden sekä toisaalta toistuvien syklien kokemuksia, mikä kuuluu yhtyeen musiikissa vapautuneesti virtaavana improvisointina sekä kiehtovasti rakentuvina muotoina.\n\nKokoonpano: Juho Valjakka (piano), Oskari Siirtola (kontrabasso), Anssi Tirkkonen (rummut)","poster":"https://hiff.fi/wp-content/uploads/airtable/aaba3752b6425671aee48466d516b7f5-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/everybody-digs-bill-evans/","imdb":"https://www.imdb.com/title/tt34347792/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_everybody%20digs"},"content_warnings":["Kuolema","Onnettomuus","Ahdistus","Mielenterveysongelmat","Päihteiden ongelmakäyttö","Sairaalakuvasto"],"showing_ids":["rec9kmcX8CRBPLf10"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-african-express","title":"R&A Shorts: African Express","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-african-express/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Kids These Days"],"keywords":["Perhesuhteet","Identiteetti","Nuoruus","Elokuvanteko","LGBTQIA+","R&A Shorts"],"countries":["Itävalta","Mali","Nigeria","Norsunluurannikko","Ranska","Saksa","Senegal","Sveitsi"],"directors":[],"cast":[],"languages":["kapverdenkreoli","norja","wolof","somali","portugali"],"subtitles":["englanti"],"age_rating":"K16","duration_min":80,"year":null,"logline":"Eri Afrikan maihin kytkeytyviä upeimpia uusia elokuvia tarjoilevassa näytöksessä pohditaan sukupuoli-identiteettiä, noustaan taiteelliseen vastarintaan ja tavataan aikamatkaileva prinsessa sekä myyttisten sielunsyöjättärien sisaristo.","description_text":"Yhteistyössä Think Africa -järjestön ja Ubuntu Film Club -kollektiivin kanssa kuratoidussa näytöksessä nähdään kokoelma eri Afrikan maihin tavalla tai toisella kytkeytyviä tuoreita elokuvia.\n\nA Black Fairytale vie katsojan keskelle utopiaa, jossa prinsessa matkaa halki ajan ja ulottuvuuksien. Satuelementtejä hyödyntävä kokeellinen teos tuudittaa pehmeän kantaaottavaan uneen.\n\nBerlinalessa parhaan queer-elokuvan Teddy-palkinnolla palkittu Taxi Moto on elokuva elokuvantekemisestä. Ohjaaja ei ole saanut kuvata kahden miehen välisestä rakkaudesta kertovaa elokuvaansa kotimaassaan. Uuden lokaation ja päänäyttelijän myötä avautuu voimallinen vastarinnan ulottuvuus.\n\nSukupuolen ilmaisultaan moninainen Obi palaa pitkän tauon jälkeen lapsuudenperheensä kotiin hautajaisia varten. Vastassa on perinteinen perheyhteisö, hiljaisuus ja joukko asioita, joista ei voi puhua. Obi is a boy on haikea mutta toiveikas kuvaus oman itsensä puolella olemisesta.\n\nNäytöksen päättää Dëmm , kauhugenren rajapinnalla leikittelevä kuvaus 17-vuotiaasta Matista, joka yrittää selvitä äitinsä kuolemasta. Yöllisellä kävelyllään hän törmää myyttisiin sielunsyöjättäriin, joiden kohtaaminen osoittautuu käänteentekeväksi.","poster":"https://hiff.fi/wp-content/uploads/airtable/d662b2793c17a64ea4fd5f594f0d239b-large.jpg","trailer_url":null,"links":{},"content_warnings":["Kehokauhu"],"showing_ids":["recyglNy01xJ2F7t5"],"shorts":[{"title":"A Black Fairytale","directors":["Kim Sanou","Isabelle Edi","Mariama Sow"],"countries":["Itävalta","Saksa","Mali","Norsunluurannikko","Senegal"],"duration_min":26,"year":2026},{"title":"Taxi Moto","directors":["Gaël Kamilindi"],"countries":["Ranska","Sveitsi"],"duration_min":20,"year":2026},{"title":"Obi Is a Boy","directors":["Dika Ofoma"],"countries":["Nigeria"],"duration_min":17,"year":2025},{"title":"Dëmm","directors":["Aïda Captijn"],"countries":["Sveitsi","Senegal"],"duration_min":17,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-baltian-animaatiohuiput","title":"R&A Shorts: Baltian animaatiohuiput", ch korostaa ahdistusta, joka sotaa vastustavilla venäläisillä on syntynyt paetessaan kotimaastaan Ukrainan sodan alkaessa. Animaatiotekniikka tuo eteen henkilöiden psykologisen taakan ja pakomatkan epämääräisyyden.\n\nJuho Lipponen","poster":"https://hiff.fi/wp-content/uploads/airtable/c19b8bc925327c6098d261bd453d1908-large.jpg","trailer_url":null,"links":{},"content_warnings":["Sota"],"showing_ids":["recVXdMk0g2rUGio7"],"shorts":[{"title":"Lines of Riga","directors":["Andrejs Brīvulis"],"countries":["Latvia"],"duration_min":12,"year":2026},{"title":"Facade","directors":["Elise Kruusel"],"countries":["Viro"],"duration_min":12,"year":2026},{"title":"The One Who Knows","directors":["Eglė Davidavičė"],"countries":["Liettua"],"duration_min":12,"year":2024},{"title":"Eating Time","directors":["Mari Kivi"],"countries":["Viro"],"duration_min":16,"year":2025},{"title":"Winter in March","directors":["Natalia Mirzoyan"],"countries":["Viro","Armenia"],"duration_min":16,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-laughing-in-swedish","title":"R&A Shorts: Laughing in Swedish","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-laughing-in-swedish/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio","Animaatio"],"themes":["Pohjolan huiput"],"keywords":["Huumori","Feelgood","Eläimet","Festarihitti","Lapsuus","R&A Shorts"],"countries":["Ranska","Ruotsi","Tanska"],"directors":[],"cast":[],"languages":["ruotsi","suomi","englanti"],"subtitles":["englanti"],"age_rating":"K12","duration_min":75,"year":null,"logline":"Piinallinen korvamato, surkea selvänäkijä ja yltiöperinteinen keskikesän juhla kommervenkkeineen – tämä on näytöksen täydeltä hassuttelua länsinaapurista.","description_text":"Veteraaniohjaaja Lukas Moodysson sallii kapinahenkisyyden myös keski-ikäisille hullunkurisessa We Are Not Leaving -komediassa. Potkut saanut yliopisto-opettaja valtaa kahden kaverinsa kanssa ex-pomon toimiston vaatiessaan työtään takaisin. Nokkelan dialogin kautta sivutaan niin politiikkaa kuin uskontoa.\n\nSuosittu selvännäkijä ennustaa yleisölleen kulttijohtajan elkein haikeassa Guldbagge-palkitussa draamakomediassa Dancing Pigeons . Raastava kuvaus yhteyden kaipuusta toiseen ihmiseen kulminoituu tilanteeseen, jossa yleisön jäsen kokee saavansa kontaktin kuolleeseen mieheensä ennustajan kautta.\n\nOhjaaja Niki Lindroth von Bahr pohdiskelee ihmisyyttä eläinhahmojen kautta huvittavan syvällisessä The End -animaatiossa. Lentokentälle sijoittuva stop motion -komedia jää kummittelemaan mieleen. Äänirooleissa kuullaan niin maailmankuulua Alexander Skarsgårdia kuin suomalaisikoni Arja Saijonmaatakin.\n\nEarworm kertoo kaikille tutusta vaivasta: päässä loputtomasti soivasta kappaleesta. Toimistotyöntekijä kokeilee hervottomia hoitokeinoja, mutta arjen kirous saa lopulta kauhumaisia tasoja. Uskaltaakohan tarttuvia pop-melodioita kuunnella enää ikinä huolettomasti? Lääkärin roolissa Maria Sid!\n\nLapsen ja aikuisen erilaiset maailmat kohtaavat Ville Gobin vilkkaassa A Real Swedish Midsummer -lyhytelokuvassa. Supiruotsalaiseen keskikesän juhlaan kuuluu näköjään ainakin rauhaa terrorisoivat hyttyset, meluavat aikuiset, muutama viinitonkka sekä Europe-yhtyeen nokkamies Joey Tempest.\n\nTaneli Timisjärvi","poster":"https://hiff.fi/wp-content/uploads/airtable/dc0db3193fe8ab891414781a7d113481-large.jpg","trailer_url":null,"links":{},"content_warnings":["Itsetuhoisuus","Ahdistus"],"showing_ids":["recgaVMt37IA3ArJ5"],"shorts":[{"title":"We Are Not Leaving","directors":["Lukas Moodysson"],"countries":["Ruotsi"],"duration_min":10,"year":2025},{"title":"Dancing Pigeons","directors":["Christofer Nilsson"],"countries":["Ruotsi","Ranska"],"duration_min":23,"year":2025},{"title":"The End","directors":["Niki Lindroth Von Bahr"],"countries":["Ruotsi","Tanska","Ranska"],"duration_min":15,"year":2026},{"title":"Earworm","directors":["Patrik Eklund"],"countries":["Ruotsi"],"duration_min":12,"year":2025},{"title":"A Real Swedish Midsumm "Tavallisen ihmisen parrasvaloihin nostavassa näytöksessä heitetään striptease-keikkaa, haaveillaan ilmakitaramestaruudesta ja päädytään vahingossa osaksi taideteosta.","description_text":"Monilla on tarve toteuttaa itseään jollain tavoin, jotkut haaveilevat suuresta tähteydestä. Näytöksen elokuvat kertovat ihan tavallisen ihmisen poluista parrasvaloihin. Katseen kohteeksi joutuminen voi olla kiusallinen vahinko, mutta myös unelmien täyttymys pelkojen voittamisen jälkeen.\n\nBread and Games on sympaattinen kuvaus Ferdinandista, jolle Pariisin kesäolympialaiset avaavat mahdollisuuden unelmoida isosti. Hän päätyy siivoojaksi yhdelle lukuisista kisapaikoista, mutta kisojen häly ja kaoottinen ihmispaljous ovat liikaa. Turvapaikka löytyy kellaritasossa sijaitsevasta kotikolosta, jossa on hyvä kirjoitella biisejä ystävien kanssa.\n\nTummempia sävyjä tarjoileva draama Dog and Wolf on kertomus parikymppisestä Rudista, joka kiertää strippariryhmän mukana keikkaa heittäen. Päihteiden ja univajeen sekoittamissa huuruisissa muistoissa häilyvät ex-tyttöystävä ja vanha elämä.\n\nRutinoitunut pitkän linjan talkoolainen Helen aloittaa jälleen urakan vapaaehtoisena näyttelyvahtina nykytaidetapahtumassa, mutta tällä kerralla tapahtuu jotain poikkeuksellista. Yhtäkkiä se onkin Helen, joka pitelee aseita käsissään, kirjaimellisesti. Kujeilevan humoristinen A Shot at Art kommentoi performatiivisuutta ja valta-asetelmia kiusallisen pistävästi.\n\nLady Attila -lyhytelokuvassa Agathen päivät kuluvat työskennellessä maatilakoneiden mekaanikkona perheyrityksessä. Hänen suuri intohimonsa eivät kuitenkaan ole traktorit, vaan ilmakitaran soitto. Kun lähistöllä järjestetään kisat, on vihdoin aika nousta parrasvaloihin vastoinkäymisistä huolimatta. Ohjaaja-käsikirjoittaja Apolline Andreys näyttelee nimiroolin, jonka voisi sanoa olevan enemmän kuin hänelle tehty: hän ON Lady Attila. Kyseessä on hänen ilmakitaristi -alter egonsa, jolla hän on käynyt kilpailemassa jopa vuosittain Suomessa järjestettävissä maailmanmestaruuskisoissa asti.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/c5c1d4b6a29a610f019229cdd5dfd900-large.jpg","trailer_url":null,"links":{},"content_warnings":["Seksuaalinen kuvasto","Onnettomuus"],"showing_ids":["recfLjqsnhviUqhYj"],"shorts":[{"title":"Bread and Games","directors":["Léa Tarral","Judith Longuet-Marx"],"countries":["Ranska","Belgia"],"duration_min":25,"year":2025},{"title":"Dog and Wolf","directors":["Terézia Halamová"],"countries":["Tšekki"],"duration_min":20,"year":2025},{"title":"A Shot at Art","directors":["Ilke Paddenburg"],"countries":["Alankomaat"],"duration_min":16,"year":2025},{"title":"Lady Attila","directors":["Apolline Andreys"],"countries":["Ranska"],"duration_min":25,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-night-visions-esittaa","title":"R&A Shorts: Night Visions esittää","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-night-visions-esittaa/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio","Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Kauhu","Jännitys","Action","Badass","R&A Shorts"],"countries":["Espanja","Japani","Kanada","Ruotsi","Suomi","Taiwan"],"directors":[],"cast":[],"languages":["englanti","portugali","ranska","espanja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":99,"year":null,"logline":"Pohjoismaiden suurin fantasia-, kauhu-, scifi-, toiminta- ja kulttielokuviin keskittyvä, vaan ei rajoittuva, festivaali tarjoilee jälleen päräyttävän kattauksen genrelyhäreitä R&A-yleisölle.","description_text":"Näytöksen kuratoinut Night Visions on Pohjoismaiden suurin fantasia-, kauhu-, scifi-, toiminta- ja kulttielokuviin keskittyvä, vaan ei rajoittuva festivaali. Tapahtuma järjestetään Helsingissä kaksi kertaa vuodessa, seuraavan kerran 11.–15. marraskuuta 2026.\n\nDyyni kohtaa Phil Tippettin Mad Godin stop motion -tekniikalla toteutetussa, herkullisia yksityiskohtia tulvivassa scifi-animaatiossa Återsådd , joka sijoittuu mystisten hiekkamatojen kansoittamalle planeetalle. Elokuva voitti vuoden parhaan lyhytelokuvan palkinnon Tukholman Monsters of Film -festivaalilla.\n\nLatinosaippuaoopperoita ronskisti parodioiva genre-elokuvakokeilu Kusiset kosijat ohjaaja Esa Jussilalta, joka muistetaan myös lyhytelokuvista The Pussy with an Uzi (2021) ja Dead End Delights (2022).\n\nAustinin korkealle arvostetun South by Southwest -festivaalin Midnight Shorts -sarjassa maailmanensi-iltansa saanut Wax on kehokauhutarina opiskelijasta, jonka korvatulehdus ajaa äärirajoille.\n\nStop motion -tekniikkaa perinteiseen animaatiokerrontaan niputtava Bodyrave on suomalaisittain poikkeuksellinen scifi-tunnelmapala, jonka ilmeisin inspiraatio löytyy Phil Tippettin festivaalisuosikki Mad Godista .\n\nKaukoidän vampyyrifolklorea What We Do in the Shadowsiin niputtavan The Last JiangShin näyttelijäkaartiin tuo merkittävää kulttielokuvauskottavuutta myös Hongkong-klassikko Mr. Vampiressa (1985) mukana ollut Anthony Chan.\n\nVihan hedelmät -animaatiollaan (2024) ilahduttaneen Tomi ”Malakias” Malkin uutuus Kulta, olen kotona on tekijänsä tyylille uskollinen tuokiokuva, jonka yllä leijuu Kalervo Palsan haamu.\n\nHyönteisten säälimätöntä invaasiota ja vainoharhakuvausta risteyttävä Necrosectos saavuttaa kliimaksissaan Peter Jacksonin varhaistöistä muistuttavia kierroksia.\n\nTerror Night on periruotsalaisesta epadunk-traktoriteknosta ammentava, graafiseksi kasvava spektaakkeli Josefinesta, jonka autoonsa asentama massiivinen bassojärjestelmä osoittautuu kohtalokkaaksi.\n\nJ-Horrorin kuvastolla herkutteleva Magai-Gami on folk-kauhutarina Kanonista ja Renasta, jotka huomaavat tehneensä elämänsä pahimman virheen saavuttuaan samoilemaan ”väärennettyjen jumalolentojen” eli Magai-Gamien kansoittamaan metsään.","poster":"https://hiff.fi/wp-content/uploads/airtable/e73589bea421e44c9d49eb72d799c381-large.jpg","trailer_url":null,"links":{},"content_warnings":["Kehokauhu","Eritteet","Väkivalta"],"showing_ids":
