Schoenbrun"],"cast":["Hannah Einbinder","Gillian Anderson","Amanda Fix","Arthur Conti","Eva Victor"],"languages":["englanti"],"subtitles":["suomi"],"age_rating":"K16","duration_min":112,"year":2026,"logline":"Jane Schoenbrunin slasher-ilottelu kulttikauhu-remakea puuhaavasta ohjaajasta (Hannah Einbinder) ja hiipuneesta elokuvatähdestä (Gillian Anderson) vie queerin (elokuva)nautinnon ytimeen.","description_text":"Portrait of a Lady on Fire sijoitettuna Perjantai 13. -elokuvan jatko-osaan. Näin ohjaaja Jane Schoenbrun ( I Saw the TV Glow , R&A 2024) kuvaili Cannesissa uutta elokuvaansa Teenage Sex and Death at Camp Miasma , joka pokasi festivaalilla Queer Palm -palkinnon.\n\nElokuvassa queer-ohjaaja Kris Williams (Hannah Einbinder) on tekemässä uutta versiota 80-luvun slasherista Camp Miasmasta , joka poiki aikoinaan franchisen. Alkuperäisessä Camp Miasmassa pahis – sekä tyttönä että poikana kasvatettu ja kiusaajien hukuttama ”Pieni kuolema” (Jack Haven) – listii kesäleirillä kiimaisia teinejä yksi kerrallaan. Studio on palkannut Krisin tekemään tarinasta ”woke-version”.\n\nKris matkustaa tapaamaan Camp Miasman tähteä, erakkona alkuperäisen elokuvan kuvauspaikalla elävää Billy Presleytä (Gillian Anderson), suostutellakseen hänet mukaan reboottiin. Kohtaaminen tempaa kaksikon halun ja veren pyörteisiin. Elokuva ja todellisuus alkavat sekoittua, kun pieni kuolema lähestyy.\n\nTeenage Sex and Death at Camp Miasma on slasher-fanien 2020-luvulle päivitetty märkä uni. Se on riemastuttavan queer kauhuilottelu, joka käsittelee oivaltavasti seksuaalisuutta ja kehollista vapautumista. Schoenbrunin elokuva on kulttiklassikko jo syntyessään.\n\nRiikka Pennanen","poster":"https://hiff.fi/wp-content/uploads/airtable/21567b764b2eb8f14fca491009844127-large.jpg","trailer_url":"https://www.youtube.com/embed/dimCiC_hdoA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/teenage-sex-and-death-at-camp-miasma/","imdb":"https://www.imdb.com/title/tt35298123/?ref_=nv_sr_srsg a hän kasvoi tarinankertojaksi. Vaikka elokuva ei sinällään käsittele vaikeuksien kääntämistä voitoksi, on ohjaaja itse voinut käyttää kokemuksiaan kuvaamalla elokuvaansa voimakkaita ja maagisia kohtauksia.\n\nOmar Fasolah","poster":"https://hiff.fi/wp-content/uploads/airtable/c727f6f196633abf7a85a747f1db1a18-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/the-boy-with-the-light-blue-eyes/","imdb":"https://www.imdb.com/title/tt31031570/?ref_=nv_sr_srsg_dm_0_tt_4_nm_4_in_0_q_the%20boy%20with%20the%20light%20blue%20eyes"},"content_warnings":[],"showing_ids":["recozFmOw1Pr4yV9p","rechwnsy6fuzh5xDg","recHcrNSFHLWltKov","recmHAgjfvpNRHkEE"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-dance-club","title":"The Dance Club","original_title":null,"url":"https://hiff.fi/ohjelma/the-dance-club/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Feelgood","Tanssi","Mielenterveys","Huumori"],"countries":["Ruotsi"],"directors":["Lisa Langseth"],"cast":["Nils Wetterholm","Alva Bratt","Matias Varela","Julia Franzén"],"languages":["ruotsi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":99,"year":2025,"logline":"Psykologian opiskelija ja performanssitaiteilija aloittavat salaisen tanssiterapiaryhmän kepeässä ja musiikin täyttämässä draamakomediassa.","description_text":"Kun kovien tulostavoitteiden alla tehtaillaan lääketieteellisiä diagnooseja, saadaan suurempi tuotto sairaiden ihmisten kustannuksella. Toisaalta, jos tuntee arvoristiriitaa tällaisen työpaikan kanssa, on toki mahdollista kokeilla uusia hoitokeinoja työnantajan selän takana.\n\nEräänä lauantaiaamuna tilaisuus tekee kallonkutistajan, kun klinikalle pelmahtaa henkilöautoon mahtuva määrä rikkinäisiä sieluja. Harjoitteluaan suorittava psykologian opiskelija Johannes on ainoa henkilö paikalla, ja hän päättää tarjota apuaan. Yhdessä salaperäisen ja yhtä lailla hoitoihin pettyneen Rakelin kanssa hän päätyy hoitamaan potilaita tanssiterapialla. Tanssiryhmän kasvaessa Johanneksella on vaikeuksia pitää ohjakset käsissään, ja vertaistukea riittää siihen asti, mihin muiden rajat päättyvät.\n\nOhjaaja Lisa Langsethin ( Euphoria , R&A 2018; Rakkaus ja anarkia -tv-sarja) comeback-elokuva voi näkökulmasta riippuen olla joko psykologinen komedia tai komedia psykologiasta. Hauskaan musiikkielokuvaan on ympätty vauhtia, romantiikkaa sekä ripaus yhteiskuntakritiikkiä. Katsojalleen The Dance Club näyttää, että ainakin elokuvissa mieleen pesiytyneet peikot ja demonit voi manata pois tanssimalla.\n\nOmar Fasolah","poster":"https://hiff.fi/wp-content/uploads/airtable/e2ac76775e42bcb94b5ecf02b5669453-large.jpg","trailer_url":"https://www.youtube.com/embed/RtNBHTlMUxM?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-dance-club/","imdb":"https://www.imdb.com/title/tt33269715/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20dance%20club"},"content_warnings":[],"showing_ids":["rectXCNW2dRsTbM75","recXGl6p9nl8flGVS","recnKccjYsf1ApSNy","reci8p79nIZJDtCc0"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-day-she-returns","title":"The Day She Returns","original_title":"그녀가 돌아온 날","url":"https://hiff.fi/ohjelma/the-day-she-returns/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Elokuvanteko","Naiskuvia","Identiteetti","Muisti","Media"],"countries":["Etelä-Korea"],"directors":["Hong Sang-soo"],"cast":["Song Seon-mi","Cho Yun-hee","Park Mi-so","Ha Seong-guk","Shin Seok-ho"],"languages":["korea"],"subtitles":["englanti"],"age_rating":"K7","duration_min":84,"year":2026,"logline":"Korealaisen keskusteluelokuvan kuninkaan Hong Sang-soon uutuudessa comebackin tehnyt näyttelijä antaa polveilevia haastatteluita saksalaisen oluen äärellä.","description_text":"Bae Jeong-su on keski-ikäinen näyttelijä, joka avioliiton, lapsen kasvatuksen, avioeron ja 12 vuoden jälkeen palaa takaisin näyttelemisen pariin. Hänen uusi elokuvansa on indie-lajityyppiä, päinvastoin kuin ilmeisesti aiemmalla uralla. The Day She Returns koostuu viidestä numeroidusta näytöksestä: alkupuolella kolme nuorta naisreportteria haastattelee yksi kerrallaan Jeong-sua, jälkipuolella Jeong-su näyttelee workshopissa uudelleen haastattelut yhdessä toisen naisnäyttelijän kanssa.\n\nAlkupuolella kukin kolmesta haastattelijasta päätyy kertomaan yhtä paljon itsestään kuin haastattelemastaan tähdestä. Jälkimmäinen puolisko taas paljastaa muistin, omakuvan ja ulospäin itsestä projisoidun minän hataruuden: Jeong-su haparoi dialogissaan, ei muista, mitä on sanonut.\n\nThe Day She Returns on kuvattu Hong Sang-soon luotettuun tyyliin, mustavalkoisena ja kukin näytös liikkumattomalla kameralla yhtenä otoksena. Ohjaajan tavaramerkin, sojun särpimisen, sijaan henkilöt nauttivat tällä kertaa saksalaista olutta.\n\nEija Niskanen","poster":"https://hiff.fi/wp-content/uploads/airtable/5d28d107488645f021893f70fadca73f-large.jpg","trailer_url":"https://www.youtube.com/embed/upivohDEZm4?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-day-she-returns/","imdb":"https://www.imdb.com/title/tt39368030/?ref_=nv_sr_srsg_0_tt_6_nm_2_in_0_q_the%20day%20she%20re"},"content_warnings":[],"showing_ids":["recCR2RohOHmqilw1","rec9MT3sy27m3W6Nb"],"shorts":[],"cinema_release":{"label":"Ensi-ilta vuoden 2027 alussa","status":"undated","date":null},"on_yle_areena":false},{"slug":"the-devils","title":"The Devils","original_title":null,"url":"https://hiff.fi/ohjelma/the-devils/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["R&A Trailblazers"],"keywords":["Usko","Outoa","Epookki","Seksi"],"countries":["Iso-Britannia"],"directors":["Ken Russell"],"cast":["Vanessa Redgrave","Oliver Reed","Dudley Sutton","Max Adrian"],"languages":["englanti","latina"],"subtitles":["N/A"],"age_rating":"K18","duration_min":114,"year":null,"logline":"Kaikkien aikojen kulttielokuviin lukeutuva nunnaeksploitaatio oli Suomessa kokonaan kielletty 30 kesää ja saapuu nyt valkokankaalle täydessä mitassaan.","description_text":"Suureellisesta tyylistään tunnettu brittiohjaaja Ken Russell kohahdutti kansainvälisesti, kun todellisesta ursuliininunnien riivaustapauksesta 1600-luvun Ranskassa aineksensa ammentava The Devils sai ensi-iltansa vuonna 1971. Aldous Huxleyn kirjaan The Devils of Loudun perustuvassa elokuvassa pappi Urbain Grandier (Oliver Reed) joutuu vallanpitäjien vainoamaksi, kun häneen pakkomielteisesti suhtautuva sisar Jeanne (Vanessa Redgrave) syyttää häntä satanismin levittämisestä luostariin. Elokuvan pidäkkeetön seksuaalinen sisältö, kirkon valtapolitiikan kritiikki sekä graafinen väkivalta saivat kauhistuneiden elokuvatarkastajien sensuurisakset välittömästi heilumaan. Kokonaan esityskieltoon elokuva päätyi muun muassa Suomessa, aina vuoteen 2001 asti.\n\nCannesissa keväällä ensi-iltansa saanut alkuperäisestä kameranegatiivista koottu leikkaamaton 4K-restauraatio palauttaa elokuvan alkuperäiseen loistoonsa. Loppuun asti hiottu suurelokuva ravisuttaa vielä puoli vuosisataa ilmestymisensä jälkeen. Aikansa huippunäyttelijöiden unohtumattomat roolisuoritukset sekä Derek Jarmanin kekseliäs lavastus nostavat elokuvan kiistatta klassikon tasolle.\n\nIda Kumpulainen","poster":"https://hiff.fi/wp-content/uploads/airtable/2739c354e9dd4032dc04972f9296d3be-large.jpg","trailer_url":"https://www.youtube.com/embed/qh0wL211hnQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-devils/","imdb":"https://www.imdb.com/title/tt0066993/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20devils"},"content_warnings":["Väkivalta","Seksuaalinen kuvasto","Rienaus"],"showing_ids":["recNveiOM5n4BE1St","recknsf1Wy8sTvKV4"],"shorts":[],"cinema_release":{"label":"Tulossa levitykseen, ensi-ilta ei vielä tiedossa","status":"undated","date":null},"on_yle_areena":false},{"slug":"the-diary-of-a-chambermaid","title":"The Diary of a Chambermaid","original_title":"Le Journal d'une femme de chambre","url":"https://hiff.fi/ohjelma/the-diary-of-a-chambermaid/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["East Side Stories"],"keywords":["Huumori","Yhteiskunta","Outoa","Kirjallisuus","Siirtolaisuus"],"countries":["Ranska","Romania"],"directors":["Radu Jude"],"cast":["Ana Dumitrașcu","Mélanie Thierry","Vincent Macaigne","Marie Rivière"],"languages":["ranska","romania","englanti"],"subtitles":["englanti"],"age_rating":"K12","duration_min":94,"year":2026,"logline":"Itäeurooppalainen sisäkkö yrittää irrota jouluksi kotiin työstään varakkaan ranskalaisperheen kotona yhteiskunnallisessa satiirissa, joka on kuin pehmeä paketti romanialaisen elokuvan kauhukakara Radu Judelta.","description_text":"Pariisissa kotiapulaisena työskentelevä Gianina (loistava Ana Dumitrașcu) yrittää järjestää itseään jouluksi kotiin tyttärensä luo Romanian maaseudulle. Työ on tasaista ja ennakoitavaa, mutta työnantajaperhe käyttäytyy Gianinaa kohtaan alentuvasti ja töykeästi.\n\nGianinan hoitaessa varakkaan perheen kotia hänen tyttärensä asuu isoäitinsä luona päälle lahoavassa talossa. Ranskalainen perhe teeskentelee välittävänsä Gianinan ikävästä, mutta omat tarpeet jotenkin tulevat kuitenkin aina tielle.\n\nGianinalla on monta roolia. Äidin ja kotiapulaisen lisäksi hän näyttelee harrastelijateatterin versiossa Octave Mirbeaun romaanista Le Journal d’une femme de chambre .\n\nElokuva kokonaisuudessaan on nykyaikainen reflektio Mirbeaun toistaiseksi suomentamattomasta klassikosta. Romanian kuuluisimpiin elokuvaohjaajiin kuuluva Radu Jude maalaa elävän kuvan täysin eri todellisuuksissa elävistä luokista. Elokuva tarina kantaa Mirbeaun alkuperäistä ajatusta pidemmälle: siinä missä romaani käsittelee porvariston moraalista rappiota ja työväenluokan hyväksikäyttöä, joka puolestaan ajaa työläiset samalle rappion tielle, Jude ottaa käsittelyyn maahanmuuton ja äidinrakkauden teemat, ja lähestyy luokkaeroja monisyisemmällä otteella.\n\nElokuvan aiheisiin kuuluvat niin Ukrainan sota, ihmis- ja eläinoikeudet kuin sadutkin. Se paljastaa yläluokan totaalisen irtautuneisuuden työläisten arkielämästä ja ottaa käsittelyyn tekopyhyyden ja performatiivisen solidaarisuuden. Kaiken alla, luokkaeroista huolimatta, ihmisiä yhdistävät rakkauden ja vallankumousten (tai rakkauden ja anarkian) kokemukset.\n\nLjubomir Delevic (kääntänyt Adrian Murtomäki)","poster":"https://hiff.fi/wp-content/uploads/airtable/fa71ce0e37de772ba58311362f718882-large.jpg","trailer_url":"https://www.youtube.com/embed/VhCR5WgsVbA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/super-furball-and-the-lying-squirrel/","imdb":"https://www.imdb.com/title/tt35166699/?ref_=nv_sr_srsg_1_tt_7_nm_0_in_1_q_supermarsu"},"content_warnings":["Sota"],"showing_ids":["reclLfEEMRpJsFVen","rec7ggruq4B1DIVZP"],"shorts":[],"cinema_release":{"label":"Ensi-ilta vuoden 2027 alussa","status":"undated","date":null},"on_yle_areena":false},{"slug":"the-dreamed-adventure","title":"The Dreamed Adventure","original_title":"Das geträumte Abenteuer","url":"https://hiff.fi/ohjelma/the-dreamed-adventure/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["East Side Stories"],"keywords":["Rikos","Festarihitti","Naiskuvia","Yhteiskunta","Historia"],"countries":["Bulgaria","Itävalta","Ranska","Saksa"],"directors":["Valeska Grisebach"],"cast":["Yana Radeva","Syuleyman Alilov Letifo","Stoicho Kostadinov"],"languages":["bulgaria"],"subtitles":["englanti"],"age_rating":"K12","duration_min":164,"year":2026,"logline":"Cannesin elokuvajuhlilla tuomariston palkinnon saaneessa elokuvassa arkeologi luovii kiistelevien rikollispomojen ja vuosikymmenten ihmissuhdekudelmien keskellä Bulgarian ja lain rajamailla.","description_text":"Kartalla Bulgarian ja Turkin raja on Matochinan kylän kohdalla lähes luotisuora. Paikallisille seutu muodostaa kuitenkin häilyvän rajavyöhykkeen, jossa Kreikkakin on aivan nurkan takana. Aika tuntuu osin pysähtyneen neuvostovuosiin, mutta toisaalta modernin salakuljetuksen eri muotojen ympärille rakentunut rikollisuus kukoistaa.\n\nKiistelevien rikollispomojen ja vuosikymmenten ihmissuhdekudelmien keskellä luovivat The Dreamed Adventuren päähenkilöt: Matochinassa arkeologisia kaivauksia johtava Veska sekä toisten omaisuudella itsensä elättävä, lähikaupunki Svilengradiin pitkästä aikaa palaava Saïd. Nuoruuden valinnat ovat heittäneet elokuvan hahmoja kaidalle polulle tai siltä sivuun.\n\nOhjaaja Valeska Grisebach tuli tunnetuksi elokuvastaan Western (R&A 2017). The Dreamed Adventure nappasi puolestaan Cannesissa tuomarison palkinnon. Tässä elokuvassa matka itsessään on päämäärä. Monia juonenpätkiä aukeaa, mutta tarkoituksellisesti vain osa kurotaan umpeen. Autenttisuuden tuntua lisää, että elokuvan illanviettoihin ja pihaparlamentteihin on tuotu onnistuneesti mukaan amatöörinäyttelijöitä. Sivuhahmoistakin saadaan loihdittua pienillä eleillä ja elämänmakuisilla kohtauksilla esiin paljon.\n\nMatti Ylönen","poster":"https://hiff.fi/wp-content/uploads/airtable/d9c7c933ef9facdd90b099436a29316a-large.png","trailer_url":"https://www.youtube.com/embed/Js1IBgEcaeE?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-dreamed-adventure/","imdb":"https://www.imdb.com/title/tt21188986/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20dreamed%20ad"},"content_warnings":[],"showing_ids":["recHItNOYmJtpUaNZ","recUtwWbYRpyviSkN","recpf75feUE7ctmxB"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-education-of-jane-cumming","title":"The Education of Jane Cumming","original_title":null,"url":"https://hiff.fi/ohjelma/the-education-of-jane-cumming/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Historia uusiksi"],"keywords":["Epookki","LGBTQIA+","Ihmisoikeudet","Rakkaus","Perustuu tositapahtumiin"],"countries":["Iso-Britannia","Saksa","Sveitsi"],"directors":["Sophie Heldman"],"cast":["Flora Nicholson","Clare Dunne","Mia Tharia","Fiona Shaw"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":114,"year":2026,"logline":"1800-luvun Skotlantiin sijoittuvassa kauniissa draamassa vähemmistöihin kuuluvat naiset löytävät toisistaan turvan. Epookkielokuva kuvaa hienovaraisesti ajan sosiaalisia hierarkioita, rasismia ja homofobiaa.","description_text":"Edinburgh, 1810. Tositapahtumiin perustuvassa draamaelokuvassa itsenäistä elämää tavoittelevat opettajat Jane Pirie (Flora Nicholson) ja Marianne Woods (Clare Dunne) avaavat yhdessä tyttöjen sisäoppilaitoksen. Kouluun ilmoittautuu varakkaan aristokraatin (Fiona Shaw) pojantytär, Intiasta Skotlantiin muuttanut teini-ikäinen Jane Cumming (Mia Tharia). Muut oppilaat hyljeksivät puoliksi intialaista Janea, joka puolestaan tukeutuu opettajakaksikkoon.\n\nTyön ja yksityiselämän rajat hälvenevät, kun kolmikko päätyy viettämään kesän yhdessä Janen isoäidin painostuksesta. Kesän aikana heidän välilleen muodostuu herkkä perhedynamiikka. Myös opettajien välinen suhde syvenee, ja nuori Jane aistii tämän. Kun Jane kokee myöhemmin pettymyksen opettajien suunnalta, hän päättää käyttää tätä heitä vastaan.\n\nVisuaalisesti runollinen ja kauniisti näytelty The Education of Jane Cumming kuvaa hienovaraisesti 1800-luvun sosiaalisia hierarkioita, rasismia ja homofobiaa. Elokuvassa vähemmistöihin kuuluvat löytävät toisistaan turvaa – mutta päätyvät lopulta käyttämään tätä haavoittuvuutta aseena toista vastaan traagisesti.\n\nRiikka Pennanen","poster":"https://hiff.fi/wp-content/uploads/airtable/59d96adfb1a229c7e43b72e7ec8e8f0f-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/the-education-of-jane-cumming-1/","imdb":"https://www.imdb.com/title/tt27811182/?ref_=nv_sr_srsg_0_tt_6_nm_2_in_0_q_the%20education%20of%20jane"},"content_warnings":["Homofobia","Rasismi"],"showing_ids":["recKOKOx4QsmRuYrV","recPRNEZasSv5CDJC","recqjgX91T3ksZqjm"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-end-of-it","title":"The End of It","original_title":null,"url":"https://hiff.fi/ohjelma/the-end-of-it/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Outouden laakso"],"keywords":["Sci-fi","Yhteiskunta","Ikääntyminen","Outoa"],"countries":["Espanja","Iso-Britannia","Norja"],"directors":["Maria Martinez Bayona"],"cast":["Rebecca Hall","Noomi Rapace","Gael García Bernal"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":101,"year":2026,"logline":"Nimekkäiden näyttelijöiden tähdittämä scifi-satiiri ikuiseen elämään kyllästyneestä taiteilijasta, joka päättää muuttaa kuolemansa taideteokseksi.","description_text":"Espanjalaisen Maria Martínez Bayonan ensimmäinen kokopitkä elokuva The End of It kysyy, miten elää mielekästä elämää maailmassa, jossa ikääntyminen on selätetty ja ihminen voi elää ikuisesti.\n\nElokuvassa entinen provokatiivinen taiteilija Claire (Rebecca Hall) on saavuttamassa 250 vuoden iän. Samojen pinnallisten ystävien, robottiavustajan (Beanie Feldstein) ja muuttumattoman arjen keskellä hän saa tarpeekseen ja tekee skandaalimaisen päätöksen: hän haluaa kuolla. Päätös aiheuttaa kaaoksen hänen aviomiehensä (Gael García Bernal) ja tyttärensä (Noomi Rapace) elämässä, mutta sytyttää Claireen uuden luovan roihun. Hän päättää muuttaa oman kuolemansa viimeiseksi suureksi taideteoksekseen.\n\nHall tekee teoksessa upean roolisuorituksen naisena, joka yrittää löytää viimeisen ripauksen inhimillisyyttä ylisiloitellussa maailmassa.\n\nCannesin elokuvajuhlilla ihastuttanut satiirinen sci-fi-draama leikittelee sysimustalla huumorilla ja eksistentialistisella absurdismilla. Se on terävä ja raikas kuvaus ihmissuhteiden teennäisyydestä, vanhemmuudesta sekä ihmisen pakonomaisesta tarpeesta etsiä merkitystä. The End of It pohtii tyylikkäästi ja pistävästi, onko ilman loppua millään mitään väliä.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/70bafac207a0cdfd507af4dab1faf392-large.jpg","trailer_url":"https://www.youtube.com/embed/MX_6mivF63c?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-end-of-it/","imdb":"https://www.imdb.com/title/tt36590232/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_the%20end%20of%20it"},"content_warnings":["Itsemurha"],"showing_ids":["recQSwZaZY7D1sZKT","recYML2Ic8hSP5NYE","rec4NC8kGJIKOho0q"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-history-of-concrete","title":"The History of Concrete","original_title":null,"url":"https://hiff.fi/ohjelma/the-history-of-concrete/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["United States of Indie"],"keywords":["Outoa","Huumori","Feelgood","Kaupunkitila"],"countries":["Yhdysvallat"],"directors":["John Wilson"],"cast":[],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":100,"year":null,"logline":"Eksentrinen dokumentaristi vie tajunnanvirtansa mukana pökerryttävän poukkoilevalle ja esseistiselle komediaretkelle tutustumaan meitä kaikkia erottavaan ja yhdistävään materiaan – betoniin.","description_text":"The History of Concrete esittelee betonin historian takaperoisesti nykyhetkestä Rooman imperiumiin. Matkan varrella esitellään New Yorkin kaduilta purukumeja poistava firma, sivutaan kuolleiden ihmisten tatuointeja säilövää yritystä, pohditaan uskonnollisia ultrajuoksijoita, kuokitaan Kim Kardashianin juhlissa, ja pian huomaatkin astuneesi kaninkoloon oppaanasi dokumentaristi John Wilson!\n\nWilson tuo debyyttielokuvassaan HBO-sarjastaan How To with John Wilson tutun kiusaantuneen huumorin ja salakavalan herkkyyden vihdoin valkokankaille. Elokuvan alussa Wilson osallistuu työpajaan, jossa opetetaan, miten tehdä rom-com-kliseistään tunnettu Hallmark-jouluelokuva. Wilson ottaa haasteen vastaan ja saatujen oppien avulla lähtee tekemään elokuvaa meitä kaikkia yhdistävästä voimasta, betonista.\n\nKameransa takaa kainosti kommentoiva Wilson vetää katsojan tajunnanvirtansa vietäväksi pökerryttävän poukkoilevalle esseistiselle retkelle läpi arjen massasta esiin huuhtomansa eriskummallisen elämänaineksen. Wilsonin aseistariisuvan vilpitön ilo ja uteliaisuus yhdistyy toinen toistaan nokkelampiin havaintoihin tästä tavanomaisesta meitä kaikkia erottavasta ja yhdessä pitävästä materiasta – ja samalla betonin historiakin tulee käsitellyksi, jotenkuten.\n\nJimi Rosling","poster":"https://hiff.fi/wp-content/uploads/airtable/e11e5011ec50ff34178db502300e2f33-large.jpg","trailer_url":"https://www.youtube.com/embed/hF7vGlfTg6w?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-history-of-concrete/","imdb":"https://www.imdb.com/title/tt39150234/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_history%20of%20con"},"content_warnings":[],"showing_ids":["recR3ZUGwc3pFcUW2","recMSDXgUxHVRX6QD","recDUd5Ku0s5jhuk3"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-love-that-remains","title":"The Love That Remains","original_title":null,"url":"https://hiff.fi/ohjelma/the-love-that-remains/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjoismaiden neuvoston elokuvapalkintoehdokkaat"],"keywords":["Perhesuhteet","Luontosuhde","Huumori","Rakkaus"],"countries":["Islanti","Ranska","Ruotsi","Tanska"],"directors":["Hlynur Pálmason"],"cast":["Saga Garðarsdóttir","Sverrir Gudnason","Ída Mekkín Hlynsdóttir"],"languages":["englanti","ranska","islanti"],"subtitles":["englanti"],"age_rating":"K12","duration_min":109,"year":2025,"logline":"Islantilainen erotarina tutkii hellästi perheen, rakkauden ja jaettujen muistojen monimutkaisia rihmastoja.","description_text":"Cannesissa ensi-iltansa saanut The Love That Remains on runollinen ja hellävarainen tutkimusmatka islantilaiseen perheeseen, joka yrittää navigoida vanhempien eron ja yhteisvanhemmuuden hienovaraisissa muutoksissa. Elokuva uppoutuu kalastajaisän ja kuvataitelijaäidin uuteen elämänrytmiin lempeän realistisesti, kunnes jättimäinen kukko ja maalitauluna käytetty variksenpelätin saapuvat kummittelemaan unenomaisina symboleina.\n\nPalkitun Hlynur Pálmasonin ( Kutsumus , R&A 2022) elokuvissa Islannin luonto nousee yhdeksi päähenkilöksi. Vuodenaikojen vaihtumisen ympärille rakennettu runoelma etenee kuin elävä kollaasi: laajat islantilaiset maisemat muuttuvat emotionaalisiksi vastakohdiksi erilaisille yksityiskohdille ja tekstuureille, ruosteisille taideteoksille ja putouksena virtaaville silakkaseinämille.\n\nSen sijaan, että elokuva tarjoaisi siistejä ratkaisuja, se on kauniin hienovarainen draamakomedia ja pohdiskeleva tutkimus siitä, mitä jää jäljelle rakkauden muuttuessa. Se viipyy monitulkintaisuudessa kutsuen katsojat tuntemaan hahmojen mukana vuoroveden lailla virtaavat moninaiset tunteet.\n\nOtto Kylmälä, R&A 2025","poster":"https://hiff.fi/wp-content/uploads/airtable/05f0a1406e3705f60a3daccc823eaad1-large.jpg","trailer_url":"https://www.youtube.com/embed/jZ0fdmesr-w?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-love-that-remains/","imdb":"https://www.imdb.com/title/tt33381401/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20love%20that"},"content_warnings":[],"showing_ids":["rec0cq8L99LdHIKUD","reccyVz8zRYlr8wDX","rec9tKR29HkKDHoZ1"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-meltdown","title":"The Meltdown","original_title":"El deshielo","url":"https://hiff.fi/ohjelma/the-meltdown/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Rikos & rangaistus"],"keywords":["Rikos","Lapsuus","Ystävyys","Jännitys"],"countries":["Chile","Espanja","Meksiko","Yhdysvallat"],"directors":["Manuela Martelli"],"cast":["Maya O’Rourke","Saskia Rosendahl","Maia Domagala"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K12","duration_min":108,"year":2026,"logline":"Chileläiseen hiihtokeskukseen sijoittuvassa jännärissä tarkkanäköinen tyttö joutuu keskelle aikuisten valheita, kun hänen uusi ystävänsä katoaa.","description_text":"On vuosi 1992 ja Chilessä eletään diktaattori Augusto Pinochetin jälkeensä jättämän trauman aikaa. Lumisten Andien läheisyydessä sijaitsee hotelli, jossa 9-vuotias Inés kuljeksii tarkkailemassa vieraita ja henkilökuntaa. Hotellin omistavat Inéksen isovanhemmat, joiden luona hän asuu vanhempiensa ollessa työmatkalla. Hotellin yhteydessä toimiva hiihtokeskus vetää puoleensa runsaasti eurooppalaisia matkailijoita, ja kun hotelliin saapuu saksalainen alppihiihtäjä, 14-vuotias Hanna, Inés saa tästä ystävän.\n\nHannan valmentaja Alexander patistelee tätä treeneihin, mutta Hanna testailee hänelle asetettuja rajoja tupakoimalla ja tutustumalla Inéksen serkkuun Sebastiániin. Erään yön aikana Hanna katoaa ja Inéksellä on tietoja, jotka voisivat auttaa etsinnöissä. Mummi kuitenkin kieltää Inéstä kertomasta näkemästään, sillä hotellin mainetta on suojeltava. Kun Hannan äiti Lina osallistuu etsintöihin, Inés ryhtyy salaa hänen avukseen.\n\nThe Meltdown muistuttaa tunnelmaltaan paikoin vuoden 1975 ikonista mysteeriä Picnic at Hanging Rock , vaikka maisemat ovat Australian sijaan Chilessä ja raukea kesäpäivä vaihtuu lumiseen metsään. Lapsen näkökulmasta kuvattu katoamisjännäri näyttää taidokkaasti, miten me aikuiset unohdamme, että lapset huomaavat kaiken.\n\nEelia Leikas","poster":"https://hiff.fi/wp-content/uploads/airtable/8ef5e7e56d977ea34178f0b2739a411b-large.jpg","trailer_url":"https://www.youtube.com/embed/C5UqRE2XGZs?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-meltdown/","imdb":"https://www.imdb.com/title/tt39571626/?ref_=nv_sr_srsg_3_tt_8_nm_0_in_0_q_the%20meltdown"},"content_warnings":[],"showing_ids":["recwHLZzP8Tk5NwKP","recmTAWZQNdK1WaGx"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-patron","title":"The Patron","original_title":"Mecenaten","url":"https://hiff.fi/ohjelma/the-patron/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjolan huiput"],"keywords":["Taide","Identiteetti","Outoa"],"countries":["Ruotsi"],"directors":["Julia Thelin"],"cast":["Carla Sehn","Maxwell Cunningham","Lucas Lynggaard Tønnesen","Ulf Stenberg"],"languages":["ruotsi","tanska","englanti"],"subtitles":["osittain englanti"],"age_rating":"K12","duration_min":100,"year":null,"logline":"Siivooja tekeytyy taidemesenaatiksi jännittävässä ja seksikkäässä elokuvassa, joka on kuin Parasiten ja Funny Gamesin viinipöhnäinen skandiserkku.","description_text":"Anonyymi nuori nainen (Carla Sehn) elättää itsensä siivoamalla taidemuseota ja törkyrikkaan mesenaatti-gallerianomistaja Annika Franken kotia haaveillen statuksesta taidemaailmassa. Kun Franke lähtee matkoille, päättää nainen hetken mielijohteesta omia tämän identiteetin ja lähteä taidenäyttelyn avajaisiin.\n\nAvajaisissa nainen tutustuu tarjoilijana työskenteleviin taideopiskelijapoikiin Gustaviin (Lucas Lynggaard Tønnesen) ja Salleen (Maxwell Cunningham) ja kutsuu nämä jatkoille. Kuinka pitkälle “Annikan” valkoinen valhe voi kantaa, ja kuka viekään tässä vinksahtaneessa roolileikissä lopulta ketä?\n\nLyhäreillään Cannesia myöten glooriaa keränneen Julia Thelinin sähköinen ja seksikäs esikoispitkä The Patron on kuin Parasiten ja Funny Gamesin viinipöhnäinen skandiserkku. Tiukkoja genrerajoja ei kuitenkaan vedetä. Thelin tiivistää tunnelmaa kohtaus kohtaukselta, ja pinnan alla muhivat primitiiviset vietit ovat alati ryöpsähtämäisillään.\n\nUpeat Sehn, Tønnesen ja Cunningham tekevät hyväksyntää ja tunnustusta janoavista “Annikasta”, Gustavista ja Sallesta moniulotteisia ja vastustamattomia hahmoja. Ohjaaja-käsikirjoittaja Thelinin tanssijatausta taas näkyy ja kuuluu elokuvassa herkullisesti.\n\nTommi Kumén","poster":"https://hiff.fi/wp-content/uploads/airtable/eaa88736e4c28eb676d8d720383c9c4d-large.jpg","trailer_url":"https://www.youtube.com/embed/7Jt-nKUdWGA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-patron-2026/","imdb":"https://www.imdb.com/title/tt37184015/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_the%20patron"},"content_warnings":["Väkivalta"],"showing_ids":["recMDWPJR82nCPCJq","recJykMC5diGr874g","reclnFDZVsU3rwOIi","rec4BMIlnXr7NOHU3","reccpO43pp99ZAT5g"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-red-hangar","title":"The Red Hangar","original_title":"Hangar Rojo","url":"https://hiff.fi/ohjelma/the-red-hangar/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Historia uusiksi"],"keywords":["Yhteiskunta","Historia","Jännitys"],"countries":["Argentiina","Chile","Italia"],"directors":["Juan Pablo Sallato"],"cast":["Nicolás Zárate","Boris Quercia","Marcial Tagle"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K12","duration_min":83,"year":2026,"logline":"Poliittinen jännäri Chilen 1973 vallankaappauksen ensimmäisestä vuorokaudesta kertoo tarinansa moraaliseen umpikujaan ajautuvan upseerin näkökulmasta.","description_text":"Chilen sotilasvallankaappaus syyskuussa 1973 ei ala yllättäen. Ilmasotakoulun upseeristoon kuuluva sotilaskapteeni Jorge Silva (Nicolás Zárate) saa ennakkoon puhelun, jossa kehotetaan olemaan valmiina. Silva lyö luurin soittajan korvaan.\n\nVäistäminen on turhaa, sillä jo seuraavana aamuna paikan ottaa haltuunsa mies Silvan menneisyydestä. Lentokonehalliin perustetaan marxistien ”käsittelykeskus”, punainen hangaari. Silva tekee komentoketjun mukaan mitä käsketään, vaikkei missään vaiheessa myönnäkään olevansa sotilaskapinallisten puolella.\n\nJuan Pablo Sallaton draamassa väkivalta tapahtuu äärinäön ja -kuulon rajalla. Sen olemassaolo on liki automaattista ympäristössä, jossa vallankaappaus rutiininomaisesti nöyryyttää vihollisiaan niin ikkunattomissa takahuoneissa kuin avoimilla stadioneillakin.\n\nMustavalkoisen, syvätarkkaa kuvaa väistävän moraalitutkielman intensiteetistä huolehtivat lähikuvat Silvan kasvoista ja venyvät hetket, joissa kapteeni pohtii mielessään, miten toimia seuraavaksi. Pienet päätökset jo alussa vihjaavat, että oikein on mahdotonta toimia.\n\nNoin kahden vuorokauden sisään mahdutettu tarina pohjautuu elokuvassakin kokijahahmona nähtävän Fernando Villagránin kirjaan, jossa hän kertoo omista kokemuksistaan punaisessa hangaarissa.\n\nJohanna Siik","poster":"https://hiff.fi/wp-content/uploads/airtable/4c2cc77b8ab8d102c53c24e1fa39f4d2-large.jpg","trailer_url":"https://www.youtube.com/embed/XT0Dd_ZUj9g?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-red-hangar/","imdb":"https://www.imdb.com/title/tt37664358/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20red%20hanga"},"content_warnings":["Ahdistus","Väkivalta"],"showing_ids":["recfrlBopb7pW4AOD","recXOl3Y9k198WbqS","recTuYr4se5SVUL83"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-samurai-and-the-prisoner","title":"The Samurai and the Prisoner","original_title":"黒牢城","url":"https://hiff.fi/ohjelma/the-samurai-and-the-prisoner/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Epookki","Rikos","Jännitys","Kirjallisuus"],"countries":["Japani"],"directors":["Kiyoshi Kurosawa"],"cast":["Masahiro Motoki","Masaki Suda","Yuriko Yoshitaka"],"languages":["japani"],"subtitles":["englanti"],"age_rating":"K12","duration_min":147,"year":2026,"logline":"Kiyoshi Kurosawan samuraidraama yhdistää murhamysteerin psykologiseen valtapeliin Agatha Christien ja Shakespearen hengessä.","description_text":"Japanilaisen taiteellisesti kunnianhimoisen kauhun mestari Kiyoshi Kurosawa ( Cure ; Pulse , R&A 2002) tekee uuden aluevaltauksen samuraidraamallaan The Samurai and the Prisoner .\n\n1500-luvulle sijoittuva ja Honobu Yonezawan palkittuun menestysromaaniin perustuva teos on neljään vuodenaikaan jaettu epookkimysteeri. Tarina käynnistyy, kun kapinallinen samurai Araki Murashige (Masahiro Motoki) linnoittautuu Ariokan linnaan noustuaan sotaan entistä liittolaistaan, julmaa sotaherra Oda Nobunagaa vastaan. Piirityksen kiristyessä linnassa alkaa tapahtua selittämättömiä ja raakoja rikoksia, ja epätoivoinen samurai joutuu kääntymään tyrmään heitetyn vihollisstrategi Kuroda Kanbein puoleen.\n\nKurosawa muovaa historiallisesta sotaepookista hienovaraisen suljetun huoneen dekkarimysteerin, joka tihentyy Shakespearen tragedioita henkiväksi, psykologiseksi valtapeliksi. Epäluulon ja syyllisyyden mädättämät mielet ottavat yhteen, kun suljetussa linnassa alkaa levitä vainoharhaisuuden ja petoksen ilmapiiri. Linna muuttuu mikrokosmokseksi, jossa poliittinen laskelmointi, uskollisuus ja pelko syövät vähitellen yhteisön sisältäpäin.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/858b09736d023f0384ab7420de31df72-large.jpg","trailer_url":"https://www.youtube.com/embed/dY5kXykdbLo?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-samurai-and-the-prisoner/","imdb":"https://www.imdb.com/title/tt39602215/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20samurai"},"content_warnings":["Väkivalta"],"showing_ids":["recYEYYm8bihXKfJQ","rec5YTINmXEb0K1vT","recqhl32OJGLktHax"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"the-secret-reading-club-of-kabul","title":"The Secret Reading Club of Kabul","original_title":null,"url":"https://hiff.fi/ohjelma/the-secret-reading-club-of-kabul/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Fight the Power"],"keywords":["Tekstitetty/puhuttu suomeksi","Yhteiskunta","Naiskuvia"],"countries":["Norja","Suomi"],"directors":["Shakiba Adil","Elina Hirvonen"],"cast":[],"languages":["dari","paštu","englanti"],"subtitles":["suomi","ruotsi"],"age_rating":"K16","duration_min":92,"year":2026,"logline":"Järisyttävä dokumentti nuorista naisista, jotka nousevat vastarintaan perustamalla salaisen lukupiirin talibanien toisen valtaannousun jälkeisessä Afganistanissa.","description_text":"Ohjaaja Shakiba Adil syntyi vuonna 1985 tyystin erilaiseen Afganistaniin kuin missä hän eli merkityksellisen teini-iän kasvukautensa. Talibanin vuoden 1996 valtaannoususta ei lopulta opittu mitään, sillä tapahtumat toistuivat identtisen kylmäävästi 2021.\n\nTästä naisten ja tyttöjen toimijuuden järjestelmällisestä häivyttämisestä ja uskonnollisesta diktatuurista on syntynyt järisyttävä elokuva. Kahden Kabulissa elävän nuoren naisen ja yhden sitkeän kouluikäisen tytön puhelimiin tallentuneet videot, omat pohdinnot, dialogit ja tapahtumien salakuvaukset näyttävät liki toteavasti, mitä naisten kotiin sulkemisesta seuraa.\n\nPäähenkilöt eivät ole neuvottomia: yhdessä perustetaan keskustelukerho Anne Frankin päiväkirjan ympärille. Omassa arjessa opiskellaan vieraita kieliä ja treenataan tavoitteellisesti kamppailulajeja. Uskonnollisen poliisin mielestä kaikessa tässä on kyse seksistä, siis vaarallisesta asiasta ja siksi kielletystä. Saksaa opiskelevaa koululaista moinen pakkomielle väistämättä huvittaa.\n\nKotiaan kukaan naisista ei halua jättää, mutta poismuuttoa kaikki pohtivat ja jotkut sen tekevätkin. Heidän kokemuksensa kuuluvat Suomessakin viimeistään tämän dokumentin myötä, mutta kuunteleeko niitä lopulta kukaan?\n\nJohanna Siik\n\nTämä elokuva pitchattiin R&A:n ammattilaistapahtuma Finnish Film Affairissa ennen sen valmistumista.","poster":"https://hiff.fi/wp-content/uploads/airtable/4ffdb9f42c0dfb0a2bffa4a380757377-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/the-secret-reading-club-of-kabul/","imdb":"https://www.imdb.com/title/tt40754698/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20secret%20readin"},"content_warnings":["Ahdistus"],"showing_ids":["reccUbHtTHb9vOjh7"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 25.9.","status":"dated","date":"2026-09-25"},"on_yle_areena":false},{"slug":"the-station","title":"The Station","original_title":"المحطّة","url":"https://hiff.fi/ohjelma/the-station/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Fight the Power"],"keywords":["Yhteiskunta","Naiskuvia","Perhesuhteet"],"countries":["Alankomaat","Jordania","Norja","Qatar","Ranska","Saksa","Yemen"],"directors":["Sara Ishaq"],"cast":["Manal Al-Maliki","Abeer Mohammad","Rashad Alrajeh"],"languages":["arabia"],"subtitles":["englanti"],"age_rating":"K12","duration_min":112,"year":2026,"logline":"Jemeniläiset naiset kokoontuvat huoltoasemalle keskellä loppumatonta sisällissotaa. Aseman muurien sisällä hengitetään vapaasti, mutta samalla sota uhkaa hajottaa perheet.","description_text":"Sara Ishaqin debyyttifiktio kuvaa jemeniläisten naisten pyörittämää huoltoasemaa keskellä sisällissotaa. Asema on keidas, jonka muurien sisällä hengitetään vapaasti ja unelmoidaan elämästä. Toisella puolella oleminen on uhattua ja miesten kunniakäsitykset hauraita. Mutta kuinka lapsen voisi pelastaa väkivallan kierteeltä?\n\nSkotlanninjemeniläinen Ishaq aloitti uransa Jemenin kansannousua kuvaavilla dokumenteilla. The Stationin hän sijoittaa rinnakkaistodellisuuteen, jossa sisällissodan osapuolet ovat kuvitteellisia. Öljy on elokuvassa arjen elinehto, ei geopolitiikkaa.\n\nPäähenkilö Layal (Manal Al-Mulaiki) asuu pienen veljensä Laithin (Rashad Khaled) kanssa keskellä vihollisaluetta. Kotirintamalla kiristys ja korruptio rehottavat, mutta lyhyetkin henkoset vapautta kertovat, miten värikylläistä ja sointuisaa elämä voisi olla.\n\nIshaq näyttää, kuinka menetykset katkeroittavat ja sitovat vihanpitoon. Jokainen pakenisi, jos voisi. Sota on rikkonut myös Layalin suhdetta siskoonsa Shamsiin (Abeer Mohammed). Yhdessä he kuitenkin suojelevat Laithia pakkovärväykseltä. Laith on huolehtivainen, leikkisä ja mielikuvituksellinen: siitä sota vaatii häntä luopumaan valheellisen miehuuden asussa.\n\nJustus Pitkänen","poster":"https://hiff.fi/wp-content/uploads/airtable/dfc709623ab7b05c2f70d66e9b88960a-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/the-station-2026/","imdb":"https://www.imdb.com/title/tt19516714/?ref_=nv_sr_srsg_1_tt_8_nm_0_in_0_q_the%20station%202026"},"content_warnings":["Sota"],"showing_ids":["recoch5egG2LIMuSF","recBR9h2DifGBW63f","recCjfdnETkhiYGvJ","recyMH2qHeWtMl0Ni"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"their-town","title":"Their Town","original_title":null,"url":"https://hiff.fi/ohjelma/their-town/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["United States of Indie"],"keywords":["Angsti","Kasvutarina","Kaupunkitila","Matka","Mielenterveys","Ystävyys","Nuoruus"],"countries":["Yhdysvallat"],"directors":["Katie Aselton"],"cast":["Ora Duplass","Chosen Jacobs","Daveed Diggs"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":81,"year":null,"logline":"Lukionäytelmän harjoituksiin vievä nuoruuskuvaus kulkee herkkävireisesti Before-trilogian jalanjäljissä.","description_text":"Ajan kulku tuntuu pysähtyvän amerikkalaisessa pikkukaupungissa kahden teinin kohdatessa.\n\nKun high school -näytelmän tähden Abbyn (Ora Duplass) vastanäyttelijä, poikaystävä Tyler, jättäytyy pois näytelmästä, tilalle nousee lavasteiden takana viihtyvä Matt (Chosen Jacobs). Abby lupautuu auttamaan Mattia vuorosanojen kanssa. Tapaamisesta käynnistyy läpi uinuvan pikkukaupungin ulottuva öinen vaellus, jonka aikana nuoret avautuvat toisilleen.\n\nTheir Town on syntynyt perheen yhteistyönä: ohjaaja Katie Aselton ja käsikirjoittaja Mark Duplass käsittelevät teini-iän ahdistusta, epävarmuutta ja vanhempi-lapsi-suhteita ilman ylenkatsetta. Abbya herkästi esittävä Ora Duplass on tekijäpariskunnan tytär. Nuorten päänäyttelijöiden kemiassa on harvinaista aitoutta, joka tekee pienistä hetkistä suuria ja intiimejä.\n\nRichard Linklaterin Before -trilogiaa henkivä draama on herkkävireinen ja riisuttu kuvaus yhteydestä ja nuoruuden hauraudesta. South by Southwest -festarilla ensi-iltansa saanut elokuva muistuttaa, kuinka syvä voima toisen läsnäololla voi olla juuri silloin, kun maailma tuntuu olevan murroksessa.\n\nRiikka Pennanen","poster":"https://hiff.fi/wp-content/uploads/airtable/135e51477d47f534f4a3ae0cf922538e-large.jpeg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/their-town/","imdb":"https://www.imdb.com/title/tt35053810/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_their%20town"},"content_warnings":["Itsetuhoisuus","Mielenterveysongelmat"],"showing_ids":["recYSeedcFIT8r8wl","rect63SHKfU6Kdc3m","rec6qpDmaKy078QHs","reccN630zFwlDnIhL"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"three-of-a-kind","title":"Three of a Kind","original_title":"Ingen kære mor","url":"https://hiff.fi/ohjelma/three-of-a-kind/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjolan huiput"],"keywords":["Perhesuhteet","Suru","Ikääntyminen"],"countries":["Tanska"],"directors":["Charlotte Brodthagen"],"cast":["Freja Klint Sandberg","Lene Maria Christensen","Birthe Neumann"],"languages":["tanska"],"subtitles":["englanti"],"age_rating":"K7","duration_min":98,"year":2025,"logline":"Äidin ja tyttären melankolinen joulunvietto saa käänteen, kun isoäiti saapuu mökille viinipullot kainalossaan ja vuosikymmenten jännitteet nousevat pintaan.","description_text":"Parikymppinen Luis viettää joulupyhiä mökillä äitinsä Christelin kanssa. Hyggeilyä varjostaa se, että äiti on tilannut pihaan paketin, joka paljastuu hänen hautakivekseen. Hänellä on myös kova kiire käydä läpi vanhoja tavaroitaan ja viedä niitä jäteasemalle. Joulukuusikin on jäänyt hankkimatta, koska miksi kaataa puu vain hetken koristukseksi.\n\nKun paikalle karauttaa isoäiti Vivi parin viinipullon kanssa, tunnelma muuttuu välittömästi. Kolmen naissukupolven kohdatessa jännitteitä alkaa nousta esiin voimalla, jota on mahdotonta sivuuttaa. Millä tavoin naiset ovat kohdelleet toisiaan, ja mitä on jäänyt käsittelemättä? Entä voivatko kaikki todella niin hyvin kuin väittävät?\n\nTanskalaisen Charlotte Brodthagenin esikoisohjaus kuvaa herkästi ja tarkkanäköisesti taakkoja, jotka siirtyvät sukupolvelta toiselle vain näennäisesti muotoaan muuttaen. Elokuva antaa tilaa kysymyksille siitä, onko välejä mahdollista korjata ennen kuin on liian myöhäistä. Ehkä rakkaus ja kauna ovat lähempänä toisiaan kuin luulemme.\n\nTaina Vuokko","poster":"https://hiff.fi/wp-content/uploads/airtable/7afac3d08852ba09c4ba5fa8ed21e627-large.png","trailer_url":"https://www.youtube.com/embed/yBIVfM2lm_U?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/three-of-a-kind-2025/","imdb":"https://www.imdb.com/title/tt38125670/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_three%20of%20a%20kind"},"content_warnings":[],"showing_ids":["recWiGwiZVym0IogA","recjLwBULNCoFYQgx","reclAkTSJVRZQdPxe","rechV1jUzX5BAesuR","recAHF1rzcHNOvoMP"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"titanic-ocean","title":"Titanic Ocean","original_title":null,"url":"https://hiff.fi/ohjelma/titanic-ocean/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Fantasia","Identiteetti","Kasvutarina","Naiskuvia","Rakkaus","Outoa","Urheilu","Nuoruus","Ystävyys"],"countries":["Espanja","Japani","Kreikka","Ranska","Romania","Saksa"],"directors":["Konstantina Kotzamani"],"cast":["Arisa Sasaki","Melina Mardini","Haruna Matsui"],"languages":["japani"],"subtitles":["englanti"],"age_rating":"K12","duration_min":131,"year":2026,"logline":"Japanilaisessa sisäoppilaitoksessa teini-ikäiset tytöt pidättelevät hengitystään. Heistä koulutetaan merenneitoja maailman parhaisiin akvaarioihin. Voisiko joku heistä olla oikea merenneito?","description_text":"Japanilaisessa sisäoppilaitoksessa teini-ikäiset tytöt pidättelevät hengitystään. Heidän on opittava hallitsemaan keuhkojaan ja sydämensykettään, sillä heistä on tulossa fanien rakastamia merenneitoja maailman parhaisiin akvaarioihin. Kouluun tullessaan jokainen valitsee itselleen merenneitonimen, värjää hiuksensa pastelliksi ja yrittää löytää oman seireeninlaulunsa, jolla lumota yleisönsä areenoilla ja sosiaalisessa mediassa.\n\nUnenomaisessa elokuvassa koulun arkea ja valmistautumista merenneitokilpailuihin seurataan Akamen silmin, joka valitsee itselleen nimeksi Deep Sea. Ujo ja syrjäänvetäytyvä Deep Sea kipuilee erottautuakseen koulutovereistaan ja kilpakumppaneistaan. Mutta voisiko hänen seireeninlaulunsa hukuttaa merimiehiä ja vietellä haita, oikeasti?\n\nTitanic Ocean on Konstantina Kotzamanin upea esikoispitkä, joka sai ensi-iltansa Cannesin legendaarisessa Un Certain Regard -kilpasarjassa. Elokuva pakenee määrittelyjä. Maaginen realismi lienee lähimpänä, vaikka merenneitokoulu ei tunnu aivan todelliselta arjen oravanpyörään verrattuna. Se näyttää herkulliselta kuin Sofia Coppolan Marie Antoinette ja kysyy, mitä käy tytöille, joita kasvatetaan akvaarioon, kun ulkona odottaa meri.\n\nSanni Myllyaho","poster":"https://hiff.fi/wp-content/uploads/airtable/b09683689683eafdea5f97c81388422f-large.jpg","trailer_url":"https://www.youtube.com/embed/7rQnibjmPDc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/titanic-ocean/","imdb":"https://www.imdb.com/title/tt15437998/?ref_=nv_sr_srsg_0_tt_3_nm_0_in_0_q_titanic%20ocean"},"content_warnings":["Kehon arvostelu"],"showing_ids":["recmFKUjYMQ0hfRyj","recnMKDS25RfeBA4M","reciXURkRaJxHsSse","rec4YLTDqdDHkCxpb"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"trial-of-hein","title":"Trial of Hein","original_title":"Der Heimatlose","url":"https://hiff.fi/ohjelma/trial-of-hein/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Outouden laakso"],"keywords":["Identiteetti","Outoa","Muisti","LGBTQIA+","Perhesuhteet"],"countries":["Saksa"],"directors":["Kai Stänicke"],"cast":["Paul Boche","Stephanie Amarell","Philip Froissant"],"languages":["saksa"],"subtitles":["englanti"],"age_rating":"K12","duration_min":122,"year":2026,"logline":"Palattuaan lapsuudenkotiinsa Hein joutuu kafkamaiseen oikeudenkäyntiin, jossa hänen täytyy todistaa olevansa osa kyläyhteisöä, joka vaikuttaa unohtaneen hänet.","description_text":"14 vuotta sisämaassa viettänyt Hein palaa kotisaarelleen, missä häntä odottaa kylmä vastaanotto: kyläyhteisö omia perheenjäseniä myöten ei tunnista tai myönnä tunnistavansa häntä. Päästäkseen osaksi yhteisöä Heinin tehtäväksi tulee todistaa olevansa se, joka väittää olevansa. Hein vain muistaa lapsuutensa eri tavoin kuin kyläläiset, jotka määrittelevät menneisyyttä mielivaltaisella tavalla.\n\nElokuva käsittelee historiaa ja sitä, kenellä on valta määritellä se. Yhteisön selviämisen kannalta sen yhteinen muisti on äärimmäisen tärkeä, sillä ilman yhteistä muistia, yhteistä historiaa, ei ole mitään yhteisöä. Totuudella, jos sellaista edes on, ei ole väliä, jos omaa ryhmää täytyy suojella kuvitellultakin viholliselta. Elokuvan erinomainen lavastus näyttää yhteisön keinotekoisuuden ja haurauden. Kylää ylläpitävät heppoiset rakenteet jotka tarjoavat suojaa vain, koska niiden uskotaan tarjoavan suojaa.\n\nHaneken Valkoiselle nauhalle (2009) sukua oleva Trial of Hein punoo tyylikkäästi yhteen ajankohtaisia teemoja liittyen Euroopan poliittiseen tilanteeseen, mutta myös yksilöiden erilaisiin rooleihin pienemmässä mittakaavassa: ketkä ovat valmiita pitämää yllä mitäkin kulisseja ja miksi?\n\nAnna Jolma","poster":"https://hiff.fi/wp-content/uploads/airtable/4410371f2a519148868af1c534ba8b6d-large.jpg","trailer_url":"https://www.youtube.com/embed/7raKJKp46Z0?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/trial-of-hein/","imdb":"https://www.imdb.com/title/tt33522697/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_trial%20of%20hein"},"content_warnings":[],"showing_ids":["recj0AZPeYvoBNag4","recDNBttIvnSvATH5","recWKUDDzUmYtzh84"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"truly-naked","title":"Truly Naked","original_title":null,"url":"https://hiff.fi/ohjelma/truly-naked/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Let's Talk about Sex"],"keywords":["Seksi","Kasvutarina","Nuoruus","Rakkaus","Perhesuhteet"],"countries":["Alankomaat","Belgia","Iso-Britannia","Ranska"],"directors":["Muriel d’Ansembourg"],"cast":["Andrew Howard","Lyndsey Marshal","Juliet Aubrey"],"languages":["englanti"],"subtitles":["englanti"],"age_rating":"K16","duration_min":102,"year":2026,"logline":"Introvertti teini työskentelee isänsä amatööripornobisneksessä, mutta päätyy uudenlaisen intiimiyden äärelle ärhäkän koulutoverinsa kanssa.","description_text":"Millaista on oppia seksuaalisesta suostumuksesta ja terveellisestä intiimiydestä maailmassa, jossa seksuaalisuutta tuotteellisettaan ja performoidaan? Sisäänpäin suuntautunut ja seksuaalisesti kokematon Jamie viettää päivänsä kuvaten isänsä matalan budjetin pornotuotantoja, joissa tämä myös esiintyy.\n\nRaa’an rehellisesti roolinsa esittävä Cameron James-King näyttelee merenrantakaupungissa kasvanutta Jamieta. Hän yrittää pitää kaksoiselämäänsä poissa katseilta siinä kuitenkaan kovin hyvin onnistumatta. Sen sijaan hän löytää itsensä jumista kahden ihmisen välillä: hänen isänsä elokuvissa näyttelevän Lizzien (Alessa Savage, oikea pornonäyttelijä), joka on ottanut eräänlaisen isosiskon roolin, sekä hänen luokkakaverinsa Ninan (maaginen Safiya Bennaddi), jonka itsenäisyys ja karisma saavat Jamien kyseenalaistamaan kaikkea tietämäänsä. Jamiella on vaikeuksia navigoida oman henkisen ja seksuaalisen heräämisensä kanssa ympäristössä, jossa seksi on jatkuvasti lavastettua ja näyteltyä, mutta todellinen intiimiys ei koskaan ota täyttä muotoaan.\n\nElokuvan provokatiivinen alkuasetelma kehittyy yllättävän herkäksi ja häiritseväksi kasvutarinaksi, jossa porno ei ole lopulta aihepiirinä keskeinen. Todellinen huomion keskipiste on Jamien haavoittuvainen sisäinen maailma ja sävykäs emotionaalinen kehitys. Päähenkilöä ei yksinkertaisteta olosuhteidensa uhriksi, vaan elokuva onnistuu reflektoimaan pornoteollisuuden tapoja rakentaa miehistä katsetta ja sitä, miten näitä malleja sisäistetään ja toistetaan, sekä kuinka niitä voidaan myös kyseenalaistaa ja purkaa.\n\nDiego Ginartes Rodríguez (kääntänyt Johanna Järvinen)","poster":"https://hiff.fi/wp-content/uploads/airtable/3d369ad46548b1093e450bf8805f2a55-large.jpg","trailer_url":"https://www.youtube.com/embed/c-2G-drcASo?feature=oembed","links":{"letterboxd":"https://let elly Reichardtin ja Hong Sang-soon ystävien makuun. Rauhallinen, mutta määrätietoisesti etenevä; kuin raukea kotimatka luotetun kyydissä. Elokuva romantikoille ja elokuvaromantikoille.\n\nJa tätä elokuvan hahmot eivät tiedä, Miyake tietää, ja sinä ymmärrät pian: karpin saa vain tyhjentämällä lammen.\n\nJimi Rosling","poster":"https://hiff.fi/wp-content/uploads/airtable/70ebcc4725dcc34730a66507c3e04baf-large.jpg","trailer_url":"https://www.youtube.com/embed/lC0xyNHI5fc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/two-seasons-two-strangers/","imdb":"https://www.imdb.com/title/tt37538491/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_two%20seasons%20"},"content_warnings":[],"showing_ids":["recVKlpIhggWwPwf1","recumvvVggDABhnpH"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 9.10.","status":"dated","date":"2026-10-09"},"on_yle_areena":false},{"slug":"we-are-aliens","title":"We Are Aliens","original_title":"我々は宇宙人","url":"https://hiff.fi/ohjelma/we-are-aliens/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio"],"themes":["Animoituja unia"],"keywords":["Kasvutarina","Ystävyys","Angsti","Nuoruus","Muisti"],"countries":["Japani","Ranska"],"directors":["Kohei Kadowaki"],"cast":["Ryota Bando","Amane Okayama","Ten Yamasaki"],"languages":["japani"],"subtitles":["englanti"],"age_rating":"K16","duration_min":117,"year":2026,"logline":"Realistisesta surrealistiseen liukuva japanilaiselokuva yhdistää erilaisia animaatiotyylejä kertoessaan tarinan kahden pojan ystävyydestä ja sen rikkoutumisesta.","description_text":"Kolmannella luokalla Tsubasa ystävystyy Gyotaron kanssa. Siinä missä Tsubasaa vaivaa näkymättömyyden tunne, Gyotaron omalaatuisuus tekee hänestä luokkatovereidensa ihailun kohteen. Eroistaan huolimatta heidän ystävyytensä kukoistaa ja täyttää kesäpäivät seikkailuilla.\n\nVähitellen erimielisyydet hiipivät poikien leikkeihin, ja lopulta väärinymmärryksen ja petoksen kohtalokas tapahtumaketju repii heidät erilleen. Vaikka ystävyys särkyy, syyllisyys ja hämmennys tapahtuneesta seuraavat heitä aikuisuuteen.\n\nHenkeäsalpaava teos yhdistää 2D-animaatiota ja rotoskooppausta, jossa hahmot animoidaan näyttelijöiden päälle. Animaatio lipuu realismista unenomaiseen, jopa painajaismaisen surrealistiseen.\n\nWe Are Aliens on vuosikymmenten yli ulottuva kasvutarina siitä, miten jatkaa elämää, kun anteeksipyynnön hetki on hukattu. Kadowakin esikoispitkä on intiimi kuvaus lapsuuden konflikteista ja ihmisen arkisesta julmuudesta. Se vangitsee vaikuttavasti ulkopuolisuuden kokemuksen ja kyvyttömyyden päästää irti menneisyydestä. Lapsuuden ja aikuisuuden sekä hahmojen näkökulmien välillä liikkuva kerronta paljastaa muistojen subjektiivisuuden ja tuo mieleen Kore-edan mestarillisen Monsterin (R&A 2023). Riipivä kokonaisuus avautuu katsojalle vähitellen.\n\nAnni Rossi","poster":"https://hiff.fi/wp-content/uploads/airtable/1f931cdff2484ffc0d6db9c19e89cbab-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/we-are-aliens-2026/","imdb":"https://www.imdb.com/title/tt41830798/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_we%20are%20aliens"},"content_warnings":["Koulukiusaaminen","Kiusaaminen","Mielenterveysongelmat","Syrjintä","Piikit"],"showing_ids":["recCnvxyzK4LWCW8o","recus4l6i1DeJIQVE","recaFpC87Qj6hGWAJ"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"we-are-all-strangers","title":"We Are All Strangers","original_title":"我们不是陌生人","url":"https://hiff.fi/ohjelma/we-are-all-strangers/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["Perhesuhteet","Rakkaus","Yhteiskunta","Media"],"countries":["Australia","Singapore"],"directors":["Anthony Chen"],"cast":["Yeo Yann Yann","Koh Jia Ler","Andi Lim"],"languages":["mandariinikiina","englanti","kiina"],"subtitles":["englanti"],"age_rating":"K12","duration_min":157,"year":2026,"logline":"Singaporen hulppeisiin pilvenpiirtäjiin, vilkkaisiin kauppahalleihin ja ahtaisiin asuntoihin vievä rikas perhedraama ui tragedioiden ja unelmien välissä.","description_text":"Jotkut elokuvat ovat kuin elämä itse, yhtä luontevasti polveilevia. Niiden henkilöt ja tapahtumapaikat tuntuvat läheisiltä, vaikka kuinka vieraissa ympäristöissä oltaisiin, ja tarinat soljuvat kuin itsestään kohti jotain, jonka vuoksi kyseistä elokuvaa on lähdetty tekemään. Niillä on tarkoitus eikä niissä ole mitään pakotettua eikä teennäistä. Anthony Chenin kirjoittama ja ohjaama We Are All Strangers on sellainen elokuva.\n\nSingaporelaisen ruokabaarin pitäjä on ihastunut tarjoilijaansa. Baarin pitäjän poika on vuorostaan ihastunut katolisen kasvatuksen saaneeseen, paremmista oloista lähtöisin olevaan tyttöön. Pian käy niin, että nämä parit menevät kumpikin naimisiin ja alkavat asua pojan isän luona, saman katon alla, sillä asuminen on Singaporessa kallista.\n\nSyntyy pieni poika. Viisikon yhteiselo ei ole kivutonta, mutta rauhalliset kohtaukset eivät juurikaan sisällä draamaa. Elämä kantaa aina lopulta. Kamera taltioi Singaporen maisemia ja ihmisten toimia, ja juoni kuljettaa ahkeran isän saamatonta poikaa kohti aikuisuutta ja eriparista nelikkoa arvostamaan toisiaan.\n\nKaikki päättyy juuri silloin ja siten kuin tämän tarinan kuuluukin, ja lopputekstien alle jää soimaan Cat Stevensin puhutteleva laulu ”Father and Son”.\n\nJaana Semeri","poster":"https://hiff.fi/wp-content/uploads/airtable/ff14fc2fe06b02f902cbd32c91900455-large.jpg","trailer_url":"https://www.youtube.com/embed/RmBVnpJIRBw?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/we-are-all-strangers/","imdb":"https://www.imdb.com/title/tt13848364/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_we%20are%20all%20str"},"content_warnings":["Sairaus","Kuolema"],"showing_ids":["recw902w3t2iX5hWb","rec1G5y5gSGvEep2l","rec2rqWhXgX4IY2nO","recs0up2kOM22CQBu"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"yesterday-the-eye-didnt-sleep","title":"Yesterday the Eye Didn't Sleep","original_title":"البارح العين ما نامت","url":"https
