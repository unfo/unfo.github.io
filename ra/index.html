wp-content/uploads/airtable/54e8b0ba515f17c3e1a5140f7620e34b-large.jpg","trailer_url":"https://www.youtube.com/embed/1xl-rhEt7Vo?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/benimana/","imdb":"https://www.imdb.com/title/tt38820979/?ref_=nv_sr_srsg_0_tt_4_nm_4_in_0_q_ben%27imana"},"content_warnings":["Ahdistus","Kansanmurha","Väkivalta","Seksuaalinen väkivalta"],"showing_ids":["recD6hIdvL2j6DYAU","reckKLe8XnlrK2Iqa","recgmQOz6qjFlL4NM"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"birita","title":"Birita","original_title":null,"url":"https://hiff.fi/ohjelma/birita/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Pohjoismaiden neuvoston elokuvapalkintoehdokkaat"],"keywords":["Muisti","Perhesuhteet","Taide","Ikääntyminen"],"countries":["Färsaaret","Tanska"],"directors":["Búi Dam"],"cast":[],"languages":["Faroese"],"subtitles":["englanti"],"age_rating":"S","duration_min":89,"year":2025,"logline":"Färsaarelaisessa dokumentissa Alzheimerin tautia sairastava näyttelijä valmistautuu teatteriperheensä kanssa viimeiseen Shakespeare-rooliin.","description_text":"Färsaarelainen jo eläköitynyt veteraaninäyttelijä Birita Dam valmistautuu vielä yhteen esitykseen: hänen ja hänen teatteriperheensä tarkoituksena on esittää Shakespearen Kuningas Lear tämän dokumenttielokuvan ohjaajan Búi Damin ohjauksessa.\n\nNäytelmään valmistautumisen haasteena on Biritan terveydentila. Hän sairastaa Alzheimerin tautia, minkä vuoksi sana ”tarkoitus” on hänen tilanteessaan hankala. Jotta ihmisellä voi olla tarkoitus tehdä jotain, tulee hänellä olla myös tahto. Missä määrin ihmisellä, joka ei täysin tiedosta olevansa maskeeraushuoneessa valmistautumassa näytelmään, voi olla tahto esittää yhtään mitään? Toimivatko hänen puolisonsa ja poikansa eettisesti järjestäessään näytelmän, jonka pääosassa on ihminen, joka ei kykene muistamaan vuorosanojaan? Búi sanoo intuitiivisesti tietävänsä, että hänen äitinsä tahtoo olla lavalla. Biritan puoliso puolestaan muistaa Biritan sanoneen ennen sairastumistaan, ettei halua enää koskaan esiintyä.\n\nBiritan esittämiin eettisiin kysymyksiin ei yritetä vastata tässä elokuvassa, vaan elokuva toimii enemmänkin keskustelunavauksena. Kun elokuvassa pysähdytään hetkittäin ihastelemaan Färsaarten jylhää luontoa, on katsojilla mahdollisuus hiljentyä pohtimaan elämän ja identiteetin haurautta.\n\nHerman Tikkanen","poster":"https://hiff.fi/wp-content/uploads/airtable/c71e7cd7eba8e33500249933073636fc-large.jpg","trailer_url":"https://www.youtube.com/embed/le0n23_SnrY?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/birita/","imdb":"https://www.imdb.com/title/tt38937597/?ref_=nv_sr_srsg_0_tt_2_nm_6_in_0_q_birita"},"content_warnings":["Sairaus"],"showing_ids":["rec3wW8ii9ZTU5Ved","reckGjOHgq0Y7iqSs","reciLbQGOs0g44aWp","recvNWOytkLMR9w2w"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"blue-film","title":"Blue Film","original_title":null,"url":"https://hiff.fi/ohjelma/blue-film/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Let's Talk about Sex"],"keywords":["Rikos","LGBTQIA+","Seksi","Angsti","Muisti"],"countries":["Yhdysvallat"],"directors":["Elliot Tuttle"],"cast":["Reed Birney","Kieron Moore"],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":85,"year":null,"logline":"Tabuja rikkovassa psykologisessa draamassa nuori seksityöntekijä viettää yön vanhemman asiakkaan kanssa ja paljastuu, että miehillä on synkkä yhteys vuosien takaa.","description_text":"Parikymppinen Aaron Eagle (Kieron Moore) on webkameran edessä alushoususillaan machoileva camboy. Hän lupautuu viettämään yön anonyymin katsojansa (Reed Birney) kanssa, joka tarjoaa illasta poikkeuksellisen suurta palkkiota. Mies avaa Aaronille oven ensin hiihtopipo päässä, mutta pian käy ilmi, että miehet tuntevat toisensa pitkän ajan takaa. Synkkä yhteinen historia johdattaa illan yön mittaiseksi tunnustukseksi, jossa fetissi, fantasia ja trauma sulautuvat toisiinsa.\n\nBlue Film on intiimi ja vaativa psykologinen draama, joka rakentuu lähes kokonaan kahden näyttelijän intensiiviselle dialogille. Indie-elokuva ottaa mallia aikaisemmista psykoseksuaalisten elokuvien klassikoista, ja varsinkin Catherine Breillatin vaikutteet ovat vahvasti läsnä. Katsojan moraalikäsityksiä koetellaan, eikä elokuva tarjoile helppoja vastauksia. Pohjimmillaan elokuva kertoo häpeästä, hyväksikäytöstä ja yksinäisyydestä.\n\nKiistanalainen elokuva on ollut monille elokuvafestivaaleille liian kontroversiaali. Elliot Tuttlen esikoispitkä on osoitus siitä, että queer-elokuva voi edelleen olla aidosti transgressiivista ja yhteiskunnallisia normeja haastavaa.\n\nOliver Tomar","poster":"https://hiff.fi/wp-content/uploads/airtable/3790aeb3842cc9550d673aac636e4d01-large.jpg","trailer_url":"https://www.youtube.com/embed/oZI8G4lfbgc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/blue-film-2025/","imdb":"https://www.imdb.com/title/tt34915693/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_blue%20film"},"content_warnings":["Pedofilia","Ahdistus","Seksuaalinen hyväksikäyttö","Seksuaalinen kuvasto","Homofobia"],"showing_ids":["recrFyYDd1rLYal0B","recaSeQiE5PhHmTz7","recghFQPaRwWnQEhk"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"blue-heron","title":"Blue Heron","original_title":null,"url":"https://hiff.fi/ohjelma/blue-heron/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Kids These Days"],"keywords":["Perhesuhteet","Angsti","Kasvutarina","Mielenterveys","Muisti","Suru","Tekstitetty/puhuttu suomeksi"],"countries":["Kanada","Unkari"],"directors":["Sophy Romvari"],"cast":["Eylul Guven","Iringó Réti","Ádám Tompa","Edik Beddoes","Amy Zimmer"],"languages":["englanti","unkari"],"subtitles":["suomi","englanti"],"age_rating":"K7","duration_min":91,"year":2025,"logline":"Kahdeksanvuotiaan Sashan isoveli oireilee vakavasti perheen muutettua Vancouverinsaarelle. Omaelämäkerrallinen esikoiselokuva on koskettavan kaunis kuvaus muistamisesta, surusta ja lapsuudesta.","description_text":"On kuuma kesä 90-luvulla. Pihalla lapset juoksevat sadettimen alla, televisiossa pyörivät piirretyt ja olohuoneen nurkassa raksuttaa isän valtava tietokone. Kahdeksanvuotiaan Sashan unkarilainen uusperhe on juuri muuttanut uuteen kotiin Kanadan Vancouverinsaarilla. Lapsuuden kesän yllä roikkuu kuitenkin tumma sävy, kun perheen nuorimmainen Sasha seuraa tarkkaan isoveljensä Jeremyn vaikeaa oireilua. Jeremy on arvaamaton, sulkeutunut ja uhkaava – ja vanhemmat ovat neuvottomia hänen kanssaan. Koko koti muuttuu kriisialueeksi, eikä naapurin kavereita olisi sopivaa kutsua kylään. Perheen sisäiset kamppailut nähdään lapsen huolestuneesta epätietoisuudesta käsin. Katse Jeremyyn on kuitenkin kaiken aikaa rakastava.\n\nLyhytelokuvillaan mainetta niittänyt Sophy Romvari jatkaa varmaa henkilökohtaista linjaansa ensimmäisen pitkän elokuvansa kanssa. Kahta aikatasoa sekoittava Blue Heron onnistuu kauniin vähäeleisesti kuvaamaan muistamisen haurautta. Aikuisena Sashasta on kasvanut elokuvantekijä, joka yrittää edelleen ratkaista veljensä arvoitusta. Vanhat kotivideot, psykologiset selitysmallit tai omat muistot voivat lopulta tarjota vain välähdyksiä toisen ihmisen ymmärtämiseen. Elokuva toimii kuin muisti – myös kaikessa rajallisuudessaan.\n\nMartta Tuppurainen","poster":"https://hiff.fi/wp-content/uploads/airtable/3ab283fb1556f0f5ca9c32ebbaf053ed-large.png","trailer_url":"https://www.youtube.com/embed/JeWg8wUlQVo?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/blue-heron/","imdb":"https://www.imdb.com/title/tt32252801/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_blue%20heron"},"content_warnings":["Kuolema"],"showing_ids":["recIS1ocuM7EWJ76z","recZkBYnOHLCtjORc"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"bouchra","title":"Bouchra","original_title":null,"url":"https://hiff.fi/ohjelma/bouchra/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio","Dokumentti","Animaatio"],"themes":["Animoituja unia"],"keywords":["Eläimet","Kaupunkitila","LGBTQIA+","Muisti","Naiskuvia","Perhesuhteet","Rakkaus","Seksi","Elokuvanteko","Afrikka","Nuoruus"],"countries":["Italia","Marokko","Yhdysvallat"],"directors":["Orian Barki","Meriem Bennani"],"cast":["Meriem Bennani","Orian Barki","Fayçal Azizi"],"languages":["englanti","ranska","arabia"],"subtitles":["englanti"],"age_rating":"K16","duration_min":83,"year":2025,"logline":"Queer arthouse-animaatio kertoo tarinan marokkolaisen kojootin yrityksistä rakentaa elämäänsä New Yorkissa.","description_text":"Bouchra on kertomus kolmekymppisestä nimihenkilöstään, joka on jo vuosia rakentanut omannäköistä elämää New Yorkiin. Elokuvantekijän uraan ja ihmissuhdeviritelmiin liittyvien arkisten hankauksien alla kytee isompia ja kipeämpiä kysymyksiä lesbo- ja maahanmuuttajaidentiteetin yhteensovittamisesta omien juurien kanssa. Keskiöön nousee suhde synnyinmaa Marokossa asuvaan äitiin. Lopputuloksena on coming-of-age-tarina, jossa päähenkilö löytää tukevasti omassa identiteetissään seisovan aikuisen itsensä.\n\nHenkilöhahmot esitetään antropomorfisina eläiminä, ja hahmojen äänet saavat kodikseen esimerkiksi kojootin, lehmän ja karhun kehon. Animaation, live action -kuvan ja hybrididokumentin yhdistelmä on läpikotaisin luova ja leikkisä. Moniulotteinen, moderni aikuisten taideanimaatio on erittäin cool, queer ja meta.\n\nTekijät Meriem Bennani ja Orian Barki tulivat tunnetuiksi pandemia-aikaan Instagramissa julkaistun ja isoksi viraalihitiksi nousseen lyhytanimaatiosarja 2 Lizardsin myötä. Bouchra sijoittuu sarjan kanssa samaan universumiin.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/7db5853d95b8c96c7186aa3cd4d03838-large.jpg","trailer_url":"https://www.youtube.com/embed/-m302Kq_FG4?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/bouchra/","imdb":"https://www.imdb.com/title/tt36543744/?ref_=nv_sr_srsg_0_tt_1_nm_7_in_0_q_bouchra"},"content_warnings":["Homofobia","Seksuaalinen kuvasto"],"showing_ids":["recNpmL87aqm38MHM","recRgqQirWmCsPXyw","rec3yqpmMTszPt4Du","recKwu6aaxqduDwYp"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"brunssinaytos-a-womans-life","title":"Brunssinäytös: A Woman's Life","original_title":"La vie d'une femme","url":"https://hiff.fi/ohjelma/brunssinaytos-a-womans-life/","is_film":false,"event_types":["tapahtumat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Rakkaus","Perhesuhteet","Naiskuvia","Badass","Feelgood","LGBTQIA+"],"countries":["Ranska"],"directors":["Charline Bourgeois-Tacquet"],"cast":["Léa Drucker","Mélanie Thierry","Charles Berling"],"languages":["ranska"],"subtitles":["englanti"],"age_rating":"K12","duration_min":129,"year":2026,"logline":"Elämänmakuinen ja romanttinen ranskalaiselokuva A Woman's Life nähdään R&A:n brunssinäytöksessä. Buffetmuotoinen brunssi tarjoillaan klo 12.00, ja elokuva alkaa klo 12.30.","description_text":"Kirurgi, puoliso, rakastaja. Tytär, sisko, huoltaja, esihenkilö. Ystävä, idoli. Naisella on monta roolia ja monta vastuuta, ainakin jos hän on Gabrielle (Léa Drucker), päähenkilö Charline Bourgeois-Tacquetin hengästyttävässä uutukaisessa A Woman’s Life . Nimensä mukaisesti elokuva avaa yhden naisen elämää yhdessä ajassa.\n\nBourgeois-Tacquetin tuore filmi on ranskalainen draama, jossa puhutaan, tavataan ja kosketaan. Hahmot piirtyvät esiin vuorovaikutuksen kautta ja se, kuka on kuka, kuuluu sanotussa. Välillä on alastomuutta, usein paljon monimutkaisia tunteita. Yhdessä kohtauksessa voi vilistä sävyjä kiintymyksestä kismitykseen ja himosta häiritsevään käytökseen. Elämän ja reaktioiden kirjo on alati läsnä.\n\nNimenomaan ihmissuhteet koostavat tämän elokuvan ja Gabriellen vikoineen ja vahvuuksineen. Kohtaaminen kohtaamiselta esiin viiltyy tinkimätön nainen, joka vaatii paljon sekä itseltään että toisilta. Vastuut kertyvät hänen harteilleen, mutta ottaako hän ne itse vai kasaavatko niitä toiset? Voiko hänen tapaansa elää vai tulisiko tehdä toisin? Jokainen sivuhahmo näyttää oman otoksensa Gabriellesta. Kuten elämässä, tässä elokuvassakin se, miten kohtaa muut, antaa ihmisestä tarkimman kuvan.\n\nSusanna Puomio\n\nRakkautta & Anarkiaa -leffabrunssin herkut ovat kasvisruokaa (lakto-ovo-vege) ja vähälaktoosisia. Mikäli sinulla on muita ruoka-aineallergioita, laitathan sähköpostia otsikolla ”brunssinäytös 19.9. erikoisruokavalio” tai ”brunssinäytös 26.9. erikoisruokavalio” 7 vrk ennen tapahtumapäivää osoitteeseen teatteri@gilda.fi ja huomioimme toiveesi.","poster":"https://hiff.fi/wp-content/uploads/airtable/a023c29363afbbf0924ab7c0408af061-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/a-womans-life-2026/","imdb":"https://www.imdb.com/title/tt39299437/"},"content_warnings":[],"showing_ids":["recbIUl11UJ7QZ7KD"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"brunssinaytos-the-dance-club","title":"Brunssinäytös: The Dance Club","original_title":null,"url":"https://hiff.fi/ohjelma/brunssinaytos-the-dance-club/","is_film":false,"event_types":["tapahtumat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Feelgood","Tanssi","Mielenterveys","Huumori"],"countries":["Ruotsi"],"directors":["Lisa Langseth"],"cast":["Nils Wetterholm","Alva Bratt","Matias Varela","Julia Franzén"],"languages":["ruotsi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":129,"year":2025,"logline":"Kepeä ja musiikin täyttämä draamakomedia The Dance Club nähdään R&A:n brunssinäytöksessä. Buffetmuotoinen brunssi tarjoillaan klo 12.00, ja elokuva alkaa klo 12.30.","description_text":"Kun kovien tulostavoitteiden alla tehtaillaan lääketieteellisiä diagnooseja, saadaan suurempi tuotto sairaiden ihmisten kustannuksella. Toisaalta, jos tuntee arvoristiriitaa tällaisen työpaikan kanssa, on toki mahdollista kokeilla uusia hoitokeinoja työnantajan selän takana.\n\nEräänä lauantaiaamuna tilaisuus tekee kallonkutistajan, kun klinikalle pelmahtaa henkilöautoon mahtuva määrä rikkinäisiä sieluja. Harjoitteluaan suorittava psykologian opiskelija Johannes on ainoa henkilö paikalla, ja hän päättää tarjota apuaan. Yhdessä salaperäisen ja yhtä lailla hoitoihin pettyneen Rakelin kanssa hän päätyy hoitamaan potilaita tanssiterapialla. Tanssiryhmän kasvaessa Johanneksella on vaikeuksia pitää ohjakset käsissään, ja vertaistukea riittää siihen asti, mihin muiden rajat päättyvät.\n\nOhjaaja Lisa Langsethin ( Euphoria , R&A 2018; Rakkaus ja anarkia -tv-sarja) comeback-elokuva voi näkökulmasta riippuen olla joko psykologinen komedia tai komedia psykologiasta. Hauskaan musiikkielokuvaan on ympätty vauhtia, romantiikkaa sekä ripaus yhteiskuntakritiikkiä. Katsojalleen The Dance Club näyttää, että ainakin elokuvissa mieleen pesiytyneet peikot ja demonit voi manata pois tanssimalla.\n\nOmar Fasolah\n\nRakkautta & Anarkiaa -leffabrunssin herkut ovat kasvisruokaa (lakto-ovo-vege) ja vähälaktoosisia. Mikäli sinulla on muita ruoka-aineallergioita, laitathan sähköpostia otsikolla ”brunssinäytös 19.9. erikoisruokavalio” tai ”brunssinäytös 26.9. erikoisruokavalio” 7 vrk ennen tapahtumapäivää osoitteeseen teatteri@gilda.fi ja huomioimme toiveesi.","poster":"https://hiff.fi/wp-content/uploads/airtable/e2ac76775e42bcb94b5ecf02b5669453-large.jpg","trailer_url":"https://www.youtube.com/embed/RtNBHTlMUxM?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-dance-club/","imdb":"https://www.imdb.com/title/tt33269715/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_the%20dance%20club"},"content_warnings":[],"showing_ids":["rec1xjxQgZaRe5lfd"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"california-schemin","title":"California Schemin'","original_title":null,"url":"https://hiff.fi/ohjelma/california-schemin/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Musiikin voima"],"keywords":["Musiikki","Feelgood","Ystävyys","Huumori"],"countries":["Iso-Britannia","Yhdysvallat"],"directors":["James McAvoy"],"cast":["Séamus McLean Ross","Samuel Bottomley","Lucy Halliday","Rebekah Murrell","James McAvoy"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":107,"year":2025,"logline":"Skottiräppärit alkavat esiintyä kalifornialaisina saadakseen uransa lentoon. James McAvoyn hillitön debyyttiohjaus perustuu tositapahtumiin.","description_text":"”Haluatko olla uusi Eminem?” kysytään musiikkilehden ilmoituksessa. Skotlantilaiset kaverukset Gavin ja Billy sanovat kyllä. He ovat amatööriräppäreitä, jotka eivät saa uraansa alkuun skotlantilaisia karsastavassa Englannissa. Kotipuolessa heidän haaveensa saavat silmät pyörimään, Lontoon koe-esiintymisissä heidän skottiaksenttinsa naurattaa tuomareita. Hetken ideasta kasvaa suunnitelma: he alkavat näytellä amerikkalaisia räppäreitä saadakseen ansaitsemaansa uskottavuutta. Pian ”Brains” ja ”Silibili” ovat Lontoossa levytuottaja Anthonyn (James MacAvoy) siipien alla, matkalla kohti rahaa ja mainetta. Valheella on kuitenkin pitkät jäljet, ja epäaitouden paino koettelee miesten välistä ystävyyttä pahemman kerran.\n\nMuotisana ”huijarisyndrooma” ei ole koskaan ollut yhtä käsinkosketeltava kuin tätä tositarinaa seuratessa. California Schemin’ on iloinen sekoitus genrejä: se on tummasävyinen komedia, puhdas musiikkielokuva, raastavan inhimillinen draama, ajoittain jopa jännäri. Rapin ystäville se on puhdasta iloa. Monipuolisen elokuvan eri kerroksia yhdistää inhimillinen kertomus ystävyydestä, kunnianhimosta ja valheen luomasta painolastista.\n\nErityisesti elokuva on esikoisohjaaja James McAvoyn rakkauskirje Skotlannille, jonka erikoiset hahmot, huumori ja rohkea elämänasenne järisyttävät tarttuvien säkeiden ja biittien kautta elokuvateatterin seiniä sekä katsojaa luihin ja ytimiin.\n\nJoonas Kallonen","poster":"https://hiff.fi/wp-content/uploads/airtable/563f74fde6380a66122b953d0a562dd2-large.jpg","trailer_url":"https://www.youtube.com/embed/oUTSyu4Ovcc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/california-schemin/","imdb":"https://www.imdb.com/title/tt29549490/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_california%20sche"},"content_warnings":[],"showing_ids":["recTh9e9VNj6SC8Tq","recKnq1f3RvJXdYxb","recrIcy0G9UL9ahsk"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"cambodian-beer-dreams","title":"Cambodian Beer Dreams","original_title":"Cambodianske øldrømme","url":"https://hiff.fi/ohjelma/cambodian-beer-dreams/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Asian Cuts"],"keywords":["Yhteiskunta","Kaupunkitila"],"countries":["Ranska","Ruotsi","Tanska"],"directors":["Laurits Nansen"],"cast":[],"languages":["khmer","englanti"],"subtitles":["englanti"],"age_rating":"K16","duration_min":82,"year":null,"logline":"Hurja dokumentti Kambodžan sääntelemättömästä alkoholikulttuurista, olutfirmojen ruokkimasta korruptiosta sekä ryyppäyskulttuurin myymistä unelmista.","description_text":"Kambodžassa ei ole alkoholilainsäädäntöä, mutta on villi bilekulttuuri isoine yleisökilpailuineen. Arkena juhlimisen mainonta, sekä suora että nuorisolle myytyihin mielikuviin piilotettu, tulevat joka kulman takaa vastaan. Ylikansallisella Carlsberg-konsernilla on varaa pelata likaista peliä, lakaista kilpailijoitaan maton alle ja hyväksikäyttää työntekijöitään raa’alla tavalla. Myös paikalliset toimijat haluavat apajille yrittäen saada yhä nuoremmista juhlijoista uusia asiakkaita ronskeja keinoja käyttäen. Aktivisti Kim Eng yrittää parhaansa mukaan lobata maalle uutta reilumpaa alkoholilakia, mutta saa kokea vain taka-askelia.\n\nHurja dokumentti käsittelee kaakkoisaasialaisen näkökulman kautta alkoholikulttuurin vaikutuksia ja olutfirmojen syviä lonkeroita viihdeteollisuuteen, korruption vaikutusta yhteiskunnan taantumiseen sekä uuskolonialistista kapitalismia ja sen myymiä unelmia.\n\nDokumentti viihtyy niin vallan kamareissa kuin valtavissa katubileissäkin ja ajelehtii neonvalaistujen katujen mainosvaloissa. Humoristisemmalla puolella nähdään olutsponssin saaneen Voice of Cambodia -formaattiviihdeohjelman esityksiä. Kuinka kamppailla korruptoituneita olutjättejä vastaan, kun näillä on pohjaton budjetti muokata ihmisten mielihaluja siihen pisteeseen, että ölperiä lahjoitetaan avoimesti laatikoittain niin hallinnolle kuin poliisivoimillekin?\n\nPaavo Ihalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/acafd475472c43ae29075e0396b15e3c-large.jpg","trailer_url":"https://player.vimeo.com/video/1140492111?dnt=1&app_id=122963","links":{"letterboxd":"https://letterboxd.com/film/cambodia-beer-dreams/","imdb":"https://www.imdb.com/title/tt40554020/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_cambodia%20bee"},"content_warnings":["Päihteiden ongelmakäyttö"],"showing_ids":["recmWWicV270YD5pW","recESjOI3cHvVkNvK","recO5ufSuOSEEUd0W"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"camp","title":"CAMP","original_title":null,"url":"https://hiff.fi/ohjelma/camp/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Dark Feminine"],"keywords":["Kasvutarina","Kauhu","Identiteetti","Fantasia","Naiskuvia"],"countries":["Kanada"],"directors":["Avalon Fast"],"cast":["Zola Grimmer","Alice Wordsworth","Cherry Moore"],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":111,"year":2025,"logline":"Girl horror -elokuvassa traumatisoitunut Emily päätyy leiriohjaajaksi nuorten kesäleirille. Seuraa viininhuuruista bondailua ja sekoilua leirinuotiolla, loitsuja ja traumojen käsittelyä.","description_text":"Nuoressa elämässään useita traagisia kuolemantapauksia kohdannut Emily päätyy leiriohjaajaksi ongelmaisille lapsille tarkoitetulle kesäleirille. Perillä odottaa erikoinen, huumaavan vastustamaton joukkio muita ohjaajia, joille leiri on jokavuotinen perinne. Pian seuraakin punaviininhuuruista bondailua leirinuotiolla ja esoteeristä elämöintiä kesäyössä nuorten naisten upotessa yhä syvemmälle noitapiiriinsä uumeniin.\n\nJane Schoenbrunin ( Teenage Sex and Death at Camp Miasma , R&A 2026) kvääriin elokuva-entourageen kuuluva ohjaaja-käsikirjoittaja Avalon Fast on vahvan omaehtoinen indie-tekijä, joka on nimennyt elokuviensa genren “tyttökauhuksi”. Ja tosiaan, CAMP kuljettaa tyttöyden ja nuoren naiseuden unenomaisen melankoliseen ytimeen, jossa paitsi söpöillään ja herkistellään, myös muunnetaan traumat ja patriarkaatin kauhut sytytysnesteeksi jollekin räjähtävälle.\n  \nEi liene suurta liioittelua nimittää CAMP 2020-luvulle päivitetyksi The Craftiksi . Kunnioittavasti kulttiesiäitiään kohti kumartava CAMP jatkaa noituuden, okkultismin ja sukupuolen yhteenkietoutumien käsittelyä terävästi ja välillä ilmat pihalle iskien.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/bc6347afd3f45f58a47aafb491b3548b-large.jpg","trailer_url":"https://www.youtube.com/embed/qctnEcM5TkI?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/camp-2025/","imdb":"https://www.imdb.com/title/tt38226226/?ref_=nm_knf_c_2"},"content_warnings":["Kuolema","Onnettomuus"],"showing_ids":["recXxSKLkqRBwacQ9","recIaF70u0D0VYfL3","recGmaC51TKu7KGO6"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"congo-boy","title":"Congo Boy","original_title":null,"url":"https://hiff.fi/ohjelma/congo-boy/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Musiikin voima"],"keywords":["Kasvutarina","Musiikki","Identiteetti","Perhesuhteet","Yhteiskunta","Ihmisoikeudet","Nuoruus","Afrikka"],"countries":["Central African Republic","Italia","Kongon demokraattinen tasavalta","Ranska"],"directors":["Rafiki Fariala"],"cast":["Bradley Fiomona Dembeasset","Christy Djomanda Louba","Pétruche Mbomba"],"languages":["lingala","swahili","ranska"],"subtitles":["englanti"],"age_rating":"K16","duration_min":90,"year":2026,"logline":"Toiveikkaassa draamassa kongolaispoika haaveilee räppiurasta, mutta arki kuluu nuoremmista sisaruksista huolehtiessa, kun vanhemmat viruvat vankilassa.","description_text":"Nuorisonäkökulmasta kerrotussa Congo Boyssa teinipoika Robert on Keski-Afrikan tasavallassa asuva pakolainen Kongosta. Idea rap-muusikon urasta innostaa, mutta sen tiellä on useita esteitä. Iästään huolimatta hän on ajautunut pitämään huolta nuoremmista sisaruksistaan, koska hänen vanhempansa ovat vankilassa. Tämän lisäksi elämää ympäröi sisällissota, ja kouluelämääkin pitäisi pitää yllä. Muusikonlahjat voivat kuitenkin tarjota hänelle ratkaisun ongelmiinsa.\n\nKäynnissä oleva sisällissota värittää kohtausten keskusteluja ja miljöötä. Kaikki tämä toteutetaan hyvin arkisesti, eikä sota ole suoranaisesti fokuksessa. Tärkeämpää on Robertin jokapäiväinen elämä tapahtumien ympärillä. Bradley Fiomona Dembeassetin roolisuoritus istuu hyvin tyyliin, eikä taustalla oleva synkkyys valtaa teosta. Sen sijaan normaali elämä jatkuu yhteiskunnallisista ongelmista huolimatta.\n\nOhjaaja Rafiki Fariala tasapainottelee eri elementtien välillä hienovaraisesti. Congo Boyn monipuoliset ainekset pysyvät kasassa, ja nuoren päähenkilön elämän kuvaus pysyy kevyenä loppuun asti. Elämä voi olla toiveikas olosuhteista huolimatta. Tärkeintä ovat asiat, jotka tuovat elämään iloa. Robertille se on musiikki.\n\nJuho Lipponen","poster":"https://hiff.fi/wp-content/uploads/airtable/8f06b117eeec77b7afa8f7939c085495-large.jpg","trailer_url":"https://www.youtube.com/embed/AFYWcTnl0U8?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/congo-boy/","imdb":"https://www.imdb.com/title/tt41592086/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_congo%20boy"},"content_warnings":["Ahdistus","Rasismi","Syrjintä","Väkivalta"],"showing_ids":["recS0qaQHKeVgcqtI","rec8jWTCWllwuFbee","rec4102AEEycl07R3"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"dao","title":"Dao","original_title":null,"url":"https://hiff.fi/ohjelma/dao/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Tekstitetty/puhuttu suomeksi","Kokeellinen","Afrikka","Perhesuhteet"],"countries":["Guinea-Bissau","Ranska","Senegal"],"directors":["Alain Gomis"],"cast":["Katy Correa","D’Johé Kouadio","Samir Guesmi","Mike Etienne"],"languages":["ranska","wolof","manjak","Guinea-Bissau Creole"],"subtitles":["suomi","englanti"],"age_rating":"K7","duration_min":185,"year":2026,"logline":"Yhdet häät ja yhdet hautajaiset kutsuvat juhlimaan elämää Ranskaan ja Guinea-Bissauhun seremoniarumpujen ja jazzin soidessa taustalla.","description_text":"Oliko tämä sittenkin dokumentti? Dao -elokuvaa katsellessa kysymys nousee useamman kerran mieleen. Kameran edessä soljuva elämä on narratiivia olennaisempaa. Siinä missä liikutaan fiktion ja dokumentaarisen tyylin rajalla, myös itse tarinassa aikatasot, nykyisyys ja menneisyys, elävien maailma ja tuonilmainen limittyvät toisiinsa. ”Dao” viittaa taolaisuuden alkusyyn käsitteeseen; voimaan, josta kaikki on lähtöisin ja johon kaikki palaa. Katsoja kutsutaan mukaan osaksi elämän ja kuoleman riittejä, kahteen juhlaan. Päähenkilö Glorian (Katy Correa) tyttären häitä vietetään Ranskassa ja kuolleen isän muistoseremoniaa Guinea-Bissaussa, ison suvun voimin. Miljööt ovat hyvin erilaiset, mutta kahden maailman välille syntyy elävä yhteys. Kaiken keskiössä on perhe ja traditiot.\n\nTodistusvoimassaan Dao tuntuu hyvin henkilökohtaiselta. Ohjaaja Gomes on kertonut valuttaneensa elokuvaan omia kokemuksiaan, mutta hän on samanaikaisesti avannut tekoprosessin kollektiiviseksi. Mukana on improvisaatiota, mutta jälki ei tunnu epätasaiselta.\n\nHarmoninen tasapaino löytyy historian ja nykyhetken, elävien ja kuolleiden sekä eri maiden välille. Kolmituntinen kesto mahdollistaa ajan ja tilan, joilla vältetään kerronnan karikatyyrit. Dao sykkii iloa ja soi.\n\nHilla Okkonen","poster":"https://hiff.fi/wp-content/uploads/airtable/df67e0efdb569da4ab2cdaf80e9a2cfa-large.jpg","trailer_url":"https://www.youtube.com/embed/TQwKj4ZfQek?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/dao-2026/","imdb":"https://www.imdb.com/title/tt32358921/?ref_=nv_sr_srsg_1_tt_7_nm_0_in_0_q_dao%202026"},"content_warnings":[],"showing_ids":["rec21d9cQCeoYJe3q","recNzR6ipVJgQhkox"],"shorts":[],"cinema_release":{"label":"Ensi-ilta vuoden 2027 alussa","status":"undated","date":null},"on_yle_areena":false},{"slug":"dawning","title":"Dawning","original_title":"Demring","url":"https://hiff.fi/ohjelma/dawning/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Kauhu","Perhesuhteet","Angsti","Naiskuvia"],"countries":["Norja"],"directors":["Patrik Syversen"],"cast":["Kathrine Thorborg Johansen","Silje Storstein","Marte Magnusdotter Solem"],"languages":["norja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":109,"year":null,"logline":"Kolme sisarta vetäytyy syrjäiselle mökille, jonne saapuu muukalainen. Jos Bergman olisi ohjannut kauhua, lopputulos voisi olla tällainen hyytävä psykologinen painajainen.","description_text":"Kolme sisarta vetäytyy perheen syrjäiselle mökille sen jälkeen, kun nuorin sisko on selvinnyt toisesta itsemurhayrityksestä. Kun vanhemmat sisaret yrittävät tukea häntä, he saavat tiedon äitinsä kuolemasta. Koska he uskovat nuorimman olevan liian hauras kestämään uutisen, he päättävät salata äidin kuoleman tältä. Yritys ylläpitää näennäistä normaaliutta alkaa kuitenkin murentua, kun mökille saapuu salaperäinen muukalainen pyytämään apua. Hänen ilmestymisensä käynnistää tapahtumaketjun, joka muuttuu yhä ahdistavammaksi ja arvaamattomammaksi.\n\nNorjalaisen Patrik Syversenin ohjaama ja käsikirjoittama Dawning on ennakkoluuloton ja omaperäinen kauhun, trillerin ja kamaridraaman hybridi, jossa tyylilliset genremuutokset heijastelevat syvän surun epävakaata tunnekirjoa.\n\nKorutonta mustavalkokuvaa ja vapautuneempia värijaksoja yhdistelevä elokuva pitää katsojan jatkuvasti varpaillaan. Sen tavassa käsitellä traumaa ja tukahdutettuja tunteita on kaikuja muun muassa David Lynchin, Ingmar Bergmanin ja Michael Haneken teoksista. Upea on myös elokuvan tapa käyttää ääntä: levottomuutta lietsovat äänimaisemat saavat arkiset ympäristöt vaikuttamaan perustavanlaatuisen kauhistuttavilta.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/f8b7df5938888610142d310d01ee794d-large.jpg","trailer_url":"https://www.youtube.com/embed/SbcmoApg-y0?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/dawning-2025/","imdb":"https://www.imdb.com/title/tt36454040/?ref_=nv_sr_srsg_1_tt_6_nm_1_in_0_q_dawning"},"content_warnings":["Ahdistus","Väkivalta","Kuolema","Itsemurhayritys"],"showing_ids":["rec3p8Nc76ljD97Qe","recpz5F8Qm2Wk8lFn","rec9Iy4ZJ4tnMr1vh","recFEfDKhGWKeXcoU","reczMrOEtWr5BQPCc"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"decorado","title":"Decorado","original_title":null,"url":"https://hiff.fi/ohjelma/decorado/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio"],"themes":["Animoituja unia"],"keywords":["Angsti","Eläimet","Fantasia","Identiteetti","Jännitys","Kaupunkitila","Mielenterveys","Outoa","Perhesuhteet"],"countries":["Espanja"],"directors":["Alberto Vázquez"],"cast":["Asier Hormaza","Aintzane Gamiz","Kandido Uranga"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":95,"year":2025,"logline":"Synkän koominen aikuisten animaatio ja terävä dystopia, jossa keski-ikäinen Arnold-hiiri alkaa epäillä koko elämänsä olevan vain lavastettu illuusio.","description_text":"Espanjalaisen animaation omaperäisimpiin tekijöihin kuuluva Alberto Vázquez ( Psiconautas , Unicorn Wars ) laajentaa Goya-palkitun lyhytelokuvansa täyspitkäksi eksistentiaaliseksi painajaiseksi, jossa suloisen näköinen animaatio kätkee alleen armottoman tutkielman vieraantumisesta, vallasta ja vapauden illuusiosta.\n\nKeski-ikäinen, pitkäaikaistyötön Arnold-hiiri alkaa epäillä, että hänen elämänsä, avioliittonsa ja koko ympäröivä yhteiskunta ovat valtavaa lavastusta. Ystävän salaperäinen kuolema syventää vainoharhaa, joka johdattaa hänet kohti maailmaa hallitsevan megayhtiön kulissien takaista todellisuutta. Vázquez ei kuitenkaan rakenna perinteistä salaliittotrilleriä, vaan absurdin, mustalla huumorilla sävytetyn sadun, jossa todellisuus tuntuu liukuvan jatkuvasti pois otteesta.\n\nDecorado leikittelee yhtä aikaa Disneyn klassisella eläinanimaatiolla, Orwellin dystopioilla ja The Truman Show’n kaltaisilla todellisuusilluusioilla. Lopputulos on visuaalisesti huumaava, synkän koominen ja filosofisesti levoton. Aikuisten animaatio ei tarjoa lohtua eikä moraalisia opetuksia, vaan kutsuu katsojan kyseenalaistamaan kaiken sen, mikä näyttää itsestään selvältä. Jos elämä on näyttämö, kuka kirjoittaa käsikirjoituksen?\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/deae6f299ebddcbd4313e965a8674bbb-large.jpg","trailer_url":"https://www.youtube.com/embed/A1MfWRXeB18?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/decorado/","imdb":"https://www.imdb.com/title/tt26923383/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_decorado"},"content_warnings":["Mielenterveysongelmat","Päihteiden ongelmakäyttö","Väkivalta"],"showing_ids":["recCT2o7TFt6cRE6Y","rec60SYOirs5FK5D7","recfH2cNWIxeAAGCF","recPur20yTNEwfVA9"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"double-freedom","title":"Double Freedom","original_title":"La libertad doble","url":"https://hiff.fi/ohjelma/double-freedom/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Perhesuhteet","Slow cinema","Luontosuhde"],"countries":["Argentiina","Chile","Iso-Britannia","Luxemburg","Saksa"],"directors":["Lisandro Alonso"],"cast":["Misael Saavedra","Catalina Saavedra","Adrián Fondari"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K7","duration_min":100,"year":2026,"logline":"Slow cinema -visionääri Lisandro Alonson uutuudessa erakoituneen metsurin yksinkertainen arki Argentiinan pampalla muuttuu odottamattoman perhevastuun myötä.","description_text":"Misael elää yksinkertaista ja omalakista elämää metsän keskellä, kaukana muista ihmisistä. Hän kaataa puita, polttaa tupakkaa ja antaa päivien seurata toisiaan samanlaisina. Hänen erakkoelämänsä kuitenkin järkkyy, kun odottamaton perhevastuu pakottaa hänet ottamaan huomaansa mielenterveysongelmista kärsivän sisarensa säästöleikkausten suljettua tämän hoitopaikan. Luonnon ja arjen yksinkertaisen rytmin rinnalle nousee uusi inhimillinen side, joka haastaa Misaelin käsityksen henkilökohtaisesta vapaudesta.\n\nArgentiinalaisen slow cinema -mestarin Lisandro Alonson uutuus Double Freedom palaa ohjaajan ensimmäisen kokopitkän elokuvan La libertad (2001) maisemiin ja päähenkilöön. Amatöörinäyttelijä Misael Saavedra ei niinkään esitä roolia kuin jatkaa elämää, joka alkoi valkokankaalla neljännesvuosisata sitten. Alonson elokuvassa ajan kuluminen tuntuu yhtä konkreettiselta kuin metsän puiden kasvu: maailma on muuttunut, mutta Misaelin suhde työhön, luontoon ja yksinäisyyteen on säilynyt.\n\nAlonso rakentaa draaman pienistä eleistä ja havainnoista. 35-milliselle filmille kuvatut pitkät otokset ja niukka dialogi antavat tilaa luonnon äänille, ihmisen liikkeille ja hiljaisuuden kielelle.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/cd86f60d6dc1945288f4b79c46dd7331-large.jpg","trailer_url":"https://www.youtube.com/embed/6D3vF82OJi0?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/double-freedom/","imdb":"https://www.imdb.com/title/tt33037660/?ref_=nv_sr_srsg_0_tt_6_nm_0_in_0_q_double%20freedom"},"content_warnings":["Mielenterveysongelmat"],"showing_ids":["recmuZb5YN03BEvvu","recVArtb6bExDm32H","recFskt4Y6oDHEdP4","recMTyizeyFCM9xfZ"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"down-the-arm-of-god","title":"Down the Arm of God","original_title":null,"url":"https://hiff.fi/ohjelma/down-the-arm-of-god/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["United States of Indie"],"keywords":["Yhteiskunta","Jännitys","Usko"],"countries":["Ranska","Yhdysvallat"],"directors":["Peter Brunner"],"cast":["Caleb Landry Jones","India Marie Cross","Nick Stahl","Mena Suvari"],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":106,"year":2026,"logline":"Yhteistyössä asunnottomien yhteisön kanssa tehdyssä indie-draamassa pastori (Caleb Landry Jones) yrittää auttaa asunnottomia seurakuntalaisten ennakkoluuloista huolimatta.","description_text":"Teksasilaisten asunnottomien kanssa yhteistyössä toteutettu Down the Arm of God maalaa aidontuntuisen kuvan asunnottomien säännöllisesti kohtaamasta syrjinnästä ja suoranaisesta eristämisestä. Elokuva ammentaa todellisista kertomuksista asunnottoman arjesta, ja asunnottomien yhteisön jäsenet näyttelevät siinä avainrooleja. Caleb Landry Jonesin tähdittämä elokuva pujottelee ihmisyyden kauneimpien ja karuimpien puolien välillä.\n\nTarina seuraa pastoria, joka ottaa johdettavakseen teksasilaisen pikkukaupungin uskonnollisen yhteisön. Vaikka ensivastaanotto on lämmin, pastorin pyrkimys auttaa hädänalaisia saa paikalliset kääntymään nopeasti häntä vastaan. Yrityksiä avustaa kaupungin ulkopuolella elävää asunnottomien yhteisöä suvaitaan alkuun, mutta talven kovetessa kovenevat asenteetkin, ja pian kaupunkilaisten turhautuminen, rasismi ja ymmärtämättömyys erilaisuutta kohtaan alkavat pulputa pintaan.\n\nElokuva käsittelee asunnottomuutta ilmiönä Yhdysvalloissa ja sitä, miten rajusti ja epäsuhtaisesti järjestelmä pettää ihmiset. Käsikirjoitus on Peter Brunnerin ja Landry Jonesin yhteiskäsialaa ja tutkii sitä, miten itseriittoinen uskonnollisuus toimii vaarallisena aseena sellaisessa ympäristöissä, jossa ihmisten hätään ei suhtauduta vakavasti ja kunnioittavasti.\n\nPaikoissa, joissa kristillisiä opetuksia käytetään vain etuoikeutettujen vallan pönkittämiseen, lähimmäisenrakkauden julistukset näyttäytyvät pelkkänä performanssina.\n\nLjubomir Delevic (kääntänyt Adrian Murtomäki)","poster":"https://hiff.fi/wp-content/uploads/airtable/1ecbb13a40763b0e4a9dede24c8d0ca0-large.jpg","trailer_url":"https://www.youtube.com/embed/MY876qJ6QHs?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/down-the-arm-of-god/","imdb":"https://www.imdb.com/title/tt15181684/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_down%20the%20arm"},"content_warnings":["Ahdistus"],"showing_ids":["recSWZVb77CWAUylK","recCif6mJV8UOaPIl","recSQqt7fOCvJ3lPL"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"dracula","title":"Dracula","original_title":null,"url":"https://hiff.fi/ohjelma/dracula/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Tech","Kokeellinen","Kirjallisuus","Fantasia","Huumori"],"countries":["Brasilia","Itävalta","Luxemburg","Romania"],"directors":["Radu Jude"],"cast":["Adonis Tanța","Gabriel Spahiu","Oana Maria Zaharia"],"languages":["romania","englanti","saksa","espanja","ranska","unkari","latina"],"subtitles":["englanti"],"age_rating":"K16","duration_min":170,"year":2025,"logline":"Vampyyrikreivi Dracula herää epäkuolleena tekoälyhirviönä Radu Juden kuvia raastavassa törkykomediassa, joka pilkkaa armotta uusliberaalin nyky-Romanian epäkohtia.","description_text":"Kreivi Dracula on ylivoimaisesti tunnetuin romanialainen. Ympäri maailman tunnettu transilvanialainen vampyyri perustuu lievästi historialliseen hahmoon ja tarkemmin viktoriaanisen ajan romaaniin, mutta viittaussuhteet ovat jo aikaa sitten sulaneet yleiseen mielikuvitukseen. Kun hahmolla yritetään tehdä rahaa esimerkiksi matkailun edistämiseksi, alkaa myös Draculan naaman ja Romanian valtion suhde sulautua.\n\nKuvainraastaja Radu Jude riepottelee vampyyrin ikonista luonnetta omintakeisilla tavoilla. Uusille elokuvatulkinnoillehan vaikuttaa aina olevan sijaa. Kehyskertomuksessa innostunut elokuvaohjaaja (Adonis Tanta) esittelee parikymmentä erilaista näkemystä aihiosta. Pennibudjetti ei haittaa, koska tekoälyteknologiat mahdollistavat kaikenlaisten luonnottomien hirvitysten tekemisen.\n\nLähes kolmetuntinen pläjäys tarjoaa vaihtelevia aiheita törkyhuumorista kansantaruihin ja romanttisiin virityksiin. Samalla annetaan napakka potku takalistoon sekä nyky-Romanian uusliberaalille ahneudelle että elokuva-alan laiskuudelle ja katteettomalle tekno-optimismille, joka lupaa ennennäkemättömiä näkyjä uusilla generoivilla työkaluilla. Niitähän saadaan, jos on esimerkiksi koskaan miettinyt, miltä Draculan sukuelin mahtaa näyttää.\n\nPaavo Ihalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/d2256fdcaaad8492afebb964d7b6576b-large.jpg","trailer_url":"https://www.youtube.com/embed/qoLmJZ9suAk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/dracula-2025-1/","imdb":"https://www.imdb.com/title/tt32448239/?ref_=nv_sr_srsg_3_tt_8_nm_0_in_0_q_dracula%202025"},"content_warnings":["Tekoälyllä generoitu kuvasto","Kehokauhu","Seksuaalinen kuvasto","Seksuaalinen väkivalta","Väkivalta","Epilepsiavaroitus"],"showing_ids":["recoXSryuqgMpzEIM","recdjovQyqkNPPlLx"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 30.10.","status":"dated","date":"2026-10-30"},"on_yle_areena":false},{"slug":"dry-leaf","title":"Dry Leaf","original_title":null,"url":"https://hiff.fi/ohjelma/dry-leaf/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Tekstitetty/puhuttu suomeksi","Kokeellinen","Slow cinema","Perhesuhteet","Fantasia","Urheilu"],"countries":["Georgia","Saksa"],"directors":["Alexandre Koberidze"],"cast":["David Koberidze","Otar Nijaradze","Irina Chelidze","Giorgi Bochorishvili"],"languages":["georgia","englanti"],"subtitles":["suomi","englanti"],"age_rating":"K7","duration_min":186,"year":2025,"logline":"Georgian elokuvamaagin palikkapuhelimella kuvattu metafyysinen tie-elokuva kertoo kadonneen ihmisen ja uudenlaisen elokuvan etsinnästä.","description_text":"Jos etsit elokuvaa, joka uudistaa elokuvakerrontaa, ja jos elokuvateatteri on sinulle pyhä paikka, jonne hiljentyä todistamaan ihmeitä, niin silloin tämä elokuva on sinulle.\n\nDry Leaf on piskuinen eepos ja metafyysinen tie-elokuva, jossa isä lähtee etsimään jalkapallokenttiä valokuvannutta tytärtään. Mukaan lähtee tyttären näkymätön ystävä. He ajavat läpi kesäisen Georgian maaseudun etsien jalkapallokenttiä ja kysellen ohikulkijoilta tyttären perään. Etsintä on tuloksetonta, kunnes…\n\nElokuvan ohjaaja ja kuvaaja Alexandre Koberidze on palkannut isänsä pääosaan. Maaseudun halki ajavan auton pelkääjän paikalla istuukin elokuvantekijä itse, elokuvaansa etsien.\n\nKoberidze ohjasi viime vuosien parhaimpiin lukeutuvan elokuvan, jalkapallosinfonian What Do We See When We Look at the Sky? (R&A 2021), jonka kuvankaunis 16mm filmi on vaihtunut Dry Leafin vielä kauniimpaan Sony Ericssonin vanhan palikkapuhelimen 144 pikseliin.\n\nElokuvamaagi Koberidzen käsissä vanha digiteknologia loihditaan elokuvan horisonttiin luotaavaksi pensseliksi, jolla maalata suurella lempeydellä impressionistisia pastoraaleja antonionimaisesta etsinnästä, elämän ja jalkapallon ihmeistä.\n\nJimi Rosling","poster":"https://hiff.fi/wp-content/uploads/airtable/a94f039d78e414d605b2159520e2b5b2-large.jpg","trailer_url":"https://www.youtube.com/embed/nx1D3hVbMgc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/dry-leaf/","imdb":"https://www.imdb.com/title/tt37537636/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_dry%20leaf"},"content_warnings":[],"showing_ids":["recOMTKtDr6yQ0Jqj","recHnkn1t7yXr89UL"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 20.11.","status":"dated","date":"2026-11-20"},"on_yle_areena":false},{"slug":"dua","title":"Dua","original_title":null,"url":"https://hiff.fi/ohjelma/dua/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["East Side Stories"],"keywords":["Historia","Perhesuhteet","Naiskuvia","Perustuu tositapahtumiin","Kasvutarina","Nuoruus"],"countries":["Kosovo","Ranska","Sveitsi"],"directors":["Blerta Basholli"],"cast":["Pinea Matoshi","Vlera Bilalli","Kaona Sylejmani"],"languages":["albania"],"subtitles":["englanti"],"age_rating":"K12","duration_min":100,"year":null,"logline":"Cannesissa palkitussa elokuvassa 13-vuotiaan tytön kasvutarina limittyy 90-luvun Kosovon yhteiskunnalliseen myllerrykseen.","description_text":"Dua ja kaverit haluaisivat olla normaaleja teinejä ja tehdä normaaleja teiniasioita: käydä koulua, kuunnella musiikkia, rakastua. Nämä tarpeet saadaan kyllä tyydytettyä kamalissakin olosuhteissa, mutta sota ja albaaniväestön kohtaama syrjintä synkentävät joka hetkeä.\n\nElokuva vie katsojan pahenevan sodan keskuuteen, vuosien 1998 ja 1999 vaihteen Serbialle kuuluneeseen Kosovoon, jossa serbiviranomaiset toteuttavat jatkuvaa etnistä puhdistusta paikallista albaaniväestöä vastaan.\n\nUpean sodanvastaisen teoksen ohjaaja Blerta Basholli ammentaa omista teini-iän kokemuksistaan fiktiolla höystettynä, luoden henkilökohtaista ja Kosovon historiaa käsittelevän melkein-muistelmateoksen. Elokuva keskityy Duaan ja hänen näkökulmaansa sodan ja väkivallan tapahtuessa hänen välittömän elinpiirinsä ulkopuolella. Tietyllä tapaa Dua edustaa Blertaa, ja samalla kaikkia lapsia, jotka joutuvat kasvamaan konfliktin keskiössä.\n\nBashollin elokuvalla on vangitseva vaikutus. Rankan ympäristön äänimaailma ja kuvasto eivät suinkaan vaimene katsojan upotessa Duan teinikuplaan, vaan sodan todellisuus tuntuu sitä vaikuttavammalta, jopa käsinkosketeltavalta.\n\nLjubomir Delevic (kääntänyt Adrian Murtomäki)","poster":"https://hiff.fi/wp-content/uploads/airtable/42f9cbdca55bba9710d946f67a14c874-large.jpg","trailer_url":"https://www.youtube.com/embed/QDB0sdqEJLg?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/dua/","imdb":"https://www.imdb.com/title/tt38765198/?ref_=nm_knf_c_2"},"content_warnings":["Alaikäisen ahdistelu","Ahdistus","Murha"],"showing_ids":["recmG29D5s8DOysu2","reczlJSsAZqPHBde6","recpZLSOSqemiNHTO"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"elephants-in-the-fog","title":"Elephants in the Fog","original_title":"तिनीहरू","url":"https://hiff.fi/ohjelma/elephants-in-the-fog/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Asian Cuts"],"keywords":["LGBTQIA+","Luontosuhde","Eläimet","Rakkaus","Rikos"],"countries":["Nepal","Ranska"],"directors":["Abinash Bikram Shah"],"cast":["Pushpa Thing Lama","Deepika Yadav","Jasmin Bishwokarma"],"languages":["nepali"],"subtitles":["englanti"],"age_rating":"K12","duration_min":108,"year":2026,"logline":"Nepalilaisen transyhteisön matriarkka tasapainoilee vapauden ja vastuun välillä, kun yksi hänen suojateistaan katoaa. Vaanivatko kylää ympäröivässä metsässä villielefantit vai miehet?","description_text":"Pieni sumuinen kylä Nepalissa, missä villien norsujen hyökkäykset ovat arkipäivää, on Piratin ja hänen suojattiensa koti. Pirati on transnaisten Kinner-yhteisön arvostettu matriarkka, joka huolehtii pienestä perheestään tiukalla otteella mutta suurella sydämellä. Kinner-yhteisöön kuuluminen vaatii sääntöjen tarkkaa noudattamista. Jäsenten täytyy pidättäytyä rakkaussuhteista ja päihdyttävistä aineista. Heidän tehtävänsä on suorittaa siunauksia paikallisille ja tienata elantonsa tanssimalla häissä ja muissa juhlissa. Vaikka yhteisö on Piratille tärkeä, hänen sydämensä on myös muualla, mikä aiheuttaa jatkuvaa ristiriitaa ja ajoittaista eripuraa yhteisön sisällä. Sitten yksi Piratin suojateista katoaa ja hänen täytyy tehdä valinta, haluaako hän selvittää, mitä on tapahtunut ja samalla asettaa itsensä vaaraan vai lähteä pois kokonaan.\n\nElephants in the Fog on käsikirjoittaja-ohjaaja Abinash Bikram Shahin ensimmäinen pitkä elokuva. Se sai ensiesityksensä Cannesin elokuvajuhlilla, missä se nappasi ansaitusti Un Certain Regard -sarjan tuomariston palkinnon. Vaikka se käsittelee raskaita teemoja kuten syrjintää, se onnistuu luomaan ahdistavistakin elementeistä herkän ja eheän kokonaisuuden, jonka keskiössä ovat Pirati ja hänen yhteisönsä. Vahvan tarinankerronnan ja vimmaisen pääosanesittäjänsä (ensiroolinsa tekevä Pushpa Thing Lama), lisäksi elokuva tarjoaa henkeäsalpaavan kauniita maisemia, jotka jäävät mieleen pitkäksi aikaa.\n\nSanttu Nikula","poster":"https://hiff.fi/wp-content/uploads/airtable/f27120f76d11695043312c74256c2498-large.jpg","trailer_url":"https://www.youtube.com/embed/9tBBtuLlzkY?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/elephants-in-the-fog/","imdb":"https://www.imdb.com/title/tt29279937/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_elephants%20in%20the%20"},"content_warnings":["Ahdistus","Transfobia"],"showing_ids":["recCu7yanjEGFV5Ea","reczpulhxnS4faZ5c","rec4wrsmAOiWeSYWV"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"erupcja","title":"Erupcja","original_title":null,"url":"https://hiff.fi/ohjelma/erupcja/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Kaupunkitila","LGBTQIA+","Naiskuvia","Feelgood","Festarihitti"],"countries":["Puola","Yhdysvallat"],"directors":["Pete Ohs"],"cast":["Charli xcx","Lena Góra","Will Madden","Jeremy O. Harris"],"languages":["englanti","puola"],"subtitles":["osittain englanti"],"age_rating":"K12","duration_min":71,"year":2025,"logline":"Bethany (Charli XCX ensimmäisessä pääroolissaan) haahuilee ja bailaa Varsovan kaduilla itseään ja sielunkumppaniaan etsien. Poikaystävä seuraa perässä kihlasormus taskussa.","description_text":"Charli XCX on Bethany, joka matkustaa poikaystävänsä Robin kanssa Varsovaan. Kiltti ja tylsä Rob uskoo tulleensa romanttiselle lomamatkalle tyttöystävänsä kanssa, mutta Bethany haikailee Varsovassa asuvan entisen ihastuksensa Nelin perään. Tulivuori Etna purkautuu, ja se on merkki kohdata Nel uudestaan, sillä Robin kanssa ”maa ei tärise, eivätkä tulivuoret purkaudu”. Reppana Rob seuraa kihlasormus taskussaan Bethanyn perässä, kun tämä bailaa Nelin kanssa Varsovan valojen välkkeessä.\n\nErupcja on elokuva kaikille niille millenniaaleille, jotka pettyivät tajuttuaan, ettei elämä ole yhtään niin maagista kuin Amélie lupasi 25 vuotta sitten. Sen sijaan arjesta tuli vähän nihilististä ja millenniaaleista omaa elämäänsä performoivia hipstereitä, jotka haaveilevat elämän mielekkyydestä, mutta ovat kyvyttömiä tehdäkseen sen saavuttamiseksi mitään. Jos tunnistat itsesi tästä kuvauksesta, samaan aikaan itseironinen ja vakava Erupcja on todennäköisesti elokuva sinulle. Se epävarma hapuilu, jota Joachim Trier kuvasi The Worst Person in the World -elokuvassa tarkkanäköisesti ja pieteetillä, esitetään Erupcjassa oivaltavina otoksina. Samaa harhailua, eri muodossa.\n\nEelia Leikas","poster":"https://hiff.fi/wp-content/uploads/airtable/f2b94883469c1d32e5414f30a3074f6a-large.jpg","trailer_url":"https://www.youtube.com/embed/PPMOewiW5XI?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/erupcja/","imdb":"https://www.imdb.com/title/tt33712666/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_erupcja"},"content_warnings":[],"showing_ids":["recfTiaKdslrcWAGk","recfl705UnRmo8c9f","rec1JA2w21XPE29go"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"everybody-digs-bill-evans","title":"Everybody Digs Bill Evans","original_title":null,"url":"https://hiff.fi/ohjelma/everybody-digs-bill-evans/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Musiikin voima"],"keywords":["Angsti","Festarihitti","Mielenterveys","Musiikki","Perhesuhteet","Suru","Perustuu tositapahtumiin","Elämäkerta"],"countries":["Irlanti","Iso-Britannia"],"directors":["Grant Gee"],"cast":["Anders Danielsen Lie","Bill Pullman","Laurie Metcalf","Isabelle Harriet"],"languages":["englanti"],"subtitles":[],"age_rating":"K16","duration_min":102,"year":2026,"logline":"Kaunistelematon kuvaus muusikko Bill Evansin vaikeasta vuodesta 1961, jota ennen ja jonka jälkeen syntyi maailman parasta jazzmusiikkia.","description_text":"Heinäkuussa 1961 jazzpianisti ja säveltäjä Bill Evansia kohtasi tragedia: kontrabasisti Scott LaFaro kuoli auto-onnettomuudessa. Tapahtuma vaikutti merkittävästi paitsi Evansin soittokykyyn, myös heroiinin käytön eskaloitumiseen. Ilman veljensä Harryn perhettä ja pakkolepolomaa vanhempiensa luona Floridassa Evans tuskin olisi toipunut takaisin pianon äärelle.\n\nHenkilökuvaksi muusikosta elokuvassa kuullaan alkutekstejä lukuun ottamatta vähäisesti musiikkia. Evansin ehkä kuuluisin kappale, Waltz for Debby , asetetaan hienosti herkkään kontekstiinsa. Muutoin eletään väliaikaa, joka ”joskus kuuluu musiikkiin”.\n\nGrant Geen ohjaamassa, Berliinin elokuvajuhlilla Hopeisella karhulla palkitussa elokuvassa nähdään välähdyksiä väistämättömästä, jossa kuolee lisää ihmisiä ja lopulta Evans itsekin. Mustavalkoisesta kertomuksen painopisteestä ja väreillä vääristetystä tulevaisuudesta syntyy rikkinäinen melodia, joka kuitenkin kerrotaan harmonisesti päähenkilönsä (Anders Danielsen Lie) kulkiessa kohti seuraavaa luomiskautta.\n\nElokuvan päälle voi katsella Yle Areena -palvelusta Helsingin Lauttasaaressa vuonna 1970 kuvatun olohuonekonsertin, jossa Evans esittää silloisen trionsa kanssa kolme kappaletta haastattelun lomassa.\n\nJohanna Siik","poster":"https://hiff.fi/wp-content/uploads/airtable/aaba3752b6425671aee48466d516b7f5-large.jpg","trailer_url":"https://www.youtube.com/embed/Hiobg5hJRTY?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/everybody-digs-bill-evans/","imdb":"https://www.imdb.com/title/tt34347792/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_everybody%20digs"},"content_warnings":["Kuolema","Onnettomuus","Ahdistus","Mielenterveysongelmat","Päihteiden ongelmakäyttö","Sairaalakuvasto"],"showing_ids":["recuXJvpIOVJV9wLt","recNwATAYjsGNKoX1"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"everybody-to-kenmure-street","title":"Everybody to Kenmure Street","original_title":null,"url":"https://hiff.fi/ohjelma/everybody-to-kenmure-street/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Fight the Power"],"keywords":["Yhteiskunta","Kaupunkitila","Siirtolaisuus","Ihmisoikeudet"],"countries":["Iso-Britannia"],"directors":["Felipe Bustos Sierra"],"cast":["Emma Thompson","Kate Dickie","Keira Lucchesi"],"languages":["englanti","urdu","pandžabi"],"subtitles":["osittain englanti"],"age_rating":"K12","duration_min":98,"year":2025,"logline":"Skotlantilainen naapurusto nousee vastustamaan maahanmuuttoviranomaisen kiinniottoja omalla kotikadullaan dokumentissa, joka osoittaa kansalaisaktivismin ja yhteisöllisyyden voiman.","description_text":"13. toukokuuta 2021, muslimien Id-juhlan alkamisen aamuna Iso-Britannian maahanmuuttoviranomainen järjestää ratsian Kenmure Streetillä Skotlannin Glasgow’ssa.\n\nKaksi miestä otetaan kiinni ja suljetaan pakettiautoon. Tästä käynnistyy kansalaisaktivismin ja yhteisöllisyyden rauhaisa voimannäyte, jossa monikulttuurinen naapurusto nousee vastustamaan omien jäsentensä kiinniottoa.\n\nFelipe Bustos Sierran ylistetty dokumentti on saanut tunnustusta mm. Sundancen elokuvajuhlilla. Hän kuvaa, miten jokainen voi vaikuttaa yhteisen asian eteen omalla tavallaan: Yksi hivuttautuu pakettiauton alle estääkseen sen lähdön, toinen ostaa kaupasta ruokaa jaettavaksi ja kolmas pirauttaa juristille.\n\nNäyttelijät Emma Thompson, Kate Dickie ja Keira Lucchesi antavat äänensä kolmen osallistujan kokemuksille päivän tapahtumista. Haastatteluiden ja kattavan videomateriaalin lisäksi protestia peilataan arkistomateriaalilla osaksi kansalaisaktivismin perinnettä Glasgow’ssa.\n\nUseat maat kiristävät maahanmuuttopolitiikkaansa. Moni kohtaa omakohtaisesti, lähipiirissään tai median välityksellä kiinniottoja tai niiden uhkaa. Dokumentti osoittaa, että jos tätä tapahtuu omalla kotikadullasi, sitä ei tarvitse katsoa sivusta.\n\nKatariina Kantola","poster":"https://hiff.fi/wp-content/uploads/airtable/550e86fb34a63d1775cac65061d451a0-large.jpg","trailer_url":"https://www.youtube.com/embed/JOY5T03hHbk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/everybody-to-kenmure-street/","imdb":"https://www.imdb.com/title/tt36966956/?ref_=nv_sr_srsg_0_tt_6_nm_0_in_0_q_everybody%20to%20ken"},"content_warnings":[],"showing_ids":["recH0aFMpZQuj359f","rec3CuBN4bOyzFHzb","rec0DTs579X9nnK0z"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"everytime","title":"Everytime","original_title":null,"url":"https://hiff.fi/ohjelma/everytime/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Suru","Outoa","Perhesuhteet","Matka","Muisti"],"countries":["Itävalta","Saksa"],"directors":["Sandra Wollner"],"cast":["Birgit Minichmayr","Tristán López","Lotte Keiling"],"languages":["saksa"],"subtitles":["englanti"],"age_rating":"K12","duration_min":124,"year":2026,"logline":"Kolmen ihmisen elämät nyrjähtävät menetyksen jälkeen paikoiltaan. Cannesissa palkittu elokuva on kuin surun eri muodoista rakentuva pitkä uni, joka vie Berliinistä surrealistiselle Teneriffan-matkalle.","description_text":"Äiti (Birgit Minichmayr) ja kaksi tytärtä (Lotte Keiling, Carla Hüttermann) elävät aika tavallista elämää liian pienessä berliiniläiskodissaan, kun rantaloman kynnyksellä iskee tragedia. Tapahtuneen jälkeisessä ajassa siistitäänkin jo hautaa, syödään makkaraa kesäisen ruokapöydän äärellä ja pelataan videopeliä vanhemman tyttären heilan (Tristan López) kanssa.\n\nTämän vuoden Cannesin Un certain regard -voittaja on kuin pitkä uni surun eri muodoista. Menetyksen kokeneen surijan kokemukset ovat välähdyksiä oman elämän etenemisestä muistojen ja valemuistojen taistellessa tietoisesta ajatustilasta. Arjen tuttu kronologia rikkoutuu vastahankaisen ja impulsiivisen käytöksen vuorotellessa kuin levottomalla pikkulapsella.\n\nItävaltalaisen ohjaaja-käsikirjoittaja Sandra Wollnerin elokuvan ensimmäinen puolisko sijoittuu Berliinin ja toinen Teneriffalle. Sileiden betonibunkkereiden ja terävien laavarantojen eroavaisuuksista huolimatta aurinko näyttää porottavan koko ajan samalla tavalla.\n\nKuvaaja Gregory Oke ( Aftersun , R&A Spring Break 2023) tekee loistotyötä. Alkuosan auringonnoususta sumea, jännitteinen kamera-ajo ei koskaan saavuta kohdettaan kunnolla, ja juuri tästä kurotuksesta rakentuu koko elokuvan ydin.\n\nJohanna Siik","poster":"https://hiff.fi/wp-content/uploads/airtable/867b8dd21eee44beaf6a4e5a52efc7ec-large.jpg","trailer_url":"https://www.youtube.com/embed/PsLSvf99UDg?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/everytime/","imdb":"https://www.imdb.com/title/tt41592057/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_everytime"},"content_warnings":["Kuolema"],"showing_ids":["recQCOOSI7gIeGOxe","recReCQlgXEMsU8Un","recGiVtYpHrg0vvvx"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"festivaalibaari-juova","title":"Festivaalibaari Juova","original_title":null,"url":"https://hiff.fi/ohjelma/festivaalibaari-juova/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Events"],"keywords":["Feelgood","Ystävyys"],"countries":[],"directors":[],"cast":[],"languages":[],"subtitles":[],"age_rating":null,"duration_min":null,"year":null,"logline":"R&A-näytösten jälkeen suosittelemme jatkamaan iltaa virallisessa festaribaari Juovassa (Kaisaniemenkatu 3)! Festarilipulla saat 10% alennuksen hanajuomista.","description_text":"","poster":"https://hiff.fi/wp-content/uploads/airtable/c6525442a23f9bc31de9a0a735c958f5-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":[],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"full-phil","title":"Full Phil","original_title":null,"url":"https://hiff.fi/ohjelma/full-phil/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Outoa","Matka","Huumori","Kauhu"],"countries":["Belgia","Ranska"],"directors":["Quentin Dupieux"],"cast":["Woody Harrelson","Kristen Stewart","Charlotte Le Bon","Tim Heidecker"],"languages":["englanti","ranska"],"subtitles":["osittain englanti"],"age_rating":"K16","duration_min":78,"year":2026,"logline":"Perhedraama kohtaa kehokauhun ja absurdin huumorin, kun isä (Woody Harrelson) ja tytär (Kristen Stewart) yrittävät löytää yhteyden painajaismaisella Pariisin-matkalla.","description_text":"Miltä kuulostaa perhedraamakomedia, jossa vanhemmuuden kipupisteitä käsitellään kehokauhun, absurdin huumorin ja 1950-luvun hirviöelokuvan keinoin? Quentin Dupieux’n ( Rubber , R&A 2010; Deerskin , R&A 2019) elokuvalta.\n\nRanskalainen ohjaaja, joka on tullut tunnetuksi myös elektronisen musiikin tekijänä nimellä Mr. Oizo, on viehättynyt surrealistisiin pienelokuviin, joissa otetaan yksi mieltä nyrjäyttävä idea ja katsotaan, kuinka pitkälle sen voi viedä.\n\nFull Phil kuvaa amerikkalaisen teollisuuspohatan Philip Doomin (Woody Harrelson) ja tämän aikuisen Madeleine-tyttären (Kristen Stewart) Pariisin-matkaa, jonka tarkoituksena on löytää kadonnut yhteys perheenjäsenten välillä. Mikään ei kuitenkaan suju suunnitelmien mukaan. Isän tuska alkaa tuntua vähitellen vatsassa asti, kun tytär keskittyy lähinnä katsomaan kauhuelokuvaa ja ahmimaan ruokaa.\n\nDupieux’n maailmassa banaali ja järjetön kulkevat käsi kädessä: hotellihuone muuttuu kuumeiseksi painajaiseksi, ateria ruumiilliseksi koettelemukseksi ja arkinen keskustelu eksistentiaaliseksi kriisiksi. Harrelson ja Stewart muodostavat täydellisen epäsuhtaisen pääosaduon elokuvassa, jota ohjaaja on itse kuvaillut: “ Emily in Paris helvetissä”.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/15a300651a7e14f45daa8889116ce2a3-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/full-phil/","imdb":"https://www.imdb.com/title/tt38607959/"},"content_warnings":["Syömishäiriö","Väkivalta","Kehokauhu"],"showing_ids":["recunVuOZUWov818p"],"shorts":[],"cinema_release":{"label":"Tulossa levitykseen, ensi-ilta ei vielä tiedossa","status":"undated","date":null},"on_yle_areena":false},{"slug":"ghost-in-the-cell","title":"Ghost in the Cell","original_title":null,"url":"https://hiff.fi/ohjelma/ghost-in-the-cell/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Angsti","Jännitys","Kauhu","Action"],"countries":["Etelä-Korea","Indonesia"],"directors":["Joko Anwar"],"cast":["Abimana Aryasatya","Bront Palarae","Dimas Danang"],"languages":["indonesia"],"subtitles":["englanti"],"age_rating":"K18","duration_min":106,"year":2026,"logline":"Joukko vankeja taistelee hengestään yliluonnollisia voimia vastaan pitelemättömässä indonesialaisessa genresekoituksessa.","description_text":"Häkki heilahtaa toimittaja Dimasille, kun hänet löydetään pomonsa työhuoneesta yltä päältä veressä, pomo kattotuulettimeen suolistettuna. Vankila on kiltille tyypille pelottava paikka, mutta jengit ja sadistiset vartijat ovat vasta alkusoittoa: kun grand guignol -murhat jatkuvat vielä vankilan sisällä, on helvetti kirjaimellisesti irti.\n\nRuumiiden kasaantuessa vankien epäilykset kohdistuvat Dimasiin. Pian käy kuitenkin selväksi, että vastassa ovat yliluonnolliset voimat eikä kukaan kuolevainen ole turvassa. Vankien on otettava käyttöön kaikki kuviteltavissa olevat aseet selvitäkseen.\n\nIndonesialainen Ghost in the Cell murtautuu ulos genrestä toisensa perään. Aineksina ovat tasavertaisesti draama, kauhu, martial arts -toiminta, fantasia ja slapstick, usein saman kohtauksen sisällä. Elokuva luo itselleen säännöistä piittaamattoman tyylin, jossa joukkotappelu saattaa muuttua tanssiksi ja jossa gore-efektit jakavat tilaa hyväntahtoisen ystävyystematiikan kanssa.\n\nErityistä hupia seuraa oivalluksesta, että vankeja saalistava henki poimii uhreikseen kaikkein vihaisimmat yksilöt. Positiivisesta ajattelusta tulee tällöin eloonjäämistaistelun arvokkain ase.\n\nJussi Tarvainen","poster":"https://hiff.fi/wp-content/uploads/airtable/85613f626a8dd0d45f5321784733c140-large.jpg","trailer_url":"https://www.youtube.com/embed/otL78_pk_A0?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/ghost-in-the-cell/","imdb":"https://www.imdb.com/title/tt9000310/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_ghost%20in%20the%20cell"},"content_warnings":["Eritteet","Itsetuhoisuus","Henkinen väkivalta","Kehokauhu","Kuolema","Väkivalta","Silpominen"],"showing_ids":["rec0U2KRPUmOg3Nm0","reczMmb0f8NSN61I4","recLWCMmWlOP0FoXa"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"glorious-summer","title":"Glorious Summer","original_title":null,"url":"https://hiff.fi/ohjelma/glorious-summer/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Outouden laakso"],"keywords":["Outoa","Yhteiskunta","Mielenterveys","Naiskuvia"],"countries":["Puola"],"directors":["Helena Ganjalyan","Bartosz Szpak"],"cast":["Magdalena Fejdasz","Helena Ganjalyan","Daniela Komędera"],"languages":["puola"],"subtitles":["englanti"],"age_rating":"K12","duration_min":89,"year":2025,"logline":"Yorgos Lanthimosin töitä muistuttavassa dystooppisessa debyyttielokuvassa kolme naista on loukussa renessanssipalatsissa, jossa mystinen voima toteuttaa heidän toiveitaan.","description_text":"Kuka ei unelmoisi loputtomasta kesästä murenevassa renessanssipalatsissa? M, H ja D lipuvat auringon kylvettämien iltapäivien, uima-altaiden ja hyvinvointirituaalien välillä, ja ulkomaailma tuntuu kadonneen. Näille Glorious Summer -elokuvan keskiössä oleville naisille paratiisi on totta ja sitä ylläpitää yksi kirjoittamaton sääntö: älä ylitä muuria. Vähä vähältä heille kehittyy sanaton kieli ajatuksille, joita ei voi sanoa ääneen, samalla kun outo rituaali alkaa muodostua: harjoitus kuolemaa varten; uskomus, että muuta tapaa paeta ei ole. Idyllisen retriitin todelliset, huolellisesti koreografioidun hallintamekanismin kasvot alkavat paljastua.\n\nMonialaisen ohjaajakaksikon Helena Ganjalyanin ja Bartosz Szpakin täyspitkä debyytti sai ensi-iltansa SXSW:ssä vuonna 2025. Elokuvan luonnottoman maailman rakennuselementtejä ovat sen 16-milliselle filmille kuvatut täyteläiset tekstuurit, aistilliset koreografiat, pikkutarkasti asetellut tableaux vivants ja sen aavemainen äänimaisema, jossa hiljaisuus on yhtä ilmaisuvoimaista kuin dialogi. Glorious Summer -elokuvalla on Yorgos Lanthimosin varhaisten teosten kaltainen tahto ja taipumus vieraantuneisuuteen sekä narratiiviseen kryptisyyteen, mutta se työstää vaikutteensa joksikin selvästi omaksi ja aidoksi. Elokuvasta muodostuu häiritsevä tutkielma auktoriteetista, autonomiasta ja sellaisista viettelevistä mekanismeista, jotka esittävät hallinnan huolenpitona.\n\nDiego Ginartes Rodríguez (kääntänyt Ailiina Saaristo)","poster":"https://hiff.fi/wp-content/uploads/airtable/4bea1cfe34fe340dcc9d438dd4db0c7c-large.png","trailer_url":"https://www.youtube.com/embed/Eotmd5Qi1o4?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/glorious-summer/","imdb":"https://www.imdb.com/title/tt35521189/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_glorious%20summ"},"content_warnings":[],"showing_ids":["recDp0kOw4hB8Slvv","recdt7elVK7Eo3R0j","recgJlvoceoaKmymE"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"god-will-not-help","title":"God Will Not Help","original_title":"Bog neće pomoći","url":"https://hiff.fi/ohjelma/god-will-not-help/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Dark Feminine"],"keywords":["Usko","Outoa","Epookki","Jännitys"],"countries":["Italia","Kreikka","Kroatia","Ranska","Romania","Slovenia"],"directors":["Hana Jušić"],"cast":["Dimas Danang","Ana Marija Veselčić","Filip Đurić"],"languages":["kroatia","espanja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":137,"year":2025,"logline":"Tummasävyisessä epookissa syvästi uskonnollinen Teresa saapuu syrjäiseen kroatialaiseen paimentolaiskylään mukanaan edesmenneen aviomiehensä luut ja kertoo olevansa paikallisen miehen leski.","description_text":"Kroatialaisen Hana Jušićin God Will Not Help on nimensä veroinen. Karulle ja köyhälle paimentolaisseudulle sijoittuva ankara tarina ei päästä ketään helpolla. Katsoja saa jännittää Jana Plećašin komeasti kuvaaman elokuvan käänteitä viime metreille asti. Henkilöt puolestaan kärvistelevät kovan elämän ja kielitaidon puutteen hetteikössä.\n\nTarina alkaa, kun chileläinen Teresa ilmestyy kroatialaisen Milenan kotitilalle ja kertoo olevansa tämän veljen Markon leski. Merten taakse paremman elämän toivossa matkanneen Markon kohtalo ei ole saavuttanut kotiväkeä, sillä eletään 1900-luvun alkua.\n\nTeresa osaa vain espanjaa ja Milena kroaattia. Teresan muistikirjan naivististen maalausten ja Milenan käsityön avulla naiset selvittävät tilanteita toisilleen. Milenan veljen Nikolan saavuttua paikalle Teresa vaatii päästä tapaamaan Markon toista veljeä Ilijaa. Näin tapahtuukin, kohtalokkain seurauksin.\n\nNerokkaasti Jušic kertoo meille kaiken oleellisen: henkilöt puhuvat toisilleen kuin toinen ymmärtäisi, ja näin saamme tietää, mitä he ajattelevat. Manuela Martellin, Ana Marija Veselčićin ja muiden vahvoja roolisuorituksia tässä ällistyttävän todentuntuisessa elokuvassa säestää jylhä musiikki.\n\nJaana Semeri","poster":"https://hiff.fi/wp-content/uploads/airtable/06a18d6a8e0978797cfcc687e90007d3-large.jpg","trailer_url":"https://www.youtube.com/embed/-X-jfIBp1Jg?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/god-will-not-help/","imdb":"https://www.imdb.com/title/tt37537475/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_god%20will%20not"},"content_warnings":["Ahdistus"],"showing_ids":["rec5odevQCrDYeTmi","recKoVERaaHmX9KLa","recLplw5G8YLTybYD"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"good-boy","title":"Good Boy","original_title":null,"url":"https://hiff.fi/ohjelma/good-boy/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Toisenlajiset"],"keywords":["Tekstitetty/puhuttu suomeksi","Angsti","Eläimet","Kauhu"],"countries":["Yhdysvallat"],"directors":["Ben Leonberg"],"cast":["Indy","Shane Jensen","Arielle Friedman","Larry Fessenden"],"languages":["englanti"],"subtitles":["suomi"],"age_rating":"K16","duration_min":72,"year":2025,"logline":"Koiran näkökulmasta kerrotussa kauhuelokuvassa novascotiannoutaja Indy on ainoa, joka aistii uhan ja voi suojella omistajaansa vanhan talon kiroukselta.","description_text":"Koirien aistihavainnot ovat kymmenkertaiset ihmisen aisteihin verrattuna. Koira näkee, kuulee ja haistaa enemmän kuin me koskaan voisimme. Koira on valpas, sillä se on valmis puolustamaan laumaansa viimeiseen asti.\n\nTämän havainnon pohjalle rakentuu Good Boy , maailman ensimmäinen koiran näkökulmasta kerrottu kauhuelokuva. Ohjaaja Ben Leonbergin oma koira, novascotiannoutaja Indy esittää pääosaa. Indy ja hänen omistajansa muuttavat kaupungista miehen menehtyneen isoisän taloon keskelle maaseutua. Pimeyden vallatessa talon huoneet ja painajaisten täyttäessä päivät Indy on ainoa, joka aistii uhan jokaisessa nurkkauksessa ja joka voi suojella omistajaansa talon kiroukselta.\n\nGood Boy on vahvimmillaan löytäessään kauhua erinomaisesti valituista ympäristöstä. Harvoin syksyinen metsä, hautausmaa tai sateinen yö kouraisevat vatsanpohjasta samalla tavalla kuin elokuvan vahvimmissa kohtauksissa.\n\nElokuva ei olisi oma itsensä ilman Indy-koiraa. Leonbergin ohjaus välttelee perinteisesti elokuvissa korostettuja ihmiskasvoja keskittyen niiden sijaan Indyn ilmaisuvoimaisiin silmiin. Koiran viattomuus, äänetön havainnointi ja yllättävä rohkeus luovat ikimuistoisia ja liikuttaviakin hetkiä, jotka painuvat visusti mieleen. Antakaa tälle koiralle Oscar!\n\nJoonas Kallonen","poster":"https://hiff.fi/wp-content/uploads/airtable/26d6b7e5b4fe9a37e8b8ad96a150be95-large.jpg","trailer_url":"https://www.youtube.com/embed/q4-CRkd_74g?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/good-boy-2025/","imdb":"https://www.imdb.com/title/tt35521922/?ref_=nv_sr_srsg_3_tt_8_nm_0_in_0_q_good%20boy"},"content_warnings":["Ahdistus","Kuolema","Sairaus"],"showing_ids":["recZkEntn1oqCOLRE","recDjsnYbqwNGBrvb","recS5eFW6YPt4rczu"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"her-private-hell","title":"Her Private Hell","original_title":null,"url":"https://hiff.fi/ohjelma/her-private-hell/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Jännitys","Rikos","Outoa","Sci-fi"],"countries":["Tanska","Yhdysvallat"],"directors":["Nicolas Winding Refn"],"cast":["Sophie Thatcher","Charles Melton","Havana Rose Liu","Shioli Kutsuna","Aoi Yamada"],"languages":["englanti","japani"],"subtitles":["osittain englanti"],"age_rating":"K16","duration_min":110,"year":2026,"logline":"Nicolas Winding Refn tekee paluun unenomaisella tunnelmapalalla, joka sijoittuu dystooppiseen tulevaisuuteen.","description_text":"Auteur-suosikki Nicholas Winding Refn tekee näyttävän paluun elokuvien pariin kymmenen vuoden odotuksen jälkeen. Pusherista ja Drivesta (R&A 2011) tunnettu ohjaaja on siirtynyt uusille unenomaisille urille, mikä varmasti miellyttää kovan luokan cinefiilejä. Musiikista vastaa Brian De Palman klassikkoelokuvien ja useiden kulttiteosten säveltäjä Pino Donaggio, jonka tunnelmalliset sävellykset luovat tunteellisen pohjan kylmääville tapahtumille.\n\nGiallomaisessa, neonväreihin uppoutuvassa ja dystooppisessa scifi-elokuvassa näyttelijä Elle (Sophie Thatcher) etsii isäänsä taivaisiin kohoavissa tulevaisuuden tornitaloissa. Onko murhaavalla myyttisellä ”nahkamiehellä” jotain tekemistä asian kanssa? Ja miten amerikkalaissotilaan (Charles Melton) tyttären etsintä ja kohtaaminen Yakuzan kanssa vuosia aikaisemmin liittyvät asiaan?\n\nJuonella ei ole suurta roolia elokuvassa, vaan Refn keskittyy sen sijaan erinomaiseen miljöön ja äänen käyttöön. Elokuvan visuaalinen ilme on NWR vietynä kaikkein äärimmilleen, ja hänen faneillensa löytyy elokuvasta paljon tarttumapintaa. Her Private Hell palkitsee heidät, jotka pitävät oudosta ja konventioita uhmaavasta elokuvakerronnasta.\n\nJuho Lipponen","poster":"https://hiff.fi/wp-content/uploads/airtable/aa3fbbf1a1c957127ea918897f1a5af2-large.jpg","trailer_url":"https://www.youtube.com/embed/C
