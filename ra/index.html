s seksuaalisen heräämisen kynnyksellä. Makuuhuoneensa turvasta hän lähettää loitsun maailmaan, mutta lopulta kupla puhkeaa.\n\nAikaulottuvuuksien välillä liikkuva Boa esittelee nuoren, kenties suoraan keskiajalta tulleen munkin, jonka modernin painonnostosalin kajastus lumoaa. Boa on häijyn lihallinen kertomus maskuliinisuudesta ja kieroutuneesta kehokulttuurista.\n\nIsosisko on lähtemässä seuraavana päivänä kauas pois. Hän ei voi paljastaa oikeaa syytä lähtöönsä, mutta kertoo pikkusiskolleen vielä yhden viimeisen iltasadun, joka kertoo kaupungista, jonka ikuinen yö on nielaissut. Keväällä Cannesissa nähty City of Owls rakentaa kekseliään, sadun muotoon verhotun metaforan.\n\nNäytöksen räjähtävällä energialla päättävä Orla on tekijöiden itsensä kuvaavasti tiivistämänä “ekofeministinen rapmusikaali oikeudenmukaisuudesta”. Se on kertomus tyrannin hallitsemassa valtakunnassa elävästä Orlasta, joka nousee vastarintaan. Vahvasti perinteisen tsekkiläisen satusurrealismin puoleen niiaava Orla yhdistelee animaatiota filmille kuvattuun materiaalin luoden uniikin, kuvankauniin kokonaisuuden.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/1d8a34d616c57f8c8d9c99e1b51a88b3-large.jpg","trailer_url":null,"links":{},"content_warnings":["Ahdistus","Väkivalta","Itsetuhoisuus","Seksuaalinen kuvasto"],"showing_ids":["recFhiPqn5Bxc6AyO"],"shorts":[{"title":"Stallion and a Crystal Ball","directors":["Christian Avilés"],"countries":["Espanja"],"duration_min":20,"year":2026},{"title":"Boa","directors":["Alexandre Dostie"],"countries":["Ranska"],"duration_min":25,"year":2025},{"title":"City of Owls","directors":["Zhenia Kazankina"],"countries":["Italia","Ranska","Saksa"],"duration_min":13,"year":2026},{"title":"Orla","directors":["Marie Lukáčová"],"countries":["Tšekki","Slovakia"],"duration_min":21,"year":2026}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-silmakarkkia","title":"R&A Shorts: Silmäkarkkia","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-silmakarkkia/","is_film":true,"event_types":["elokuvat"],"genres":["Animaatio","Fiktio"],"themes":["Animoituja unia"],"keywords":["Fantasia","Eläimet","Elämäkerta","Kirjallisuus","Outoa","R&A Shorts"],"countries":["Espanja","Iran","Iso-Britannia","Ranska","Saksa"],"directors":[],"cast":[],"languages":["englanti","japani","espanja","Farsi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":55,"year":null,"logline":"Näytöksen täydeltä silmäniloa ja esteettisiä elämyksiä – tämä on täysi kattaus vuoden visuaalisesti vaikuttavimpia lyhäreitä!","description_text":"Nannaa näköaistille! Tämä ylitsepursuileva namipussi pitää sisällään sekoituksen kauneimpia, kiehtovimpia ja esteettisesti elähdyttävimpiä lyhytelokuvia, joiden sisältö on kuitenkin kaikkea muuta kuin hattarahöttöä.\n\nViime vuonna maailman merkittävimmillä animaatiofestivaaleilla Annecyssa parhaana opiskelijaelokuvana palkittu Zootrope on pieni pysäytyskuva eläintarhasta. Hienostuneen murretulla paletilla väritetyn 2D-animaation tekstuuri muistuttaa tussipiirosta.\n\nMuutama vuosi sitten The Debutante -työllään laajalti hurmannut Elizabeth Hobbes palaa uudella, vuonna 1920 julkaistuun, samannimiseen novelliin perustuvalla animaatiolla Daughters of the Late Colonel . Anarkistisen rajoittamattomina liikkuvat viivat, jotka piirretään perinteisesti musteella ja maaleilla paperilla, kehystävät tarinan keski-ikäisten siskosten vapautumisesta ankean isänsä ikeen alta.\n\nHappoisaa kaaosenergiaa tarjoileva UM on taitelija Nieton uusin luomus. Neonväreissä hehkuvassa pimeän puolen kertomuksessa lintuihmiset käyvät raivoisaan taistoon demonisia voimia vastaan.\n\nCorpus Christi on kertomus Adelasta, jonka mieli on järkkynyt. Koska kukaan ei oikein tunnu osaavan auttaa, päätyy hän etsimään vastauksia uskonnon parista. Vakavan aihepiirin reunustaa ennennäkemättömän upealla animaatiotyylillä tehty toteutus, joka saa koko elokuvan näyttämään yhdeltä isolta ristipistotyöltä.\n\nDaria’s Night Flowers kertoo Iranin naisista, salatusta kukkien kielestä ja sapfisesta rakkaustarinasta. Sinisen sadoissa sävyissä hehkuva elokuva hypnotisoi katsojansa.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/727fe0940460568c64bbfc41af2ffefa-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recUo45KHcIuXw9w9"],"shorts":[{"title":"Zootrope","directors":["Léna Martinez"],"countries":["Ranska"],"duration_min":8,"year":2025},{"title":"Daughters of the Late Colonel","directors":["Elizabeth Hobbs"],"countries":["Iso-Britannia","Saksa"],"duration_min":9,"year":2026},{"title":"UM","directors":["Luis Nieto"],"countries":["Ranska"],"duration_min":9,"year":2025},{"title":"Corpus Christi","directors":["Bea Lema"],"countries":["Espanja"],"duration_min":13,"year":2025},{"title":"Daria's Night Flowers","directors":["Maryam Tafakory"],"countries":["Iran","Ranska","Iso-Britannia"],"duration_min":16,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-skabmagovat-esittaa-csv-nayta-saamen-henkea","title":"R&A Shorts: Skábmagovat esittää: ČSV – Näytä Saamen henkeä","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-skabmagovat-esittaa-csv-nayta-saamen-henkea/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio","Dokumentti"],"themes":["Fight the Power"],"keywords":["Alkuperäiskansat","Luontosuhde","Yhteiskunta","Badass","R&A Shorts"],"countries":["Norja","Ruotsi","Saamenmaa","Suomi"],"directors":[],"cast":[],"languages":["saame","suomi","norja","North Sámi","koltansaame","eteläsaame"],"subtitles":["englanti"],"age_rating":"K12","duration_min":95,"year":null,"logline":"Alkuperäiskansojen elokuvafestivaali Skábmagovatin kuratoimassa näytöksessä nähdään uusimpia saamelaisia lyhytelokuvia, jotka nivovat yhteen tarinoita toivosta, unelmista, vastarinnasta, nuoruuden tärkeistä käännekohdista ja kolonialismin tuottamista mielettömyyksistä.","description_text":"Skábmagovat čájeha: ČSV – Čájet Sámi Vuoiŋŋa\n\nSkábmagovat čájeha goalmmát geardde ovttasbarggus Helssega Internášunála Filbmafestiváliin sámi oanehisfilmma varrasepmosiid, mat dolvot geahčči Sámieatnama váibmui. ČSV – Čájet Sámi Vuoiŋŋa -oanehisfilbmačájáhus čatná oktii muitalusaid doaivagis, nieguin, vuostálastimis, nuorravuođa dehálaš jorggáldagain ja kolonialismma buvttadan mielahisvuođas.\n\nČájáhusa filmmat leat čohkkejuvvon Skábmagovat-filbmafestivála jagi 2026 prográmmas, man festiválatemán lei girjás ráhkisvuohta. Dán temá ulbmilin lei čalmmustahttit ráhkisvuođa eamiálbmogiid geahčastagas: mo ráhkisvuohta lea dálkkodahtti vuostevuoibmi kolonialisma dagahan háviide, ja dasa gullá romanttálaš ráhkisvuođa lassin earret eará fuolkevuohta, válljejuvvon bearaš, servošat, luondu, eallit – buot mii eallá.\n\nSkábmagovat lea internašunála dáhpáhus, mii buktá oidnosii sámi ja eará eamiálbmotfilmma muitalusaid Anáris juohke ođđajagimánu. Čájáhusa lea kurateren Skábmagovaid dáiddalaš jođiheaddji Radio-JusSunná / Sunna Nousuniemi.\n\n***\n\nSkábmagovat esittää yhteistyössä Rakkautta & Anarkiaa -elokuvafestivaalin kanssa saamelaisen lyhytelokuvan uutuudet, jotka saattelevat katsojan Saamenmaan sydämeen. ČSV – Näytä Saamen henkeä -lyhytelokuvanäytös punoo yhteen tarinoita toivosta, unelmista, vastarinnasta, nuoruuden keskeisistä käännekohdista ja kolonialismin tuottamista mielettömyyksistä. Näytöksen on kuratoinut Skábmagovat-festivaalin taiteellinen johtaja Radio-JusSunná / Sunna Nousuniemi.\n\nOahpes Bahá sukeltaa 17-vuotiaan karasjokelaisen Elli Annen ajatuksiin, kun toivo ja unelmat joutuvat koetukselle. Se tutkii ristiriitaa saamelaiskulttuurin ulkoisen kuvan ja yksilön sisäisen kokemuksen välillä. Miten pitkään Elli Anne voi pitää kiinni Saamenmaan unelmastaan?\n\nMu gieđas – Minun kädessäni on kertomus alkuperäiskansa-aktivisti Niillas Sombysta ja se tutkii saamelaisten henkilökohtaisia ja historiallisia taisteluita. Elokuvassa kuljetaan Sombyn vankilakokemuksesta protesteihin ja surrealistisiin kohtaamisiin, ja siten se tarjoaa katsojalle ainutlaatuisen näkymän yhden miehen poikkeukselliseen matkaan.\n\nElokuvassa Eallu lea Eallin nuori saamelainen poronhoitajanainen tuskailee ristiriidan keskellä: lähteäkö opiskelemaan vai jatkaako esivanhempiensa perinteistä elämäntapaa. Lyhyt dokumenttielokuva seuraa hänen matkaansa ja tutkii uhanalaisen saamelaisen kulttuuriperinnön eri puolia nyky-yhteiskunnassa.\n\nSiõrškuäđam – Vaietut askeleet on tanssielokuva saamelaisalueen ulkopuolella kasvaneesta kolttasaamelaisesta Laurasta, joka katrilli-tanssin avulla kurkottaa kohti tuntemattomaksi jäänyttä kulttuuriperintöään.\n\nNorjan korkein oikeus on langettanut tuomion, että porojen laidunmaille rakennettu tuulivoimala rikkoo saamelaisten ihmisoikeuksia. Siitä huolimatta tuuliturbiineja ei ole purettu. Elokuvassa Gumppe Guvlui nuoret saamelaisaktivistit yrittämään protestoinnillaan saada hallituksen kantamaan vastuunsa.","poster":"https://hiff.fi/wp-content/uploads/airtable/a17306510150390b9fbb17944041ccf0-large.jpg","trailer_url":null,"links":{},"content_warnings":["Stroboefekti","Kolonialismi"],"showing_ids":["recit83fC04lFm7g0"],"shorts":[{"title":"Oahpes Bahá","directors":["Vegard Bjørsmo","Silje Bürgin-Borch"],"countries":["Saamenmaa","Norja"],"duration_min":12,"year":2025},{"title":"Mu gieđas – Minun kädessäni","directors":["Liselotte Wajstedt","Marja Helander"],"countries":["Saamenmaa","Ruotsi","Norja","Suomi"],"duration_min":24,"year":2025},{"title":"Eallu lea Eallin","directors":["Eila Muotka"],"countries":["Saamenmaa","Norja"],"duration_min":18,"year":2025},{"title":"Siõrškuâđam – Vaietut askeleet","directors":["Laura Feodoroff","Kati Kallio"],"countries":["Saamenmaa","Suomi"],"duration_min":13,"year":2025},{"title":"Gumpe Guvlui","directors":["Johannes Vang"],"countries":["Saamenmaa","Norja"],"duration_min":28,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-shorts-toisenlajiset","title":"R&A Shorts: Toisenlajiset","original_title":null,"url":"https://hiff.fi/ohjelma/ra-shorts-toisenlajiset/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti","Fiktio"],"themes":["Toisenlajiset"],"keywords":["Eläimet","Perhesuhteet","Mielenterveys","Yhteiskunta","R&A Shorts"],"countries":["Belgia","Espanja","Sveitsi","Unkari","Yhdysvallat"],"directors":[],"cast":[],"languages":["englanti","hollanti","unkari","katalaani"],"subtitles":["englanti"],"age_rating":"K12","duration_min":75,"year":null,"logline":"Elokuvallinen rakkauskirje kissalle, muodonmuutos karhuksi ja kurkistus kuuluisan kilpahevosen jet-set-elämään – tämä on näytös täynnä eläimellistä menoa.","description_text":"Tämän näytöksen lyhytelokuvat katsovat kohti eläimiä ympärillämme ja eläintä meissä.\n\nAir Horse One -dokumentti seuraa 15-vuotiaan mestariestehyppääjä Legacyn elämää. Hevosta lennätetään ympäri maailmaa huippuluokan kalustolla henkilökohtaisten huoltojoukkojen seuratessa mukana, aivan kuten huippu-urheilijalla konsanaan. Mutta onko Legacyn elämä todella etuoikeutettua jet set -elämää ja mitä se oikeastaan hevoselle tarkoittaisi?\n\nKaikin tavoin tavallisen unkarilaisperheen elämä sekoittuu, kun perheen kiltti ja tunnollinen tytär muuttuu karhuksi. Vapaudenkaipuu saa täyttymyksensä metamorfoosin myötä elokuvassa Something Wild .\n\nHenry Is a Girl Who Likes to Sleep on hellä elokuvallinen rakkauskirje ohjaaja Marthe Petersin kissalle. Poeettinen tutkielma pohtii ihmisyyden ja eläimyyden valtasuhdetta lempeällä kosketuksella.\n\nNobody Barks -elokuvan lähtökohta on traaginen: täti ajaa vahingossa siskonpoikansa rakkaan lemmikkikoiran päälle. Hän päätyy sepittämään armollisen valheen siitä mihin koira oikein on mennyt. Elokuvan loppukohtaus pehmittää paatuneimmankin sydämen.\n\nAnnu Suvanto","poster":"https://hiff.fi/wp-content/uploads/airtable/1d097c0b228c1b7caa3192471091ccf4-large.jpg","trailer_url":null,"links":{},"content_warnings":["Onnettomuus"],"showing_ids":["recGiFDQT5mfq26s3"],"shorts":[{"title":"Air Horse One","directors":["Lasse Linder"],"countries":["Belgia","Sveitsi"],"duration_min":21,"year":2025},{"title":"Something Wild","directors":["Zsuzsanna Konrád"],"countries":["Unkari","Yhdysvallat"],"duration_min":21,"year":2025},{"title":"Henry Is a Girl Who Likes to Sleep","directors":["Marthe Peters"],"countries":["Belgia"],"duration_min":13,"year":2026},{"title":"Nobody Barks","directors":["Júlia Coldwell Serra"],"countries":["Espanja"],"duration_min":20,"year":2025}],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-talks-x-animalia-kana","title":"R&A Talks x Animalia: Kana","original_title":null,"url":"https://hiff.fi/ohjelma/ra-talks-x-animalia-kana/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Talks"],"keywords":["Eläimet","Maksuton"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duration_min":45,"year":null,"logline":"Kana-elokuvan näytöstä seuraa asiantuntijakeskustelu eläinten oikeuksista yhteistyössä Animalian kanssa.","description_text":"Ilmainen keskustelutilaisuus järjestetään elokuvateatterissa Kana -elokuvan näytöksen jälkeen. Liput elokuvaan myydään erikseen elokuvan omalla sivulla.\n\nEläinoikeusjärjestö Animalian kanssa yhteistyössä toteutettu paneelikeskustelu pureutuu kanan elämään eri näkökulmista. Asiantuntijat Tiina Ollila, Laura Uotila ja Pinja Mustajoki keskustelevat siitä, miltä kanan elämä yleisesti näyttää, ja miten ihminen voi valinnoillaan siihen vaikuttaa.\n\nTiina Ollila työskentelee Animaliassa erityisasiantuntijana. Hän on myös väitöskirjatutkija ja tietokirjailija, joka on perehtynyt tuotantoeläimiin ja teurastukseen. Ollilalta on juuri ilmestynyt kirja Broilerin tarina, joka pureutuu Suomen yleisimmän linnun lyhyeen elämään. Hän on elänyt kotikanojen kanssa vuosikymmenen ajan.\n\nLaura Uotila on Animalian eläinsuojeluasiantuntija, joka perehtynyt etenkin eläimiä koskevaan lainsäädäntöön ja eläinpolitiikkaan. Hän on opiskellut myös eläintenkouluttajaksi sekä elänyt vuosia tuotantotiloilta pelastettujen kanojen kanssa.\n\nPinja Mustajoki on tutkinut laajasti eläimen roolia kameran edessä. Mustajoki on perehtynyt ihmisen ja eläimen välisten valtasuhteiden elokuvallisia muotoja niin valkokankaalla kuin salakuvatuilla eläinoikeusvideoilla.\n\nKeskustelun vetää Nadja Uusiperhe, joka opiskelee ohjausta Teatterikorkeakoulussa. Hän käsittelee töissään muunlajisten ja ihmisten välisiä suhteita.","poster":"https://hiff.fi/wp-content/uploads/airtable/415542315a48426bb9320c108a5fad85-large.png","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["rec5inXGI34P5A34u"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-talks-x-lux-yleisopalkinto","title":"R&A Talks x LUX-yleisöpalkinto","original_title":null,"url":"https://hiff.fi/ohjelma/ra-talks-x-lux-yleisopalkinto/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Talks"],"keywords":["Yhteiskunta","Maksuton"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duration_min":45,"year":null,"logline":"LUX-yleisöpalkinto juhlistaa eurooppalaista elokuvaa ja edistää keskustelua yhteiskunnallisista aiheista. Paneelikeskustelu keskittyy tasa-arvoon ja naisten asemaan Euroopan elokuvateollisuudessa.","description_text":"LUX-yleisöpalkinnon ehdokaselokuvat lisäävät tietoisuutta ajankohtaisista yhteiskunnallisista ja poliittisista kysymyksistä. Tässä paneelikeskustelussa keskitytään tasa-arvoon ja naisten asemaan Euroopan elokuvateollisuudessa sekä keskustellaan EU:n elokuvarahoitusmuodoista. Keskustelijoina ovat R&A:n Kotimaisen gaalaelokuvan Yön lapsen ohjaaja Hanna Bergholm, Media Deskin toiminnanjohtaja Liisa Sauri sekä Euroopan parlamentin jäsen Sirpa Pietikäinen (EPP, kok.). Keskustelun moderoi R&A:n toiminnanjohtaja Pauliina Ståhlberg.\n\nKeskustelu järjestetään yhteistyössä Euroopan parlamentin Suomen-toimiston kanssa. LUX-yleisöpalkinto on Euroopan suurin yleisöäänestyksellä myönnettävä elokuvapalkinto, jonka voittajan kansalaiset valitsevat yhdessä Euroopan parlamentin jäsenten kanssa. Se korostaa Euroopan parlamentin sitoutumista kulttuuriin ja koulutukseen tukemalla eurooppalaista elokuvataidetta ja edistämällä kulttuurista monimuotoisuutta. Palkinnon myöntävät vuosittain Euroopan parlamentti ja European Film Academy yhteistyössä Euroopan komission ja Europa Cinemas -verkoston kanssa.\n\nKeskusteluun on vapaa pääsy, ja se järjestetään Bio Rex Lasipalatsissa maksuttoman Sentimental Value -näytöksen jälkeen.","poster":"https://hiff.fi/wp-content/uploads/airtable/64f20b389f98e8b958d3c8cd5a3eaeb5-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recnutqYKo0mG3ZGW"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-talks-x-turun-yliopisto-arru","title":"R&A Talks x Turun yliopisto: Árru","original_title":null,"url":"https://hiff.fi/ohjelma/ra-talks-x-turun-yliopisto-arru/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Talks"],"keywords":["Alkuperäiskansat","Maksuton"],"countries":[],"directors":[],"cast":[],"languages":["englanti"],"subtitles":[],"age_rating":null,"duration_min":45,"year":null,"logline":"Árru-elokuvan teemoihin pohjautuvassa englanninkielisessä paneelikeskustelussa tarkastellaan alkuperäiskansojen oikeuksien edistämisessä viime aikoina tapahtunutta kehitystä sekä edelleen olemassa olevia haasteita Norjassa, Ruotsissa ja Suomessa.","description_text":"Ilmainen keskustelutilaisuus järjestetään elokuvateatterissa Árru -elokuvan näytöksen jälkeen. Liput elokuvaan myydään erikseen elokuvan omalla sivulla.\n\nMillaisia askelia saamelaisten oikeuksien edistämisessä on otettu ja mitkä kysymykset ovat yhä ratkaisematta Norjassa, Ruotsissa ja Suomessa? Voidaanko instituutioita ja valtasuhteita muuttaa ja millä tavoin? Millainen rooli tieteellä ja taiteella voi olla sovintoprosesseissa?\n\nÁrru tarkastelee Saamenmaalla lisääntyvää maa-alueiden hyödyntämistä ja maankäytön aiheuttamaa painetta henkilökohtaisen, sukupolvia ylittävän tarinan kautta.\n\nElokuvanäytöksen jälkeisessä keskustelutilaisuudessa syvennytään elokuvan teemoihin ja erityisesti alkuperäiskansojen oikeuksien viimeaikaiseen kehitykseen ja ajankohtaisiin haasteisiin. Pohjoismaisten saamelaisten totuus- ja sovintokomissioiden työn pohjalta pohditaan, voidaanko instituutioita ja valtasuhteita muuttaa ja millainen rooli tieteellä ja taiteella voi olla sovintoprosesseissa.\n\nMukana keskustelemassa ovat Árru -elokuvan ohjaaja Elle Sofe Sara sekä Petra Laiti. Keskustelua moderoi Turun yliopiston oikeustieteen apulaisprofessori Daniela Alaattinoglu.","poster":"https://hiff.fi/wp-content/uploads/airtable/b3e694dae59a6e7f8c1c2a9c2c377cb8-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["rec8RbAuTScAfAo15"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-talks-x-the-ulkopolitist-the-red-hangar","title":"R&A Talks x The Ulkopolitist: The Red Hangar","original_title":null,"url":"https://hiff.fi/ohjelma/ra-talks-x-the-ulkopolitist-the-red-hangar/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Talks"],"keywords":["Historia","Yhteiskunta","Maksuton"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duration_min":30,"year":null,"logline":"Ulkopolitist-median kanssa yhteistyössä järjestettävä paneelikeskustelu paneutuu The Red Hangar -elokuvan teemoihin.","description_text":"Vuoden 1973 sotilasvallankaappaus jätti syvät arvet Chileen ja koko Latinalaiseen Amerikkaan. Tervetuloa The Ulkopolitistin ja R&A-festivaalin keskusteluun The Red Hangar -elokuvan näytöksen päätteeksi! Keskustelussa taustoitetaan elokuvaa sekä pohditaan tapahtumien ajankohtaisuutta Chilen nykytilanteelle sekä Yhdysvaltojen Trumpin kauden ulkopolitiikalle.\n\nKeskustelussa on mukana suomenchileläinen tutkija Alfonso Padilla, joka pakeni Chilestä vuoden 1973 vallankaappauksen seurauksena. Hän tuo mukanaan arvokkaan, omakohtaisen näkökulman elokuvan kuvaamiin tapahtumiin. Toisena asiantuntijana on mukana Latinalaiseen Amerikkaan erikoistunut väitöskirjatutkija Ella Virtanen Helsingin yliopistosta. Moderaattorina toimii The Ulkopolitist ry:n puheenjohtaja ja Ulkopoliittisen instituutin tutkija Tomi Kristeri.\n\nTapahtuman järjestää The Ulkopolitist, joka on kansainvälisen politiikan ilmiöitä sekä suomalaista ulko- ja turvallisuuspolitiikkaa käsittelevä sitoutumaton verkkomedia. The Ulkopolitist on jo viidentoista vuoden ajan julkaissut analyysejä ja kommentteja tarjotakseen kriittisiä ja tuoreita näkökulmia suomalaisen ulkopoliittisen keskustelun taustaksi ja tueksi.","poster":"https://hiff.fi/wp-content/uploads/airtable/4c2cc77b8ab8d102c53c24e1fa39f4d2-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recgICURA9TXTCgy9"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-x-amos-andersonin-rahasto-miami-masterclass","title":"R&A x Amos Andersonin rahasto: Miami & Masterclass","original_title":null,"url":"https://hiff.fi/ohjelma/ra-x-amos-andersonin-rahasto-miami-masterclass/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjolan huiput"],"keywords":["Tekstitetty/puhuttu suomeksi","Rikos","Perhesuhteet","Ystävyys","Matka"],"countries":[],"directors":["Zaida Bergroth"],"cast":["Krista Kosonen","Sonja Kuittinen","Juhan Ulfsak","Alex Anton"],"languages":["suomi"],"subtitles":["englanti"],"age_rating":"K12","duration_min":164,"year":null,"logline":"Miami on rikosdraamaksi kehystetty road movie erilleen kasvaneista siskoista. Elokuvaa seuraa kiehtova masterclass-keskustelu ohjaaja Zaida Bergrothin ja näyttelijä Krista Kososen kanssa.","description_text":"Zaida Bergrothin rohkeassa elokuvassa erilleen kasvaneet siskot kohtaavat ja pääsevät toistensa ihon alle. Angela (Krista Kosonen) on säkenöivä showtanssija, kun taas pikkusisko Anna (Sonja Kuittinen) on arka maalaistyttö aikuisuuden kynnyksellä. Anna hullaantuu normeja rikkovaan Angelaan kuten upeisiin ihmisiin vain voi, ja ryhtyy kiertämään tämän kanssa tanssilavoja.\n\nMiami on velkojineen ja itämafioineen rikosdraamaksi kehystetty road movie. Jännitys on tyylinä rohkea veto, ja se keventää sisarusten kasvutarinaa. Samoin toimivat elokuvaa tahdittavat herkullisen glitteriset tanssikohtaukset sekä pauhaava pop. Aikaa vietetään tien päällä ja hämyisissä motelleissa. Nurkan takana odottavat elämän ahdistavat realiteetit, mutta kauniiden nuorten naisten huumaava valta pitää heidät liikkeessä. Päämääränä on Miami.\n\nElokuva tutkii, kuinka naisten rohkeutta ja normeja rikkovaa käyttäytymistä katsotaan vinoon. Kun naiset ottavat tilaa, se sekä kiehtoo että ärsyttää. Onkin hienoa nähdä näin voimakas tarina naisten perspektiivistä. Angela ja Anna ovat monisyisiä henkilöitä, jotka rakentavat tarinaansa, yhdessä.\n\nSaara Tuusa, R&A 2017","poster":"https://hiff.fi/wp-content/uploads/airtable/bd187f9068c80d604aaa3a884953dd4e-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/miami-2017/","imdb":"https://www.imdb.com/title/tt5822148/?ref_=fn_t_1"},"content_warnings":[],"showing_ids":["recPXsBvcY6kAybZC"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-x-puistokatu-4-everybody-to-kenmure-street","title":"R&A x Puistokatu 4: Everybody to Kenmure Street","original_title":null,"url":"https://hiff.fi/ohjelma/ra-x-puistokatu-4-everybody-to-kenmure-street/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["R&A Special Screenings"],"keywords":["Yhteiskunta","Maksuton"],"countries":["Iso-Britannia"],"directors":["Felipe Bustos Sierra"],"cast":["Emma Thompson","Kate Dickie","Keira Lucchesi"],"languages":["englanti","urdu","pandžabi"],"subtitles":["osittain englanti"],"age_rating":"K12","duration_min":98,"year":2025,"logline":"Puistokatu 4:n R&A-näytökseen teemana on tänä vuonna yhteisön voima! Aktivismidokkari Everybody to Kenmure Street kertoo skotlantilaisen naapuruston asukkaista, jotka nousevat vastarintaan naapureidensa karkoitusta vastaan. Dokumentin jälkeen kuulemme kahden Puistokatu 4:n jäsenen, Pihla Soinnunmaan ja Siiri Hännisen, kommenttipuheenvuorot yhteisön merkityksestä Stansvikin metsän suojelussa.","description_text":"Puistokatu 4:n R&A-näytökseen teemana on tänä vuonna yhteisön voima! Aktivismidokkari Everybody to Kenmure Street kertoo skotlantilaisen naapuruston asukkaista, jotka nousevat vastarintaan naapureidensa karkoitusta vastaan. Dokumentin jälkeen kuulemme kahden Puistokatu 4:n jäsenen, Pihla Soinnunmaan ja Siiri Hännisen, kommenttipuheenvuorot yhteisön merkityksestä Stansvikin metsän suojelussa. Ilmoittaudu mukaan Puistokatu 4:n verkkosivuilla , ilmoittautuminen aukeaa perjantaina 4.9.\n\nPuistokatu 4 on Helsingin Kaivopuistossa sijaitseva Tieteen ja toivon talo, joka edistää ympäristökriisissä tarvittavaa nopeaa kulttuurin muutosta.","poster":"https://hiff.fi/wp-content/uploads/airtable/550e86fb34a63d1775cac65061d451a0-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/everybody-to-kenmure-street/","imdb":"https://www.imdb.com/title/tt36966956/?ref_=nv_sr_srsg_0_tt_6_nm_0_in_0_q_everybody%20to%20ken"},"content_warnings":[],"showing_ids":["rec1gTDFPQhT7C5Bd"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-talks-x-uusi-juttu-live-kerma","title":"R&A Talks x Uusi Juttu: Live-Kerma","original_title":null,"url":"https://hiff.fi/ohjelma/ra-talks-x-uusi-juttu-live-kerma/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Talks"],"keywords":["Media","Maksuton"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duration_min":30,"year":null,"logline":"Uuden Jutun kulttuuriohjelma Kerman rakastettu livekeskustelu tekee paluun! Tällä kertaa pitkän linjan toimittajien Sonja Saarikosken, Hilla Körkön ja Olli Seurin debatti liittyy löyhästi elokuvaan Solomamma, joka nähdään keskustelun jälkeen.","description_text":"Ilmainen keskustelutilaisuus järjestetään elokuvateatterissa ennen Solomamma -elokuvan näytöstä. Liput elokuvaan myydään erikseen elokuvan omalla sivulla.\n\nKerma on Uuden Jutun supersuosittu kulttuuriohjelma, jossa toimittajat Sonja Saarikoski, Hilla Körkkö, Vaula Helin ja Oskari Onninen keskustelevat, debatoivat ja huutavat toistensa päälle ajankohtaisista kulttuuriaiheista.\n\nOhjelman lopuksi kukin keskustelija saa myös hieman omaa tilaa, jonka aikana hän saa vaahdota itselleen merkityksellisestä asiasta.\n\nKerma ilmestyy keskiviikkoisin Uudessa Jutussa, mutta aika ajoin Kerma rantautuu tavallisten kuolevaisten pariin live-esitysten muodossa. Silloin kannattaa tulla paikalle. Historian ensimmäinen live-Kerma koettiin juuri Rakkautta & Anarkiaa -festivaaleilla vuonna 2025.\n\nNäin Sonja Saarikoski kuvailee liven viehätystä:\n\n”Mielestäni live paljastaa, mikä Kermassa on parasta: mitä vain voi tapahtua. Emme tiedä, miten toinen reagoi tai mitä hän aikoo sanoa. On vain luotettava tilanteen kantavan, omien argumenttien pitävän. Aina ne eivät pidä. Sekin kuuluu pelin henkeen. Uskon, että live-Kermat auttavat meitä tekemään parempaa ohjelmaa. Yleisön reaktio on niin suora.”\n\nTässä live-Kermassa lauteille nousevat Sonja Saarikoski, Hilla Körkkö ja vieraileva debatoija, päätoimittaja Olli Seuri.\n\nHanki parempaa seuraa ja tule kokemaan Kerman jännite paikan päälle Rakkautta & Anarkiaa -festivaalille!","poster":"https://hiff.fi/wp-content/uploads/airtable/860d1e765bf59df289c8bcba3f58f8dc-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recVEbNeZG2ZmFLsW"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-x-vvo-interstellar-live","title":"R&A x VVO: Interstellar Live","original_title":null,"url":"https://hiff.fi/ohjelma/ra-x-vvo-interstellar-live/","is_film":false,"event_types":["tapahtumat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Musiikki","Sci-fi","Perhesuhteet"],"countries":[],"directors":["Christopher Nolan"],"cast":["Matthew McConaughey","Anne Hathaway","Michael Caine","Jessica Chastain","Casey Affleck"],"languages":["englanti"],"subtitles":["suomi"],"age_rating":"K12","duration_min":210,"year":null,"logline":"Vantaan Viihdeorkesteri ja Interstellar-elokuvan soundtrackilla soittava urkuvirtuoosi Roger Sayer herättävät Hans Zimmerin upean musiikin henkiin Musiikkitalon Interstellar-elokuvakonsertissa.","description_text":"Hans Zimmerin upean musiikin herättävät henkiin Vantaan Viihdeorkesteri ja elokuvan soundtrackilla soittava urkuvirtuoosi Roger Sayer. Kapellimestarina esiintyy Martin Gellner. Elokuvakonsertti toteutetaan Vantaan Viihdeorkesterin ja Rakkautta & Anarkiaa -elokuvafestivaalin yhteistyönä. Konsertti on loppuunmyyty.\n\nChristopher Nolanin ohjaama Interstellar (2014) sai ilmestyttyään viisi Oscar-ehdokkuutta. Yksi näistä tuli Hans Zimmerin huikeasta musiikista, jonka unenomaiset äänimaisemat kuljettavat katsojaa avaruuden tyhjyydessä ja eristäytyneisyydessä.\n\nElokuvassa entinen NASA-pilotti Cooper (Matthew McConaughey) lähtee vaaralliselle avaruusmatkalle etsimään uutta kotiplaneettaa kuolevalle ihmiskunnalle. Tytär Murph jää kotiin selvittämään ihmislajin pelastumisen kannalta ratkaisevaa tieteellistä ongelmaa. Interstellar on jälleen ajankohtainen, sillä Nolanin uusin elokuva The Odyssey saapui elokuvateattereihin kesällä.\n\nVantaan Viihdeorkesterin taiteellinen johtaja Lauri Porra kuvaa Interstellarin musiikkia kunnianhimoiseksi, emotionaalisesti voimakkaaksi ja soundiltaan ainutlaatuiseksi.\n\n”Hans Zimmer yhdistää mestarillisesti klassisia, elektronisia ja kokeellisia äänimaailmoja. Interstellarissa uruilla on poikkeuksellisen suuri rooli. Onkin hienoa, että käytössä ovat juuri Musiikkitalon upeat urut ja että niitä soittaa juuri Roger Sayer.”\n\nHuikeassa konsertissa esitetään koko elokuva isolta valkokankaalta, ja kaikki elokuvan musiikki kuullaan suuren sinfoniaorkesterin esittämänä.\n\nLisätietoa tapahtumasta Musiikkitalon sivuilla","poster":"https://hiff.fi/wp-content/uploads/airtable/cbf16375ef21a9d5af50bd969b452063-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/interstellar/","imdb":"https://www.imdb.com/title/tt0816692/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_inters"},"content_warnings":[],"showing_ids":["recLdZ4yAMXTOrYl8","recKiAXLm28RtzAYv"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"ra-x-yle-areenan-dokkarifestivaali-keinaan-mee-takas-somaliaan","title":"R&A x Yle Areenan Dokkarifestivaali: Keinaan, mee takas Somaliaan","original_title":null,"url":"https://hiff.fi/ohjelma/ra-x-yle-areenan-dokkarifestivaali-keinaan-mee-takas-somaliaan/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["R&A Special Screenings"],"keywords":["Tekstitetty/puhuttu suomeksi","Maksuton","Nuoruus"],"countries":["Suomi"],"directors":["Timo Korpi","Abdirahman Keinaan"],"cast":[],"languages":["suomi","somali"],"subtitles":[],"age_rating":"K12","duration_min":67,"year":null,"logline":"Keinaan tekee sen, mitä jotkut suomalaiset ovat jo pitkään toivoneet. Hän menee takaisin sinne, mistä on tullutkin, vaikka ei ole siellä koskaan ollutkaan. Keinaan matkustaa kuvaajansa Hamsan kanssa heidän vanhempiensa kotimaahan Somaliaan.","description_text":"“Mene takaisin sinne mistä olet tullutkin!”\n\nKeinaan ei ole koskaan käynyt Somaliassa. Vaikka ulkoministeriö kehottaa välttämään sinne matkustamista, lähtee hän kuvaajansa Hamsan kanssa toteuttamaan joidenkin suomalaisten toivetta ja suuntaa vanhempiensa kotimaahan.\n\nSisällissodan runtelema Somalia muistetaan lähinnä merirosvoista ja pommituksista. Se ei kuitenkaan ole enää se sama maa, jota Keinaan oppi lapsena pelkäämän – ihmisille on herännyt toivo paremmasta tulevaisuudesta.","poster":"https://hiff.fi/wp-content/uploads/airtable/62aa7bf8239816d87b6b94f738df8d60-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recPaOQLiQIhN1LoE"],"shorts":[],"cinema_release":null,"on_yle_areena":true},{"slug":"ra-x-yle-fml-nuorten-lyharikokonaisuus","title":"R&A x Yle: fml – nuorten lyhärikokonaisuus","original_title":null,"url":"https://hiff.fi/ohjelma/ra-x-yle-fml-nuorten-lyharikokonaisuus/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Nuoruus","Ystävyys","Kasvutarina","Maksuton","Tekstitetty/puhuttu suomeksi","R&A Shorts"],"countries":["Suomi"],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":"K12","duration_min":120,"year":null,"logline":"Erikoisnäytöksessä nähdään neljä uunituoretta nuorille suunnattua lyhytelokuvaa. Elokuvien katselun lisäksi tapahtumassa päästetään tekijät ääneen ja käydään keskustelua.","description_text":"Miks mä aina mokaan ja miksi totuuden kertominen on niin vaikeaa? Neljä yhden illan katastrofia, jotka eivät olekaan lopulta niin vakavia. Lyhytelokuvat on toteutettu osana Ylen, AVEK:in ja Kirkon Mediasäätiön Nuorten lyhytelokuvafestivaali -hanketta, ja ne yhdistyvät Yle Areenassa fml-nimiseksi sarjakokonaisuudeksi.\n\nNäytöksessä katsotaan kaikki lyhytelokuvat yhdessä tekijöiden kanssa. Lisäksi luvassa on keskustelu nuorten mahdollisuuksista päästä elokuva- ja media-alalle. Tilaisuuden juontaa näyttelijä, Yle Summerin Onks noloo? -podcastin juontaja Anni Iikkanen.\n\nTilaisuuden jälkeen Bio Rexin aulassa on media-alan meet & greet, jossa yleisöllä on mahdollisuus tavata ja kysyä media-alalle pääsystä alan ammattilaisilta.\n\nElokuvassa Gap Onnin ja Sofian somepersoonat eivät aivan vastaa todellisuutta. Mutta ehkä tapaaminen IRL ei olekaan niin kamalaa?\n\nRepale -elokuvassa esinahka repeää kesken sekstailun ja 18-vuotias Noel joutuu tekoälyn, terveydenhuollon ja tukahdutettujen tunteiden vuoristorataan, johon koulun seksivalistus ei häntä valmistanut.\n\nElokuvassa Misstakes Misstakes Olga ja Minni tekevät raskaustestin huoltoaseman vessassa. Tulos aiheuttaa paniikin, ja he joutuvat turvautumaan yllättävän tuttavan apuun – vain tajutakseen, että ovat mokanneet aivan eri tavalla kuin luulivat.\n\nEmilia tahtoo bailaa -elokuvassa keskeinen kysymys on, etsivätkö kaikki kotibileissä seuraa. Emilia haluaa vain bailata, mutta päätyy keskelle romanttisten suhteiden miinakenttää, jossa pääsy tanssilattialle vaatii enemmän, kuin hän osasi odottaa.","poster":"https://hiff.fi/wp-content/uploads/airtable/94fced36a6ff6d6aef9714243c1afe65-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":["recIPePVO963MhWeW"],"shorts":[{"title":"GAP","directors":["Malin Nyqvist"],"countries":["Suomi"],"duration_min":7,"year":2026},{"title":"Repale","directors":["Ilmari Nera"],"countries":["Suomi"],"duration_min":5,"year":2026},{"title":"Misstakes Misstakes","directors":["Krista Moisio"],"countries":["Suomi"],"duration_min":6,"year":2026},{"title":"Emilia tahtoo bailaa","directors":["Lotte Laitinen"],"countries":["Suomi"],"duration_min":7,"year":2026}],"cinema_release":null,"on_yle_areena":true},{"slug":"ra-jatkot-x-yle-teema-levoton-tuhkimo","title":"R&A-jatkot x Yle Teema: Levoton Tuhkimo","original_title":null,"url":"https://hiff.fi/ohjelma/ra-jatkot-x-yle-teema-levoton-tuhkimo/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["R&A Special Screenings"],"keywords":["Tekstitetty/puhuttu suomeksi","Musiikki","Historia","Elämäkerta","Ystävyys","Feelgood"],"countries":["Suomi"],"directors":["Mari Rantasila"],"cast":["Saku Taittonen","Alvari Stenbäck","Mauno Terävä","Samuel Kujala"],"languages":["suomi"],"subtitles":[],"age_rating":"K7","duration_min":88,"year":null,"logline":"Yle Teeman ja R&A:n yhteisnäytöksessä nähdään elokuva, joka keräsi Ylen 100 toive-elokuvaa -hankkeessa ylivoimaisesti eniten toiveita. Maksuton Levoton Tuhkimo -näytös kruunaa festivaalin jälkeisen lauantain R&A-jatkot Bio Rex Lasipalatsissa. Elokuva esitetään samaan aikaan Yle Teemalla ja se on katsottavana Areenassa jouluun 2027 asti.","description_text":"Yle Teeman ja Rakkautta & Anarkiaa -festivaalin tämänvuotisena yhteisnäytöksenä nähdään elokuva, joka keräsi Ylen 100 toive-elokuvaa -hankkeessa ylivoimaisesti eniten toiveita. Se on Mari Rantasilan ohjaama Dingo-draama Levoton Tuhkimo .\n\nR&A-näytös järjestetään lauantaina 3.10.2026 klo 21 Helsingin Bio Rexissä, ja se on yleisölle maksuton. Elokuva on katsottavana Yle Areenassa jouluun 2027 asti.\n\nYle Teema keräsi katsojilta elokuvatoiveita Ylen juhlavuotta 2026 varten keväällä 2025.\n\nToiveita tuli tuhansia ja toivottuja elokuvia oli satoja. 100 toive-elokuvaa on nimensä mukaisesti kokonaisuus, jossa nähdään suomalaisen elokuvan koko kaari 1920-luvulta tähän päivään. Kaikkien mahdollisuuksien joukosta juuri Levoton Tuhkimo nousi toivotuimmaksi. Juhlistamme asiaa erikoisnäytöksellä R&A:n kanssa.\n\n***\n\nDingon läpimurto 1980-luvun puolivälissä oli suomalaisen populaarikulttuurin poikkeuksellinen taitos: hetki, jolloin uusi tuntui todella uudelta. Mari Rantasilan ohjaama Levoton Tuhkimo vie keskelle hysteriakertoimia hipovaa aikakautta, jolloin meikkaavasta porilaisesta Pertti “Nipa” Neumannista tuli kokonaisen sukupolven palvoma ikoni.\n\nDingon musiikki yhdisti tarttuvat popmelodiat, uuden aallon tyylin ja romanttisen herkkyyden. Kappaleet kuten Sinä ja minä , Nahkatakkinen tyttö ja Autiotalo nousivat ajan tunnuslauluiksi, joiden runollinen kuvasto ja suomalainen melankolia puhuttelevat valtavaa yleisöä. Elämäkertaelokuva käy läpi yhtyeen nousun ja tuhon ja tarkastelee samalla tähteyden syntymistä ja sen hintaa. Miten yksittäisestä muusikosta tulee kansallinen pakkomielle? Entä mitä tapahtuu ihmiselle, jonka identiteetti alkaa sulautua julkiseen kuvaan?\n\nRantasilan ohjaus kulkee konserttien hurmoksesta kulissien taakse, missä ystävyys, luovuus ja paineet törmäävät toisiinsa. Pääroolin näyttelevä Saku Taittonen tavoittaa Neumannin karisman ja herkkyyden tavalla, joka paljastaa ikonin takaa hauraan ihmisen.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/b58e1064b11497b78d81cac4faa66103-large.jpg","trailer_url":"https://www.youtube.com/embed/4e37RXpM0mg?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/my-name-is-dingo/","imdb":"https://www.imdb.com/title/tt27141260/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_levoton"},"content_warnings":["Päihteiden ongelmakäyttö","Henkinen väkivalta","Mielenterveysongelmat"],"showing_ids":["recm3CW5FlOJ6cI7j"],"shorts":[],"cinema_release":null,"on_yle_areena":true},{"slug":"ra-leffavisa","title":"R&A-leffavisa","original_title":null,"url":"https://hiff.fi/ohjelma/ra-leffavisa/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Events"],"keywords":["Feelgood"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duration_min":null,"year":null,"logline":"Tule mukaan visaamaan! R&A:n pubivisa haastaa elokuvatietoutta ja palkitsee etevimmät leffafriikit juomalipuilla ja elokuvalipuilla. Kaikille soveltuva visa järjestetään 22.9 klo 19 ja haastava visa tositietäjille 26.9. klo 18. \n\nEnnakkoilmoittautumista ei tarvita! Pelata saa yksin, kaverin kanssa tai joukkueessa. \n\nLeffavisat järjestetään R&A:n virallisessa festivaalibaarissa Juova Hanahuoneessa. (Kaisaniemenkatu 3 b)","description_text":"","poster":"https://hiff.fi/wp-content/uploads/airtable/78ff39517374ac97d4b0ea3d3e1da41a-large.jpg","trailer_url":null,"links":{},"content_warnings":[],"showing_ids":[],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"rakastettu","title":"Rakastettu","original_title":"El ser querido","url":"https://hiff.fi/ohjelma/rakastettu/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Avainelokuvat"],"keywords":["Elokuvanteko","Perhesuhteet","Taide","Tekstitetty/puhuttu suomeksi"],"countries":["Espanja"],"directors":["Rodrigo Sorogoyen"],"cast":["Javier Bardem","Victoria Luengo","Melina Matthews"],"languages":["espanja","englanti","ranska"],"subtitles":["englanti"],"age_rating":"K12","duration_min":135,"year":2026,"logline":"Javier Bardemin tähdittämä draama on pistävän piinallinen mutta sitäkin herkempi kuvaus ohjaajaisän ja näyttelijätyttären kipeästä suhteesta ja elokuvan tekemisestä yhdessä.","description_text":"Huom! Toisin kuin sivulla aiemmin ilmoitettiin, elokuvassa on ainoastaan englanninkielinen tekstitys.\n\nMoninkertaisesti Goya-palkitun Rodrigo Sorogoyenin uutuus on pistävän piinallinen mutta sitäkin herkempi kuvaus isän ja tyttären suhteesta. Javier Bardem sulautuu rooliinsa juhlittuna elokuvaohjaaja Esteban Martinezina, joka päättää tarjota aikuiselle tyttärelleen (vaikuttava Victoria Luengo, joka loistaa myös Pedro Almodóvarin uutuudessa) suuren mahdollisuuden. Taiteilijaisä lähti Emilian elämästä kauan sitten, mutta nyt hän tarjoaa näyttelijäksi kasvaneelle tyttärelleen merkittävää roolia seuraavassa projektissaan. Onko tämä yritys hyvittää mennyttä aikaa? Elokuva seuraa tulevia kuvauksia.\n\nRakastettu on elokuva elokuvanteosta. Tähtipölyn ja glamourin sijaan Sorogoyenin leppymätön katse kohdistuu psykologiaan ja valtasuhteisiin. Bardemin ylistetty roolisuoritus on Guardianin Peter Bradshaw’n mukaan pelottavin sitten Menetetyn maan (2007).\n\nSaharan autiomaahan tuotu kuvausryhmä todistaa, kuinka hitaasti kasvava paine saavuttaa räjähdyspisteen. Laura Birn nähdään tarinan loppupuolella Martinezin uutena vaimona. Tyylittelyssään hiottu elokuva sai ensi-iltansa Cannesin festivaalin kilpasarjassa.\n\nSiiri Siltala","poster":"https://hiff.fi/wp-content/uploads/airtable/e9704118c96198eaf99f9ed1782c2cc0-large.jpg","trailer_url":"https://www.youtube.com/embed/PL7SITDOzh8?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/the-beloved-2026/","imdb":"https://www.imdb.com/title/tt33451014/?ref_=nv_sr_srsg_0_tt_6_nm_2_in_0_q_the%20beloved"},"content_warnings":["Henkinen väkivalta"],"showing_ids":["recAXrkk1kpcEnFeb","rec4Ams695WG3RetT"],"shorts":[],"cinema_release":{"label":"Ensi-ilta 6.11.","status":"dated","date":"2026-11-06"},"on_yle_areena":false},{"slug":"redoubt","title":"Redoubt","original_title":"Värn","url":"https://hiff.fi/ohjelma/redoubt/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Historia uusiksi"],"keywords":["Historia","Slow cinema","Yhteiskunta"],"countries":["Alankomaat","Iso-Britannia","Puola","Ruotsi","Suomi","Sveitsi","Tanska"],"directors":["John Skoog"],"cast":["Denis Lavant","Agnieszka Podsiadlik","Michalis Koutsogiannakis"],"languages":["ruotsi"],"subtitles":["englanti"],"age_rating":"K7","duration_min":81,"year":2025,"logline":"Kylmän sodan ydinuhkaa säikähtänyt maajussi (ruotsia puhuva Denis Lavant) alkaa omin käsin rakentaa pommisuojaa vähäeleisessä mustavalkodraamassa.","description_text":"Eletään kylmän sodan kylmimpiä vuosia eteläisen Ruotsin maaseudulla. Kaikkiin koteihin toimitetaan säännöllisin väliajoin toimintaohjeet ydinsodan syttymisen varalta. Yksin asuva Karl-Göran tutustuu ohjeisiin läpikotaisin ja alkaa rakentaa pommisuojaa pellon reunaan. Hän kiertää kylällä keräämässä romumetallia tarpeisiinsa ja nikkaroi omissa oloissaan yötä päivää. Kyläläiset suhtautuvat projektilleen omistautuneeseen, sosiaalisesti kömpelöön mieheen varauksella. Vain kylän lapset tuntuvat todella ymmärtävän Karl-Görania.\n\nRedoubtin elegantit, luonnonvaloa loistavat mustavalkokuvat ja äänisuunnittelun kirkkaus ovat jatkuva ilo aisteille. Minimalistisen elokuvan kantava voima on kuitenkin eurooppalaisen taide-elokuvan vakiokasvo Denis Lavant, joka elää lapsenomaisen, vainoharhaisen Karl-Göranin roolia joka solullaan. Kehollisesta eläytymiskyvystään tunnettu ranskalaisvirtuoosi on opetellut ruotsin alkeet toimittaakseen yhden myöhäisen uransa mieleenpainuvimmista roolisuorituksista. Elokuva osaa antaa tilaa Lavantin yhtä aikaa hienovaraiselle ja raa’an fyysiselle näyttelijäntyölle. Tuloksena on poikkeuksellinen kuvaus ulkopuolisuudesta, pakkomielteestä ja arkea määrittävästä kauhusta.\n\nAatos Ketvel","poster":"https://hiff.fi/wp-content/uploads/airtable/9923d18c6c99fb10a01685075a31da79-large.jpg","trailer_url":"https://www.youtube.com/embed/uSF3raJC854?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/redoubt-2025/","imdb":"http://imdb.com/title/tt27541205/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_queen%20at%20sea"},"content_warnings":[],"showing_ids":["rec50vkeifWnnvPi7","recY9QjPfKX7wOMr9","recXGwvlb407c8J8L","recSoa0wgWmkr8CEp"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"rehearsals-for-a-revolution","title":"Rehearsals for a Revolution","original_title":"خاطرات ایران","url":"https://hiff.fi/ohjelma/rehearsals-for-a-revolution/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Fight the Power"],"keywords":["Yhteiskunta","Historia","Arkistot","Perhesuhteet","Suru"],"countries":["Espanja","Tšekki"],"directors":["Pegah Ahangarani"],"cast":[],"languages":["persia","englanti"],"subtitles":["englanti"],"age_rating":"K16","duration_min":95,"year":null,"logline":"Cannesissa palkittu dokumentti käärii Iranin veristä lähihistoriaa auki ennenäkemättömän kuvamateriaalin ja henkilökohtaisten muistojen kautta.","description_text":"Yhden määritelmän mukaan hulluutta on se, että tekee saman asian uudelleen ja uudelleen, mutta odottaa eri lopputulosta. Sukupolvi toisensa perään kaduille mieltään osoittamaan lähteviä iranilaisia ei kuitenkaan voi diagnosoida mielisairaudesta. Toki nykymaailmassa toivolle varmasti liikenisi oma tautiluokitus.\n\nVuonna 1979 perustetun islamilaisen tasavallan taival on ollut verinen. Autoritäärinen hallitus on tukistanut jokaista kansannousun kuiskausta yhä raaemmaksi käyvillä otteilla, joiden voimakkuus näkyy vain arvioiden kuolleiden määrästä kasvaessa ensin yksittäisistä satoihin, sitten tuhansiin ja lopulta kymmeniin tuhansiin.\n\nCannesin elokuvajuhlilla parhaan dokumentin L’Œil d’or -palkinnon pokannut Pegah Ahangarani ei kuitenkaan pelaa pelkillä numeroilla. Hän luo katsauksen Iranin veriseen lähihistoriaan omien sekä lähipiirinsä kokemusten kautta. Historiankulku ja yksilötarinat kietoutuvat toisiinsa, koska ne ovat erottamattomia: suru on tuttu kyläilijä jokaisessa iranilaisperheessä.\n\nAhangarani juoksuttaa lumoavasti tarinaa toivosta pettymykseen ja takaisin. Henkilökohtaisesta arkistosta, uutispätkistä, kännykkävideoista ja perheen valokuvista koostuva kuvamateriaali sekä hengästyttää että naulitsee. Varoituksena, että paikoin kuvasto käy yhtä väkivaltaiseksi kuin sen näyttämä todellisuus.\n\nMinna Saarinen","poster":"https://hiff.fi/wp-content/uploads/airtable/7e597da9c801f66cfd2bad16a3cfb27e-large.jpg","trailer_url":"https://www.youtube.com/embed/LS_d6EUutRA?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/rehearsals-for-a-revolution/","imdb":"https://www.imdb.com/title/tt41593500/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_rehearsal%20for%20a%20rev"},"content_warnings":["Väkivalta"],"showing_ids":["recdmLdVW54vAlPgg","rec7cO5nqFGtEaY3R","reckwD4SiBiW5i9D6"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"rolling-papers","title":"Rolling Papers","original_title":"Pikad Paberid","url":"https://hiff.fi/ohjelma/rolling-papers/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Live, Laugh, Love & Anarchy"],"keywords":["Kaupunkitila","Huumori","Ystävyys","Rakkaus"],"countries":["Viro"],"directors":["Meel Paliale"],"cast":["Mihkel Kuusk","Karl Birnbaum","Edgar Vunš"],"languages":["viro"],"subtitles":["englanti"],"age_rating":"K12","duration_min":97,"year":2024,"logline":"Melankolisen hurmaava hengailuelokuva kuvaa nuorten aikuisten kipuilua Tallinnan vaihtuvien vuodenaikojen keskellä.","description_text":"Kaikki tietävät sen fiiliksen, kun kesäiltana tekisi mieli ottaa loparit duunista ja lähteä elämään elämää. Kaupan kassalla apaattisena jumittavan Sebastianin (Mihkel Kuusk) päähän ajatuksen istuttaa sätkäpaperia ostamaan tullut vapaa sielu Silo (Karl Birnbaum). Nuorukaisilla klikkaa heti. Siispä lappu luukulle ja uimarannan kautta bileisiin. Tallinnan kesä on nimittäin lyhyt.\n\nBileissä Sebastian tutustuu Silon kavereihin, muiden muassa hiphop-läpimurrosta haaveilevaan Mr. Mazeen (Edgar Vunš) ja oikiksessa opiskelevaan Noraan (Maria Helena Seppik). Sebastian ja Nora jakavat rakkauden elokuviin ja alkavat tapailla. Pian Sebastianilla on edessään valinta. Jatkaako suhdetta kunnianhimoisen Noran kanssa vai lähteäkö Silon kanssa Brasilian rannoille pakoon Itämeren ihmisjääkaappia?\n\nTallinnan urbaanissa sykkeessä lonkero virtaa, sätkä palaa ja vuodenajat vaihtuvat. Mutta aika ei odota ketään eikä kukaan tule hakemaan kotoa, jos muutosta haluaa. Mutta haluaako sitä, ja onko jo oikeastaan myöhäistä? Viron Oscar-ehdokkaaksi valittu hurmaava Rolling Papers tavoittaa sattuvasti hahmojensa sukupolven hukassa olon ja melankolian. Monilahjakas Meel Paliale  ( Tree of Eternal Love , R&A 2022) vastaa ohjauksen ja käsikirjoituksen lisäksi myös elokuvaa rytmittävistä Mr. Mazen kappaleista.\n\nTommi Kumén","poster":"https://hiff.fi/wp-content/uploads/airtable/da4dc6de5dd0afefbede2e725d3dfc95-large.png","trailer_url":"https://www.youtube.com/embed/8LVAdMovVMQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/rolling-papers-2024/","imdb":"https://www.imdb.com/title/tt35456230/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_redoubt"},"content_warnings":[],"showing_ids":["recLNC3DS8viXhVwv","recx8gYGVYYplHg7g","rec0i8a6PjBY69Lco","recpEsEH6wUBM3j9Y"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"roma-elastica","title":"Roma Elastica","original_title":null,"url":"https://hiff.fi/ohjelma/roma-elastica/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Outouden laakso"],"keywords":["Outoa","Elokuvanteko","Ikääntyminen"],"countries":["Italia","Ranska"],"directors":["Bertrand Mandico"],"cast":["Marion Cotillard","Noémie Merlant","Martina Scrinzi","Agnese Claisse","Isabella Ferrari"],"languages":["ranska","italia","englanti"],"subtitles":["englanti"],"age_rating":"K16","duration_min":107,"year":2026,"logline":"Absurdilla huumorilla kuorrutettu surrealistinen kuvaus unohdusta ja kuolemaa pelkäävän naisnäyttelijän (Marion Cotillard) kriisistä scifi-elokuvan kuvauksissa kasari-Roomassa.","description_text":"Roma Elastica lennättää katsojan vuoden 1982 Roomaan, jossa hiipuva näyttelijätähti Eddie (Marion Cotillard) saapuu Cinecittàn studioille kuvaamaan uransa pelastavaa tai päättävää scifi-elokuvaa.\n\nOhjaaja Bertrand Mandico kumartaa syvään Fellinille, mutta osoittaa kunniaa myös 80-luvun B-elokuvien estetiikalle. Felliniläistä tunnelmaa haetaan paitsi kameratyöllä myös äänisuunnittelulla: hahmot on dubattu unenomaisesti kuin 8 1/2:ssa konsanaan.\n\nMuutoin Roma Elastica on kitschin ja scifin railakas liitto body horrorilla höystettynä ja tupakansavulla marinoituna. Koko antiikin patsasvarasto on ripoteltu kuviin. Myös kulttimainetta nauttivat Franco Nero ja Ornella Muti piipahtavat kameran edessä. Rooman kaduille saakka ei koskaan päästä, mutta Cinecittàn valtavat lavasteet kohoavat taustalla.\n\nEddie kohtaa matkallaan myös nuoremman itsensä, joka ilmestyy kuin Janus-kasvot menneisyyden ja nykyhetken välillä. Todellisuus ja elokuva sekoittuvat. Felliniläisen ohjaajamiehen luovan kriisin sijaan elokuvan keskiössä on naisnäyttelijän kriisi: voiko vanheneva tähti tehdä uuden tulemisen, vai johtaako ainoa tie kuolemaan kameran edessä (tai sen takana)?\n\nHilla Okkonen","poster":"https://hiff.fi/wp-content/uploads/airtable/c9e0fd410a3c866c1c925c1f62954bad-large.jpg","trailer_url":"https://www.youtube.com/embed/ldaQp2UpcZk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/roma-elastica/","imdb":"https://www.imdb.com/title/tt32596720/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_roma%20elast"},"content_warnings":["Kehokauhu","Sairaus"],"showing_ids":["recouyYhPIOZIhzGI","recFxHCZXCgtsQ1hO","rec53v0yY9A29J49l"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"roqia","title":"Roqia","original_title":"رقية","url":"https://hiff.fi/ohjelma/roqia/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Historia uusiksi"],"keywords":["Kauhu","Yhteiskunta","Jännitys","Muisti"],"countries":["Algeria","Qatar","Ranska","Saudi-Arabia"],"directors":["Yanis Koussim"],"cast":["Ali Namous","Akhram Djeghim","Mostefa Djadjam","Hanaa Mansour"],"languages":["arabia"],"subtitles":["englanti"],"age_rating":"K16","duration_min":94,"year":null,"logline":"Hyytävä kauhumysteeri punoo yhteen Algerian sisällissodan traumat, islamilaisen manaamisen ja sodan haamut.","description_text":"Mikä jää elämään, kun yhteiskunta päättää unohtaa? Yanis Koussimin esikoispitkä elokuva käyttää yliluonnollista kauhua purkaakseen Algerian 1990-luvun sisällissodan, “mustan vuosikymmenen” vaiettua perintöä.\n\nKahdella aikatasolla etenevä mysteeri punoo yhteen muistinsa menettäneen miehen painajaismaisen kotiinpaluun ja ikääntyvän raqin – islamilaista eksorsismia harjoittavan parantajan – hiipuvan taistelun näkymättömiä voimia vastaan.\n\nIslamilaisessa perinteessä ruqyah on Koraanin resitointiin perustuva rituaali, jota käytetään parantamiseen ja pahan torjumiseen. Koussimin käsissä eksorsismi saa kuitenkin myös laajemman merkityksen: se on epätoivoinen yritys pitää kurissa menneisyys, joka ei suostu pysymään haudattuna.\n\nHillitysti mutta herkeämättömällä intensiteetillä etenevä Roqia rakentaa piinaavan tunnelmansa hiljaisuudesta, kuiskauksista ja epävarmuudesta. Sen kauhu versoo historian haamuista, jotka asuttavat ihmisten mieliä, koteja ja maisemia. Uskomusperinteitä ja modernia genre-elokuvaa yhdistävä teos näyttää, miten tehokkaasti kauhu voi antaa äänen sille, mistä ei enää osata puhua.\n\nRauli Karjalainen","poster":"https://hiff.fi/wp-content/uploads/airtable/cebcf19496e3cd25a8c1a060c06ec798-large.jpg","trailer_url":"https://www.youtube.com/embed/SBlKv9v6ARk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/roqia/","imdb":"https://www.imdb.com/title/tt37673712/?ref_=nv_sr_srsg_0_tt_5_nm_3_in_0_q_roqia"},"content_warnings":["Väkivalta","Sota","Henkinen väkivalta","Ahdistus"],"showing_ids":["reczoxuZWZMhvYPmk","recnDLS1tzGFKc13C","recjBzWd16IoRF8uK"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"rose-of-nevada","title":"Rose of Nevada","original_title":null,"url":"https://hiff.fi/ohjelma/rose-of-nevada/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Next Level"],"keywords":["Outoa","Kokeellinen","Muisti"],"countries":["Iso-Britannia"],"directors":["Mark Jenkin"],"cast":["George MacKay","Callum Turner","Francis Magee"],"languages":["englanti"],"subtitles":[],"age_rating":"K12","duration_min":114,"year":2025,"logline":"Filmitaituri Mark Jenkin palaa cornwallilaiseen rannikkokylään mystisessä elokuvassa, jossa kalastajat (Callum Turner ja George MacKay) ovat entisaikojen aaveita.","description_text":"R&A-suosikki Mark Jenkinin uusimmassa elokuvassa kaikki vuotaa: katto, aika ja identiteetit. Cornwallin pienen kylän pubi ja kadut ovat hiljentyneet, eikä merelle lähde enää kalastajaveneitä. Sen sijaan satamaan saapuu alus, 30 vuotta aiemmin kadonnut Rose of Nevada. Kun se otetaan uudelleen käyttöön, miehistöksi lähtevät rahaton kiertolainen Liam (Callum Turner) ja perheellinen Nick (George MacKay), jonka kodin katto ei pidä enää sadetta. Kalastajien työn vaiheet toistuvat mekaanisina uudelleen ja uudelleen.\n\nJenkin vie samoihin maisemiin ja tunnelmiin kuin elokuvassaan Bait (R&A 2019), jota The Observerin Mark Kermode kutsui ”yhdeksi vuosikymmenen keskeisistä brittielokuvista”. Rakeisen mustavalkokuvan sijaan Rose of Nevada täyttyy kuitenkin kylläisistä väreistä, yksityiskohdista ja materiaalisuudesta: ryppyisestä ihosta, likaisista linsseistä ja punaisista neilikoista sinistä merta vasten. 16-millinen filmi näyttää nykysilmin ikiaikaiselta.\n\nFyysisen työn ja autioituvan kylän mukanaan tuomaa sosiaalista realismia leikkaavat aaveet ja aikamatkustus. Kun Nick ja Liam palaavat satamaan, eletään 30 vuoden takaista aikaa. Eivätkä he ole enää Nick ja Liam.\n\nKaisu Tervonen","poster":"https://hiff.fi/wp-content/uploads/airtable/5b552586e4dfc7a53362b96630368ae2-large.jpg","trailer_url":"https://www.youtube.com/embed/bw371ui9cTk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/rose-of-nevada/","imdb":"https://www.imdb.com/title/tt35674521/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_rose%20of%20ne"},"content_warnings":["Itsetuhoisuus","Itsemurha"],"showing_ids":["rectEab3wcXIYE9RB","recRIE9u8OmxjCA3Y","recFlnol51IlJRDqm"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"salvation","title":"Salvation","original_title":"Kurtuluş","url":"https://hiff.fi/ohjelma/salvation/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Rikos & rangaistus"],"keywords":["Yhteiskunta","Jännitys","Usko"],"countries":["Alankomaat","Kreikka","Ranska","Ruotsi","Saudi-Arabia","Turkki"],"directors":["Emin Alper"],"cast":["Caner Cindoruk","Berkay Ateş","Feyyaz Duman","Naz Göktan"],"languages":["turkki","kurdi"],"subtitles":["englanti"],"age_rating":"K16","duration_min":120,"year":2026,"logline":"Berliinin elokuvajuhlien kakkospalkinnon napannut poliittinen jännityselokuva käsittelee kahden veljen eripuraa ja väkivaltaista rajakiistaa Turkin vuoristossa.","description_text":"Turkkilaisohjaaja Emin Alper ( Burning Days , R&A 2022) osoittaa uudella elokuvallaan olevansa poliittisen jännityselokuvan ykkösnimiä tällä hetkellä. Siinä missä aiemmissa elokuvissa käsitellään esimerkiksi korruptiota, nyt pureudutaan joukko- ja kansanmurhien sekä sotien syttymisen dynamiikkaan. Elokuva on saanut inspiraatiota Mardinin seudulla vuonna 2009 tapahtuneesta verilöylystä, jossa 44 ihmistä murhattiin hääjuhlissa, eikä yhtymäkohdilta käynnissä oleviin konflikteihin voi välttyä.\n\nKantaaottava teos kuvaa kahden Itä-Anatolian syrjäseuduilla elävän heimon vanhaa kiistaa maanomistuksesta, joka johtaa yhteenottoihin ja verenvuodatukseen. Epäluuloisuus, valta ja kauna sekoittuvat uniin ja uskomuksiin, jotka johtavat peruuttamattomiin tekoihin, kun kostonhimoista retoriikkaa lietsova hahmo kokoaa yhteen väkivaltaan valmiit tahot.\n\nAlperin aiempien elokuvien tavoin Salvationin tunnelma on uhkaava, mutta tällä kertaa se huipentuu surrealistisiin ja jopa painajaismaisiin kohtauksiin. Loistavan roolituksen keskellä loistaa Suomessakin näytellyt Feyyaz Duman ( Maan laulu , R&A 2026), joka tekee huippuluokan roolisuorituksen suufiveljeskuntaa johtavana šeikki Feritinä.\n\nOmar Fasolah","poster":"https://hiff.fi/wp-content/uploads/airtable/a403c64b3cf7947b7d2a149572b7d99c-large.jpg","trailer_url":"https://www.youtube.com/embed/TllAS6UVs24?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/salvation-2026/","imdb":"https://www.imdb.com/title/tt36472181/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_salvatio"},"content_warnings":["Väkivalta"],"showing_ids":["recCfGtDzCB5AnQ8j","recfzh2qxPIOHPM3u","rec1jL4m08A262281","recoQXDzQi5RQxEZA"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"sentimental-value","title":"Sentimental Value","original_title":null,"url":"https://hiff.fi/ohjelma/sentimental-value/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Pohjoismaiden neuvoston elokuvapalkintoehdokkaat","R&A x LUX-yleisöpalkinto"],"keywords":["Tekstitetty/puhuttu suomeksi","Elokuvanteko","Perhesuhteet","Naiskuvia","Maksuton"],"countries":["Iso-Britannia","Norja","Ranska","Ruotsi","Saksa","Tanska","Turkki"],"directors":["Joachim Trier"],"cast":["Renate Reinsve","Stellan Skarsgård","Inga Ibsdotter Lilleaas","Elle Fanning","Anders Danielsen Lie"],"languages":["norja","englanti","ranska","tanska"],"subtitles":["suomi","ruotsi"],"age_rating":"K12","duration_min":134,"year":2025,"logline":"Palkittu elokuvahelmi on sentimentaalisuuden välttävä ja rujon kaunis kertomus rakkaudesta, armosta, taiteesta ja sisaruudesta. Se esitetään maksuttomassa näytöksessä osana R&A:n LUX-yleisöpalkintoehdokkaiden sarjaa.","description_text":"Ingmar Bergmanin henki on vahvasti läsnä viime vuoden upeimpiin lukeutuvassa elokuvahelmessä, joka on sentimentaalisuuden välttävä, rujon kaunis kertomus rakkaudesta, armosta, taiteesta ja sisaruudesta.\n\nStellan Skarsgård on egoistinen elokuvaohjaaja, jonka itsekkäät valinnat ovat jättäneet nyt jo aikuiset tyttäret ruhjeille. Nora (Renate Reinsve) on äkkiväärä suorasuu, lamaannuttavasta ramppikuumeesta kärsivä näyttelijä, jolla on kompleksinen suhde isäänsä, työhönsä teatterissa – ja itseensä. Näennäisen selväjärkinen Agnes-sisko (Inga Ibsdotter Lilleaas) elää ydinperhearkea ja tunteilee ainoastaan tutkimustyönsä äärellä. Keskeisessä roolissa on sisarusten kansallisromanttinen lapsuudenkoti, joka kätkee sisälleen ovia, muistoja ja salaisuuksia. Eräänä päivänä ohjaajaisä tuo taloon näyttelijä Rachel Kempin (Elle Fanning), seuraavan elokuvansa tähden…\n\nNeljä vuotta sitten Joachim Trier, Renate Reinsve ja Trierin työparina toimiva käsikirjoittaja Eskil Vogt aiheuttivat sensaation elokuvallaan The Worst Person in the World . Nyt he hemmottelevat meitä lisää Cannesissa lumonneella, virtuoosimaisella uutuudellaan.\n\nPökerryttävän intensiivinen elokuva iskee ilmat pihalle. Renate Reinsven silmät polttavat valkokankaaseen reiän, josta näemme haamujen mätkivän ja hellivän eläviä.\n\nSaija Holm, R&A 2025\n\nSentimental Value oli yksi LUX-yleisöpalkinnon ehdokaselokuvista vuonna 2026. Ilmaisnäytökset järjestetään yhdessä Euroopan parlamentin kanssa. Elokuvat on tekstitetty suomeksi ja ruotsiksi.","poster":"https://hiff.fi/wp-content/uploads/airtable/09fb92d15b210b728b5070740417d68f-large.jpg","trailer_url":"https://www.youtube.com/embed/XLGeBaxfOTc?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/sentimental-value-2025/","imdb":"https://www.imdb.com/title/tt27714581/?ref_=nv_sr_srsg_0_tt_7_nm_1_in_0_q_sentimental%20"},"content_warnings":[],"showing_ids":["recK7TO5gCmw2hhxc"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"shame-and-money","title":"Shame and Money","original_title":"Hatixhja dhe Shabani","url":"https://hiff.fi/ohjelma/shame-and-money/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["East Side Stories"],"keywords":["Yhteiskunta","Perhesuhteet","Kaupunkitila","Rikos"],"countries":["Albania","Belgia","Kosovo","Pohjois-Makedonia","Saksa","Slovenia"],"directors":["Visar Morina"],"cast":["Astrit Kabashi","Flonja Kodheli","Kumrije Hoxha"],"languages":["albania"],"subtitles":["englanti"],"age_rating":"K12","duration_min":129,"year":2026,"logline":"Sundancen elokuvajuhlien pääpalkinnon voittanut kosovolaiselokuva katsoo myöhäiskapitalismia raatorehellisesti silmiin ja kysyy, mikä on arvokkaan elämän mitta.","description_text":"Yhteiskunnassa, joka jakaa ihmiset voittajiin ja häviäjiin, keskitien tallaajalle jää vähän elintilaa. Hyvä elämä voi olla vain muutamasta lehmästä kiinni. Kun kantturat katoavat, se on siinä.\n\nKosovolaisen maalaiskylän perukoilla Shaban (Astrit Kabashi) ja Hatixhe (Flonja Kodheli) vielä sinnittelevät ahkeroimalla aamusta iltaan. Kun perhettä kohtaa tragedia, törmäys kapitalismin kylmän kouran kanssa on väistämätön.\n\nPääkaupunki Pristinassa Bill Clinton tervehtii tulijoita rauhan hymyllä, mutta patsaan juurella oliivipuun oksa kuihtuu markkinatalouden risuksi. Ihmisarvon mitta on pankkitilin saldo, ja väki on jaettu varakkaisiin ja varattomiin. Köyhien on ymmärrettävä olla kiitollisia parempiosaisten armopaloista ja sukulaistenkin hyväksikäytöstä. Vaikka Shabanin vanha äiti Nana (Kumrije Hoxha) pysyy moraalin ja säädyllisyyden portinvartijana, pyrkimys hankkia elantoa vie pariskunnan yhä uusiin syvyyksiin. Häpeästä on tullut ylellisyystuote.\n\nSundancen elokuvajuhlilla kansainvälisen kilpasarjan pääpalkinnon tuoreimmallaan pokannut Visar Morina raastaa globalisaatiokertomuksellaan. Nopean repäisyn sijasta laastari nitkutellaan irti ihokarva kerrallaan. Yhtä hitaasti kuin toivo hiipuu.\n\nMinna Saarinen","poster":"https://hiff.fi/wp-content/uploads/airtable/e618887582dbe5173ac4df09ca6a491d-large.jpg","trailer_url":"https://www.youtube.com/embed/qF3aSjMmnlQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/shame-and-money/","imdb":"https://www.imdb.com/title/tt39140264/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_shame%20and%20mon"},"content_warnings":["Ahdistus"],"showing_ids":["recCLQDVIsbsv03ar","reciEnCyHYe9lkWo7","recxKH9Q6eV55urmV"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"silence","title":"Silence","original_title":"Silencio","url":"https://hiff.fi/ohjelma/silence/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Outouden laakso"],"keywords":["Musiikki","Epookki","Ihmisoikeudet","LGBTQIA+","Fantasia"],"countries":["Espanja"],"directors":["Eduardo Casanova"],"cast":["Lucía Díez","María León","Ana Polvorosa","Mariola Fuentes"],"languages":["espanja"],"subtitles":["englanti"],"age_rating":"K16","duration_min":57,"year":2025,"logline":"Espanjalaiselokuva seuraa vampyyrisiskoja 1300-luvun ruttovuosista lähitulevaisuuteen keksien vampyyrielokuvan uusiksi campin, politiikan ja goottiestetiikan suloisena sekoituksena.","description_text":"Vuosisatoja mustasta surmasta nykypäivään kattava Silence seuraa vampyyriperhettä, jonka elämä kietoutuu HIV:n ja AIDSin historiaan. Elokuva alkaa kahdesta sisaruksesta, jotka annostelevat jäljellä olevaa ”puhdasta” ihmisverta ruton tyhjentäessä kadut ympäriltään. Vuosisatoja myöhemmin yksi heidän jälkeläisistään perii saman vaivan toisella nimellä ja rakastuu johonkuhun väärällä puolella rajaa maailmassa, joka yhä vaatii jakoa sairaisiin ja terveisiin, ihmisiin ja vampyyreihin.\n\nEduardo Casanova ( Skins , R&A 2017) tutkii jälleen valtavirtaelokuvan kanonisten sääntöjen ulkopuolella olevia kehoja omaksuen hirviömäisyyden tilan, jossa queeriys, haavoittuvuus ja halu voivat esiintyä rinnakkain kumoamatta toisiaan. Lavastus ansaitsee erityishuomion: tila, johon identiteettikriisin keskellä olevat sisarukset vetäytyvät, ammentaa yhtä lailla kitschistä ja campista – mukaan lukien Tom of Finlandilta – kuin Murnaun romantiikasta. Sama hallitun houreen tila sekoittaa anteeksipyytelemättä almodóvarilaista costumbrismoa musikaaliin, kauhuun ja science fictioniin, asettumatta lopulta täysin mihinkään niistä. Pidä kiinni penkistäsi, sillä Silence ei aio jättää ketään kylmäksi.\n\nDiego Ginartes Rodríguez (kääntänyt Kati Ilomäki)","poster":"https://hiff.fi/wp-content/uploads/airtable/3e5c58084882a29e914399d1b0add7bd-large.jpg","trailer_url":null,"links":{"letterboxd":"https://letterboxd.com/film/silence-2025-2/","imdb":"https://www.imdb.com/title/tt37538765/?ref_=nm_knf_c_4"},"content_warnings":["Sairaus"],"showing_ids":["recS8ulR0zYKnDyzK","recsqSAX9vWxBPAUi","rec2tmKhy4tD8TJZr","rec36ci8ouLtmM4l4","rec2RTGwpHLqYvIU0"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"silent-friend","title":"Silent Friend","original_title":"Stille Freundin","url":"https://hiff.fi/ohjelma/silent-friend/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Toisenlajiset"],"keywords":["Luontosuhde","Muisti","Epookki","Feelgood","Kasvutarina"],"countries":["Kiina","Ranska","Saksa","Unkari"],"directors":["Ildikó Enyedi"],"cast":["Tony Leung Chiu-wai","Léa Seydoux","Luna Wedler"],"languages":["englanti","saksa","kantoninkiina"],"subtitles":["englanti"],"age_rating":"S","duration_min":147,"year":2025,"logline":"Kasvitieteellisen puutarhan neidonhiuspuu valvoo, kun yksinäiset sielut (mm. Tony Leung) kolmessa aikatasossa löytävät yhteyden ympäröivään maailmaan ja sen ihmisiin.","description_text":"Vuonna 2020 saksalaisella yliopistolla vieraileva neurologian tohtori (yksinäisyyselokuvan veteraani, iki-ihana Tony Leung Chiu-wai) jää jumiin autiolle kampukselle koronapandemian suljettua koko maailman. Vuonna 1908 samaisen yliopiston ensimmäinen naisopiskelija hakee paikkaansa vihamielisessä ympäristössä. 70-luvulla vetäytyvä nuorimies rakastuu kuohuvan opiskelijaliikkeen myrskynsilmässä. Yksinäiset sielut kolmessa aikatasossa löytävät yhteyden ympäröivään maailmaan ja sen ihmisiin löytämällä ensin yhteyden kasveihin.\n\nTarinoiden kiintopisteenä toimii yliopiston kasvitieteellisessä puutarhassa kasvava neidonhiuspuu ( Gingko biloba ). Pitkän uran tehneen ohjaajan ja käsikirjoittajan Ildikó Enyedin vähäeleinen maaginen realismi on kerännyt eurooppalaisilla elokuvafestivaaleilla merkittäviä palkintoja, mukaan lukien Kultaisen karhun elokuvalla Kosketuksissa (R&A 2017). Uusimmassa elokuvassaan Enyedi asettuu jälleen tutkimaan tietoisuuden, kommunikaation ja yhteyden kysymyksiä, tällä kertaa kasvitieteen kautta. Lihallisen latautuneet lähikuvat kukkien emistä ja solujen liikkeistä vuorottelevat tyhjää täynnä olevien kuvakulmien kanssa luoden henkilöhahmojen yksinäisyydelle polttelevan toiveikkaan pohjavireen.\n\nAdrian Murtomäki","poster":"https://hiff.fi/wp-content/uploads/airtable/fdf2b4f857a2d0ae00d81ba6754ac301-large.jpg","trailer_url":"https://www.youtube.com/embed/TaRZnpAmtJk?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/silent-friend/","imdb":"https://www.imdb.com/title/tt27811632/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_silent%20friend"},"content_warnings":["Seksuaalinen häirintä","Misogynia"],"showing_ids":["rec2qI3B9cVMmX9nU","recD7EQi91mjjBw1x","recyDMcKrafmoKuI2"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"sirens-call","title":"Sirens Call","original_title":null,"url":"https://hiff.fi/ohjelma/sirens-call/","is_film":true,"event_types":["elokuvat"],"genres":["Dokumentti"],"themes":["Toisenlajiset"],"keywords":["Identiteetti","Matka","Fantasia","Kokeellinen"],"countries":["Alankomaat","Saksa"],"directors":["Miriam Gossing","Lina Sieckmann"],"cast":[],"languages":["englanti"],"subtitles":["englanti"],"age_rating":"K7","duration_min":121,"year":2025,"logline":"Lynchiläinen tie-elokuva merenväestä sukeltaa todellisuuden, fantasian ja genrerajojen tuolle puolen matkallaan postmodernin Amerikan halki.","description_text":"Scifiä ja dokumenttia yhdistelevä queer-feministinen road movie seuraa Unaa (Gina Rønning), merenneidoksi identifiotuvaa hybridiolentoa, matkallaan Yhdysvaltojen poikki. Una etsii taipaleeltaan yhteisöä, mutta trumpilaisen politiikan väistämättömät varjot vaanivat joka kulman takana. Identiteettejä kyseenalaistava ja jopa kieltävä yhteiskunta – eritoten Yhdysvalloissa rehottava transvastainen politiikka – haastaa Unaa, mutta hän onnistuu löytämään hyväksyntää Portlandin merenväen alakulttuurista. Saavuttamastaan kuulumisen tunteesta huolimatta eksistentiaaliset ongelmat saartavat yhä Unaa.\n\nMiri Ian Gossingin ja Lina Sieckmannin täyspitkä debyytti on kaukana tavanomaisesta ja arkipäiväisestä. Sirens Call sai ensi-iltansa Berliinin elokuvajuhlilla, missä se oli ehdokkaana queer-elokuville myönnettävän Teddy-palkinnon saajaksi. Hybridiaiheeseen sopivasti elokuva on kuvattu 16-milliselle filmille, mikä ruokkii nostalgista tunnelmaa, kun samalla tarina pitää meidät ankarassa nykytodellisuudessa. Ihmisyyttä, kulutuskulttuuria ja ekosysteemin romahdusta radikaalisti kommentoiva elokuva kuljettaa meitä vaihtuvien amerikkalaisten kaupunkien läpi luoden taustan Unan tuntemalle irtonaisuudelle modernista maailmasta.\n\nLjubomir Delevic (kääntänyt Ailiina Saaristo)","poster":"https://hiff.fi/wp-content/uploads/airtable/6f7c8f365157e383f923455991e0de99-large.png","trailer_url":"https://www.youtube.com/embed/pBuLrg5vQc4?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/sirens-call-2025/","imdb":"https://www.imdb.com/title/tt18235498/?ref_=nv_sr_srsg_0_tt_8_nm_0_in_0_q_sirens%20call"},"content_warnings":[],"showing_ids":["rec2VU94a51bZOzYJ","recZUHRPHcf21ZOMC","recvP7M9FR5ALtaGU"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"sister","title":"Sister","original_title":"시스터","url":"https://hiff.fi/ohjelma/sister/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Midnight Mayhem"],"keywords":["Identiteetti","Jännitys","Naiskuvia","Rikos","Kauhu"],"countries":["Etelä-Korea"],"directors":["Jin Sung-moon"],"cast":["Jung Zi-so","Lee Soo-hyuk","Cha Joo-young","Jung Ji-woo"],"languages":["korea"],"subtitles":["englanti"],"age_rating":"K16","duration_min":87,"year":2026,"logline":"Ratkaisu rahapulaan: kidnapataan rikkaan miehen tytär! Suljetun huoneen napakassa korealaistrillerissä valta-asetelmat vaihtuvat.","description_text":"Hae-ran on kiinankorealainen nuori nainen ja laittomasti Etelä-Koreassa. Hän yrittää kasata rahaa siskonsa leikkaukseen ja lähtee mukaan Tae-soon suunnitelmaan kidnapata rikkaan bisnesmiehen tytär So-jin ja vaatia miljoona wonia lunnaita. So-jin vangitaan rakenteilla olevan kerrostalon huoneeseen. Myös Hae-ran on puolittain vankina rakennuksessa aina, kun Tae-soo lähtee hoitamaan yhteyksiä kidnapatun perheeseen. Matkaan tulee mutkia, kun So-jin väittää, ettei ole ollut vuosikausiin yhteydessä isäänsä. Puhuuko hän totta?\n\nVuoden 2009 brittitrilleriä The Disappearance of Alice Creed mukaileva intensiivinen jännäri sijoittuu miltei kokonaan yhteen rakennukseen. Kolmikon valta-asetelmat vaihtelevat, kukin on vuorollaan niskan päällä ja jokaisen taustasta paljastuu yllättäviä asioita. Hae-ran alkaa bondata So-jinin kanssa, mutta voiko So-jiniin luottaa? Hae-rania näyttelevä Jung Ji-so on tuttu Parasiten rikkaan perheen tyttären roolista ja hittidraamasta The Glory . Samasta K-draamasta on tuttu myös So-jinin roolin tekevä Cha Joo-young. Lee Soo-hyuk luo Tae-soosta kylmäverisen ja laskelmoivan psykopaatin. Yhden tilan napakka trilleri toimii ja tykittää.\n\nEija Niskanen","poster":"https://hiff.fi/wp-content/uploads/airtable/021c2fc2d5f167fbcaf5fbc0c071a65f-large.jpg","trailer_url":"https://www.youtube.com/embed/Bnxdub0SPgQ?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/sister-2026/","imdb":"https://www.imdb.com/title/tt39239178/?ref_=nv_sr_srsg_3_tt_8_nm_0_in_0_q_sister%202026"},"content_warnings":["Ahdistus","Väkivalta"],"showing_ids":["recnekCgK4OZbEjdQ","rec9fQmV8yAVfpgjr","recBhc2I6ldppUbDr"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"soldiers-of-song","title":"Soldiers of Song","original_title":null,"url":"https://hiff.fi/ohjelma/soldiers-of-song/","is_film":true,"event_types":["elokuvat"],"genres":["Fiktio"],"themes":["Musiikin voima"],"keywords":["Angsti","Kaupunkitila","Musiikki","Suru","Yhteiskunta","Ihmisoikeudet"],"countries":["Ukraina"],"directors":["Ryan Smith"],"cast":[],"languages":["englanti","ukraina"],"subtitles":["osittain englanti"],"age_rating":"K16","duration_min":90,"year":2024,"logline":"Tulisieluinen dokumentti ukrainalaismuusikoista sodan jaloissa. Taisteluhenkeä julistava elokuva ei väistele sodan veristä todellisuutta.","description_text":"Soldiers of Song on hurskastelematon dokumentti ukrainalaisista muusikoista keskellä Venäjän hyökkäyssotaa. Ryan Smithin ohjaaman elokuvan ilmaisurekisterissä yhdistyy tiivistahtisen televisiodokumentin, musiikkivideon, vlogien ja propagandaelokuvan estetiikka.\n\nElokuva näyttää, millainen on 2020-luvun poptähden rooli sodassa. Toisaalta se antaa äänen ja kasvot myös aivan tavallisille ukrainalaisille muusikoille. Rocktähdelle sota on merkinnyt yleisön kohtaamista kotonaan ja vastarintaa median välittämänä. Popmuusikon ilmaisu on vakavoitunut, pommisuojissa kaikuu toivoa ylläpitävä laulu, ja oopperalaulajan urasta unelmoiva auttaa naapureitaan pommitetuissa kerrostaloissa. Räppäristä on puolestaan tullut drooniyksikön komentaja.\n\nSoldiers of Song esittelee myös Ukrainan asevoimissa palvelevat kulttuurijoukot, tovereilleen musisoivat sotilaat. Tulisieluisen taisteleva ja sähäkkä dokumentti ei väistele yhä jatkuvan sodan veristä ja ahdistavaa todellisuutta. Se hiljentää niin kokonaisten kaupunkien kuin yksilöidenkin tragedioiden äärelle.\n\nJustus Pitkänen","poster":"https://hiff.fi/wp-content/uploads/airtable/cfc13f25c3fd4360373971dbd iers of Song esittelee myös Ukrainan asevoimissa palvelevat kulttuurijoukot, tovereilleen musisoivat sotilaat. Tulisieluisen taisteleva ja sähäkkä dokumentti ei väistele yhä jatkuvan sodan veristä ja ahdistavaa todellisuutta. Se hiljentää niin kokonaisten kaupunkien kuin yksilöidenkin tragedioiden äärelle.\n\nJustus Pitkänen\n\nThe Sound of Hope\n\nKäsittämättömän kovien hetkien ja paikkojen keskellä humanitaarinen apu voi tehdä muutakin kuin auttaa ihmisiä selviytymään. Se voi auttaa ihmisiä löytämään takaisin tunteen normaaliudesta.\n\nThe Sound of Hope , Euroopan unionin tuottama elokuva, seuraa kolmea EU:n tukemaa humanitaarisen avun työntekijää heidän tuodessaan apua maailman haastavimpiin olosuhteisiin.\n\nInhimillisyyden, puolueettomuuden, tasapuolisuuden ja riippumattomuuden periaatteiden ohjaamina he työskentelevät kriisin koettelemien yhteisöjen rinnalla Syyriassa, Haitilla ja kongolaisten pakolaisten asutusalueella Burundissa, tarjoten apua siellä, missä sitä eniten tarvitaan.\n\nOli kyse terveydenhuollosta, suojasta, koulutuksesta tai tiloista, joissa ihmiset voivat tuntea olonsa turvalliseksi, elokuva paljastaa, kuinka monia ilmenemismuotoja EU:n humanitaarisella avulla on.\n\nAvustustyöntekijöiden rinnalla tapaamme ihmisiä, joiden elämää konflikti, uudelleenasettumiset ja kriisi ovat muovanneet, mutta joiden lahjakkuus, unelmat ja poikkeuksellinen sisukkuus kertovat suurempaa tarinaa.\n\nYhdistäen avustustyöntekijöiden ja avun saajien äänet The Sound of Hope tarjoaa intiimin kuvan EU:n humanitaarisen toiminnan takana olevista inhimillisistä tarinoista. Nämä ovat tarinoita avustustyöntekijöistä, jotka ovat etulinjassa joka päivä, ja ihmisistä, joiden äänet kantavat yhä toivoa.\n\nNämä ovat inhimillisyyden äänet.","poster":"https://hiff.fi/wp-content/uploads/airtable/cfc13f25c3fd4360373971dbdec92b15-large.png","trailer_url":"https://www.youtube.com/embed/l3GGx-B1lvw?feature=oembed","links":{},"content_warnings":["Sota"],"showing_ids":["recvbs1rel2NUiXwh" den. Vaikka hän on ollut kerran aiemminkin ihastunut – ja on vähän edelleenkin heikkona kuorokaveriinsa Mikeliin –, tämä rakkaus on niin kokonaisvaltaista, että hän on valmis jättämään sen vuoksi kaiken. Juuri sitä se nimittäin vaatii, jos haluaa Jeesuksen morsiameksi, ja Ainara rakastaa Jeesusta niin paljon, että haluaa sulkeutua luostariin.\n\nJoillekin läheisille Ainaran valinta on shokki. Ateisti, katoliseen kirkkoon kriittisesti suhtautuva Maite-täti on sitä mieltä, että mystinen ”Jeesuksen kutsu” on koulun papin ja nunnien manipulaatiota ja että lapsena äitinsä menettänyt tyttö etsii uskonnosta kompensaatiota tyhjiölleen.\n\nRuiz de Azúan elokuva vakuuttaa, koska mystinen hurmos ja viileä rationalismi kulkevat tarinassa tasavertaisesti rinnakkain. Niin ikään vakuuttavat elokuvan naistähdet Blanca Soroa (Ainara), Patricia López Arnaiz (Maite) ja Nagore Aramburu (abbedissa Isabel). Kotimaassaan Espanjassa Sundays on vakuuttanut yhtä lailla niin elokuvayleisön kuin palkintoraaditkin: se voitti San Sebastianin elokuvajuhlien pääpalkinnon ja viisi tärkeintä Goyaa (mm. paras elokuva, ohjaus ja naispääosa).\n\nSari Selander","poster":"https://hiff.fi/wp-content/uploads/airtable/e5803071dfdd7a79150101944505cb42-large.jpg","trailer_url":"https://www.youtube.com/embed/FRwwy6W2xh8?feature=oembed","links":{"letterboxd":"https://letterboxd.com/film/sundays-2025/","imdb":"https://www.imdb.com/title/tt35513027/?ref_=nv_sr_srsg_1_tt_6_nm_1_in_0_q_sundays"},"content_warnings":[],"showing_ids":["recNlzM9tZHCho39q","recXe1oTe4cZcfnFi","recpvNCyhRqd0A5ri","recgYrVoSMhkQ7S3h"],"shorts":[],"cinema_release":null,"on_yle_areena":false},{"slug":"tatskatytot-pitchmatch","title":"Tatskatytöt: PITCH&MATCH®","original_title":null,"url":"https://hiff.fi/ohjelma/tatskatytot-pitchmatch/","is_film":false,"event_types":["tapahtumat"],"genres":[],"themes":["R&A Events"],"keywords":["Rakkaus"],"countries":[],"directors":[],"cast":[],"languages":["suomi"],"subtitles":[],"age_rating":null,"duratio
